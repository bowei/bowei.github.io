/v1.ParametersReference","typeDecorators":["Ptr"],"docString":"ParametersRef is a reference to a resource that contains the configuration\nparameters corresponding to the GatewayClass. This is optional if the\ncontroller does not require any additional configuration.\n\nParametersRef can reference a standard Kubernetes resource, i.e. ConfigMap,\nor an implementation-specific custom resource. The resource can be\ncluster-scoped or namespace-scoped.\n\nIf the referent cannot be found, refers to an unsupported kind, or when\nthe data within that resource is malformed, the GatewayClass SHOULD be\nrejected with the \"Accepted\" status condition set to \"False\" and an\n\"InvalidParameters\" reason.\n\nA Gateway for this GatewayClass may provide its own `parametersRef`. When both are specified,\nthe merging behavior is implementation specific.\nIt is generally recommended that GatewayClass provides defaults that can be overridden by a Gateway.\n\nSupport: Implementation-specific\n\n+optional"},{"fieldName":"Description","typeName":"string","typeDecorators":["Ptr"],"docString":"Description helps describe a GatewayClass with more details.\n\n+kubebuilder:validation:MaxLength=64\n+optional"}],"enumValues":[],"docString":"GatewayClassSpec reflects the configuration of a class of Gateways.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewayClassStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayClassStatus","fields":[{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"Conditions is the current status from the controller for\nthis GatewayClass.\n\nControllers should prefer to publish conditions using values\nof GatewayClassConditionType for the type of each Condition.\n\n+optional\n+listType=map\n+listMapKey=type\n+kubebuilder:validation:MaxItems=8\n+kubebuilder:default={{type: \"Accepted\", status: \"Unknown\", message: \"Waiting for controller\", reason: \"Pending\", lastTransitionTime: \"1970-01-01T00:00:00Z\"}}"},{"fieldName":"SupportedFeatures","typeName":"sigs.k8s.io/gateway-api/apis/v1.SupportedFeature","typeDecorators":["List"],"docString":"SupportedFeatures is the set of features the GatewayClass support.\nIt MUST be sorted in ascending alphabetical order by the Name key.\n+optional\n+listType=map\n+listMapKey=name\n\u003cgateway:experimental\u003e\n+kubebuilder:validation:MaxItems=64"}],"enumValues":[],"docString":"GatewayClassStatus is the current status for the GatewayClass.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewayInfrastructure":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayInfrastructure","fields":[{"fieldName":"Labels","typeName":"LabelValue","typeDecorators":["Map[LabelKey]"],"docString":"Labels that SHOULD be applied to any resources created in response to this Gateway.\n\nFor implementations creating other Kubernetes objects, this should be the `metadata.labels` field on resources.\nFor other implementations, this refers to any relevant (implementation specific) \"labels\" concepts.\n\nAn implementation may chose to add additional implementation-specific labels as they see fit.\n\nIf an implementation maps these labels to Pods, or any other resource that would need to be recreated when labels\nchange, it SHOULD clearly warn about this behavior in documentation.\n\nSupport: Extended\n\n+optional\n+kubebuilder:validation:MaxProperties=8\n+kubebuilder:validation:XValidation:message=\"Label keys must be in the form of an optional DNS subdomain prefix followed by a required name segment of up to 63 characters.\",rule=\"self.all(key, key.matches(r\\\"\\\"\\\"^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]{0,61})?[A-Za-z0-9]$\\\"\\\"\\\"))\"\n+kubebuilder:validation:XValidation:message=\"If specified, the label key's prefix must be a DNS subdomain not longer than 253 characters in total.\",rule=\"self.all(key, key.split(\\\"/\\\")[0].size() \u003c 253)\""},{"fieldName":"Annotations","typeName":"AnnotationValue","typeDecorators":["Map[AnnotationKey]"],"docString":"Annotations that SHOULD be applied to any resources created in response to this Gateway.\n\nFor implementations creating other Kubernetes objects, this should be the `metadata.annotations` field on resources.\nFor other implementations, this refers to any relevant (implementation specific) \"annotations\" concepts.\n\nAn implementation may chose to add additional implementation-specific annotations as they see fit.\n\nSupport: Extended\n\n+optional\n+kubebuilder:validation:MaxProperties=8\n+kubebuilder:validation:XValidation:message=\"Annotation keys must be in the form of an optional DNS subdomain prefix followed by a required name segment of up to 63 characters.\",rule=\"self.all(key, key.matches(r\\\"\\\"\\\"^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]{0,61})?[A-Za-z0-9]$\\\"\\\"\\\"))\"\n+kubebuilder:validation:XValidation:message=\"If specified, the annotation key's prefix must be a DNS subdomain not longer than 253 characters in total.\",rule=\"self.all(key, key.split(\\\"/\\\")[0].size() \u003c 253)\""},{"fieldName":"ParametersRef","typeName":"sigs.k8s.io/gateway-api/apis/v1.LocalParametersReference","typeDecorators":["Ptr"],"docString":"ParametersRef is a reference to a resource that contains the configuration\nparameters corresponding to the Gateway. This is optional if the\ncontroller does not require any additional configuration.\n\nThis follows the same semantics as GatewayClass's `parametersRef`, but on a per-Gateway basis\n\nThe Gateway's GatewayClass may provide its own `parametersRef`. When both are specified,\nthe merging behavior is implementation specific.\nIt is generally recommended that GatewayClass provides defaults that can be overridden by a Gateway.\n\nIf the referent cannot be found, refers to an unsupported kind, or when\nthe data within that resource is malformed, the Gateway SHOULD be\nrejected with the \"Accepted\" status condition set to \"False\" and an\n\"InvalidParameters\" reason.\n\nSupport: Implementation-specific\n\n+optional"}],"enumValues":[],"docString":"GatewayInfrastructure defines infrastructure level attributes about a Gateway instance.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewayList":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1.Gateway","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"GatewayList contains a list of Gateways.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewaySpec":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewaySpec","fields":[{"fieldName":"GatewayClassName","typeName":"ObjectName","typeDecorators":null,"docString":"GatewayClassName used for this Gateway. This is the name of a\nGatewayClass resource."},{"fieldName":"Listeners","typeName":"sigs.k8s.io/gateway-api/apis/v1.Listener","typeDecorators":["List"],"docString":"Listeners associated with this Gateway. Listeners define\nlogical endpoints that are bound on this Gateway's addresses.\nAt least one Listener MUST be specified.\n\n## Distinct Listeners\n\nEach Listener in a set of Listeners (for example, in a single Gateway)\nMUST be _distinct_, in that a traffic flow MUST be able to be assigned to\nexactly one listener. (This section uses \"set of Listeners\" rather than\n\"Listeners in a single Gateway\" because implementations MAY merge configuration\nfrom multiple Gateways onto a single data plane, and these rules _also_\napply in that case).\n\nPractically, this means that each listener in a set MUST have a unique\ncombination of Port, Protocol, and, if supported by the protocol, Hostname.\n\nSome combinations of port, protocol, and TLS settings are considered\nCore support and MUST be supported by implementations based on the objects\nthey support:\n\nHTTPRoute\n\n1. HTTPRoute, Port: 80, Protocol: HTTP\n2. HTTPRoute, Port: 443, Protocol: HTTPS, TLS Mode: Terminate, TLS keypair provided\n\nTLSRoute\n\n1. TLSRoute, Port: 443, Protocol: TLS, TLS Mode: Passthrough\n\n\"Distinct\" Listeners have the following property:\n\n**The implementation can match inbound requests to a single distinct\nListener**.\n\nWhen multiple Listeners share values for fields (for\nexample, two Listeners with the same Port value), the implementation\ncan match requests to only one of the Listeners using other\nListener fields.\n\nWhen multiple listeners have the same value for the Protocol field, then\neach of the Listeners with matching Protocol values MUST have different\nvalues for other fields.\n\nThe set of fields that MUST be different for a Listener differs per protocol.\nThe following rules define the rules for what fields MUST be considered for\nListeners to be distinct with each protocol currently defined in the\nGateway API spec.\n\nThe set of listeners that all share a protocol value MUST have _different_\nvalues for _at least one_ of these fields to be distinct:\n\n* **HTTP, HTTPS, TLS**: Port, Hostname\n* **TCP, UDP**: Port\n\nOne **very** important rule to call out involves what happens when an\nimplementation:\n\n* Supports TCP protocol Listeners, as well as HTTP, HTTPS, or TLS protocol\n  Listeners, and\n* sees HTTP, HTTPS, or TLS protocols with the same `port` as one with TCP\n  Protocol.\n\nIn this case all the Listeners that share a port with the\nTCP Listener are not distinct and so MUST NOT be accepted.\n\nIf an implementation does not support TCP Protocol Listeners, then the\nprevious rule does not apply, and the TCP Listeners SHOULD NOT be\naccepted.\n\nNote that the `tls` field is not used for determining if a listener is distinct, because\nListeners that _only_ differ on TLS config will still conflict in all cases.\n\n### Listeners that are distinct only by Hostname\n\nWhen the Listeners are distinct based only on Hostname, inbound request\nhostnames MUST match from the most specific to least specific Hostname\nvalues to choose the correct Listener and its associated set of Routes.\n\nExact matches MUST be processed before wildcard matches, and wildcard\nmatches MUST be processed before fallback (empty Hostname value)\nmatches. For example, `\"foo.example.com\"` takes precedence over\n`\"*.example.com\"`, and `\"*.example.com\"` takes precedence over `\"\"`.\n\nAdditionally, if there are multiple wildcard entries, more specific\nwildcard entries must be processed before less specific wildcard entries.\nFor example, `\"*.foo.example.com\"` takes precedence over `\"*.example.com\"`.\n\nThe precise definition here is that the higher the number of dots in the\nhostname to the right of the wildcard character, the higher the precedence.\n\nThe wildcard character will match any number of characters _and dots_ to\nthe left, however, so `\"*.example.com\"` will match both\n`\"foo.bar.example.com\"` _and_ `\"bar.example.com\"`.\n\n## Handling indistinct Listeners\n\nIf a set of Listeners contains Listeners that are not distinct, then those\nListeners are _Conflicted_, and the implementation MUST set the \"Conflicted\"\ncondition in the Listener Status to \"True\".\n\nThe words \"indistinct\" and \"conflicted\" are considered equivalent for the\npurpose of this documentation.\n\nImplementations MAY choose to accept a Gateway with some Conflicted\nListeners only if they only accept the partial Listener set that contains\nno Conflicted Listeners.\n\nSpecifically, an implementation MAY accept a partial Listener set subject to\nthe following rules:\n\n* The implementation MUST NOT pick one conflicting Listener as the winner.\n  ALL indistinct Listeners must not be accepted for processing.\n* At least one distinct Listener MUST be present, or else the Gateway effectively\n  contains _no_ Listeners, and must be rejected from processing as a whole.\n\nThe implementation MUST set a \"ListenersNotValid\" condition on the\nGateway Status when the Gateway contains Conflicted Listeners whether or\nnot they accept the Gateway. That Condition SHOULD clearly\nindicate in the Message which Listeners are conflicted, and which are\nAccepted. Additionally, the Listener status for those listeners SHOULD\nindicate which Listeners are conflicted and not Accepted.\n\n## General Listener behavior\n\nNote that, for all distinct Listeners, requests SHOULD match at most one Listener.\nFor example, if Listeners are defined for \"foo.example.com\" and \"*.example.com\", a\nrequest to \"foo.example.com\" SHOULD only be routed using routes attached\nto the \"foo.example.com\" Listener (and not the \"*.example.com\" Listener).\n\nThis concept is known as \"Listener Isolation\", and it is an Extended feature\nof Gateway API. Implementations that do not support Listener Isolation MUST\nclearly document this, and MUST NOT claim support for the\n`GatewayHTTPListenerIsolation` feature.\n\nImplementations that _do_ support Listener Isolation SHOULD claim support\nfor the Extended `GatewayHTTPListenerIsolation` feature and pass the associated\nconformance tests.\n\n## Compatible Listeners\n\nA Gateway's Listeners are considered _compatible_ if:\n\n1. They are distinct.\n2. The implementation can serve them in compliance with the Addresses\n   requirement that all Listeners are available on all assigned\n   addresses.\n\nCompatible combinations in Extended support are expected to vary across\nimplementations. A combination that is compatible for one implementation\nmay not be compatible for another.\n\nFor example, an implementation that cannot serve both TCP and UDP listeners\non the same address, or cannot mix HTTPS and generic TLS listens on the same port\nwould not consider those cases compatible, even though they are distinct.\n\nImplementations MAY merge separate Gateways onto a single set of\nAddresses if all Listeners across all Gateways are compatible.\n\nIn a future release the MinItems=1 requirement MAY be dropped.\n\nSupport: Core\n\n+listType=map\n+listMapKey=name\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=64\n+kubebuilder:validation:XValidation:message=\"tls must not be specified for protocols ['HTTP', 'TCP', 'UDP']\",rule=\"self.all(l, l.protocol in ['HTTP', 'TCP', 'UDP'] ? !has(l.tls) : true)\"\n+kubebuilder:validation:XValidation:message=\"tls mode must be Terminate for protocol HTTPS\",rule=\"self.all(l, (l.protocol == 'HTTPS' \u0026\u0026 has(l.tls)) ? (l.tls.mode == '' || l.tls.mode == 'Terminate') : true)\"\n+kubebuilder:validation:XValidation:message=\"hostname must not be specified for protocols ['TCP', 'UDP']\",rule=\"self.all(l, l.protocol in ['TCP', 'UDP']  ? (!has(l.hostname) || l.hostname == '') : true)\"\n+kubebuilder:validation:XValidation:message=\"Listener name must be unique within the Gateway\",rule=\"self.all(l1, self.exists_one(l2, l1.name == l2.name))\"\n+kubebuilder:validation:XValidation:message=\"Combination of port, protocol and hostname must be unique for each listener\",rule=\"self.all(l1, self.exists_one(l2, l1.port == l2.port \u0026\u0026 l1.protocol == l2.protocol \u0026\u0026 (has(l1.hostname) \u0026\u0026 has(l2.hostname) ? l1.hostname == l2.hostname : !has(l1.hostname) \u0026\u0026 !has(l2.hostname))))\""},{"fieldName":"Addresses","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewaySpecAddress","typeDecorators":["List"],"docString":"Addresses requested for this Gateway. This is optional and behavior can\ndepend on the implementation. If a value is set in the spec and the\nrequested address is invalid or unavailable, the implementation MUST\nindicate this in the associated entry in GatewayStatus.Addresses.\n\nThe Addresses field represents a request for the address(es) on the\n\"outside of the Gateway\", that traffic bound for this Gateway will use.\nThis could be the IP address or hostname of an external load balancer or\nother networking infrastructure, or some other address that traffic will\nbe sent to.\n\nIf no Addresses are specified, the implementation MAY schedule the\nGateway in an implementation-specific manner, assigning an appropriate\nset of Addresses.\n\nThe implementation MUST bind all Listeners to every GatewayAddress that\nit assigns to the Gateway and add a corresponding entry in\nGatewayStatus.Addresses.\n\nSupport: Extended\n\n+optional\n\u003cgateway:validateIPAddress\u003e\n+kubebuilder:validation:MaxItems=16\n+kubebuilder:validation:XValidation:message=\"IPAddress values must be unique\",rule=\"self.all(a1, a1.type == 'IPAddress' ? self.exists_one(a2, a2.type == a1.type \u0026\u0026 a2.value == a1.value) : true )\"\n+kubebuilder:validation:XValidation:message=\"Hostname values must be unique\",rule=\"self.all(a1, a1.type == 'Hostname' ? self.exists_one(a2, a2.type == a1.type \u0026\u0026 a2.value == a1.value) : true )\""},{"fieldName":"Infrastructure","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayInfrastructure","typeDecorators":["Ptr"],"docString":"Infrastructure defines infrastructure level attributes about this Gateway instance.\n\nSupport: Extended\n\n+optional"},{"fieldName":"BackendTLS","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayBackendTLS","typeDecorators":["Ptr"],"docString":"BackendTLS configures TLS settings for when this Gateway is connecting to\nbackends with TLS.\n\nSupport: Core\n\n+optional\n\u003cgateway:experimental\u003e"},{"fieldName":"AllowedListeners","typeName":"sigs.k8s.io/gateway-api/apis/v1.AllowedListeners","typeDecorators":["Ptr"],"docString":"AllowedListeners defines which ListenerSets can be attached to this Gateway.\nWhile this feature is experimental, the default value is to allow no ListenerSets.\n\n\u003cgateway:experimental\u003e\n\n+optional"}],"enumValues":[],"docString":"GatewaySpec defines the desired state of Gateway.\n\nNot all possible combinations of options specified in the Spec are\nvalid. Some invalid configurations can be caught synchronously via CRD\nvalidation, but there are many cases that will require asynchronous\nsignaling via the GatewayStatus block.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewaySpecAddress":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewaySpecAddress","fields":[{"fieldName":"Type","typeName":"AddressType","typeDecorators":["Ptr"],"docString":"Type of the address.\n\n+optional\n+kubebuilder:default=IPAddress"},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"When a value is unspecified, an implementation SHOULD automatically\nassign an address matching the requested type if possible.\n\nIf an implementation does not support an empty value, they MUST set the\n\"Programmed\" condition in status to False with a reason of \"AddressNotAssigned\".\n\nExamples: `1.2.3.4`, `128::1`, `my-ip-address`.\n\n+optional\n+kubebuilder:validation:MaxLength=253"}],"enumValues":[],"docString":"GatewaySpecAddress describes an address that can be bound to a Gateway.\n\n+kubebuilder:validation:XValidation:message=\"Hostname value must only contain valid characters (matching ^(\\\\*\\\\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$)\",rule=\"self.type == 'Hostname' ? self.value.matches(r\\\"\\\"\\\"^(\\\\*\\\\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$\\\"\\\"\\\"): true\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewayStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayStatus","fields":[{"fieldName":"Addresses","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayStatusAddress","typeDecorators":["List"],"docString":"Addresses lists the network addresses that have been bound to the\nGateway.\n\nThis list may differ from the addresses provided in the spec under some\nconditions:\n\n  * no addresses are specified, all addresses are dynamically assigned\n  * a combination of specified and dynamic addresses are assigned\n  * a specified address was unusable (e.g. already in use)\n\n+optional\n\u003cgateway:validateIPAddress\u003e\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"Conditions describe the current conditions of the Gateway.\n\nImplementations should prefer to express Gateway conditions\nusing the `GatewayConditionType` and `GatewayConditionReason`\nconstants so that operators and tools can converge on a common\nvocabulary to describe Gateway state.\n\nKnown condition types are:\n\n* \"Accepted\"\n* \"Programmed\"\n* \"Ready\"\n\n+optional\n+listType=map\n+listMapKey=type\n+kubebuilder:validation:MaxItems=8\n+kubebuilder:default={{type: \"Accepted\", status: \"Unknown\", reason:\"Pending\", message:\"Waiting for controller\", lastTransitionTime: \"1970-01-01T00:00:00Z\"},{type: \"Programmed\", status: \"Unknown\", reason:\"Pending\", message:\"Waiting for controller\", lastTransitionTime: \"1970-01-01T00:00:00Z\"}}"},{"fieldName":"Listeners","typeName":"sigs.k8s.io/gateway-api/apis/v1.ListenerStatus","typeDecorators":["List"],"docString":"Listeners provide status for each unique listener port defined in the Spec.\n\n+optional\n+listType=map\n+listMapKey=name\n+kubebuilder:validation:MaxItems=64"}],"enumValues":[],"docString":"GatewayStatus defines the observed state of Gateway.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewayStatusAddress":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayStatusAddress","fields":[{"fieldName":"Type","typeName":"AddressType","typeDecorators":["Ptr"],"docString":"Type of the address.\n\n+optional\n+kubebuilder:default=IPAddress"},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"Value of the address. The validity of the values will depend\non the type and support by the controller.\n\nExamples: `1.2.3.4`, `128::1`, `my-ip-address`.\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=253"}],"enumValues":[],"docString":"GatewayStatusAddress describes a network address that is bound to a Gateway.\n\n+kubebuilder:validation:XValidation:message=\"Hostname value must only contain valid characters (matching ^(\\\\*\\\\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$)\",rule=\"self.type == 'Hostname' ? self.value.matches(r\\\"\\\"\\\"^(\\\\*\\\\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$\\\"\\\"\\\"): true\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewayTLSConfig":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayTLSConfig","fields":[{"fieldName":"Mode","typeName":"sigs.k8s.io/gateway-api/apis/v1.TLSModeType","typeDecorators":["Ptr"],"docString":"Mode defines the TLS behavior for the TLS session initiated by the client.\nThere are two possible modes:\n\n- Terminate: The TLS session between the downstream client and the\n  Gateway is terminated at the Gateway. This mode requires certificates\n  to be specified in some way, such as populating the certificateRefs\n  field.\n- Passthrough: The TLS session is NOT terminated by the Gateway. This\n  implies that the Gateway can't decipher the TLS stream except for\n  the ClientHello message of the TLS protocol. The certificateRefs field\n  is ignored in this mode.\n\nSupport: Core\n\n+optional\n+kubebuilder:default=Terminate"},{"fieldName":"CertificateRefs","typeName":"SecretObjectReference","typeDecorators":["List"],"docString":"CertificateRefs contains a series of references to Kubernetes objects that\ncontains TLS certificates and private keys. These certificates are used to\nestablish a TLS handshake for requests that match the hostname of the\nassociated listener.\n\nA single CertificateRef to a Kubernetes Secret has \"Core\" support.\nImplementations MAY choose to support attaching multiple certificates to\na Listener, but this behavior is implementation-specific.\n\nReferences to a resource in different namespace are invalid UNLESS there\nis a ReferenceGrant in the target namespace that allows the certificate\nto be attached. If a ReferenceGrant does not allow this reference, the\n\"ResolvedRefs\" condition MUST be set to False for this listener with the\n\"RefNotPermitted\" reason.\n\nThis field is required to have at least one element when the mode is set\nto \"Terminate\" (default) and is optional otherwise.\n\nCertificateRefs can reference to standard Kubernetes resources, i.e.\nSecret, or implementation-specific custom resources.\n\nSupport: Core - A single reference to a Kubernetes Secret of type kubernetes.io/tls\n\nSupport: Implementation-specific (More than one reference or other resource types)\n\n+optional\n+kubebuilder:validation:MaxItems=64"},{"fieldName":"FrontendValidation","typeName":"sigs.k8s.io/gateway-api/apis/v1.FrontendTLSValidation","typeDecorators":["Ptr"],"docString":"FrontendValidation holds configuration information for validating the frontend (client).\nSetting this field will require clients to send a client certificate\nrequired for validation during the TLS handshake. In browsers this may result in a dialog appearing\nthat requests a user to specify the client certificate.\nThe maximum depth of a certificate chain accepted in verification is Implementation specific.\n\nSupport: Extended\n\n+optional\n\u003cgateway:experimental\u003e"},{"fieldName":"Options","typeName":"AnnotationValue","typeDecorators":["Map[AnnotationKey]"],"docString":"Options are a list of key/value pairs to enable extended TLS\nconfiguration for each implementation. For example, configuring the\nminimum TLS version or supported cipher suites.\n\nA set of common keys MAY be defined by the API in the future. To avoid\nany ambiguity, implementation-specific definitions MUST use\ndomain-prefixed names, such as `example.com/my-custom-option`.\nUn-prefixed names are reserved for key names defined by Gateway API.\n\nSupport: Implementation-specific\n\n+optional\n+kubebuilder:validation:MaxProperties=16"}],"enumValues":[],"docString":"GatewayTLSConfig describes a TLS configuration.\n\n+kubebuilder:validation:XValidation:message=\"certificateRefs or options must be specified when mode is Terminate\",rule=\"self.mode == 'Terminate' ? size(self.certificateRefs) \u003e 0 || size(self.options) \u003e 0 : true\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPBackendRef":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPBackendRef","fields":[{"fieldName":"BackendRef","typeName":"BackendRef","typeDecorators":null,"docString":"BackendRef is a reference to a backend to forward matched requests to.\n\nA BackendRef can be invalid for the following reasons. In all cases, the\nimplementation MUST ensure the `ResolvedRefs` Condition on the Route\nis set to `status: False`, with a Reason and Message that indicate\nwhat is the cause of the error.\n\nA BackendRef is invalid if:\n\n* It refers to an unknown or unsupported kind of resource. In this\n  case, the Reason must be set to `InvalidKind` and Message of the\n  Condition must explain which kind of resource is unknown or unsupported.\n\n* It refers to a resource that does not exist. In this case, the Reason must\n  be set to `BackendNotFound` and the Message of the Condition must explain\n  which resource does not exist.\n\n* It refers a resource in another namespace when the reference has not been\n  explicitly allowed by a ReferenceGrant (or equivalent concept). In this\n  case, the Reason must be set to `RefNotPermitted` and the Message of the\n  Condition must explain which cross-namespace reference is not allowed.\n\n* It refers to a Kubernetes Service that has an incompatible appProtocol\n  for the given Route type\n\n* The BackendTLSPolicy object is installed in the cluster, a BackendTLSPolicy\n  is present that refers to the Service, and the implementation is unable\n  to meet the requirement. At the time of writing, BackendTLSPolicy is\n  experimental, but once it becomes standard, this will become a MUST\n  requirement.\n\nSupport: Core for Kubernetes Service\n\nSupport: Implementation-specific for any other resource\n\nSupport for weight: Core\n\nSupport for Kubernetes Service appProtocol: Extended\n\nSupport for BackendTLSPolicy: Experimental and ImplementationSpecific\n\n+optional"},{"fieldName":"Filters","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteFilter","typeDecorators":["List"],"docString":"Filters defined at this level should be executed if and only if the\nrequest is being forwarded to the backend defined here.\n\nSupport: Implementation-specific (For broader support of filters, use the\nFilters field in HTTPRouteRule.)\n\n+optional\n+kubebuilder:validation:MaxItems=16\n+kubebuilder:validation:XValidation:message=\"May specify either httpRouteFilterRequestRedirect or httpRouteFilterRequestRewrite, but not both\",rule=\"!(self.exists(f, f.type == 'RequestRedirect') \u0026\u0026 self.exists(f, f.type == 'URLRewrite'))\"\n+kubebuilder:validation:XValidation:message=\"RequestHeaderModifier filter cannot be repeated\",rule=\"self.filter(f, f.type == 'RequestHeaderModifier').size() \u003c= 1\"\n+kubebuilder:validation:XValidation:message=\"ResponseHeaderModifier filter cannot be repeated\",rule=\"self.filter(f, f.type == 'ResponseHeaderModifier').size() \u003c= 1\"\n+kubebuilder:validation:XValidation:message=\"RequestRedirect filter cannot be repeated\",rule=\"self.filter(f, f.type == 'RequestRedirect').size() \u003c= 1\"\n+kubebuilder:validation:XValidation:message=\"URLRewrite filter cannot be repeated\",rule=\"self.filter(f, f.type == 'URLRewrite').size() \u003c= 1\""}],"enumValues":[],"docString":"HTTPBackendRef defines how a HTTPRoute forwards a HTTP request.\n\nNote that when a namespace different than the local namespace is specified, a\nReferenceGrant object is required in the referent namespace to allow that\nnamespace's owner to accept the reference. See the ReferenceGrant\ndocumentation for details.\n\n\u003cgateway:experimental:description\u003e\n\nWhen the BackendRef points to a Kubernetes Service, implementations SHOULD\nhonor the appProtocol field if it is set for the target Service Port.\n\nImplementations supporting appProtocol SHOULD recognize the Kubernetes\nStandard Application Protocols defined in KEP-3726.\n\nIf a Service appProtocol isn't specified, an implementation MAY infer the\nbackend protocol through its own means. Implementations MAY infer the\nprotocol from the Route type referring to the backend Service.\n\nIf a Route is not able to send traffic to the backend using the specified\nprotocol then the backend is considered invalid. Implementations MUST set the\n\"ResolvedRefs\" condition to \"False\" with the \"UnsupportedProtocol\" reason.\n\n\u003c/gateway:experimental:description\u003e","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPCORSFilter":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPCORSFilter","fields":[{"fieldName":"AllowOrigins","typeName":"AbsoluteURI","typeDecorators":["List"],"docString":"AllowOrigins indicates whether the response can be shared with requested\nresource from the given `Origin`.\n\nThe `Origin` consists of a scheme and a host, with an optional port, and\ntakes the form `\u003cscheme\u003e://\u003chost\u003e(:\u003cport\u003e)`.\n\nValid values for scheme are: `http` and `https`.\n\nValid values for port are any integer between 1 and 65535 (the list of\navailable TCP/UDP ports). Note that, if not included, port `80` is\nassumed for `http` scheme origins, and port `443` is assumed for `https`\norigins. This may affect origin matching.\n\nThe host part of the origin may contain the wildcard character `*`. These\nwildcard characters behave as follows:\n\n* `*` is a greedy match to the _left_, including any number of\n  DNS labels to the left of its position. This also means that\n  `*` will include any number of period `.` characters to the\n  left of its position.\n* A wildcard by itself matches all hosts.\n\nAn origin value that includes _only_ the `*` character indicates requests\nfrom all `Origin`s are allowed.\n\nWhen the `AllowOrigins` field is configured with multiple origins, it\nmeans the server supports clients from multiple origins. If the request\n`Origin` matches the configured allowed origins, the gateway must return\nthe given `Origin` and sets value of the header\n`Access-Control-Allow-Origin` same as the `Origin` header provided by the\nclient.\n\nThe status code of a successful response to a \"preflight\" request is\nalways an OK status (i.e., 204 or 200).\n\nIf the request `Origin` does not match the configured allowed origins,\nthe gateway returns 204/200 response but doesn't set the relevant\ncross-origin response headers. Alternatively, the gateway responds with\n403 status to the \"preflight\" request is denied, coupled with omitting\nthe CORS headers. The cross-origin request fails on the client side.\nTherefore, the client doesn't attempt the actual cross-origin request.\n\nThe `Access-Control-Allow-Origin` response header can only use `*`\nwildcard as value when the `AllowCredentials` field is false or omitted.\n\nWhen the `AllowCredentials` field is true and `AllowOrigins` field\nspecified with the `*` wildcard, the gateway must return a single origin\nin the value of the `Access-Control-Allow-Origin` response header,\ninstead of specifying the `*` wildcard. The value of the header\n`Access-Control-Allow-Origin` is same as the `Origin` header provided by\nthe client.\n\nSupport: Extended\n+listType=set\n+kubebuilder:validation:MaxItems=64"},{"fieldName":"AllowCredentials","typeName":"bool","typeDecorators":["Ptr"],"docString":"AllowCredentials indicates whether the actual cross-origin request allows\nto include credentials.\n\nWhen set to true, the gateway will include the `Access-Control-Allow-Credentials`\nresponse header with value true (case-sensitive).\n\nWhen set to false or omitted the gateway will omit the header\n`Access-Control-Allow-Credentials` entirely (this is the standard CORS\nbehavior).\n\nSupport: Extended\n\n+optional"},{"fieldName":"AllowMethods","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPMethodWithWildcard","typeDecorators":["List"],"docString":"AllowMethods indicates which HTTP methods are supported for accessing the\nrequested resource.\n\nValid values are any method defined by RFC9110, along with the special\nvalue `*`, which represents all HTTP methods are allowed.\n\nMethod names are case sensitive, so these values are also case-sensitive.\n(See https://www.rfc-editor.org/rfc/rfc2616#section-5.1.1)\n\nMultiple method names in the value of the `Access-Control-Allow-Methods`\nresponse header are separated by a comma (\",\").\n\nA CORS-safelisted method is a method that is `GET`, `HEAD`, or `POST`.\n(See https://fetch.spec.whatwg.org/#cors-safelisted-method) The\nCORS-safelisted methods are always allowed, regardless of whether they\nare specified in the `AllowMethods` field.\n\nWhen the `AllowMethods` field is configured with one or more methods, the\ngateway must return the `Access-Control-Allow-Methods` response header\nwhich value is present in the `AllowMethods` field.\n\nIf the HTTP method of the `Access-Control-Request-Method` request header\nis not included in the list of methods specified by the response header\n`Access-Control-Allow-Methods`, it will present an error on the client\nside.\n\nThe `Access-Control-Allow-Methods` response header can only use `*`\nwildcard as value when the `AllowCredentials` field is false or omitted.\n\nWhen the `AllowCredentials` field is true and `AllowMethods` field\nspecified with the `*` wildcard, the gateway must specify one HTTP method\nin the value of the Access-Control-Allow-Methods response header. The\nvalue of the header `Access-Control-Allow-Methods` is same as the\n`Access-Control-Request-Method` header provided by the client. If the\nheader `Access-Control-Request-Method` is not included in the request,\nthe gateway will omit the `Access-Control-Allow-Methods` response header,\ninstead of specifying the `*` wildcard. A Gateway implementation may\nchoose to add implementation-specific default methods.\n\nSupport: Extended\n\n+listType=set\n+kubebuilder:validation:MaxItems=9\n+kubebuilder:validation:XValidation:message=\"AllowMethods cannot contain '*' alongside other methods\",rule=\"!('*' in self \u0026\u0026 self.size() \u003e 1)\""},{"fieldName":"AllowHeaders","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderName","typeDecorators":["List"],"docString":"AllowHeaders indicates which HTTP request headers are supported for\naccessing the requested resource.\n\nHeader names are not case sensitive.\n\nMultiple header names in the value of the `Access-Control-Allow-Headers`\nresponse header are separated by a comma (\",\").\n\nWhen the `AllowHeaders` field is configured with one or more headers, the\ngateway must return the `Access-Control-Allow-Headers` response header\nwhich value is present in the `AllowHeaders` field.\n\nIf any header name in the `Access-Control-Request-Headers` request header\nis not included in the list of header names specified by the response\nheader `Access-Control-Allow-Headers`, it will present an error on the\nclient side.\n\nIf any header name in the `Access-Control-Allow-Headers` response header\ndoes not recognize by the client, it will also occur an error on the\nclient side.\n\nA wildcard indicates that the requests with all HTTP headers are allowed.\nThe `Access-Control-Allow-Headers` response header can only use `*`\nwildcard as value when the `AllowCredentials` field is false or omitted.\n\nWhen the `AllowCredentials` field is true and `AllowHeaders` field\nspecified with the `*` wildcard, the gateway must specify one or more\nHTTP headers in the value of the `Access-Control-Allow-Headers` response\nheader. The value of the header `Access-Control-Allow-Headers` is same as\nthe `Access-Control-Request-Headers` header provided by the client. If\nthe header `Access-Control-Request-Headers` is not included in the\nrequest, the gateway will omit the `Access-Control-Allow-Headers`\nresponse header, instead of specifying the `*` wildcard. A Gateway\nimplementation may choose to add implementation-specific default headers.\n\nSupport: Extended\n\n+listType=set\n+kubebuilder:validation:MaxItems=64"},{"fieldName":"ExposeHeaders","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderName","typeDecorators":["List"],"docString":"ExposeHeaders indicates which HTTP response headers can be exposed\nto client-side scripts in response to a cross-origin request.\n\nA CORS-safelisted response header is an HTTP header in a CORS response\nthat it is considered safe to expose to the client scripts.\nThe CORS-safelisted response headers include the following headers:\n`Cache-Control`\n`Content-Language`\n`Content-Length`\n`Content-Type`\n`Expires`\n`Last-Modified`\n`Pragma`\n(See https://fetch.spec.whatwg.org/#cors-safelisted-response-header-name)\nThe CORS-safelisted response headers are exposed to client by default.\n\nWhen an HTTP header name is specified using the `ExposeHeaders` field,\nthis additional header will be exposed as part of the response to the\nclient.\n\nHeader names are not case sensitive.\n\nMultiple header names in the value of the `Access-Control-Expose-Headers`\nresponse header are separated by a comma (\",\").\n\nA wildcard indicates that the responses with all HTTP headers are exposed\nto clients. The `Access-Control-Expose-Headers` response header can only\nuse `*` wildcard as value when the `AllowCredentials` field is false or omitted.\n\nSupport: Extended\n\n+optional\n+listType=set\n+kubebuilder:validation:MaxItems=64"},{"fieldName":"MaxAge","typeName":"int32","typeDecorators":null,"docString":"MaxAge indicates the duration (in seconds) for the client to cache the\nresults of a \"preflight\" request.\n\nThe information provided by the `Access-Control-Allow-Methods` and\n`Access-Control-Allow-Headers` response headers can be cached by the\nclient until the time specified by `Access-Control-Max-Age` elapses.\n\nThe default value of `Access-Control-Max-Age` response header is 5\n(seconds).\n\n+optional\n+kubebuilder:default=5\n+kubebuilder:validation:Minimum=1"}],"enumValues":[],"docString":"HTTPCORSFilter defines a filter that that configures Cross-Origin Request\nSharing (CORS).","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPHeader":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPHeader","fields":[{"fieldName":"Name","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderName","typeDecorators":null,"docString":"Name is the name of the HTTP Header to be matched. Name matching MUST be\ncase-insensitive. (See https://tools.ietf.org/html/rfc7230#section-3.2).\n\nIf multiple entries specify equivalent header names, the first entry with\nan equivalent name MUST be considered for a match. Subsequent entries\nwith an equivalent header name MUST be ignored. Due to the\ncase-insensitivity of header names, \"foo\" and \"Foo\" are considered\nequivalent."},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"Value is the value of HTTP Header to be matched.\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=4096"}],"enumValues":[],"docString":"HTTPHeader represents an HTTP Header name and value as defined by RFC 7230.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderFilter":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPHeaderFilter","fields":[{"fieldName":"Set","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeader","typeDecorators":["List"],"docString":"Set overwrites the request with the given header (name, value)\nbefore the action.\n\nInput:\n  GET /foo HTTP/1.1\n  my-header: foo\n\nConfig:\n  set:\n  - name: \"my-header\"\n    value: \"bar\"\n\nOutput:\n  GET /foo HTTP/1.1\n  my-header: bar\n\n+optional\n+listType=map\n+listMapKey=name\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"Add","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeader","typeDecorators":["List"],"docString":"Add adds the given header(s) (name, value) to the request\nbefore the action. It appends to any existing values associated\nwith the header name.\n\nInput:\n  GET /foo HTTP/1.1\n  my-header: foo\n\nConfig:\n  add:\n  - name: \"my-header\"\n    value: \"bar,baz\"\n\nOutput:\n  GET /foo HTTP/1.1\n  my-header: foo,bar,baz\n\n+optional\n+listType=map\n+listMapKey=name\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"Remove","typeName":"string","typeDecorators":["List"],"docString":"Remove the given header(s) from the HTTP request before the action. The\nvalue of Remove is a list of HTTP header names. Note that the header\nnames are case-insensitive (see\nhttps://datatracker.ietf.org/doc/html/rfc2616#section-4.2).\n\nInput:\n  GET /foo HTTP/1.1\n  my-header1: foo\n  my-header2: bar\n  my-header3: baz\n\nConfig:\n  remove: [\"my-header1\", \"my-header3\"]\n\nOutput:\n  GET /foo HTTP/1.1\n  my-header2: bar\n\n+optional\n+listType=set\n+kubebuilder:validation:MaxItems=16"}],"enumValues":[],"docString":"HTTPHeaderFilter defines a filter that modifies the headers of an HTTP\nrequest or response. Only one action for a given header name is\npermitted. Filters specifying multiple actions of the same or different\ntype for any one header name are invalid. Configuration to set or add\nmultiple values for a header must use RFC 7230 header value formatting,\nseparating each value with a comma.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderMatch":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPHeaderMatch","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.HeaderMatchType","typeDecorators":["Ptr"],"docString":"Type specifies how to match against the value of the header.\n\nSupport: Core (Exact)\n\nSupport: Implementation-specific (RegularExpression)\n\nSince RegularExpression HeaderMatchType has implementation-specific\nconformance, implementations can support POSIX, PCRE or any other dialects\nof regular expressions. Please read the implementation's documentation to\ndetermine the supported dialect.\n\n+optional\n+kubebuilder:default=Exact"},{"fieldName":"Name","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderName","typeDecorators":null,"docString":"Name is the name of the HTTP Header to be matched. Name matching MUST be\ncase-insensitive. (See https://tools.ietf.org/html/rfc7230#section-3.2).\n\nIf multiple entries specify equivalent header names, only the first\nentry with an equivalent name MUST be considered for a match. Subsequent\nentries with an equivalent header name MUST be ignored. Due to the\ncase-insensitivity of header names, \"foo\" and \"Foo\" are considered\nequivalent.\n\nWhen a header is repeated in an HTTP request, it is\nimplementation-specific behavior as to how this is represented.\nGenerally, proxies should follow the guidance from the RFC:\nhttps://www.rfc-editor.org/rfc/rfc7230.html#section-3.2.2 regarding\nprocessing a repeated header, with special handling for \"Set-Cookie\"."},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"Value is the value of HTTP Header to be matched.\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=4096"}],"enumValues":[],"docString":"HTTPHeaderMatch describes how to select a HTTP route by matching HTTP request\nheaders.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPMethod":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPMethod","fields":[],"enumValues":[{"name":"HTTPMethodGet","docString":""},{"name":"HTTPMethodHead","docString":""},{"name":"HTTPMethodPost","docString":""},{"name":"HTTPMethodPut","docString":""},{"name":"HTTPMethodDelete","docString":""},{"name":"HTTPMethodConnect","docString":""},{"name":"HTTPMethodOptions","docString":""},{"name":"HTTPMethodTrace","docString":""},{"name":"HTTPMethodPatch","docString":""}],"docString":"HTTPMethod describes how to select a HTTP route by matching the HTTP\nmethod as defined by\n[RFC 7231](https://datatracker.ietf.org/doc/html/rfc7231#section-4) and\n[RFC 5789](https://datatracker.ietf.org/doc/html/rfc5789#section-2).\nThe value is expected in upper case.\n\nNote that values may be added to this enum, implementations\nmust ensure that unknown values will not cause a crash.\n\nUnknown values here must result in the implementation setting the\nAccepted Condition for the Route to `status: False`, with a\nReason of `UnsupportedValue`.\n\n+kubebuilder:validation:Enum=GET;HEAD;POST;PUT;DELETE;CONNECT;OPTIONS;TRACE;PATCH","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPPathMatch":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPPathMatch","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.PathMatchType","typeDecorators":["Ptr"],"docString":"Type specifies how to match against the path Value.\n\nSupport: Core (Exact, PathPrefix)\n\nSupport: Implementation-specific (RegularExpression)\n\n+optional\n+kubebuilder:default=PathPrefix"},{"fieldName":"Value","typeName":"string","typeDecorators":["Ptr"],"docString":"Value of the HTTP path to match against.\n\n+optional\n+kubebuilder:default=\"/\"\n+kubebuilder:validation:MaxLength=1024"}],"enumValues":[],"docString":"HTTPPathMatch describes how to select a HTTP route by matching the HTTP request path.\n\n+kubebuilder:validation:XValidation:message=\"value must be an absolute path and start with '/' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? self.value.startsWith('/') : true\"\n+kubebuilder:validation:XValidation:message=\"must not contain '//' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? !self.value.contains('//') : true\"\n+kubebuilder:validation:XValidation:message=\"must not contain '/./' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? !self.value.contains('/./') : true\"\n+kubebuilder:validation:XValidation:message=\"must not contain '/../' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? !self.value.contains('/../') : true\"\n+kubebuilder:validation:XValidation:message=\"must not contain '%2f' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? !self.value.contains('%2f') : true\"\n+kubebuilder:validation:XValidation:message=\"must not contain '%2F' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? !self.value.contains('%2F') : true\"\n+kubebuilder:validation:XValidation:message=\"must not contain '#' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? !self.value.contains('#') : true\"\n+kubebuilder:validation:XValidation:message=\"must not end with '/..' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? !self.value.endsWith('/..') : true\"\n+kubebuilder:validation:XValidation:message=\"must not end with '/.' when type one of ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? !self.value.endsWith('/.') : true\"\n+kubebuilder:validation:XValidation:message=\"type must be one of ['Exact', 'PathPrefix', 'RegularExpression']\",rule=\"self.type in ['Exact','PathPrefix'] || self.type == 'RegularExpression'\"\n+kubebuilder:validation:XValidation:message=\"must only contain valid characters (matching ^(?:[-A-Za-z0-9/._~!$\u0026'()*+,;=:@]|[%][0-9a-fA-F]{2})+$) for types ['Exact', 'PathPrefix']\",rule=\"(self.type in ['Exact','PathPrefix']) ? self.value.matches(r\\\"\\\"\\\"^(?:[-A-Za-z0-9/._~!$\u0026'()*+,;=:@]|[%][0-9a-fA-F]{2})+$\\\"\\\"\\\") : true\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPPathModifier":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPPathModifier","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPPathModifierType","typeDecorators":null,"docString":"Type defines the type of path modifier. Additional types may be\nadded in a future release of the API.\n\nNote that values may be added to this enum, implementations\nmust ensure that unknown values will not cause a crash.\n\nUnknown values here must result in the implementation setting the\nAccepted Condition for the Route to `status: False`, with a\nReason of `UnsupportedValue`.\n\n+kubebuilder:validation:Enum=ReplaceFullPath;ReplacePrefixMatch"},{"fieldName":"ReplaceFullPath","typeName":"string","typeDecorators":["Ptr"],"docString":"ReplaceFullPath specifies the value with which to replace the full path\nof a request during a rewrite or redirect.\n\n+kubebuilder:validation:MaxLength=1024\n+optional"},{"fieldName":"ReplacePrefixMatch","typeName":"string","typeDecorators":["Ptr"],"docString":"ReplacePrefixMatch specifies the value with which to replace the prefix\nmatch of a request during a rewrite or redirect. For example, a request\nto \"/foo/bar\" with a prefix match of \"/foo\" and a ReplacePrefixMatch\nof \"/xyz\" would be modified to \"/xyz/bar\".\n\nNote that this matches the behavior of the PathPrefix match type. This\nmatches full path elements. A path element refers to the list of labels\nin the path split by the `/` separator. When specified, a trailing `/` is\nignored. For example, the paths `/abc`, `/abc/`, and `/abc/def` would all\nmatch the prefix `/abc`, but the path `/abcd` would not.\n\nReplacePrefixMatch is only compatible with a `PathPrefix` HTTPRouteMatch.\nUsing any other HTTPRouteMatch type on the same HTTPRouteRule will result in\nthe implementation setting the Accepted Condition for the Route to `status: False`.\n\nRequest Path | Prefix Match | Replace Prefix | Modified Path\n-------------|--------------|----------------|----------\n/foo/bar     | /foo         | /xyz           | /xyz/bar\n/foo/bar     | /foo         | /xyz/          | /xyz/bar\n/foo/bar     | /foo/        | /xyz           | /xyz/bar\n/foo/bar     | /foo/        | /xyz/          | /xyz/bar\n/foo         | /foo         | /xyz           | /xyz\n/foo/        | /foo         | /xyz           | /xyz/\n/foo/bar     | /foo         | \u003cempty string\u003e | /bar\n/foo/        | /foo         | \u003cempty string\u003e | /\n/foo         | /foo         | \u003cempty string\u003e | /\n/foo/        | /foo         | /              | /\n/foo         | /foo         | /              | /\n\n+kubebuilder:validation:MaxLength=1024\n+optional"}],"enumValues":[],"docString":"HTTPPathModifier defines configuration for path modifiers.\n\n+kubebuilder:validation:XValidation:message=\"replaceFullPath must be specified when type is set to 'ReplaceFullPath'\",rule=\"self.type == 'ReplaceFullPath' ? has(self.replaceFullPath) : true\"\n+kubebuilder:validation:XValidation:message=\"type must be 'ReplaceFullPath' when replaceFullPath is set\",rule=\"has(self.replaceFullPath) ? self.type == 'ReplaceFullPath' : true\"\n+kubebuilder:validation:XValidation:message=\"replacePrefixMatch must be specified when type is set to 'ReplacePrefixMatch'\",rule=\"self.type == 'ReplacePrefixMatch' ? has(self.replacePrefixMatch) : true\"\n+kubebuilder:validation:XValidation:message=\"type must be 'ReplacePrefixMatch' when replacePrefixMatch is set\",rule=\"has(self.replacePrefixMatch) ? self.type == 'ReplacePrefixMatch' : true\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPPathModifierType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPPathModifierType","fields":[],"enumValues":[{"name":"FullPathHTTPPathModifier","docString":"This type of modifier indicates that the full path will be replaced\nby the specified value."},{"name":"PrefixMatchHTTPPathModifier","docString":"This type of modifier indicates that any prefix path matches will be\nreplaced by the substitution value. For example, a path with a prefix\nmatch of \"/foo\" and a ReplacePrefixMatch substitution of \"/bar\" will have\nthe \"/foo\" prefix replaced with \"/bar\" in matching requests.\n\nNote that this matches the behavior of the PathPrefix match type. This\nmatches full path elements. A path element refers to the list of labels\nin the path split by the `/` separator. When specified, a trailing `/` is\nignored. For example, the paths `/abc`, `/abc/`, and `/abc/def` would all\nmatch the prefix `/abc`, but the path `/abcd` would not."}],"docString":"HTTPPathModifierType defines the type of path redirect or rewrite.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPQueryParamMatch":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPQueryParamMatch","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.QueryParamMatchType","typeDecorators":["Ptr"],"docString":"Type specifies how to match against the value of the query parameter.\n\nSupport: Extended (Exact)\n\nSupport: Implementation-specific (RegularExpression)\n\nSince RegularExpression QueryParamMatchType has Implementation-specific\nconformance, implementations can support POSIX, PCRE or any other\ndialects of regular expressions. Please read the implementation's\ndocumentation to determine the supported dialect.\n\n+optional\n+kubebuilder:default=Exact"},{"fieldName":"Name","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderName","typeDecorators":null,"docString":"Name is the name of the HTTP query param to be matched. This must be an\nexact string match. (See\nhttps://tools.ietf.org/html/rfc7230#section-2.7.3).\n\nIf multiple entries specify equivalent query param names, only the first\nentry with an equivalent name MUST be considered for a match. Subsequent\nentries with an equivalent query param name MUST be ignored.\n\nIf a query param is repeated in an HTTP request, the behavior is\npurposely left undefined, since different data planes have different\ncapabilities. However, it is *recommended* that implementations should\nmatch against the first value of the param if the data plane supports it,\nas this behavior is expected in other load balancing contexts outside of\nthe Gateway API.\n\nUsers SHOULD NOT route traffic based on repeated query params to guard\nthemselves against potential differences in the implementations."},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"Value is the value of HTTP query param to be matched.\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=1024"}],"enumValues":[],"docString":"HTTPQueryParamMatch describes how to select a HTTP route by matching HTTP\nquery parameters.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRequestMirrorFilter":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRequestMirrorFilter","fields":[{"fieldName":"BackendRef","typeName":"BackendObjectReference","typeDecorators":null,"docString":"BackendRef references a resource where mirrored requests are sent.\n\nMirrored requests must be sent only to a single destination endpoint\nwithin this BackendRef, irrespective of how many endpoints are present\nwithin this BackendRef.\n\nIf the referent cannot be found, this BackendRef is invalid and must be\ndropped from the Gateway. The controller must ensure the \"ResolvedRefs\"\ncondition on the Route status is set to `status: False` and not configure\nthis backend in the underlying implementation.\n\nIf there is a cross-namespace reference to an *existing* object\nthat is not allowed by a ReferenceGrant, the controller must ensure the\n\"ResolvedRefs\"  condition on the Route is set to `status: False`,\nwith the \"RefNotPermitted\" reason and not configure this backend in the\nunderlying implementation.\n\nIn either error case, the Message of the `ResolvedRefs` Condition\nshould be used to provide more detail about the problem.\n\nSupport: Extended for Kubernetes Service\n\nSupport: Implementation-specific for any other resource"},{"fieldName":"Percent","typeName":"int32","typeDecorators":["Ptr"],"docString":"Percent represents the percentage of requests that should be\nmirrored to BackendRef. Its minimum value is 0 (indicating 0% of\nrequests) and its maximum value is 100 (indicating 100% of requests).\n\nOnly one of Fraction or Percent may be specified. If neither field\nis specified, 100% of requests will be mirrored.\n\n+optional\n+kubebuilder:validation:Minimum=0\n+kubebuilder:validation:Maximum=100"},{"fieldName":"Fraction","typeName":"Fraction","typeDecorators":["Ptr"],"docString":"Fraction represents the fraction of requests that should be\nmirrored to BackendRef.\n\nOnly one of Fraction or Percent may be specified. If neither field\nis specified, 100% of requests will be mirrored.\n\n+optional"}],"enumValues":[],"docString":"HTTPRequestMirrorFilter defines configuration for the RequestMirror filter.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRequestRedirectFilter":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRequestRedirectFilter","fields":[{"fieldName":"Scheme","typeName":"string","typeDecorators":["Ptr"],"docString":"Scheme is the scheme to be used in the value of the `Location` header in\nthe response. When empty, the scheme of the request is used.\n\nScheme redirects can affect the port of the redirect, for more information,\nrefer to the documentation for the port field of this filter.\n\nNote that values may be added to this enum, implementations\nmust ensure that unknown values will not cause a crash.\n\nUnknown values here must result in the implementation setting the\nAccepted Condition for the Route to `status: False`, with a\nReason of `UnsupportedValue`.\n\nSupport: Extended\n\n+optional\n+kubebuilder:validation:Enum=http;https"},{"fieldName":"Hostname","typeName":"PreciseHostname","typeDecorators":["Ptr"],"docString":"Hostname is the hostname to be used in the value of the `Location`\nheader in the response.\nWhen empty, the hostname in the `Host` header of the request is used.\n\nSupport: Core\n\n+optional"},{"fieldName":"Path","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPPathModifier","typeDecorators":["Ptr"],"docString":"Path defines parameters used to modify the path of the incoming request.\nThe modified path is then used to construct the `Location` header. When\nempty, the request path is used as-is.\n\nSupport: Extended\n\n+optional"},{"fieldName":"Port","typeName":"PortNumber","typeDecorators":["Ptr"],"docString":"Port is the port to be used in the value of the `Location`\nheader in the response.\n\nIf no port is specified, the redirect port MUST be derived using the\nfollowing rules:\n\n* If redirect scheme is not-empty, the redirect port MUST be the well-known\n  port associated with the redirect scheme. Specifically \"http\" to port 80\n  and \"https\" to port 443. If the redirect scheme does not have a\n  well-known port, the listener port of the Gateway SHOULD be used.\n* If redirect scheme is empty, the redirect port MUST be the Gateway\n  Listener port.\n\nImplementations SHOULD NOT add the port number in the 'Location'\nheader in the following cases:\n\n* A Location header that will use HTTP (whether that is determined via\n  the Listener protocol or the Scheme field) _and_ use port 80.\n* A Location header that will use HTTPS (whether that is determined via\n  the Listener protocol or the Scheme field) _and_ use port 443.\n\nSupport: Extended\n\n+optional"},{"fieldName":"StatusCode","typeName":"int","typeDecorators":["Ptr"],"docString":"StatusCode is the HTTP status code to be used in response.\n\nNote that values may be added to this enum, implementations\nmust ensure that unknown values will not cause a crash.\n\nUnknown values here must result in the implementation setting the\nAccepted Condition for the Route to `status: False`, with a\nReason of `UnsupportedValue`.\n\nSupport: Core\n\n+optional\n+kubebuilder:default=302\n+kubebuilder:validation:Enum=301;302"}],"enumValues":[],"docString":"HTTPRequestRedirect defines a filter that redirects a request. This filter\nMUST NOT be used on the same Route rule as a HTTPURLRewrite filter.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRoute":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRoute","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteSpec","typeDecorators":null,"docString":"Spec defines the desired state of HTTPRoute."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteStatus","typeDecorators":null,"docString":"Status defines the current state of HTTPRoute."}],"enumValues":[],"docString":"HTTPRoute provides a way to route HTTP requests. This includes the capability\nto match requests by hostname, path, header, or query param. Filters can be\nused to specify additional processing steps. Backends specify where matching\nrequests should be routed.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteFilter":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteFilter","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteFilterType","typeDecorators":null,"docString":"Type identifies the type of filter to apply. As with other API fields,\ntypes are classified into three conformance levels:\n\n- Core: Filter types and their corresponding configuration defined by\n  \"Support: Core\" in this package, e.g. \"RequestHeaderModifier\". All\n  implementations must support core filters.\n\n- Extended: Filter types and their corresponding configuration defined by\n  \"Support: Extended\" in this package, e.g. \"RequestMirror\". Implementers\n  are encouraged to support extended filters.\n\n- Implementation-specific: Filters that are defined and supported by\n  specific vendors.\n  In the future, filters showing convergence in behavior across multiple\n  implementations will be considered for inclusion in extended or core\n  conformance levels. Filter-specific configuration for such filters\n  is specified using the ExtensionRef field. `Type` should be set to\n  \"ExtensionRef\" for custom filters.\n\nImplementers are encouraged to define custom implementation types to\nextend the core API with implementation-specific behavior.\n\nIf a reference to a custom filter type cannot be resolved, the filter\nMUST NOT be skipped. Instead, requests that would have been processed by\nthat filter MUST receive a HTTP error response.\n\nNote that values may be added to this enum, implementations\nmust ensure that unknown values will not cause a crash.\n\nUnknown values here must result in the implementation setting the\nAccepted Condition for the Route to `status: False`, with a\nReason of `UnsupportedValue`.\n\n+unionDiscriminator\n+kubebuilder:validation:Enum=RequestHeaderModifier;ResponseHeaderModifier;RequestMirror;RequestRedirect;URLRewrite;ExtensionRef\n\u003cgateway:experimental:validation:Enum=RequestHeaderModifier;ResponseHeaderModifier;RequestMirror;RequestRedirect;URLRewrite;ExtensionRef;CORS\u003e"},{"fieldName":"RequestHeaderModifier","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderFilter","typeDecorators":["Ptr"],"docString":"RequestHeaderModifier defines a schema for a filter that modifies request\nheaders.\n\nSupport: Core\n\n+optional"},{"fieldName":"ResponseHeaderModifier","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderFilter","typeDecorators":["Ptr"],"docString":"ResponseHeaderModifier defines a schema for a filter that modifies response\nheaders.\n\nSupport: Extended\n\n+optional"},{"fieldName":"RequestMirror","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRequestMirrorFilter","typeDecorators":["Ptr"],"docString":"RequestMirror defines a schema for a filter that mirrors requests.\nRequests are sent to the specified destination, but responses from\nthat destination are ignored.\n\nThis filter can be used multiple times within the same rule. Note that\nnot all implementations will be able to support mirroring to multiple\nbackends.\n\nSupport: Extended\n\n+optional\n\n+kubebuilder:validation:XValidation:message=\"Only one of percent or fraction may be specified in HTTPRequestMirrorFilter\",rule=\"!(has(self.percent) \u0026\u0026 has(self.fraction))\""},{"fieldName":"RequestRedirect","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRequestRedirectFilter","typeDecorators":["Ptr"],"docString":"RequestRedirect defines a schema for a filter that responds to the\nrequest with an HTTP redirection.\n\nSupport: Core\n\n+optional"},{"fieldName":"URLRewrite","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPURLRewriteFilter","typeDecorators":["Ptr"],"docString":"URLRewrite defines a schema for a filter that modifies a request during forwarding.\n\nSupport: Extended\n\n+optional"},{"fieldName":"CORS","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPCORSFilter","typeDecorators":["Ptr"],"docString":"CORS defines a schema for a filter that responds to the\ncross-origin request based on HTTP response header.\n\nSupport: Extended\n\n+optional\n\u003cgateway:experimental\u003e"},{"fieldName":"ExtensionRef","typeName":"LocalObjectReference","typeDecorators":["Ptr"],"docString":"ExtensionRef is an optional, implementation-specific extension to the\n\"filter\" behavior.  For example, resource \"myroutefilter\" in group\n\"networking.example.net\"). ExtensionRef MUST NOT be used for core and\nextended filters.\n\nThis filter can be used multiple times within the same rule.\n\nSupport: Implementation-specific\n\n+optional"}],"enumValues":[],"docString":"HTTPRouteFilter defines processing steps that must be completed during the\nrequest or response lifecycle. HTTPRouteFilters are meant as an extension\npoint to express processing that may be done in Gateway implementations. Some\nexamples include request or response modification, implementing\nauthentication strategies, rate-limiting, and traffic shaping. API\nguarantee/conformance is defined based on the type of the filter.\n\n+kubebuilder:validation:XValidation:message=\"filter.requestHeaderModifier must be nil if the filter.type is not RequestHeaderModifier\",rule=\"!(has(self.requestHeaderModifier) \u0026\u0026 self.type != 'RequestHeaderModifier')\"\n+kubebuilder:validation:XValidation:message=\"filter.requestHeaderModifier must be specified for RequestHeaderModifier filter.type\",rule=\"!(!has(self.requestHeaderModifier) \u0026\u0026 self.type == 'RequestHeaderModifier')\"\n+kubebuilder:validation:XValidation:message=\"filter.responseHeaderModifier must be nil if the filter.type is not ResponseHeaderModifier\",rule=\"!(has(self.responseHeaderModifier) \u0026\u0026 self.type != 'ResponseHeaderModifier')\"\n+kubebuilder:validation:XValidation:message=\"filter.responseHeaderModifier must be specified for ResponseHeaderModifier filter.type\",rule=\"!(!has(self.responseHeaderModifier) \u0026\u0026 self.type == 'ResponseHeaderModifier')\"\n+kubebuilder:validation:XValidation:message=\"filter.requestMirror must be nil if the filter.type is not RequestMirror\",rule=\"!(has(self.requestMirror) \u0026\u0026 self.type != 'RequestMirror')\"\n+kubebuilder:validation:XValidation:message=\"filter.requestMirror must be specified for RequestMirror filter.type\",rule=\"!(!has(self.requestMirror) \u0026\u0026 self.type == 'RequestMirror')\"\n+kubebuilder:validation:XValidation:message=\"filter.requestRedirect must be nil if the filter.type is not RequestRedirect\",rule=\"!(has(self.requestRedirect) \u0026\u0026 self.type != 'RequestRedirect')\"\n+kubebuilder:validation:XValidation:message=\"filter.requestRedirect must be specified for RequestRedirect filter.type\",rule=\"!(!has(self.requestRedirect) \u0026\u0026 self.type == 'RequestRedirect')\"\n+kubebuilder:validation:XValidation:message=\"filter.urlRewrite must be nil if the filter.type is not URLRewrite\",rule=\"!(has(self.urlRewrite) \u0026\u0026 self.type != 'URLRewrite')\"\n+kubebuilder:validation:XValidation:message=\"filter.urlRewrite must be specified for URLRewrite filter.type\",rule=\"!(!has(self.urlRewrite) \u0026\u0026 self.type == 'URLRewrite')\"\n\u003cgateway:experimental:validation:XValidation:message=\"filter.cors must be nil if the filter.type is not CORS\",rule=\"!(has(self.cors) \u0026\u0026 self.type != 'CORS')\"\u003e\n\u003cgateway:experimental:validation:XValidation:message=\"filter.cors must be specified for CORS filter.type\",rule=\"!(!has(self.cors) \u0026\u0026 self.type == 'CORS')\"\u003e\n+kubebuilder:validation:XValidation:message=\"filter.extensionRef must be nil if the filter.type is not ExtensionRef\",rule=\"!(has(self.extensionRef) \u0026\u0026 self.type != 'ExtensionRef')\"\n+kubebuilder:validation:XValidation:message=\"filter.extensionRef must be specified for ExtensionRef filter.type\",rule=\"!(!has(self.extensionRef) \u0026\u0026 self.type == 'ExtensionRef')\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteFilterType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteFilterType","fields":[],"enumValues":[{"name":"HTTPRouteFilterRequestHeaderModifier","docString":"HTTPRouteFilterRequestHeaderModifier can be used to add or remove an HTTP\nheader from an HTTP request before it is sent to the upstream target.\n\nSupport in HTTPRouteRule: Core\n\nSupport in HTTPBackendRef: Extended"},{"name":"HTTPRouteFilterResponseHeaderModifier","docString":"HTTPRouteFilterResponseHeaderModifier can be used to add or remove an HTTP\nheader from an HTTP response before it is sent to the client.\n\nSupport in HTTPRouteRule: Extended\n\nSupport in HTTPBackendRef: Extended"},{"name":"HTTPRouteFilterRequestRedirect","docString":"HTTPRouteFilterRequestRedirect can be used to redirect a request to\nanother location. This filter can also be used for HTTP to HTTPS\nredirects. This may not be used on the same Route rule or BackendRef as a\nURLRewrite filter.\n\nSupport in HTTPRouteRule: Core\n\nSupport in HTTPBackendRef: Extended"},{"name":"HTTPRouteFilterURLRewrite","docString":"HTTPRouteFilterURLRewrite can be used to modify a request during\nforwarding. At most one of these filters may be used on a Route rule.\nThis may not be used on the same Route rule or BackendRef as a\nRequestRedirect filter.\n\nSupport in HTTPRouteRule: Extended\n\nSupport in HTTPBackendRef: Extended"},{"name":"HTTPRouteFilterRequestMirror","docString":"HTTPRouteFilterRequestMirror can be used to mirror HTTP requests to a\ndifferent backend. The responses from this backend MUST be ignored by\nthe Gateway.\n\nSupport in HTTPRouteRule: Extended\n\nSupport in HTTPBackendRef: Extended"},{"name":"HTTPRouteFilterCORS","docString":"HTTPRouteFilterCORS can be used to add CORS headers to an\nHTTP response before it is sent to the client.\n\nSupport in HTTPRouteRule: Extended\n\nSupport in HTTPBackendRef: Extended\n\u003cgateway:experimental\u003e"},{"name":"HTTPRouteFilterExtensionRef","docString":"HTTPRouteFilterExtensionRef should be used for configuring custom\nHTTP filters.\n\nSupport in HTTPRouteRule: Implementation-specific\n\nSupport in HTTPBackendRef: Implementation-specific"}],"docString":"HTTPRouteFilterType identifies a type of HTTPRoute filter.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteList":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRoute","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"HTTPRouteList contains a list of HTTPRoute.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteMatch":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteMatch","fields":[{"fieldName":"Path","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPPathMatch","typeDecorators":["Ptr"],"docString":"Path specifies a HTTP request path matcher. If this field is not\nspecified, a default prefix match on the \"/\" path is provided.\n\n+optional\n+kubebuilder:default={type: \"PathPrefix\", value: \"/\"}"},{"fieldName":"Headers","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPHeaderMatch","typeDecorators":["List"],"docString":"Headers specifies HTTP request header matchers. Multiple match values are\nANDed together, meaning, a request must match all the specified headers\nto select the route.\n\n+listType=map\n+listMapKey=name\n+optional\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"QueryParams","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPQueryParamMatch","typeDecorators":["List"],"docString":"QueryParams specifies HTTP query parameter matchers. Multiple match\nvalues are ANDed together, meaning, a request must match all the\nspecified query parameters to select the route.\n\nSupport: Extended\n\n+listType=map\n+listMapKey=name\n+optional\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"Method","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPMethod","typeDecorators":["Ptr"],"docString":"Method specifies HTTP method matcher.\nWhen specified, this route will be matched only if the request has the\nspecified method.\n\nSupport: Extended\n\n+optional"}],"enumValues":[],"docString":"HTTPRouteMatch defines the predicate used to match requests to a given\naction. Multiple match types are ANDed together, i.e. the match will\nevaluate to true only if all conditions are satisfied.\n\nFor example, the match below will match a HTTP request only if its path\nstarts with `/foo` AND it contains the `version: v1` header:\n\n```\nmatch:\n\n\tpath:\n\t  value: \"/foo\"\n\theaders:\n\t- name: \"version\"\n\t  value \"v1\"\n\n```","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteRetry":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteRetry","fields":[{"fieldName":"Codes","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteRetryStatusCode","typeDecorators":["List"],"docString":"Codes defines the HTTP response status codes for which a backend request\nshould be retried.\n\nSupport: Extended\n\n+optional"},{"fieldName":"Attempts","typeName":"int","typeDecorators":["Ptr"],"docString":"Attempts specifies the maximum number of times an individual request\nfrom the gateway to a backend should be retried.\n\nIf the maximum number of retries has been attempted without a successful\nresponse from the backend, the Gateway MUST return an error.\n\nWhen this field is unspecified, the number of times to attempt to retry\na backend request is implementation-specific.\n\nSupport: Extended\n\n+optional"},{"fieldName":"Backoff","typeName":"Duration","typeDecorators":["Ptr"],"docString":"Backoff specifies the minimum duration a Gateway should wait between\nretry attempts and is represented in Gateway API Duration formatting.\n\nFor example, setting the `rules[].retry.backoff` field to the value\n`100ms` will cause a backend request to first be retried approximately\n100 milliseconds after timing out or receiving a response code configured\nto be retryable.\n\nAn implementation MAY use an exponential or alternative backoff strategy\nfor subsequent retry attempts, MAY cap the maximum backoff duration to\nsome amount greater than the specified minimum, and MAY add arbitrary\njitter to stagger requests, as long as unsuccessful backend requests are\nnot retried before the configured minimum duration.\n\nIf a Request timeout (`rules[].timeouts.request`) is configured on the\nroute, the entire duration of the initial request and any retry attempts\nMUST not exceed the Request timeout duration. If any retry attempts are\nstill in progress when the Request timeout duration has been reached,\nthese SHOULD be canceled if possible and the Gateway MUST immediately\nreturn a timeout error.\n\nIf a BackendRequest timeout (`rules[].timeouts.backendRequest`) is\nconfigured on the route, any retry attempts which reach the configured\nBackendRequest timeout duration without a response SHOULD be canceled if\npossible and the Gateway should wait for at least the specified backoff\nduration before attempting to retry the backend request again.\n\nIf a BackendRequest timeout is _not_ configured on the route, retry\nattempts MAY time out after an implementation default duration, or MAY\nremain pending until a configured Request timeout or implementation\ndefault duration for total request time is reached.\n\nWhen this field is unspecified, the time to wait between retry attempts\nis implementation-specific.\n\nSupport: Extended\n\n+optional"}],"enumValues":[],"docString":"HTTPRouteRetry defines retry configuration for an HTTPRoute.\n\nImplementations SHOULD retry on connection errors (disconnect, reset, timeout,\nTCP failure) if a retry stanza is configured.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteRule":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteRule","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":["Ptr"],"docString":"Name is the name of the route rule. This name MUST be unique within a Route if it is set.\n\nSupport: Extended\n+optional"},{"fieldName":"Matches","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteMatch","typeDecorators":["List"],"docString":"Matches define conditions used for matching the rule against incoming\nHTTP requests. Each match is independent, i.e. this rule will be matched\nif **any** one of the matches is satisfied.\n\nFor example, take the following matches configuration:\n\n```\nmatches:\n- path:\n    value: \"/foo\"\n  headers:\n  - name: \"version\"\n    value: \"v2\"\n- path:\n    value: \"/v2/foo\"\n```\n\nFor a request to match against this rule, a request must satisfy\nEITHER of the two conditions:\n\n- path pr
