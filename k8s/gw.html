","typeDecorators":null,"docString":"Non-negative fractions of a second at nanosecond resolution. Negative\nsecond values with fractions must still have non-negative nanos values\nthat count forward in time. Must be from 0 to 999,999,999\ninclusive. This field may be limited in precision depending on context."}],"enumValues":[],"docString":"Timestamp is a struct that is equivalent to Time, but intended for\nprotobuf marshalling/unmarshalling. It is generated into a serialization\nthat matches Time. Do not use in Go structs.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"TypeMeta","fields":[{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":"Kind is a string value representing the REST resource this object represents.\nServers may infer this from the endpoint the client submits requests to.\nCannot be updated.\nIn CamelCase.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"APIVersion","typeName":"string","typeDecorators":null,"docString":"APIVersion defines the versioned schema of this representation of an object.\nServers should convert recognized schemas to the latest internal value, and\nmay reject unrecognized values.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n+optional"}],"enumValues":[],"docString":"TypeMeta describes an individual object in an API response or request\nwith strings representing the type of the object and its API schema version.\nStructures that are versioned or persisted should inline TypeMeta.\n\n+k8s:deepcopy-gen=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.UpdateOptions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"UpdateOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"DryRun","typeName":"string","typeDecorators":["List"],"docString":"When present, indicates that modifications should not be\npersisted. An invalid or unrecognized dryRun directive will\nresult in an error response and no further processing of the\nrequest. Valid values are:\n- All: all dry run stages will be processed\n+optional\n+listType=atomic"},{"fieldName":"FieldManager","typeName":"string","typeDecorators":null,"docString":"fieldManager is a name associated with the actor or entity\nthat is making these changes. The value must be less than or\n128 characters long, and only contain printable characters,\nas defined by https://golang.org/pkg/unicode/#IsPrint.\n+optional"},{"fieldName":"FieldValidation","typeName":"string","typeDecorators":null,"docString":"fieldValidation instructs the server on how to handle\nobjects in the request (POST/PUT/PATCH) containing unknown\nor duplicate fields. Valid values are:\n- Ignore: This will ignore any unknown fields that are silently\ndropped from the object, and will ignore all but the last duplicate\nfield that the decoder encounters. This is the default behavior\nprior to v1.23.\n- Warn: This will send a warning via the standard warning response\nheader for each unknown field that is dropped from the object, and\nfor each duplicate field that is encountered. The request will\nstill succeed if there are no other errors, and will only persist\nthe last of any duplicate fields. This is the default in v1.23+\n- Strict: This will fail the request with a BadRequest error if\nany unknown fields would be dropped from the object, or if any\nduplicate fields are present. The error returned from the server\nwill contain all unknown and duplicate fields encountered.\n+optional"}],"enumValues":[],"docString":"UpdateOptions may be provided when updating an API object.\nAll fields in UpdateOptions should also be present in PatchOptions.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.WatchEvent":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"WatchEvent","fields":[{"fieldName":"Type","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Object","typeName":"k8s.io/apimachinery/pkg/runtime.RawExtension","typeDecorators":null,"docString":"Object is:\n * If Type is Added or Modified: the new state of the object.\n * If Type is Deleted: the state of the object immediately before deletion.\n * If Type is Error: *Status is recommended; other types may make sense\n   depending on context."}],"enumValues":[],"docString":"Event represents a single event to a watched resource.\n\n+protobuf=true\n+k8s:deepcopy-gen=true\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object","isRoot":false},"k8s.io/apimachinery/pkg/runtime.Allocator":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"Allocator","fields":[],"enumValues":[],"docString":"Allocator knows how to allocate memory\nIt exists to make the cost of object serialization cheaper.\nIn some cases, it allows for allocating memory only once and then reusing it.\nThis approach puts less load on GC and leads to less fragmented memory in general.","isRoot":false},"k8s.io/apimachinery/pkg/runtime.NegotiateError":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"NegotiateError","fields":[{"fieldName":"ContentType","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Stream","typeName":"bool","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"NegotiateError is returned when a ClientNegotiator is unable to locate\na serializer for the requested operation.","isRoot":false},"k8s.io/apimachinery/pkg/runtime.NoopDecoder":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"NoopDecoder","fields":[{"fieldName":"Encoder","typeName":"Encoder","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"NoopDecoder converts an Encoder to a Serializer or Codec for code that expects them but only uses encoding.","isRoot":false},"k8s.io/apimachinery/pkg/runtime.NoopEncoder":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"NoopEncoder","fields":[{"fieldName":"Decoder","typeName":"Decoder","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"NoopEncoder converts an Decoder to a Serializer or Codec for code that expects them but only uses decoding.","isRoot":false},"k8s.io/apimachinery/pkg/runtime.Pair":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"Pair","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Doc","typeName":"string","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"Pair of strings. We keed the name of fields and the doc","isRoot":false},"k8s.io/apimachinery/pkg/runtime.RawExtension":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"RawExtension","fields":[{"fieldName":"Raw","typeName":"byte","typeDecorators":["List"],"docString":"Raw is the underlying serialization of this object.\n\nTODO: Determine how to detect ContentType and ContentEncoding of 'Raw' data."},{"fieldName":"Object","typeName":"Object","typeDecorators":null,"docString":"Object can hold a representation of this extension - useful for working with versioned\nstructs."}],"enumValues":[],"docString":"RawExtension is used to hold extensions in external versions.\n\nTo use this, make a field which has RawExtension as its type in your external, versioned\nstruct, and Object in your internal struct. You also need to register your\nvarious plugin types.\n\n// Internal package:\n\n\ttype MyAPIObject struct {\n\t\truntime.TypeMeta `json:\",inline\"`\n\t\tMyPlugin runtime.Object `json:\"myPlugin\"`\n\t}\n\n\ttype PluginA struct {\n\t\tAOption string `json:\"aOption\"`\n\t}\n\n// External package:\n\n\ttype MyAPIObject struct {\n\t\truntime.TypeMeta `json:\",inline\"`\n\t\tMyPlugin runtime.RawExtension `json:\"myPlugin\"`\n\t}\n\n\ttype PluginA struct {\n\t\tAOption string `json:\"aOption\"`\n\t}\n\n// On the wire, the JSON will look something like this:\n\n\t{\n\t\t\"kind\":\"MyAPIObject\",\n\t\t\"apiVersion\":\"v1\",\n\t\t\"myPlugin\": {\n\t\t\t\"kind\":\"PluginA\",\n\t\t\t\"aOption\":\"foo\",\n\t\t},\n\t}\n\nSo what happens? Decode first uses json or yaml to unmarshal the serialized data into\nyour external MyAPIObject. That causes the raw JSON to be stored, but not unpacked.\nThe next step is to copy (using pkg/conversion) into the internal struct. The runtime\npackage's DefaultScheme has conversion functions installed which will unpack the\nJSON stored in RawExtension, turning it into the correct object type, and storing it\nin the Object. (TODO: In the case where the object is of an unknown type, a\nruntime.Unknown object will be created and stored.)\n\n+k8s:deepcopy-gen=true\n+protobuf=true\n+k8s:openapi-gen=true","isRoot":false},"k8s.io/apimachinery/pkg/runtime.Scheme":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"Scheme","fields":[],"enumValues":[],"docString":"Scheme defines methods for serializing and deserializing API objects, a type\nregistry for converting group, version, and kind information to and from Go\nschemas, and mappings between Go schemas of different versions. A scheme is the\nfoundation for a versioned API and versioned configuration over time.\n\nIn a Scheme, a Type is a particular Go struct, a Version is a point-in-time\nidentifier for a particular representation of that Type (typically backwards\ncompatible), a Kind is the unique name for that Type within the Version, and a\nGroup identifies a set of Versions, Kinds, and Types that evolve over time. An\nUnversioned Type is one that is not yet formally bound to a type and is promised\nto be backwards compatible (effectively a \"v1\" of a Type that does not expect\nto break in the future).\n\nSchemes are not expected to change at runtime and are only threadsafe after\nregistration is complete.","isRoot":false},"k8s.io/apimachinery/pkg/runtime.SerializerInfo":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"SerializerInfo","fields":[{"fieldName":"MediaType","typeName":"string","typeDecorators":null,"docString":"MediaType is the value that represents this serializer over the wire."},{"fieldName":"MediaTypeType","typeName":"string","typeDecorators":null,"docString":"MediaTypeType is the first part of the MediaType (\"application\" in \"application/json\")."},{"fieldName":"MediaTypeSubType","typeName":"string","typeDecorators":null,"docString":"MediaTypeSubType is the second part of the MediaType (\"json\" in \"application/json\")."},{"fieldName":"EncodesAsText","typeName":"bool","typeDecorators":null,"docString":"EncodesAsText indicates this serializer can be encoded to UTF-8 safely."},{"fieldName":"Serializer","typeName":"k8s.io/apimachinery/pkg/runtime.Serializer","typeDecorators":null,"docString":"Serializer is the individual object serializer for this media type."},{"fieldName":"PrettySerializer","typeName":"k8s.io/apimachinery/pkg/runtime.Serializer","typeDecorators":null,"docString":"PrettySerializer, if set, can serialize this object in a form biased towards\nreadability."},{"fieldName":"StrictSerializer","typeName":"k8s.io/apimachinery/pkg/runtime.Serializer","typeDecorators":null,"docString":"StrictSerializer, if set, deserializes this object strictly,\nerring on unknown fields."},{"fieldName":"StreamSerializer","typeName":"k8s.io/apimachinery/pkg/runtime.StreamSerializerInfo","typeDecorators":["Ptr"],"docString":"StreamSerializer, if set, describes the streaming serialization format\nfor this media type."}],"enumValues":[],"docString":"SerializerInfo contains information about a specific serialization format","isRoot":false},"k8s.io/apimachinery/pkg/runtime.SimpleAllocator":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"SimpleAllocator","fields":[],"enumValues":[],"docString":"SimpleAllocator a wrapper around make([]byte)\nconforms to the MemoryAllocator interface","isRoot":false},"k8s.io/apimachinery/pkg/runtime.StreamSerializerInfo":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"StreamSerializerInfo","fields":[{"fieldName":"EncodesAsText","typeName":"bool","typeDecorators":null,"docString":"EncodesAsText indicates this serializer can be encoded to UTF-8 safely."},{"fieldName":"Serializer","typeName":"k8s.io/apimachinery/pkg/runtime.Serializer","typeDecorators":null,"docString":"Serializer is the top level object serializer for this type when streaming"},{"fieldName":"Framer","typeName":"k8s.io/apimachinery/pkg/runtime.Framer","typeDecorators":null,"docString":"Framer is the factory for retrieving streams that separate objects on the wire"}],"enumValues":[],"docString":"StreamSerializerInfo contains information about a specific stream serialization format","isRoot":false},"k8s.io/apimachinery/pkg/runtime.TypeMeta":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"TypeMeta","fields":[{"fieldName":"APIVersion","typeName":"string","typeDecorators":null,"docString":"+optional"},{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":"+optional"}],"enumValues":[],"docString":"TypeMeta is shared by all top level objects. The proper way to use it is to inline it in your type,\nlike this:\n\n\ttype MyAwesomeAPIObject struct {\n\t     runtime.TypeMeta    `json:\",inline\"`\n\t     ... // other fields\n\t}\n\nfunc (obj *MyAwesomeAPIObject) SetGroupVersionKind(gvk *metav1.GroupVersionKind) { metav1.UpdateTypeMeta(obj,gvk) }; GroupVersionKind() *GroupVersionKind\n\nTypeMeta is provided here for convenience. You may use it directly from this package or define\nyour own with the same fields.\n\n+k8s:deepcopy-gen=false\n+protobuf=true\n+k8s:openapi-gen=true","isRoot":false},"k8s.io/apimachinery/pkg/runtime.Unknown":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"Unknown","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/runtime.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Raw","typeName":"byte","typeDecorators":["List"],"docString":"Raw will hold the complete serialized object which couldn't be matched\nwith a registered type. Most likely, nothing should be done with this\nexcept for passing it through the system."},{"fieldName":"ContentEncoding","typeName":"string","typeDecorators":null,"docString":"ContentEncoding is encoding used to encode 'Raw' data.\nUnspecified means no encoding."},{"fieldName":"ContentType","typeName":"string","typeDecorators":null,"docString":"ContentType  is serialization method used to serialize 'Raw'.\nUnspecified means ContentTypeJSON."}],"enumValues":[],"docString":"Unknown allows api objects with unknown types to be passed-through. This can be used\nto deal with the API objects from a plug-in. Unknown objects still have functioning\nTypeMeta features-- kind, version, etc.\nTODO: Make this object have easy access to field based accessors and settors for\nmetadata and field mutatation.\n\n+k8s:deepcopy-gen=true\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object\n+protobuf=true\n+k8s:openapi-gen=true","isRoot":false},"k8s.io/apimachinery/pkg/runtime.WithVersionEncoder":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"WithVersionEncoder","fields":[{"fieldName":"Version","typeName":"GroupVersioner","typeDecorators":null,"docString":""},{"fieldName":"Encoder","typeName":"Encoder","typeDecorators":null,"docString":""},{"fieldName":"ObjectTyper","typeName":"ObjectTyper","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"WithVersionEncoder serializes an object and ensures the GVK is set.","isRoot":false},"k8s.io/apimachinery/pkg/runtime.WithoutVersionDecoder":{"package":"k8s.io/apimachinery/pkg/runtime","typeName":"WithoutVersionDecoder","fields":[{"fieldName":"Decoder","typeName":"Decoder","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"WithoutVersionDecoder clears the group version kind of a deserialized object.","isRoot":false},"k8s.io/apimachinery/pkg/types.NamespacedName":{"package":"k8s.io/apimachinery/pkg/types","typeName ation","typeName":"TypeMetaApplyConfiguration","typeDecorators":null,"docString":""},{"fieldName":"GracePeriodSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Preconditions","typeName":"PreconditionsApplyConfiguration","typeDecorators":["Ptr"],"docString":""},{"fieldName":"OrphanDependents","typeName":"bool","typeDecorators":["Ptr"],"docString":""},{"fieldName":"PropagationPolicy","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.DeletionPropagation","typeDecorators":["Ptr"],"docString":""},{"fieldName":"DryRun","typeName":"string","typeDecorators":["List"],"docString":""},{"fieldName":"IgnoreStoreReadErrorWithClusterBreakingPotential","typeName":"bool","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"DeleteOptionsApplyConfiguration represents a declarative configuration of the DeleteOptions type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.LabelSelectorApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"LabelSelectorApplyConfiguration","fields":[{"fieldName":"MatchLabels","typeName":"string","typeDecorators":["Map[string]"],"docString":""},{"fieldName":"MatchExpressions","typeName":"LabelSelectorRequirementApplyConfiguration","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"LabelSelectorApplyConfiguration represents a declarative configuration of the LabelSelector type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.LabelSelectorRequirementApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"LabelSelectorRequirementApplyConfiguration","fields":[{"fieldName":"Key","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Operator","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelectorOperator","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Values","typeName":"string","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"LabelSelectorRequirementApplyConfiguration represents a declarative configuration of the LabelSelectorRequirement type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.ManagedFieldsEntryApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"ManagedFieldsEntryApplyConfiguration","fields":[{"fieldName":"Manager","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Operation","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ManagedFieldsOperationType","typeDecorators":["Ptr"],"docString":""},{"fieldName":"APIVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Time","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":""},{"fieldName":"FieldsType","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"FieldsV1","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.FieldsV1","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Subresource","typeName":"string","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"ManagedFieldsEntryApplyConfiguration represents a declarative configuration of the ManagedFieldsEntry type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.ObjectMetaApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"ObjectMetaApplyConfiguration","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"GenerateName","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Namespace","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":["Ptr"],"docString":""},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Generation","typeName":"int64","typeDecorators":["Ptr"],"docString":""},{"fieldName":"CreationTimestamp","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":""},{"fieldName":"DeletionTimestamp","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":""},{"fieldName":"DeletionGracePeriodSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Labels","typeName":"string","typeDecorators":["Map[string]"],"docString":""},{"fieldName":"Annotations","typeName":"string","typeDecorators":["Map[string]"],"docString":""},{"fieldName":"OwnerReferences","typeName":"OwnerReferenceApplyConfiguration","typeDecorators":["List"],"docString":""},{"fieldName":"Finalizers","typeName":"string","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"ObjectMetaApplyConfiguration represents a declarative configuration of the ObjectMeta type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.OwnerReferenceApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"OwnerReferenceApplyConfiguration","fields":[{"fieldName":"APIVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Kind","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Name","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Controller","typeName":"bool","typeDecorators":["Ptr"],"docString":""},{"fieldName":"BlockOwnerDeletion","typeName":"bool","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"OwnerReferenceApplyConfiguration represents a declarative configuration of the OwnerReference type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.PreconditionsApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"PreconditionsApplyConfiguration","fields":[{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":["Ptr"],"docString":""},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"PreconditionsApplyConfiguration represents a declarative configuration of the Preconditions type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.TypeMetaApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"TypeMetaApplyConfiguration","fields":[{"fieldName":"Kind","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"APIVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"TypeMetaApplyConfiguration represents a declarative configuration of the TypeMeta type for use\nwith apply.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.AddressType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"AddressType","fields":[],"enumValues":[{"name":"IPAddressType","docString":"A textual representation of a numeric IP address. IPv4\naddresses must be in dotted-decimal form. IPv6 addresses\nmust be in a standard IPv6 text representation\n(see [RFC 5952](https://tools.ietf.org/html/rfc5952)).\n\nThis type is intended for specific addresses. Address ranges are not\nsupported (e.g. you cannot use a CIDR range like 127.0.0.0/24 as an\nIPAddress).\n\nSupport: Extended"},{"name":"HostnameAddressType","docString":"A Hostname represents a DNS based ingress point. This is similar to the\ncorresponding hostname field in Kubernetes load balancer status. For\nexample, this concept may be used for cloud load balancers where a DNS\nname is used to expose a load balancer.\n\nSupport: Extended"},{"name":"NamedAddressType","docString":"A NamedAddress provides a way to reference a specific IP address by name.\nFor example, this may be a name or other unique identifier that refers\nto a resource on a cloud provider such as a static IP.\n\nThe `NamedAddress` type has been deprecated in favor of implementation\nspecific domain-prefixed strings.\n\nSupport: Implementation-specific"}],"docString":"AddressType defines how a network address is represented as a text string.\nThis may take two possible forms:\n\n* A predefined CamelCase string identifier (currently limited to `IPAddress` or `Hostname`)\n* A domain-prefixed string identifier (like `acme.io/CustomAddressType`)\n\nValues `IPAddress` and `Hostname` have Extended support.\n\nThe `NamedAddress` value has been deprecated in favor of implementation\nspecific domain-prefixed strings.\n\nAll other values, including domain-prefixed values have Implementation-specific support,\nwhich are used in implementation-specific behaviors. Support for additional\npredefined CamelCase identifiers may be added in future releases.\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=253\n+kubebuilder:validation:Pattern=`^Hostname|IPAddress|NamedAddress|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\\/[A-Za-z0-9\\/\\-._~%!$\u0026'()*+,;=:]+$`","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.AllowedListeners":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"AllowedListeners","fields":[{"fieldName":"Namespaces","typeName":"sigs.k8s.io/gateway-api/apis/v1.ListenerNamespaces","typeDecorators":["Ptr"],"docString":"Namespaces defines which namespaces ListenerSets can be attached to this Gateway.\nWhile this feature is experimental, the default value is to allow no ListenerSets.\n\n+optional\n+kubebuilder:default={from: None}"}],"enumValues":[],"docString":"AllowedListeners defines which ListenerSets can be attached to this Gateway.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.AllowedRoutes":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"AllowedRoutes","fields":[{"fieldName":"Namespaces","typeName":"sigs.k8s.io/gateway-api/apis/v1.RouteNamespaces","typeDecorators":["Ptr"],"docString":"Namespaces indicates namespaces from which Routes may be attached to this\nListener. This is restricted to the namespace of this Gateway by default.\n\nSupport: Core\n\n+optional\n+kubebuilder:default={from: Same}"},{"fieldName":"Kinds","typeName":"sigs.k8s.io/gateway-api/apis/v1.RouteGroupKind","typeDecorators":["List"],"docString":"Kinds specifies the groups and kinds of Routes that are allowed to bind\nto this Gateway Listener. When unspecified or empty, the kinds of Routes\nselected are determined using the Listener protocol.\n\nA RouteGroupKind MUST correspond to kinds of Routes that are compatible\nwith the application protocol specified in the Listener's Protocol field.\nIf an implementation does not support or recognize this resource type, it\nMUST set the \"ResolvedRefs\" condition to False for this Listener with the\n\"InvalidRouteKinds\" reason.\n\nSupport: Core\n\n+optional\n+kubebuilder:validation:MaxItems=8"}],"enumValues":[],"docString":"AllowedRoutes defines which Routes may be attached to this Listener.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.BackendObjectReference":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"BackendObjectReference","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":["Ptr"],"docString":"Group is the group of the referent. For example, \"gateway.networking.k8s.io\".\nWhen unspecified or empty string, core API group is inferred.\n\n+optional\n+kubebuilder:default=\"\""},{"fieldName":"Kind","typeName":"Kind","typeDecorators":["Ptr"],"docString":"Kind is the Kubernetes resource kind of the referent. For example\n\"Service\".\n\nDefaults to \"Service\" when not specified.\n\nExternalName services can refer to CNAME DNS records that may live\noutside of the cluster and as such are difficult to reason about in\nterms of conformance. They also may not be safe to forward to (see\nCVE-2021-25740 for more information). Implementations SHOULD NOT\nsupport ExternalName Services.\n\nSupport: Core (Services with a type other than ExternalName)\n\nSupport: Implementation-specific (Services with type ExternalName)\n\n+optional\n+kubebuilder:default=Service"},{"fieldName":"Name","typeName":"ObjectName","typeDecorators":null,"docString":"Name is the name of the referent."},{"fieldName":"Namespace","typeName":"Namespace","typeDecorators":["Ptr"],"docString":"Namespace is the namespace of the backend. When unspecified, the local\nnamespace is inferred.\n\nNote that when a namespace different than the local namespace is specified,\na ReferenceGrant object is required in the referent namespace to allow that\nnamespace's owner to accept the reference. See the ReferenceGrant\ndocumentation for details.\n\nSupport: Core\n\n+optional"},{"fieldName":"Port","typeName":"PortNumber","typeDecorators":["Ptr"],"docString":"Port specifies the destination port number to use for this resource.\nPort is required when the referent is a Kubernetes Service. In this\ncase, the port number is the service port number, not the target port.\nFor other resources, destination port might be derived from the referent\nresource or this field.\n\n+optional"}],"enumValues":[],"docString":"BackendObjectReference defines how an ObjectReference that is\nspecific to BackendRef. It includes a few additional fields and features\nthan a regular ObjectReference.\n\nNote that when a namespace different than the local namespace is specified, a\nReferenceGrant object is required in the referent namespace to allow that\nnamespace's owner to accept the reference. See the ReferenceGrant\ndocumentation for details.\n\nThe API object must be valid in the cluster; the Group and Kind must\nbe registered in the cluster for this reference to be valid.\n\nReferences to objects with invalid Group and Kind are not valid, and must\nbe rejected by the implementation, with appropriate Conditions set\non the containing object.\n\n+kubebuilder:validation:XValidation:message=\"Must have port for Service reference\",rule=\"(size(self.group) == 0 \u0026\u0026 self.kind == 'Service') ? has(self.port) : true\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.BackendRef":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"BackendRef","fields":[{"fieldName":"BackendObjectReference","typeName":"BackendObjectReference","typeDecorators":null,"docString":"BackendObjectReference references a Kubernetes object."},{"fieldName":"Weight","typeName":"int32","typeDecorators":["Ptr"],"docString":"Weight specifies the proportion of requests forwarded to the referenced\nbackend. This is computed as weight/(sum of all weights in this\nBackendRefs list). For non-zero values, there may be some epsilon from\nthe exact proportion defined here depending on the precision an\nimplementation supports. Weight is not a percentage and the sum of\nweights does not need to equal 100.\n\nIf only one backend is specified and it has a weight greater than 0, 100%\nof the traffic is forwarded to that backend. If weight is set to 0, no\ntraffic should be forwarded for this entry. If unspecified, weight\ndefaults to 1.\n\nSupport for this field varies based on the context where used.\n\n+optional\n+kubebuilder:default=1\n+kubebuilder:validation:Minimum=0\n+kubebuilder:validation:Maximum=1000000"}],"enumValues":[],"docString":"BackendRef defines how a Route should forward a request to a Kubernetes\nresource.\n\nNote that when a namespace different than the local namespace is specified, a\nReferenceGrant object is required in the referent namespace to allow that\nnamespace's owner to accept the reference. See the ReferenceGrant\ndocumentation for details.\n\n\u003cgateway:experimental:description\u003e\n\nWhen the BackendRef points to a Kubernetes Service, implementations SHOULD\nhonor the appProtocol field if it is set for the target Service Port.\n\nImplementations supporting appProtocol SHOULD recognize the Kubernetes\nStandard Application Protocols defined in KEP-3726.\n\nIf a Service appProtocol isn't specified, an implementation MAY infer the\nbackend protocol through its own means. Implementations MAY infer the\nprotocol from the Route type referring to the backend Service.\n\nIf a Route is not able to send traffic to the backend using the specified\nprotocol then the backend is considered invalid. Implementations MUST set the\n\"ResolvedRefs\" condition to \"False\" with the \"UnsupportedProtocol\" reason.\n\n\u003c/gateway:experimental:description\u003e\n\nNote that when the BackendTLSPolicy object is enabled by the implementation,\nthere are some extra rules about validity to consider here. See the fields\nwhere this struct is used for more information about the exact behavior.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.CommonRouteSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"CommonRouteSpec","fields":[{"fieldName":"ParentRefs","typeName":"sigs.k8s.io/gateway-api/apis/v1.ParentReference","typeDecorators":["List"],"docString":"ParentRefs references the resources (usually Gateways) that a Route wants\nto be attached to. Note that the referenced parent resource needs to\nallow this for the attachment to be complete. For Gateways, that means\nthe Gateway needs to allow attachment from Routes of this kind and\nnamespace. For Services, that means the Service must either be in the same\nnamespace for a \"producer\" route, or the mesh implementation must support\nand allow \"consumer\" routes for the referenced Service. ReferenceGrant is\nnot applicable for governing ParentRefs to Services - it is not possible to\ncreate a \"producer\" route for a Service in a different namespace from the\nRoute.\n\nThere are two kinds of parent resources with \"Core\" support:\n\n* Gateway (Gateway conformance profile)\n* Service (Mesh conformance profile, ClusterIP Services only)\n\nThis API may be extended in the future to support additional kinds of parent\nresources.\n\nParentRefs must be _distinct_. This means either that:\n\n* They select different objects.  If this is the case, then parentRef\n  entries are distinct. In terms of fields, this means that the\n  multi-part key defined by `group`, `kind`, `namespace`, and `name` must\n  be unique across all parentRef entries in the Route.\n* They do not select different objects, but for each optional field used,\n  each ParentRef that selects the same object must set the same set of\n  optional fields to different values. If one ParentRef sets a\n  combination of optional fields, all must set the same combination.\n\nSome examples:\n\n* If one ParentRef sets `sectionName`, all ParentRefs referencing the\n  same object must also set `sectionName`.\n* If one ParentRef sets `port`, all ParentRefs referencing the same\n  object must also set `port`.\n* If one ParentRef sets `sectionName` and `port`, all ParentRefs\n  referencing the same object must also set `sectionName` and `port`.\n\nIt is possible to separately reference multiple distinct objects that may\nbe collapsed by an implementation. For example, some implementations may\nchoose to merge compatible Gateway Listeners together. If that is the\ncase, the list of routes attached to those resources should also be\nmerged.\n\nNote that for ParentRefs that cross namespace boundaries, there are specific\nrules. Cross-namespace references are only valid if they are explicitly\nallowed by something in the namespace they are referring to. For example,\nGateway has the AllowedRoutes field, and ReferenceGrant provides a\ngeneric way to enable other kinds of cross-namespace reference.\n\n\u003cgateway:experimental:description\u003e\nParentRefs from a Route to a Service in the same namespace are \"producer\"\nroutes, which apply default routing rules to inbound connections from\nany namespace to the Service.\n\nParentRefs from a Route to a Service in a different namespace are\n\"consumer\" routes, and these routing rules are only applied to outbound\nconnections originating from the same namespace as the Route, for which\nthe intended destination of the connections are a Service targeted as a\nParentRef of the Route.\n\u003c/gateway:experimental:description\u003e\n\n+optional\n+kubebuilder:validation:MaxItems=32\n\u003cgateway:standard:validation:XValidation:message=\"sectionName must be specified when parentRefs includes 2 or more references to the same parent\",rule=\"self.all(p1, self.all(p2, p1.group == p2.group \u0026\u0026 p1.kind == p2.kind \u0026\u0026 p1.name == p2.name \u0026\u0026 (((!has(p1.__namespace__) || p1.__namespace__ == '') \u0026\u0026 (!has(p2.__namespace__) || p2.__namespace__ == '')) || (has(p1.__namespace__) \u0026\u0026 has(p2.__namespace__) \u0026\u0026 p1.__namespace__ == p2.__namespace__ )) ? ((!has(p1.sectionName) || p1.sectionName == '') == (!has(p2.sectionName) || p2.sectionName == '')) : true))\"\u003e\n\u003cgateway:standard:validation:XValidation:message=\"sectionName must be unique when parentRefs includes 2 or more references to the same parent\",rule=\"self.all(p1, self.exists_one(p2, p1.group == p2.group \u0026\u0026 p1.kind == p2.kind \u0026\u0026 p1.name == p2.name \u0026\u0026 (((!has(p1.__namespace__) || p1.__namespace__ == '') \u0026\u0026 (!has(p2.__namespace__) || p2.__namespace__ == '')) || (has(p1.__namespace__) \u0026\u0026 has(p2.__namespace__) \u0026\u0026 p1.__namespace__ == p2.__namespace__ )) \u0026\u0026 (((!has(p1.sectionName) || p1.sectionName == '') \u0026\u0026 (!has(p2.sectionName) || p2.sectionName == '')) || (has(p1.sectionName) \u0026\u0026 has(p2.sectionName) \u0026\u0026 p1.sectionName == p2.sectionName))))\"\u003e\n\u003cgateway:experimental:validation:XValidation:message=\"sectionName or port must be specified when parentRefs includes 2 or more references to the same parent\",rule=\"self.all(p1, self.all(p2, p1.group == p2.group \u0026\u0026 p1.kind == p2.kind \u0026\u0026 p1.name == p2.name \u0026\u0026 (((!has(p1.__namespace__) || p1.__namespace__ == '') \u0026\u0026 (!has(p2.__namespace__) || p2.__namespace__ == '')) || (has(p1.__namespace__) \u0026\u0026 has(p2.__namespace__) \u0026\u0026 p1.__namespace__ == p2.__namespace__)) ? ((!has(p1.sectionName) || p1.sectionName == '') == (!has(p2.sectionName) || p2.sectionName == '') \u0026\u0026 (!has(p1.port) || p1.port == 0) == (!has(p2.port) || p2.port == 0)): true))\"\u003e\n\u003cgateway:experimental:validation:XValidation:message=\"sectionName or port must be unique when parentRefs includes 2 or more references to the same parent\",rule=\"self.all(p1, self.exists_one(p2, p1.group == p2.group \u0026\u0026 p1.kind == p2.kind \u0026\u0026 p1.name == p2.name \u0026\u0026 (((!has(p1.__namespace__) || p1.__namespace__ == '') \u0026\u0026 (!has(p2.__namespace__) || p2.__namespace__ == '')) || (has(p1.__namespace__) \u0026\u0026 has(p2.__namespace__) \u0026\u0026 p1.__namespace__ == p2.__namespace__ )) \u0026\u0026 (((!has(p1.sectionName) || p1.sectionName == '') \u0026\u0026 (!has(p2.sectionName) || p2.sectionName == '')) || ( has(p1.sectionName) \u0026\u0026 has(p2.sectionName) \u0026\u0026 p1.sectionName == p2.sectionName)) \u0026\u0026 (((!has(p1.port) || p1.port == 0) \u0026\u0026 (!has(p2.port) || p2.port == 0)) || (has(p1.port) \u0026\u0026 has(p2.port) \u0026\u0026 p1.port == p2.port))))\"\u003e"}],"enumValues":[],"docString":"CommonRouteSpec defines the common attributes that all Routes MUST include\nwithin their spec.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.CookieConfig":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"CookieConfig","fields":[{"fieldName":"LifetimeType","typeName":"sigs.k8s.io/gateway-api/apis/v1.CookieLifetimeType","typeDecorators":["Ptr"],"docString":"LifetimeType specifies whether the cookie has a permanent or\nsession-based lifetime. A permanent cookie persists until its\nspecified expiry time, defined by the Expires or Max-Age cookie\nattributes, while a session cookie is deleted when the current\nsession ends.\n\nWhen set to \"Permanent\", AbsoluteTimeout indicates the\ncookie's lifetime via the Expires or Max-Age cookie attributes\nand is required.\n\nWhen set to \"Session\", AbsoluteTimeout indicates the\nabsolute lifetime of the cookie tracked by the gateway and\nis optional.\n\nDefaults to \"Session\".\n\nSupport: Core for \"Session\" type\n\nSupport: Extended for \"Permanent\" type\n\n+optional\n+kubebuilder:default=Session"}],"enumValues":[],"docString":"CookieConfig defines the configuration for cookie-based session persistence.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.CookieLifetimeType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"CookieLifetimeType","fields":[],"enumValues":[{"name":"SessionCookieLifetimeType","docString":"SessionCookieLifetimeType specifies the type for a session\ncookie.\n\nSupport: Core"},{"name":"PermanentCookieLifetimeType","docString":"PermanentCookieLifetimeType specifies the type for a permanent\ncookie.\n\nSupport: Extended"}],"docString":"+kubebuilder:validation:Enum=Permanent;Session","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.Fraction":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"Fraction","fields":[{"fieldName":"Numerator","typeName":"int32","typeDecorators":null,"docString":"+kubebuilder:validation:Minimum=0"},{"fieldName":"Denominator","typeName":"int32","typeDecorators":["Ptr"],"docString":"+optional\n+kubebuilder:default=100\n+kubebuilder:validation:Minimum=1"}],"enumValues":[],"docString":"+kubebuilder:validation:XValidation:message=\"numerator must be less than or equal to denominator\",rule=\"self.numerator \u003c= self.denominator\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.FromNamespaces":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"FromNamespaces","fields":[],"enumValues":[{"name":"NamespacesFromAll","docString":"Routes/ListenerSets in all namespaces may be attached to this Gateway."},{"name":"NamespacesFromSelector","docString":"Only Routes/ListenerSets in namespaces selected by the selector may be attached to\nthis Gateway."},{"name":"NamespacesFromSame","docString":"Only Routes/ListenerSets in the same namespace as the Gateway may be attached to this\nGateway."},{"name":"NamespacesFromNone","docString":"No Routes/ListenerSets may be attached to this Gateway."}],"docString":"FromNamespaces specifies namespace from which Routes/ListenerSets may be attached to a\nGateway.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.FrontendTLSValidation":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"FrontendTLSValidation","fields":[{"fieldName":"CACertificateRefs","typeName":"ObjectReference","typeDecorators":["List"],"docString":"CACertificateRefs contains one or more references to\nKubernetes objects that contain TLS certificates of\nthe Certificate Authorities that can be used\nas a trust anchor to validate the certificates presented by the client.\n\nA single CA certificate reference to a Kubernetes ConfigMap\nhas \"Core\" support.\nImplementations MAY choose to support attaching multiple CA certificates to\na Listener, but this behavior is implementation-specific.\n\nSupport: Core - A single reference to a Kubernetes ConfigMap\nwith the CA certificate in a key named `ca.crt`.\n\nSupport: Implementation-specific (More than one reference, or other kinds\nof resources).\n\nReferences to a resource in a different namespace are invalid UNLESS there\nis a ReferenceGrant in the target namespace that allows the certificate\nto be attached. If a ReferenceGrant does not allow this reference, the\n\"ResolvedRefs\" condition MUST be set to False for this listener with the\n\"RefNotPermitted\" reason.\n\n+kubebuilder:validation:MaxItems=8\n+kubebuilder:validation:MinItems=1"}],"enumValues":[],"docString":"FrontendTLSValidation holds configuration information that can be used to validate\nthe frontend initiating the TLS connection","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCBackendRef":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCBackendRef","fields":[{"fieldName":"BackendRef","typeName":"BackendRef","typeDecorators":null,"docString":"BackendRef is a reference to a backend to forward matched requests to.\n\nA BackendRef can be invalid for the following reasons. In all cases, the\nimplementation MUST ensure the `ResolvedRefs` Condition on the Route\nis set to `status: False`, with a Reason and Message that indicate\nwhat is the cause of the error.\n\nA BackendRef is invalid if:\n\n* It refers to an unknown or unsupported kind of resource. In this\n  case, the Reason MUST be set to `InvalidKind` and Message of the\n  Condition MUST explain which kind of resource is unknown or unsupported.\n\n* It refers to a resource that does not exist. In this case, the Reason MUST\n  be set to `BackendNotFound` and the Message of the Condition MUST explain\n  which resource does not exist.\n\n* It refers a resource in another namespace when the reference has not been\n  explicitly allowed by a ReferenceGrant (or equivalent concept). In this\n  case, the Reason MUST be set to `RefNotPermitted` and the Message of the\n  Condition MUST explain which cross-namespace reference is not allowed.\n\nSupport: Core for Kubernetes Service\n\nSupport: Extended for Kubernetes ServiceImport\n\nSupport: Implementation-specific for any other resource\n\nSupport for weight: Core\n\n+optional"},{"fieldName":"Filters","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteFilter","typeDecorators":["List"],"docString":"Filters defined at this level MUST be executed if and only if the\nrequest is being forwarded to the backend defined here.\n\nSupport: Implementation-specific (For broader support of filters, use the\nFilters field in GRPCRouteRule.)\n\n+optional\n+kubebuilder:validation:MaxItems=16\n+kubebuilder:validation:XValidation:message=\"RequestHeaderModifier filter cannot be repeated\",rule=\"self.filter(f, f.type == 'RequestHeaderModifier').size() \u003c= 1\"\n+kubebuilder:validation:XValidation:message=\"ResponseHeaderModifier filter cannot be repeated\",rule=\"self.filter(f, f.type == 'ResponseHeaderModifier').size() \u003c= 1\""}],"enumValues":[],"docString":"GRPCBackendRef defines how a GRPCRoute forwards a gRPC request.\n\nNote that when a namespace different than the local namespace is specified, a\nReferenceGrant object is required in the referent namespace to allow that\nnamespace's owner to accept the reference. See the ReferenceGrant\ndocumentation for details.\n\n\u003cgateway:experimental:description\u003e\n\nWhen the BackendRef points to a Kubernetes Service, implementations SHOULD\nhonor the appProtocol field if it is set for the target Service Port.\n\nImplementations supporting appProtocol SHOULD recognize the Kubernetes\nStandard Application Protocols defined in KEP-3726.\n\nIf a Service appProtocol isn't specified, an implementation MAY infer the\nbackend protocol through its own means. Implementations MAY infer the\nprotocol from the Route type referring to the backend Service.\n\nIf a Route is not able to send traffic to the backend using the specified\nprotocol then the backend is considered invalid. Implementations MUST set the\n\"ResolvedRefs\" condition to \"False\" with the \"UnsupportedProtocol\" reason.\n\n\u003c/gateway:experimental:description\u003e","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCHeaderMatch":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCHeaderMatch","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCHeaderMatchType","typeDecorators":["Ptr"],"docString":"Type specifies how to match against the value of the header.\n\n+optional\n+kubebuilder:default=Exact"},{"fieldName":"Name","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCHeaderName","typeDecorators":null,"docString":"Name is the name of the gRPC Header to be matched.\n\nIf multiple entries specify equivalent header names, only the first\nentry with an equivalent name MUST be considered for a match. Subsequent\nentries with an equivalent header name MUST be ignored. Due to the\ncase-insensitivity of header names, \"foo\" and \"Foo\" are considered\nequivalent."},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"Value is the value of the gRPC Header to be matched.\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=4096"}],"enumValues":[],"docString":"GRPCHeaderMatch describes how to select a gRPC route by matching gRPC request\nheaders.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCHeaderMatchType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCHeaderMatchType","fields":[],"enumValues":[{"name":"GRPCHeaderMatchExact","docString":"GRPCHeaderMatchType constants."},{"name":"GRPCHeaderMatchRegularExpression","docString":"GRPCHeaderMatchType constants."}],"docString":"GRPCHeaderMatchType specifies the semantics of how GRPC header values should\nbe compared. Valid GRPCHeaderMatchType values, along with their conformance\nlevels, are:\n\n* \"Exact\" - Core\n* \"RegularExpression\" - Implementation Specific\n\nNote that new values may be added to this enum in future releases of the API,\nimplementations MUST ensure that unknown values will not cause a crash.\n\nUnknown values here MUST result in the implementation setting the Accepted\nCondition for the Route to `status: False`, with a Reason of\n`UnsupportedValue`.\n\n+kubebuilder:validation:Enum=Exact;RegularExpression","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCMethodMatch":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCMethodMatch","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCMethodMatchType","typeDecorators":["Ptr"],"docString":"Type specifies how to match against the service and/or method.\nSupport: Core (Exact with service and method specified)\n\nSupport: Implementation-specific (Exact with method specified but no service specified)\n\nSupport: Implementation-specific (RegularExpression)\n\n+optional\n+kubebuilder:default=Exact"},{"fieldName":"Service","typeName":"string","typeDecorators":["Ptr"],"docString":"Value of the service to match against. If left empty or omitted, will\nmatch any service.\n\nAt least one of Service and Method MUST be a non-empty string.\n\n+optional\n+kubebuilder:validation:MaxLength=1024"},{"fieldName":"Method","typeName":"string","typeDecorators":["Ptr"],"docString":"Value of the method to match against. If left empty or omitted, will\nmatch all services.\n\nAt least one of Service and Method MUST be a non-empty string.\n\n+optional\n+kubebuilder:validation:MaxLength=1024"}],"enumValues":[],"docString":"GRPCMethodMatch describes how to select a gRPC route by matching the gRPC\nrequest service and/or method.\n\nAt least one of Service and Method MUST be a non-empty string.\n\n+kubebuilder:validation:XValidation:message=\"One or both of 'service' or 'method' must be specified\",rule=\"has(self.type) ? has(self.service) || has(self.method) : true\"\n+kubebuilder:validation:XValidation:message=\"service must only contain valid characters (matching ^(?i)\\\\.?[a-z_][a-z_0-9]*(\\\\.[a-z_][a-z_0-9]*)*$)\",rule=\"(!has(self.type) || self.type == 'Exact') \u0026\u0026 has(self.service) ? self.service.matches(r\\\"\\\"\\\"^(?i)\\\\.?[a-z_][a-z_0-9]*(\\\\.[a-z_][a-z_0-9]*)*$\\\"\\\"\\\"): true\"\n+kubebuilder:validation:XValidation:message=\"method must only contain valid characters (matching ^[A-Za-z_][A-Za-z_0-9]*$)\",rule=\"(!has(self.type) || self.type == 'Exact') \u0026\u0026 has(self.method) ? self.method.matches(r\\\"\\\"\\\"^[A-Za-z_][A-Za-z_0-9]*$\\\"\\\"\\\"): true\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCMethodMatchType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCMethodMatchType","fields":[],"enumValues":[{"name":"GRPCMethodMatchExact","docString":"Matches the method or service exactly and with case sensitivity."},{"name":"GRPCMethodMatchRegularExpression","docString":"Matches if the method or service matches the given regular expression with\ncase sensitivity.\n\nSince `\"RegularExpression\"` has implementation-specific conformance,\nimplementations can support POSIX, PCRE, RE2 or any other regular expression\ndialect.\nPlease read the implementation's documentation to determine the supported\ndialect."}],"docString":"MethodMatchType specifies the semantics of how gRPC methods and services are compared.\nValid MethodMatchType values, along with their conformance levels, are:\n\n* \"Exact\" - Core\n* \"RegularExpression\" - Implementation Specific\n\nExact methods MUST be syntactically valid:\n\n- Must not contain `/` character\n\n+kubebuilder:validation:Enum=Exact;RegularExpression","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCRoute":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCRoute","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteSpec","typeDecorators":null,"docString":"Spec defines the desired state of GRPCRoute.\n+required"},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteStatus","typeDecorators":null,"docString":"Status defines the current state of GRPCRoute."}],"enumValues":[],"docString":"GRPCRoute provides a way to route gRPC requests. This includes the capability\nto match requests by hostname, gRPC service, gRPC method, or HTTP/2 header.\nFilters can be used to specify additional processing steps. Backends specify\nwhere matching requests will be routed.\n\nGRPCRoute falls under extended support within the Gateway API. Within the\nfollowing specification, the word \"MUST\" indicates that an implementation\nsupporting GRPCRoute must conform to the indicated requirement, but an\nimplementation not supporting this route type need not follow the requirement\nunless explicitly indicated.\n\nImplementations supporting `GRPCRoute` with the `HTTPS` `ProtocolType` MUST\naccept HTTP/2 connections without an initial upgrade from HTTP/1.1, i.e. via\nALPN. If the implementation does not support this, then it MUST set the\n\"Accepted\" condition to \"False\" for the affected listener with a reason of\n\"UnsupportedProtocol\".  Implementations MAY also accept HTTP/2 connections\nwith an upgrade from HTTP/1.\n\nImplementations supporting `GRPCRoute` with the `HTTP` `ProtocolType` MUST\nsupport HTTP/2 over cleartext TCP (h2c,\nhttps://www.rfc-editor.org/rfc/rfc7540#section-3.1) without an initial\nupgrade from HTTP/1.1, i.e. with prior knowledge\n(https://www.rfc-editor.org/rfc/rfc7540#section-3.4). If the implementation\ndoes not support this, then it MUST set the \"Accepted\" condition to \"False\"\nfor the affected listener with a reason of \"UnsupportedProtocol\".\nImplementations MAY also accept HTTP/2 connections with an upgrade from\nHTTP/1, i.e. without prior knowledge.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteFilter":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCRouteFilter","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteFilterType","typeDecorators":null,"docString":"Type identifies the type of filter to apply. As with other API fields,\ntypes are classified into three conformance levels:\n\n- Core: Filter types and their corresponding configuration defined by\n  \"Support: Core\" in this package, e.g. \"RequestHeaderModifier\". All\n  implementations supporting GRPCRoute MUST support core filters.\n\n- Extended: Filter types and their corresponding configuration defined by\n  \"Support: Extended\" in this package, e.g. \"RequestMirror\". Implementers\n  are encouraged to support extended filters.\n\n- Implementation-specific: Filters that are defined and supported by specific vendors.\n  In the future, filters showing convergence in behavior across multiple\n  implementations will be considered for inclusion in extended or core\n  conformance levels. Filter-specific configuration for such filters\n  is specified using the ExtensionRef field. `Type` MUST be set to\n  \"ExtensionRef\" for custom filters.\n\nImplementers are encouraged to define custom implementation types to\nextend the core API with implementation-specific behavior.\n\nIf a reference to a custom filter type cannot be resolved, the filter\nMUST NOT be skipped. Instead, requests that would have been processed by\nthat filter MUST receive a HTTP error response.\n\n+unionDiscriminator\n+kubebuilder:validation:Enum=ResponseHeaderModifier;RequestHeaderModifier;RequestMirror;ExtensionRef\n\u003cgateway:experimental:validation:Enum=ResponseHeaderModifier;RequestHeaderModifier;RequestMirror;ExtensionRef\u003e"},{"fieldName":"RequestHeaderModifier","typeName":"HTTPHeaderFilter","typeDecorators":["Ptr"],"docString":"RequestHeaderModifier defines a schema for a filter that modifies request\nheaders.\n\nSupport: Core\n\n+optional"},{"fieldName":"ResponseHeaderModifier","typeName":"HTTPHeaderFilter","typeDecorators":["Ptr"],"docString":"ResponseHeaderModifier defines a schema for a filter that modifies response\nheaders.\n\nSupport: Extended\n\n+optional"},{"fieldName":"RequestMirror","typeName":"HTTPRequestMirrorFilter","typeDecorators":["Ptr"],"docString":"RequestMirror defines a schema for a filter that mirrors requests.\nRequests are sent to the specified destination, but responses from\nthat destination are ignored.\n\nThis filter can be used multiple times within the same rule. Note that\nnot all implementations will be able to support mirroring to multiple\nbackends.\n\nSupport: Extended\n\n+optional\n\n+kubebuilder:validation:XValidation:message=\"Only one of percent or fraction may be specified in HTTPRequestMirrorFilter\",rule=\"!(has(self.percent) \u0026\u0026 has(self.fraction))\""},{"fieldName":"ExtensionRef","typeName":"LocalObjectReference","typeDecorators":["Ptr"],"docString":"ExtensionRef is an optional, implementation-specific extension to the\n\"filter\" behavior.  For example, resource \"myroutefilter\" in group\n\"networking.example.net\"). ExtensionRef MUST NOT be used for core and\nextended filters.\n\nSupport: Implementation-specific\n\nThis filter can be used multiple times within the same rule.\n+optional"}],"enumValues":[],"docString":"GRPCRouteFilter defines processing steps that must be completed during the\nrequest or response lifecycle. GRPCRouteFilters are meant as an extension\npoint to express processing that may be done in Gateway implementations. Some\nexamples include request or response modification, implementing\nauthentication strategies, rate-limiting, and traffic shaping. API\nguarantee/conformance is defined based on the type of the filter.\n\n+kubebuilder:validation:XValidation:message=\"filter.requestHeaderModifier must be nil if the filter.type is not RequestHeaderModifier\",rule=\"!(has(self.requestHeaderModifier) \u0026\u0026 self.type != 'RequestHeaderModifier')\"\n+kubebuilder:validation:XValidation:message=\"filter.requestHeaderModifier must be specified for RequestHeaderModifier filter.type\",rule=\"!(!has(self.requestHeaderModifier) \u0026\u0026 self.type == 'RequestHeaderModifier')\"\n+kubebuilder:validation:XValidation:message=\"filter.responseHeaderModifier must be nil if the filter.type is not ResponseHeaderModifier\",rule=\"!(has(self.responseHeaderModifier) \u0026\u0026 self.type != 'ResponseHeaderModifier')\"\n+kubebuilder:validation:XValidation:message=\"filter.responseHeaderModifier must be specified for ResponseHeaderModifier filter.type\",rule=\"!(!has(self.responseHeaderModifier) \u0026\u0026 self.type == 'ResponseHeaderModifier')\"\n+kubebuilder:validation:XValidation:message=\"filter.requestMirror must be nil if the filter.type is not RequestMirror\",rule=\"!(has(self.requestMirror) \u0026\u0026 self.type != 'RequestMirror')\"\n+kubebuilder:validation:XValidation:message=\"filter.requestMirror must be specified for RequestMirror filter.type\",rule=\"!(!has(self.requestMirror) \u0026\u0026 self.type == 'RequestMirror')\"\n+kubebuilder:validation:XValidation:message=\"filter.extensionRef must be nil if the filter.type is not ExtensionRef\",rule=\"!(has(self.extensionRef) \u0026\u0026 self.type != 'ExtensionRef')\"\n+kubebuilder:validation:XValidation:message=\"filter.extensionRef must be specified for ExtensionRef filter.type\",rule=\"!(!has(self.extensionRef) \u0026\u0026 self.type == 'ExtensionRef')\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteFilterType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCRouteFilterType","fields":[],"enumValues":[{"name":"GRPCRouteFilterRequestHeaderModifier","docString":"GRPCRouteFilterRequestHeaderModifier can be used to add or remove a gRPC\nheader from a gRPC request before it is sent to the upstream target.\n\nSupport in GRPCRouteRule: Core\n\nSupport in GRPCBackendRef: Extended"},{"name":"GRPCRouteFilterResponseHeaderModifier","docString":"GRPCRouteFilterRequestHeaderModifier can be used to add or remove a gRPC\nheader from a gRPC response before it is sent to the client.\n\nSupport in GRPCRouteRule: Core\n\nSupport in GRPCBackendRef: Extended"},{"name":"GRPCRouteFilterRequestMirror","docString":"GRPCRouteFilterRequestMirror can be used to mirror gRPC requests to a\ndifferent backend. The responses from this backend MUST be ignored by\nthe Gateway.\n\nSupport in GRPCRouteRule: Extended\n\nSupport in GRPCBackendRef: Extended"},{"name":"GRPCRouteFilterExtensionRef","docString":"GRPCRouteFilterExtensionRef should be used for configuring custom\ngRPC filters.\n\nSupport in GRPCRouteRule: Implementation-specific\n\nSupport in GRPCBackendRef: Implementation-specific"}],"docString":"GRPCRouteFilterType identifies a type of GRPCRoute filter.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteList":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCRouteList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCRoute","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"GRPCRouteList contains a list of GRPCRoute.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteMatch":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCRouteMatch","fields":[{"fieldName":"Method","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCMethodMatch","typeDecorators":["Ptr"],"docString":"Method specifies a gRPC request service/method matcher. If this field is\nnot specified, all services and methods will match.\n\n+optional"},{"fieldName":"Headers","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCHeaderMatch","typeDecorators":["List"],"docString":"Headers specifies gRPC request header matchers. Multiple match values are\nANDed together, meaning, a request MUST match all the specified headers\nto select the route.\n\n+listType=map\n+listMapKey=name\n+optional\n+kubebuilder:validation:MaxItems=16"}],"enumValues":[],"docString":"GRPCRouteMatch defines the predicate used to match requests to a given\naction. Multiple match types are ANDed together, i.e. the match will\nevaluate to true only if all conditions are satisfied.\n\nFor example, the match below will match a gRPC request only if its service\nis `foo` AND it contains the `version: v1` header:\n\n```\nmatches:\n  - method:\n    type: Exact\n    service: \"foo\"\n    headers:\n  - name: \"version\"\n    value \"v1\"\n\n```","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteRule":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCRouteRule","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":["Ptr"],"docString":"Name is the name of the route rule. This name MUST be unique within a Route if it is set.\n\nSupport: Extended\n+optional"},{"fieldName":"Matches","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteMatch","typeDecorators":["List"],"docString":"Matches define conditions used for matching the rule against incoming\ngRPC requests. Each match is independent, i.e. this rule will be matched\nif **any** one of the matches is satisfied.\n\nFor example, take the following matches configuration:\n\n```\nmatches:\n- method:\n    service: foo.bar\n  headers:\n    values:\n      version: 2\n- method:\n    service: foo.bar.v2\n```\n\nFor a request to match against this rule, it MUST satisfy\nEITHER of the two conditions:\n\n- service of foo.bar AND contains the header `version: 2`\n- service of foo.bar.v2\n\nSee the documentation for GRPCRouteMatch on how to specify multiple\nmatch conditions to be ANDed together.\n\nIf no matches are specified, the implementation MUST match every gRPC request.\n\nProxy or Load Balancer routing configuration generated from GRPCRoutes\nMUST prioritize rules based on the following criteria, continuing on\nties. Merging MUST not be done between GRPCRoutes and HTTPRoutes.\nPrecedence MUST be given to the rule with the largest number of:\n\n* Characters in a matching non-wildcard hostname.\n* Characters in a matching hostname.\n* Characters in a matching service.\n* Characters in a matching method.\n* Header matches.\n\nIf ties still exist across multiple Routes, matching precedence MUST be\ndetermined in order of the following criteria, continuing on ties:\n\n* The oldest Route based on creation timestamp.\n* The Route appearing first in alphabetical order by\n  \"{namespace}/{name}\".\n\nIf ties still exist within the Route that has been given precedence,\nmatching precedence MUST be granted to the first matching rule meeting\nthe above criteria.\n\n+optional\n+kubebuilder:validation:MaxItems=64"},{"fieldName":"Filters","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteFilter","typeDecorators":["List"],"docString":"Filters define the filters that are applied to requests that match\nthis rule.\n\nThe effects of ordering of multiple behaviors are currently unspecified.\nThis can change in the future based on feedback during the alpha stage.\n\nConformance-levels at this level are defined based on the type of filter:\n\n- ALL core filters MUST be supported by all implementations that support\n  GRPCRoute.\n- Implementers are encouraged to support extended filters.\n- Implementation-specific custom filters have no API guarantees across\n  implementations.\n\nSpecifying the same filter multiple times is not supported unless explicitly\nindicated in the filter.\n\nIf an implementation cannot support a combination of filters, it must clearly\ndocument that limitation. In cases where incompatible or unsupported\nfilters are specified and cause the `Accepted` condition to be set to status\n`False`, implementations may use the `IncompatibleFilters` reason to specify\nthis configuration error.\n\nSupport: Core\n\n+optional\n+kubebuilder:validation:MaxItems=16\n+kubebuilder:validation:XValidation:message=\"RequestHeaderModifier filter cannot be repeated\",rule=\"self.filter(f, f.type == 'RequestHeaderModifier').size() \u003c= 1\"\n+kubebuilder:validation:XValidation:message=\"ResponseHeaderModifier filter cannot be repeated\",rule=\"self.filter(f, f.type == 'ResponseHeaderModifier').size() \u003c= 1\""},{"fieldName":"BackendRefs","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCBackendRef","typeDecorators":["List"],"docString":"BackendRefs defines the backend(s) where matching requests should be\nsent.\n\nFailure behavior here depends on how many BackendRefs are specified and\nhow many are invalid.\n\nIf *all* entries in BackendRefs are invalid, and there are also no filters\nspecified in this route rule, *all* traffic which matches this rule MUST\nreceive an `UNAVAILABLE` status.\n\nSee the GRPCBackendRef definition for the rules about what makes a single\nGRPCBackendRef invalid.\n\nWhen a GRPCBackendRef is invalid, `UNAVAILABLE` statuses MUST be returned for\nrequests that would have otherwise been routed to an invalid backend. If\nmultiple backends are specified, and some are invalid, the proportion of\nrequests that would otherwise have been routed to an invalid backend\nMUST receive an `UNAVAILABLE` status.\n\nFor example, if two backends are specified with equal weights, and one is\ninvalid, 50 percent of traffic MUST receive an `UNAVAILABLE` status.\nImplementations may choose how that 50 percent is determined.\n\nSupport: Core for Kubernetes Service\n\nSupport: Implementation-specific for any other resource\n\nSupport for weight: Core\n\n+optional\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"SessionPersistence","typeName":"SessionPersistence","typeDecorators":["Ptr"],"docString":"SessionPersistence defines and configures session persistence\nfor the route rule.\n\nSupport: Extended\n\n+optional\n\u003cgateway:experimental\u003e"}],"enumValues":[],"docString":"GRPCRouteRule defines the semantics for matching a gRPC request based on\nconditions (matches), processing it (filters), and forwarding the request to\nan API object (backendRefs).","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCRouteSpec","fields":[{"fieldName":"CommonRouteSpec","typeName":"CommonRouteSpec","typeDecorators":null,"docString":""},{"fieldName":"Hostnames","typeName":"Hostname","typeDecorators":["List"],"docString":"Hostnames defines a set of hostnames to match against the GRPC\nHost header to select a GRPCRoute to process the request. This matches\nthe RFC 1123 definition of a hostname with 2 notable exceptions:\n\n1. IPs are not allowed.\n2. A hostname may be prefixed with a wildcard label (`*.`). The wildcard\n   label MUST appear by itself as the first label.\n\nIf a hostname is specified by both the Listener and GRPCRoute, there\nMUST be at least one intersecting hostname for the GRPCRoute to be\nattached to the Listener. For example:\n\n* A Listener with `test.example.com` as the hostname matches GRPCRoutes\n  that have either not specified any hostnames, or have specified at\n  least one of `test.example.com` or `*.example.com`.\n* A Listener with `*.example.com` as the hostname matches GRPCRoutes\n  that have either not specified any hostnames or have specified at least\n  one hostname that matches the Listener hostname. For example,\n  `test.example.com` and `*.example.com` would both match. On the other\n  hand, `example.com` and `test.example.net` would not match.\n\nHostnames that are prefixed with a wildcard label (`*.`) are interpreted\nas a suffix match. That means that a match for `*.example.com` would match\nboth `test.example.com`, and `foo.test.example.com`, but not `example.com`.\n\nIf both the Listener and GRPCRoute have specified hostnames, any\nGRPCRoute hostnames that do not match the Listener hostname MUST be\nignored. For example, if a Listener specified `*.example.com`, and the\nGRPCRoute specified `test.example.com` and `test.example.net`,\n`test.example.net` MUST NOT be considered for a match.\n\nIf both the Listener and GRPCRoute have specified hostnames, and none\nmatch with the criteria above, then the GRPCRoute MUST NOT be accepted by\nthe implementation. The implementation MUST raise an 'Accepted' Condition\nwith a status of `False` in the corresponding RouteParentStatus.\n\nIf a Route (A) of type HTTPRoute or GRPCRoute is attached to a\nListener and that listener already has another Route (B) of the other\ntype attached and the intersection of the hostnames of A and B is\nnon-empty, then the implementation MUST accept exactly one of these two\nroutes, determined by the following criteria, in order:\n\n* The oldest Route based on creation timestamp.\n* The Route appearing first in alphabetical order by\n  \"{namespace}/{name}\".\n\nThe rejected Route MUST raise an 'Accepted' condition with a status of\n'False' in the corresponding RouteParentStatus.\n\nSupport: Core\n\n+optional\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"Rules","typeName":"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteRule","typeDecorators":["List"],"docString":"Rules are a list of GRPC matchers, filters and actions.\n\n+optional\n+kubebuilder:validation:MaxItems=16\n+kubebuilder:validation:XValidation:message=\"While 16 rules and 64 matches per rule are allowed, the total number of matches across all rules in a route must be less than 128\",rule=\"(self.size() \u003e 0 ? (has(self[0].matches) ? self[0].matches.size() : 0) : 0) + (self.size() \u003e 1 ? (has(self[1].matches) ? self[1].matches.size() : 0) : 0) + (self.size() \u003e 2 ? (has(self[2].matches) ? self[2].matches.size() : 0) : 0) + (self.size() \u003e 3 ? (has(self[3].matches) ? self[3].matches.size() : 0) : 0) + (self.size() \u003e 4 ? (has(self[4].matches) ? self[4].matches.size() : 0) : 0) + (self.size() \u003e 5 ? (has(self[5].matches) ? self[5].matches.size() : 0) : 0) + (self.size() \u003e 6 ? (has(self[6].matches) ? self[6].matches.size() : 0) : 0) + (self.size() \u003e 7 ? (has(self[7].matches) ? self[7].matches.size() : 0) : 0) + (self.size() \u003e 8 ? (has(self[8].matches) ? self[8].matches.size() : 0) : 0) + (self.size() \u003e 9 ? (has(self[9].matches) ? self[9].matches.size() : 0) : 0) + (self.size() \u003e 10 ? (has(self[10].matches) ? self[10].matches.size() : 0) : 0) + (self.size() \u003e 11 ? (has(self[11].matches) ? self[11].matches.size() : 0) : 0) + (self.size() \u003e 12 ? (has(self[12].matches) ? self[12].matches.size() : 0) : 0) + (self.size() \u003e 13 ? (has(self[13].matches) ? self[13].matches.size() : 0) : 0) + (self.size() \u003e 14 ? (has(self[14].matches) ? self[14].matches.size() : 0) : 0) + (self.size() \u003e 15 ? (has(self[15].matches) ? self[15].matches.size() : 0) : 0) \u003c= 128\"\n\u003cgateway:experimental:validation:XValidation:message=\"Rule name must be unique within the route\",rule=\"self.all(l1, !has(l1.name) || self.exists_one(l2, has(l2.name) \u0026\u0026 l1.name == l2.name))\"\u003e"}],"enumValues":[],"docString":"GRPCRouteSpec defines the desired state of GRPCRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GRPCRouteStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GRPCRouteStatus","fields":[{"fieldName":"RouteStatus","typeName":"RouteStatus","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"GRPCRouteStatus defines the observed state of GRPCRoute.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.Gateway":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"Gateway","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewaySpec","typeDecorators":null,"docString":"Spec defines the desired state of Gateway."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayStatus","typeDecorators":null,"docString":"Status defines the current state of Gateway.\n\n+kubebuilder:default={conditions: {{type: \"Accepted\", status: \"Unknown\", reason:\"Pending\", message:\"Waiting for controller\", lastTransitionTime: \"1970-01-01T00:00:00Z\"},{type: \"Programmed\", status: \"Unknown\", reason:\"Pending\", message:\"Waiting for controller\", lastTransitionTime: \"1970-01-01T00:00:00Z\"}}}"}],"enumValues":[],"docString":"Gateway represents an instance of a service-traffic handling infrastructure\nby binding Listeners to a set of IP addresses.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1.GatewayBackendTLS":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayBackendTLS","fields":[{"fieldName":"ClientCertificateRef","typeName":"SecretObjectReference","typeDecorators":["Ptr"],"docString":"ClientCertificateRef is a reference to an object that contains a Client\nCertificate and the associated private key.\n\nReferences to a resource in different namespace are invalid UNLESS there\nis a ReferenceGrant in the target namespace that allows the certificate\nto be attached. If a ReferenceGrant does not allow this reference, the\n\"ResolvedRefs\" condition MUST be set to False for this listener with the\n\"RefNotPermitted\" reason.\n\nClientCertificateRef can reference to standard Kubernetes resources, i.e.\nSecret, or implementation-specific custom resources.\n\nThis setting can be overridden on the service level by use of BackendTLSPolicy.\n\nSupport: Core\n\n+optional\n\u003cgateway:experimental\u003e"}],"enumValues":[],"docString":"GatewayBackendTLS describes backend TLS configuration for gateway.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewayClass":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayClass","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayClassSpec","typeDecorators":null,"docString":"Spec defines the desired state of GatewayClass."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayClassStatus","typeDecorators":null,"docString":"Status defines the current state of GatewayClass.\n\nImplementations MUST populate status on all GatewayClass resources which\nspecify their controller name.\n\n+kubebuilder:default={conditions: {{type: \"Accepted\", status: \"Unknown\", message: \"Waiting for controller\", reason: \"Pending\", lastTransitionTime: \"1970-01-01T00:00:00Z\"}}}"}],"enumValues":[],"docString":"GatewayClass describes a class of Gateways available to the user for creating\nGateway resources.\n\nIt is recommended that this resource be used as a template for Gateways. This\nmeans that a Gateway is based on the state of the GatewayClass at the time it\nwas created and changes to the GatewayClass or associated parameters are not\npropagated down to existing Gateways. This recommendation is intended to\nlimit the blast radius of changes to GatewayClass or associated parameters.\nIf implementations choose to propagate GatewayClass changes to existing\nGateways, that MUST be clearly documented by the implementation.\n\nWhenever one or more Gateways are using a GatewayClass, implementations SHOULD\nadd the `gateway-exists-finalizer.gateway.networking.k8s.io` finalizer on the\nassociated GatewayClass. This ensures that a GatewayClass associated with a\nGateway is not deleted while in use.\n\nGatewayClass is a Cluster level resource.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1.GatewayClassList":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayClassList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayClass","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"GatewayClassList contains a list of GatewayClass","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.GatewayClassSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"GatewayClassSpec","fields":[{"fieldName":"ControllerName","typeName":"GatewayController","typeDecorators":null,"docString":"ControllerName is the name of the controller that is managing Gateways of\nthis class. The value of this field MUST be a domain prefixed path.\n\nExample: \"example.net/gateway-controller\".\n\nThis field is not mutable and cannot be empty.\n\nSupport: Core\n\n+kubebuilder:validation:XValidation:message=\"Value is immutable\",rule=\"self == oldSelf\""},{"fieldName":"ParametersRef","typeName":"sigs.k8s.io/gateway-api/apis
