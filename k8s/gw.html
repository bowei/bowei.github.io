
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godoc Multi-Column</title>
    <style>
      body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          margin: 0;
          padding: 20px;
          background-color: #f8f9fa;
          color: #212529;
      }
      h1 {
          font-weight: 500;
          margin-bottom: 20px;
      }

      kbd {
          background-color: #e9ecef;
          padding: 0.2em 0.4em;
          border-radius: 4px;
          border: 1px solid #ced4da;
          box-shadow: 0 2px 0 #ced4da;
          color: #212529;
          font-family: monospace;
          font-size: 0.9em;
          margin: 0 0.2em;
           
          position: relative;
          top: -1px;
      }

      #main-container {
          display: flex;
          flex-direction: row;
          height: calc(100vh - 100px);
          border: 1px solid #dee2e6;
          border-radius: 8px;
          overflow-x: auto;
          background-color: #fff;
      }
      .column {
          min-width: 250px;
          border-right: 1px solid #dee2e6;
          overflow-y: auto;
          flex-shrink: 0;
      }
      .column:last-child {
          border-right: none;
      }
      .column-header {
          padding: 12px 16px;
          font-weight: 600;
          border-bottom: 1px solid #dee2e6;
          background-color: #f1f3f5;
          position: sticky;
          top: 0;
          z-index: 1;
      }
      ul {
          list-style-type: none;
          margin: 0;
          padding: 0;
      }
      li {
          padding: 10px 16px;
          cursor: pointer;
          border-bottom: 1px solid #e9ecef;
          display: flex;
          justify-content: space-between;
          align-items: center;
      }
      li:last-child {
          border-bottom: none;
      }
      li:hover {
          background-color: #e9ecef;
      }
      li.selected {
          background-color: #0d6efd;
          color: white;
      }
      .type-name {
          color: #6c757d;
          font-size: 8pt;
      }
      
      .header-row {
          font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      .field-row {
          font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .field-name {
          font-size: 10pt;
      }
      .field-type {
          font-size: 10pt;
          margin-left: 6pt;
          color: #6c757d;
      }

      .doc-string {
          max-width: 400px;
          margin-top: 10pt;
          font-size: 9pt;
      }

      li.selected .field-type {
          color: #e0e0e0;
      }

      li.selected .type-name {
          color: #e0e0e0;
      }
      .chevron::after {
          content: '>';
          font-weight: bold;
          color: #adb5bd;
      }
      li.selected .chevron::after {
          color: white;
      }

      #type-switcher-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.5);
          z-index: 100;
          display: none;
          justify-content: center;
          align-items: center;
      }
      #type-switcher-dialog {
          background-color: white;
          padding: 20px;
          border-radius: 8px;
          width: 80%;
          max-width: 900px;
          box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      }
      #type-switcher-dialog h2 {
          margin-top: 0;
      }
      #type-switcher-input {
          width: 100%;
          padding: 10px;
          margin-bottom: 10px;
          box-sizing: border-box;
          border: 1px solid #ccc;
          border-radius: 4px;
      }
      #type-switcher-list {
          list-style-type: none;
          padding: 0;
          margin: 0;
          max-height: 400px;
          overflow-y: auto;
          column-count: 3;
      }
      #type-switcher-list li {
          cursor: pointer;
          padding: 8px;
          border-radius: 4px;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          height: 30px;
      }
      #type-switcher-list li:hover, #type-switcher-list li.selected {
          background-color: #0d6efd;
          color: #ffffff;
      }
      .type-switcher-type-name {
          font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
          font-size: 10pt;
      }
      .type-switcher-type-pkg {
          font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
          font-size: 8pt;
          color: #6c757d;
      }
    </style>
  </head>
  <body>
    <div id="help-text">
      Type<kbd>/</kbd>to change Object</p>
</div>
<div id="main-container"></div>

<div id="type-switcher-overlay">
  <div id="type-switcher-dialog">
    <h2>Switch Type</h2>
    <input type="text" id="type-switcher-input" placeholder="Filter types...">
    <ul id="type-switcher-list"></ul>
  </div>
</div>

/pkg/apis/meta/v1","typeName":"Condition","fields":[{"fieldName":"Type","typeName":"string","typeDecorators":null,"docString":"type of condition in CamelCase or in foo.example.com/CamelCase.\n---\nMany .condition.type values are consistent across resources like Available, but because arbitrary conditions can be\nuseful (see .node.status.conditions), the ability to deconflict is important.\nThe regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)\n+required\n+kubebuilder:validation:Required\n+kubebuilder:validation:Pattern=`^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$`\n+kubebuilder:validation:MaxLength=316"},{"fieldName":"Status","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ConditionStatus","typeDecorators":null,"docString":"status of the condition, one of True, False, Unknown.\n+required\n+kubebuilder:validation:Required\n+kubebuilder:validation:Enum=True;False;Unknown"},{"fieldName":"ObservedGeneration","typeName":"int64","typeDecorators":null,"docString":"observedGeneration represents the .metadata.generation that the condition was set based upon.\nFor instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date\nwith respect to the current state of the instance.\n+optional\n+kubebuilder:validation:Minimum=0"},{"fieldName":"LastTransitionTime","typeName":"Time","typeDecorators":null,"docString":"lastTransitionTime is the last time the condition transitioned from one status to another.\nThis should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.\n+required\n+kubebuilder:validation:Required\n+kubebuilder:validation:Type=string\n+kubebuilder:validation:Format=date-time"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"reason contains a programmatic identifier indicating the reason for the condition's last transition.\nProducers of specific condition types may define expected values and meanings for this field,\nand whether the values are considered a guaranteed API.\nThe value should be a CamelCase string.\nThis field may not be empty.\n+required\n+kubebuilder:validation:Required\n+kubebuilder:validation:MaxLength=1024\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:Pattern=`^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$`"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"message is a human readable message indicating details about the transition.\nThis may be an empty string.\n+required\n+kubebuilder:validation:Required\n+kubebuilder:validation:MaxLength=32768"}],"enumValues":[],"docString":"Condition contains details for one aspect of the current state of this API Resource.\n---\nThis struct is intended for direct use as an array at the field path .status.conditions.  For example,\n\n\ttype FooStatus struct{\n\t    // Represents the observations of a foo's current state.\n\t    // Known .status.conditions.type are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    // +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t    // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\" patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\t    // other fields\n\t}","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ConditionStatus":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ConditionStatus","fields":[],"enumValues":[{"name":"ConditionTrue","docString":"These are valid condition statuses. \"ConditionTrue\" means a resource is in the condition.\n\"ConditionFalse\" means a resource is not in the condition. \"ConditionUnknown\" means kubernetes\ncan't decide if a resource is in the condition or not. In the future, we could add other\nintermediate conditions, e.g. ConditionDegraded."},{"name":"ConditionFalse","docString": ently\ndropped from the object, and will ignore all but the last duplicate\nfield that the decoder encounters. This is the default behavior\nprior to v1.23.\n- Warn: This will send a warning via the standard warning response\nheader for each unknown field that is dropped from the object, and\nfor each duplicate field that is encountered. The request will\nstill succeed if there are no other errors, and will only persist\nthe last of any duplicate fields. This is the default in v1.23+\n- Strict: This will fail the request with a BadRequest error if\nany unknown fields would be dropped from the object, or if any\nduplicate fields are present. The error returned from the server\nwill contain all unknown and duplicate fields encountered.\n+optional"}],"enumValues":[],"docString":"CreateOptions may be provided when creating an API object.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.DeleteOptions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"DeleteOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"GracePeriodSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"The duration in seconds before the object should be deleted. Value must be non-negative integer.\nThe value zero indicates delete immediately. If this value is nil, the default grace period for the\nspecified type will be used.\nDefaults to a per object value if not specified. zero means delete immediately.\n+optional"},{"fieldName":"Preconditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Preconditions","typeDecorators":["Ptr"],"docString":"Must be fulfilled before a deletion is carried out. If not possible, a 409 Conflict status will be\nreturned.\n+k8s:conversion-gen=false\n+optional"},{"fieldName":"OrphanDependents","typeName":"bool","typeDecorators":["Ptr"],"docString":"Deprecated: please use the PropagationPolicy, this field will be deprecated in 1.7.\nShould the dependent objects be orphaned. If true/false, the \"orphan\"\nfinalizer will be added to/removed from the object's finalizers list.\nEither this field or PropagationPolicy may be set, but not both.\n+optional"},{"fieldName":"PropagationPolicy","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.DeletionPropagation","typeDecorators":["Ptr"],"docString":"Whether and how garbage collection will be performed.\nEither this field or OrphanDependents may be set, but not both.\nThe default policy is decided by the existing finalizer set in the\nmetadata.finalizers and the resource-specific default policy.\nAcceptable values are: 'Orphan' - orphan the dependents; 'Background' -\nallow the garbage collector to delete the dependents in the background;\n'Foreground' - a cascading policy that deletes all dependents in the\nforeground.\n+optional"},{"fieldName":"DryRun","typeName":"string","typeDecorators":["List"],"docString":"When present, indicates that modifications should not be\npersisted. An invalid or unrecognized dryRun directive will\nresult in an error response and no further processing of the\nrequest. Valid values are:\n- All: all dry run stages will be processed\n+optional\n+listType=atomic"},{"fieldName":"IgnoreStoreReadErrorWithClusterBreakingPotential","typeName":"bool","typeDecorators":["Ptr"],"docString":"if set to true, it will trigger an unsafe deletion of the resource in\ncase the normal deletion flow fails with a corrupt object error.\nA resource is considered corrupt if it can not be retrieved from\nthe underlying storage successfully because of a) its data can\nnot be transformed e.g. decryption failure, or b) it fails\nto decode into an object.\nNOTE: unsafe deletion ignores finalizer constraints, skips\nprecondition checks, and removes the object from the storage.\nWARNING: This may potentially break the cluster if the workload\nassociated with the resource being unsafe-deleted relies on normal\ndeletion flow. Use only if you REALLY know what you are doing.\nThe default value is false, and the user must opt in to enable it\n+optional"}],"enumValues":[],"docString":"DeleteOptions may be provided when deleting an API object.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.DeletionPropagation":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"DeletionPropagation","fields":[],"enumValues":[{"name":"DeletePropagationOrphan","docString":"Orphans the dependents."},{"name":"DeletePropagationBackground","docString":"Deletes the object from the key-value store, the garbage collector will\ndelete the dependents in the background."},{"name":"DeletePropagationForeground","docString":"The object exists in the key-value store until the garbage collector\ndeletes all the dependents whose ownerReference.blockOwnerDeletion=true\nfrom the key-value store.  API sever will put the \"foregroundDeletion\"\nfinalizer on the object, and sets its deletionTimestamp.  This policy is\ncascading, i.e., the dependents will be deleted with Foreground."}],"docString":"DeletionPropagation decides if a deletion will propagate to the dependents of\nthe object, and how the garbage collector will handle the propagation.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.Duration":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"Duration","fields":[{"fieldName":"Duration","typeName":"time.Duration","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"Duration is a wrapper around time.Duration which supports correct\nmarshaling to YAML and JSON. In particular, it marshals into strings, which\ncan be used as map keys in json.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.DurationHolder":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"DurationHolder","fields":[{"fieldName":"D","typeName":"Duration","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.FieldSelectorOperator":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"FieldSelectorOperator","fields":[],"enumValues":[{"name":"FieldSelectorOpIn","docString":""},{"name":"FieldSelectorOpNotIn","docString":""},{"name":"FieldSelectorOpExists","docString":""},{"name":"FieldSelectorOpDoesNotExist","docString":""}],"docString":"A field selector operator is the set of operators that can be used in a selector requirement.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.FieldSelectorRequirement":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"FieldSelectorRequirement","fields":[{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"key is the field selector key that the requirement applies to."},{"fieldName":"Operator","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.FieldSelectorOperator","typeDecorators":null,"docString":"operator represents a key's relationship to a set of values.\nValid operators are In, NotIn, Exists, DoesNotExist.\nThe list of operators may grow in the future."},{"fieldName":"Values","typeName":"string","typeDecorators":["List"],"docString":"values is an array of string values.\nIf the operator is In or NotIn, the values array must be non-empty.\nIf the operator is Exists or DoesNotExist, the values array must be empty.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"FieldSelectorRequirement is a selector that contains values, a key, and an operator that\nrelates the key and values.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.FieldsV1":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"FieldsV1","fields":[{"fieldName":"Raw","typeName":"byte","typeDecorators":["List"],"docString":"Raw is the underlying serialization of this object."}],"enumValues":[],"docString":"FieldsV1 stores a set of fields in a data structure like a Trie, in JSON format.\n\nEach key is either a '.' representing the field itself, and will always map to an empty set,\nor a string representing a sub-field or item. The string will follow one of these four formats:\n'f:\u003cname\u003e', where \u003cname\u003e is the name of a field in a struct, or key in a map\n'v:\u003cvalue\u003e', where \u003cvalue\u003e is the exact json formatted value of a list item\n'i:\u003cindex\u003e', where \u003cindex\u003e is position of a item in a list\n'k:\u003ckeys\u003e', where \u003ckeys\u003e is a map of  a list item's key fields to their unique values\nIf a key maps to an empty Fields value, the field that key represents is part of the set.\n\nThe exact format is defined in sigs.k8s.io/structured-merge-diff\n+protobuf.options.(gogoproto.goproto_stringer)=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.GetOptions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"GetOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":null,"docString":"resourceVersion sets a constraint on what resource versions a request may be served from.\nSee https://kubernetes.io/docs/reference/using-api/api-concepts/#resource-versions for\ndetails.\n\nDefaults to unset\n+optional"}],"enumValues":[],"docString":"GetOptions is the standard query options to the standard REST get call.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.GroupKind":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"GroupKind","fields":[{"fieldName":"Group","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"GroupKind specifies a Group and a Kind, but does not force a version.  This is useful for identifying\nconcepts during lookup stages without having partially valid types\n\n+protobuf.options.(gogoproto.goproto_stringer)=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.GroupResource":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"GroupResource","fields":[{"fieldName":"Group","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Resource","typeName":"string","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"GroupResource specifies a Group and a Resource, but does not force a version.  This is useful for identifying\nconcepts during lookup stages without having partially valid types\n\n+protobuf.options.(gogoproto.goproto_stringer)=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.GroupVersion":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"GroupVersion","fields":[{"fieldName":"Group","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Version","typeName":"string","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"GroupVersion contains the \"group\" and the \"version\", which uniquely identifies the API.\n\n+protobuf.options.(gogoproto.goproto_stringer)=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.GroupVersionForDiscovery":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"GroupVersionForDiscovery","fields":[{"fieldName":"GroupVersion","typeName":"string","typeDecorators":null,"docString":"groupVersion specifies the API group and version in the form \"group/version\""},{"fieldName":"Version","typeName":"string","typeDecorators":null,"docString":"version specifies the version in the form of \"version\". This is to save\nthe clients the trouble of splitting the GroupVersion."}],"enumValues":[],"docString":"GroupVersion contains the \"group/version\" and \"version\" string of a version.\nIt is made a struct to keep extensibility.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.GroupVersionHolder":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"GroupVersionHolder","fields":[{"fieldName":"GV","typeName":"GroupVersion","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.GroupVersionKind":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"GroupVersionKind","fields":[{"fieldName":"Group","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Version","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"GroupVersionKind unambiguously identifies a kind.  It doesn't anonymously include GroupVersion\nto avoid automatic coercion.  It doesn't use a GroupVersion to avoid custom marshalling\n\n+protobuf.options.(gogoproto.goproto_stringer)=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.GroupVersionResource":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"GroupVersionResource","fields":[{"fieldName":"Group","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Version","typeName":"string","typeDecorators":null,"docString":""},{"fieldName":"Resource","typeName":"string","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"GroupVersionResource unambiguously identifies a resource.  It doesn't anonymously include GroupVersion\nto avoid automatic coercion.  It doesn't use a GroupVersion to avoid custom marshalling\n\n+protobuf.options.(gogoproto.goproto_stringer)=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.IncludeObjectPolicy":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"IncludeObjectPolicy","fields":[],"enumValues":[{"name":"IncludeNone","docString":"IncludeNone returns no object."},{"name":"IncludeMetadata","docString":"IncludeMetadata serializes the object containing only its metadata field."},{"name":"IncludeObject","docString":"IncludeObject contains the full object."}],"docString":"IncludeObjectPolicy controls which portion of the object is returned with a Table.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"LabelSelector","fields":[{"fieldName":"MatchLabels","typeName":"string","typeDecorators":["Map[string]"],"docString":"matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels\nmap is equivalent to an element of matchExpressions, whose key field is \"key\", the\noperator is \"In\", and the values array contains only \"value\". The requirements are ANDed.\n+optional"},{"fieldName":"MatchExpressions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelectorRequirement","typeDecorators":["List"],"docString":"matchExpressions is a list of label selector requirements. The requirements are ANDed.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"A label selector is a label query over a set of resources. The result of matchLabels and\nmatchExpressions are ANDed. An empty label selector matches all objects. A null\nlabel selector matches no objects.\n+structType=atomic","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelectorOperator":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"LabelSelectorOperator","fields":[],"enumValues":[{"name":"LabelSelectorOpIn","docString":""},{"name":"LabelSelectorOpNotIn","docString":""},{"name":"LabelSelectorOpExists","docString":""},{"name":"LabelSelectorOpDoesNotExist","docString":""}],"docString":"A label selector operator is the set of operators that can be used in a selector requirement.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelectorRequirement":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"LabelSelectorRequirement","fields":[{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"key is the label key that the selector applies to."},{"fieldName":"Operator","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelectorOperator","typeDecorators":null,"docString":"operator represents a key's relationship to a set of values.\nValid operators are In, NotIn, Exists and DoesNotExist."},{"fieldName":"Values","typeName":"string","typeDecorators":["List"],"docString":"values is an array of string values. If the operator is In or NotIn,\nthe values array must be non-empty. If the operator is Exists or DoesNotExist,\nthe values array must be empty. This array is replaced during a strategic\nmerge patch.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"A label selector requirement is a selector that contains values, a key, and an operator that\nrelates the key and values.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.List":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"List","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/apimachinery/pkg/runtime.RawExtension","typeDecorators":["List"],"docString":"List of objects"}],"enumValues":[],"docString":"List holds a list of objects, which may not be known by the server.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ListMeta","fields":[{"fieldName":"SelfLink","typeName":"string","typeDecorators":null,"docString":"Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.\n+optional"},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":null,"docString":"String that identifies the server's internal version of this object that\ncan be used by clients to determine when objects have changed.\nValue must be treated as opaque by clients and passed unmodified back to the server.\nPopulated by the system.\nRead-only.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency\n+optional"},{"fieldName":"Continue","typeName":"string","typeDecorators":null,"docString":"continue may be set if the user set a limit on the number of items returned, and indicates that\nthe server has more data available. The value is opaque and may be used to issue another request\nto the endpoint that served this list to retrieve the next set of available objects. Continuing a\nconsistent list may not be possible if the server configuration has changed or more than a few\nminutes have passed. The resourceVersion field returned when using this continue value will be\nidentical to the value in the first response, unless you have received this token from an error\nmessage."},{"fieldName":"RemainingItemCount","typeName":"int64","typeDecorators":["Ptr"],"docString":"remainingItemCount is the number of subsequent items in the list which are not included in this\nlist response. If the list request contained label or field selectors, then the number of\nremaining items is unknown and the field will be left unset and omitted during serialization.\nIf the list is complete (either because it is not chunking or because this is the last chunk),\nthen there are no more remaining items and this field will be left unset and omitted during\nserialization.\nServers older than v1.15 do not set this field.\nThe intended use of the remainingItemCount is *estimating* the size of a collection. Clients\nshould not rely on the remainingItemCount to be set or to be exact.\n+optional"}],"enumValues":[],"docString":"ListMeta describes metadata that synthetic resources must have, including lists and\nvarious status objects. A resource may have only one of {ObjectMeta, ListMeta}.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ListOptions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ListOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"LabelSelector","typeName":"string","typeDecorators":null,"docString":"A selector to restrict the list of returned objects by their labels.\nDefaults to everything.\n+optional"},{"fieldName":"FieldSelector","typeName":"string","typeDecorators":null,"docString":"A selector to restrict the list of returned objects by their fields.\nDefaults to everything.\n+optional"},{"fieldName":"Watch","typeName":"bool","typeDecorators":null,"docString":"Watch for changes to the described resources and return them as a stream of\nadd, update, and remove notifications. Specify resourceVersion.\n+optional"},{"fieldName":"AllowWatchBookmarks","typeName":"bool","typeDecorators":null,"docString":"allowWatchBookmarks requests watch events with type \"BOOKMARK\".\nServers that do not implement bookmarks may ignore this flag and\nbookmarks are sent at the server's discretion. Clients should not\nassume bookmarks are returned at any specific interval, nor may they\nassume the server will send any BOOKMARK event during a session.\nIf this is not a watch, this field is ignored.\n+optional"},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":null,"docString":"resourceVersion sets a constraint on what resource versions a request may be served from.\nSee https://kubernetes.io/docs/reference/using-api/api-concepts/#resource-versions for\ndetails.\n\nDefaults to unset\n+optional"},{"fieldName":"ResourceVersionMatch","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ResourceVersionMatch","typeDecorators":null,"docString":"resourceVersionMatch determines how resourceVersion is applied to list calls.\nIt is highly recommended that resourceVersionMatch be set for list calls where\nresourceVersion is set\nSee https://kubernetes.io/docs/reference/using-api/api-concepts/#resource-versions for\ndetails.\n\nDefaults to unset\n+optional"},{"fieldName":"TimeoutSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"Timeout for the list/watch call.\nThis limits the duration of the call, regardless of any activity or inactivity.\n+optional"},{"fieldName":"Limit","typeName":"int64","typeDecorators":null,"docString":"limit is a maximum number of responses to return for a list call. If more items exist, the\nserver will set the `continue` field on the list metadata to a value that can be used with the\nsame initial query to retrieve the next set of results. Setting a limit may return fewer than\nthe requested amount of items (up to zero items) in the event all requested objects are\nfiltered out and clients should only use the presence of the continue field to determine whether\nmore results are available. Servers may choose not to support the limit argument and will return\nall of the available results. If limit is specified and the continue field is empty, clients may\nassume that no more results are available. This field is not supported if watch is true.\n\nThe server guarantees that the objects returned when using continue will be identical to issuing\na single list call without a limit - that is, no objects created, modified, or deleted after the\nfirst request is issued will be included in any subsequent continued requests. This is sometimes\nreferred to as a consistent snapshot, and ensures that a client that is using limit to receive\nsmaller chunks of a very large result can ensure they see all possible objects. If objects are\nupdated during a chunked list the version of the object that was present at the time the first list\nresult was calculated is returned."},{"fieldName":"Continue","typeName":"string","typeDecorators":null,"docString":"The continue option should be set when retrieving more results from the server. Since this value is\nserver defined, clients may only use the continue value from a previous query result with identical\nquery parameters (except for the value of continue) and the server may reject a continue value it\ndoes not recognize. If the specified continue value is no longer valid whether due to expiration\n(generally five to fifteen minutes) or a configuration change on the server, the server will\nrespond with a 410 ResourceExpired error together with a continue token. If the client needs a\nconsistent list, it must restart their list without the continue field. Otherwise, the client may\nsend another list request with the token received with the 410 error, the server will respond with\na list starting from the next key, but from the latest snapshot, which is inconsistent from the\nprevious list results - objects that are created, modified, or deleted after the first list request\nwill be included in the response, as long as their keys are after the \"next key\".\n\nThis field is not supported when watch is true. Clients may start a watch from the last\nresourceVersion value returned by the server and not miss any modifications."},{"fieldName":"SendInitialEvents","typeName":"bool","typeDecorators":["Ptr"],"docString":"`sendInitialEvents=true` may be set together with `watch=true`.\nIn that case, the watch stream will begin with synthetic events to\nproduce the current state of objects in the collection. Once all such\nevents have been sent, a synthetic \"Bookmark\" event  will be sent.\nThe bookmark will report the ResourceVersion (RV) corresponding to the\nset of objects, and be marked with `\"k8s.io/initial-events-end\": \"true\"` annotation.\nAfterwards, the watch stream will proceed as usual, sending watch events\ncorresponding to changes (subsequent to the RV) to objects watched.\n\nWhen `sendInitialEvents` option is set, we require `resourceVersionMatch`\noption to also be set. The semantic of the watch request is as following:\n- `resourceVersionMatch` = NotOlderThan\n  is interpreted as \"data at least as new as the provided `resourceVersion`\"\n  and the bookmark event is send when the state is synced\n  to a `resourceVersion` at least as fresh as the one provided by the ListOptions.\n  If `resourceVersion` is unset, this is interpreted as \"consistent read\" and the\n  bookmark event is send when the state is synced at least to the moment\n  when request started being processed.\n- `resourceVersionMatch` set to any other value or unset\n  Invalid error is returned.\n\nDefaults to true if `resourceVersion=\"\"` or `resourceVersion=\"0\"` (for backward\ncompatibility reasons) and to false otherwise.\n+optional"}],"enumValues":[],"docString":"ListOptions is the query options to a standard REST list call.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ManagedFieldsEntry":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ManagedFieldsEntry","fields":[{"fieldName":"Manager","typeName":"string","typeDecorators":null,"docString":"Manager is an identifier of the workflow managing these fields."},{"fieldName":"Operation","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ManagedFieldsOperationType","typeDecorators":null,"docString":"Operation is the type of operation which lead to this ManagedFieldsEntry being created.\nThe only valid values for this field are 'Apply' and 'Update'."},{"fieldName":"APIVersion","typeName":"string","typeDecorators":null,"docString":"APIVersion defines the version of this resource that this field set\napplies to. The format is \"group/version\" just like the top-level\nAPIVersion field. It is necessary to track the version of a field\nset because it cannot be automatically converted."},{"fieldName":"Time","typeName":"Time","typeDecorators":["Ptr"],"docString":"Time is the timestamp of when the ManagedFields entry was added. The\ntimestamp will also be updated if a field is added, the manager\nchanges any of the owned fields value or removes a field. The\ntimestamp does not update when a field is removed from the entry\nbecause another manager took it over.\n+optional"},{"fieldName":"FieldsType","typeName":"string","typeDecorators":null,"docString":"FieldsType is the discriminator for the different fields format and version.\nThere is currently only one possible value: \"FieldsV1\""},{"fieldName":"FieldsV1","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.FieldsV1","typeDecorators":["Ptr"],"docString":"FieldsV1 holds the first JSON version format as described in the \"FieldsV1\" type.\n+optional"},{"fieldName":"Subresource","typeName":"string","typeDecorators":null,"docString":"Subresource is the name of the subresource used to update that object, or\nempty string if the object was updated through the main resource. The\nvalue of this field is used to distinguish between managers, even if they\nshare the same name. For example, a status update will be distinct from a\nregular update using the same manager name.\nNote that the APIVersion field is not related to the Subresource field and\nit always corresponds to the version of the main resource."}],"enumValues":[],"docString":"ManagedFieldsEntry is a workflow-id, a FieldSet and the group version of the resource\nthat the fieldset applies to.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ManagedFieldsOperationType":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ManagedFieldsOperationType","fields":[],"enumValues":[{"name":"ManagedFieldsOperationApply","docString":""},{"name":"ManagedFieldsOperationUpdate","docString":""}],"docString":"ManagedFieldsOperationType is the type of operation which lead to a ManagedFieldsEntry being created.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.MicroTime":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"MicroTime","fields":[{"fieldName":"Time","typeName":"time.Time","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"MicroTime is version of Time with microsecond level precision.\n\n+protobuf.options.marshal=false\n+protobuf.as=Timestamp\n+protobuf.options.(gogoproto.goproto_stringer)=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.MicroTimeHolder":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"MicroTimeHolder","fields":[{"fieldName":"T","typeName":"MicroTime","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ObjectMeta","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name must be unique within a namespace. Is required when creating resources, although\nsome resources may allow a client to request the generation of an appropriate name\nautomatically. Name is primarily intended for creation idempotence and configuration\ndefinition.\nCannot be updated.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names\n+optional"},{"fieldName":"GenerateName","typeName":"string","typeDecorators":null,"docString":"GenerateName is an optional prefix, used by the server, to generate a unique\nname ONLY IF the Name field has not been provided.\nIf this field is used, the name returned to the client will be different\nthan the name passed. This value will also be combined with a unique suffix.\nThe provided value has the same validation rules as the Name field,\nand may be truncated by the length of the suffix required to make the value\nunique on the server.\n\nIf this field is specified and the generated name exists, the server will return a 409.\n\nApplied only if Name is not specified.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#idempotency\n+optional"},{"fieldName":"Namespace","typeName":"string","typeDecorators":null,"docString":"Namespace defines the space within which each name must be unique. An empty namespace is\nequivalent to the \"default\" namespace, but \"default\" is the canonical representation.\nNot all objects are required to be scoped to a namespace - the value of this field for\nthose objects will be empty.\n\nMust be a DNS_LABEL.\nCannot be updated.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces\n+optional"},{"fieldName":"SelfLink","typeName":"string","typeDecorators":null,"docString":"Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.\n+optional"},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":null,"docString":"UID is the unique in time and space value for this object. It is typically generated by\nthe server on successful creation of a resource and is not allowed to change on PUT\noperations.\n\nPopulated by the system.\nRead-only.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids\n+optional"},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":null,"docString":"An opaque value that represents the internal version of this object that can\nbe used by clients to determine when objects have changed. May be used for optimistic\nconcurrency, change detection, and the watch operation on a resource or set of resources.\nClients must treat these values as opaque and passed unmodified back to the server.\nThey may only be valid for a particular resource or set of resources.\n\nPopulated by the system.\nRead-only.\nValue must be treated as opaque by clients and .\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency\n+optional"},{"fieldName":"Generation","typeName":"int64","typeDecorators":null,"docString":"A sequence number representing a specific generation of the desired state.\nPopulated by the system. Read-only.\n+optional"},{"fieldName":"CreationTimestamp","typeName":"Time","typeDecorators":null,"docString":"CreationTimestamp is a timestamp representing the server time when this object was\ncreated. It is not guaranteed to be set in happens-before order across separate operations.\nClients may not set this value. It is represented in RFC3339 form and is in UTC.\n\nPopulated by the system.\nRead-only.\nNull for lists.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"DeletionTimestamp","typeName":"Time","typeDecorators":["Ptr"],"docString":"DeletionTimestamp is RFC 3339 date and time at which this resource will be deleted. This\nfield is set by the server when a graceful deletion is requested by the user, and is not\ndirectly settable by a client. The resource is expected to be deleted (no longer visible\nfrom resource lists, and not reachable by name) after the time in this field, once the\nfinalizers list is empty. As long as the finalizers list contains items, deletion is blocked.\nOnce the deletionTimestamp is set, this value may not be unset or be set further into the\nfuture, although it may be shortened or the resource may be deleted prior to this time.\nFor example, a user may request that a pod is deleted in 30 seconds. The Kubelet will react\nby sending a graceful termination signal to the containers in the pod. After that 30 seconds,\nthe Kubelet will send a hard termination signal (SIGKILL) to the container and after cleanup,\nremove the pod from the API. In the presence of network partitions, this object may still\nexist after this timestamp, until an administrator or automated process can determine the\nresource is fully terminated.\nIf not set, graceful deletion of the object has not been requested.\n\nPopulated by the system when a graceful deletion is requested.\nRead-only.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"DeletionGracePeriodSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"Number of seconds allowed for this object to gracefully terminate before\nit will be removed from the system. Only set when deletionTimestamp is also set.\nMay only be shortened.\nRead-only.\n+optional"},{"fieldName":"Labels","typeName":"string","typeDecorators":["Map[string]"],"docString":"Map of string keys and values that can be used to organize and categorize\n(scope and select) objects. May match selectors of replication controllers\nand services.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels\n+optional"},{"fieldName":"Annotations","typeName":"string","typeDecorators":["Map[string]"],"docString":"Annotations is an unstructured key value map stored with a resource that may be\nset by external tools to store and retrieve arbitrary metadata. They are not\nqueryable and should be preserved when modifying objects.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations\n+optional"},{"fieldName":"OwnerReferences","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.OwnerReference","typeDecorators":["List"],"docString":"List of objects depended by this object. If ALL objects in the list have\nbeen deleted, this object will be garbage collected. If this object is managed by a controller,\nthen an entry in this list will point to this controller, with the controller field set to true.\nThere cannot be more than one managing controller.\n+optional\n+patchMergeKey=uid\n+patchStrategy=merge\n+listType=map\n+listMapKey=uid"},{"fieldName":"Finalizers","typeName":"string","typeDecorators":["List"],"docString":"Must be empty before the object is deleted from the registry. Each entry\nis an identifier for the responsible component that will remove the entry\nfrom the list. If the deletionTimestamp of the object is non-nil, entries\nin this list can only be removed.\nFinalizers may be processed and removed in any order.  Order is NOT enforced\nbecause it introduces significant risk of stuck finalizers.\nfinalizers is a shared field, any actor with permission can reorder it.\nIf the finalizer list is processed in order, then this can lead to a situation\nin which the component responsible for the first finalizer in the list is\nwaiting for a signal (field value, external system, or other) produced by a\ncomponent responsible for a finalizer later in the list, resulting in a deadlock.\nWithout enforced ordering finalizers are free to order amongst themselves and\nare not vulnerable to ordering changes in the list.\n+optional\n+patchStrategy=merge\n+listType=set"},{"fieldName":"ManagedFields","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ManagedFieldsEntry","typeDecorators":["List"],"docString":"ManagedFields maps workflow-id and version to the set of fields\nthat are managed by that workflow. This is mostly for internal\nhousekeeping, and users typically shouldn't need to set or\nunderstand this field. A workflow can be the user's name, a\ncontroller's name, or the name of a specific apply path like\n\"ci-cd\". The set of fields is always in the version that the\nworkflow used when modifying the object.\n\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"ObjectMeta is metadata that all persisted resources must have, which includes all objects\nusers must create.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.OwnerReference":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"OwnerReference","fields":[{"fieldName":"APIVersion","typeName":"string","typeDecorators":null,"docString":"API version of the referent."},{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":"Kind of the referent.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds"},{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name of the referent.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names"},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":null,"docString":"UID of the referent.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids"},{"fieldName":"Controller","typeName":"bool","typeDecorators":["Ptr"],"docString":"If true, this reference points to the managing controller.\n+optional"},{"fieldName":"BlockOwnerDeletion","typeName":"bool","typeDecorators":["Ptr"],"docString":"If true, AND if the owner has the \"foregroundDeletion\" finalizer, then\nthe owner cannot be deleted from the key-value store until this\nreference is removed.\nSee https://kubernetes.io/docs/concepts/architecture/garbage-collection/#foreground-deletion\nfor how the garbage collector interacts with this field and enforces the foreground deletion.\nDefaults to false.\nTo set this field, a user needs \"delete\" permission of the owner,\notherwise 422 (Unprocessable Entity) will be returned.\n+optional"}],"enumValues":[],"docString":"OwnerReference contains enough information to let you identify an owning\nobject. An owning object must be in the same namespace as the dependent, or\nbe cluster-scoped, so there is no namespace field.\n+structType=atomic","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.PartialObjectMetadata":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"PartialObjectMetadata","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"}],"enumValues":[],"docString":"PartialObjectMetadata is a generic representation of any object with ObjectMeta. It allows clients\nto get access to a particular ObjectMeta schema without knowing the details of the version.\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object","isRoot":true},"k8s.io/apimachinery/pkg/apis/meta/v1.PartialObjectMetadataList":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"PartialObjectMetadataList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.PartialObjectMetadata","typeDecorators":["List"],"docString":"items contains each of the included items."}],"enumValues":[],"docString":"PartialObjectMetadataList contains a list of objects containing only their metadata\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.Patch":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"Patch","fields":[],"enumValues":[],"docString":"Patch is provided to give a concrete name and type to the Kubernetes PATCH request body.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.PatchOptions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"PatchOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"DryRun","typeName":"string","typeDecorators":["List"],"docString":"When present, indicates that modifications should not be\npersisted. An invalid or unrecognized dryRun directive will\nresult in an error response and no further processing of the\nrequest. Valid values are:\n- All: all dry run stages will be processed\n+optional\n+listType=atomic"},{"fieldName":"Force","typeName":"bool","typeDecorators":["Ptr"],"docString":"Force is going to \"force\" Apply requests. It means user will\nre-acquire conflicting fields owned by other people. Force\nflag must be unset for non-apply patch requests.\n+optional"},{"fieldName":"FieldManager","typeName":"string","typeDecorators":null,"docString":"fieldManager is a name associated with the actor or entity\nthat is making these changes. The value must be less than or\n128 characters long, and only contain printable characters,\nas defined by https://golang.org/pkg/unicode/#IsPrint. This\nfield is required for apply requests\n(application/apply-patch) but optional for non-apply patch\ntypes (JsonPatch, MergePatch, StrategicMergePatch).\n+optional"},{"fieldName":"FieldValidation","typeName":"string","typeDecorators":null,"docString":"fieldValidation instructs the server on how to handle\nobjects in the request (POST/PUT/PATCH) containing unknown\nor duplicate fields. Valid values are:\n- Ignore: This will ignore any unknown fields that are silently\ndropped from the object, and will ignore all but the last duplicate\nfield that the decoder encounters. This is the default behavior\nprior to v1.23.\n- Warn: This will send a warning via the standard warning response\nheader for each unknown field that is dropped from the object, and\nfor each duplicate field that is encountered. The request will\nstill succeed if there are no other errors, and will only persist\nthe last of any duplicate fields. This is the default in v1.23+\n- Strict: This will fail the request with a BadRequest error if\nany unknown fields would be dropped from the object, or if any\nduplicate fields are present. The error returned from the server\nwill contain all unknown and duplicate fields encountered.\n+optional"}],"enumValues":[],"docString":"PatchOptions may be provided when patching an API object.\nPatchOptions is meant to be a superset of UpdateOptions.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.Preconditions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"Preconditions","fields":[{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":["Ptr"],"docString":"Specifies the target UID.\n+optional"},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":["Ptr"],"docString":"Specifies the target ResourceVersion\n+optional"}],"enumValues":[],"docString":"Preconditions must be fulfilled before an operation (update, delete, etc.) is carried out.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ResourceVersionMatch":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ResourceVersionMatch","fields":[],"enumValues":[{"name":"ResourceVersionMatchNotOlderThan","docString":"ResourceVersionMatchNotOlderThan matches data at least as new as the provided\nresourceVersion."},{"name":"ResourceVersionMatchExact","docString":"ResourceVersionMatchExact matches data at the exact resourceVersion\nprovided."}],"docString":"resourceVersionMatch specifies how the resourceVersion parameter is applied. resourceVersionMatch\nmay only be set if resourceVersion is also set.\n\n\"NotOlderThan\" matches data at least as new as the provided resourceVersion.\n\"Exact\" matches data at the exact resourceVersion provided.\n\nSee https://kubernetes.io/docs/reference/using-api/api-concepts/#resource-versions for\ndetails.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.RootPaths":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"RootPaths","fields":[{"fieldName":"Paths","typeName":"string","typeDecorators":["List"],"docString":"paths are the paths available at root.\n+listType=atomic"}],"enumValues":[],"docString":"RootPaths lists the paths available at root.\nFor example: \"/healthz\", \"/apis\".","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.RowConditionType":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"RowConditionType","fields":[],"enumValues":[{"name":"RowCompleted","docString":"RowCompleted means the underlying resource has reached completion and may be given less\nvisual priority than other resources."}],"docString":"","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ServerAddressByClientCIDR":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ServerAddressByClientCIDR","fields":[{"fieldName":"ClientCIDR","typeName":"string","typeDecorators":null,"docString":"The CIDR with which clients can match their IP to figure out the server address that they should use."},{"fieldName":"ServerAddress","typeName":"string","typeDecorators":null,"docString":"Address of this server, suitable for a client that matches the above CIDR.\nThis can be a hostname, hostname:port, IP or IP:port."}],"enumValues":[],"docString":"ServerAddressByClientCIDR helps the client to determine the server address that they should use, depending on the clientCIDR that they match.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.Status":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"Status","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Status","typeName":"string","typeDecorators":null,"docString":"Status of the operation.\nOne of: \"Success\" or \"Failure\".\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"A human-readable description of the status of this operation.\n+optional"},{"fieldName":"Reason","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.StatusReason","typeDecorators":null,"docString":"A machine-readable description of why this operation is in the\n\"Failure\" status. If this value is empty there\nis no information available. A Reason clarifies an HTTP status\ncode but does not override it.\n+optional"},{"fieldName":"Details","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.StatusDetails","typeDecorators":["Ptr"],"docString":"Extended data associated with the reason.  Each reason may define its\nown extended details. This field is optional and the data returned\nis not guaranteed to conform to any schema except that defined by\nthe reason type.\n+optional\n+listType=atomic"},{"fieldName":"Code","typeName":"int32","typeDecorators":null,"docString":"Suggested HTTP return code for this status, 0 if not set.\n+optional"}],"enumValues":[],"docString":"Status is a return value for calls that don't return other objects.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.StatusCause":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"StatusCause","fields":[{"fieldName":"Type","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.CauseType","typeDecorators":null,"docString":"A machine-readable description of the cause of the error. If this value is\nempty there is no information available.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"A human-readable description of the cause of the error.  This field may be\npresented as-is to a reader.\n+optional"},{"fieldName":"Field","typeName":"string","typeDecorators":null,"docString":"The field of the resource that has caused this error, as named by its JSON\nserialization. May include dot and postfix notation for nested attributes.\nArrays are zero-indexed.  Fields may appear more than once in an array of\ncauses due to fields having multiple errors.\nOptional.\n\nExamples:\n  \"name\" - the field \"name\" on the current resource\n  \"items[0].name\" - the field \"name\" on the first array entry in \"items\"\n+optional"}],"enumValues":[],"docString":"StatusCause provides more information about an api.Status failure, including\ncases when multiple errors are encountered.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.StatusDetails":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"StatusDetails","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"The name attribute of the resource associated with the status StatusReason\n(when there is a single name which can be described).\n+optional"},{"fieldName":"Group","typeName":"string","typeDecorators":null,"docString":"The group attribute of the resource associated with the status StatusReason.\n+optional"},{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":"The kind attribute of the resource associated with the status StatusReason.\nOn some operations may differ from the requested resource Kind.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":null,"docString":"UID of the resource.\n(when there is a single resource which can be described).\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids\n+optional"},{"fieldName":"Causes","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.StatusCause","typeDecorators":["List"],"docString":"The Causes array includes more details associated with the StatusReason\nfailure. Not all StatusReasons may provide detailed causes.\n+optional\n+listType=atomic"},{"fieldName":"RetryAfterSeconds","typeName":"int32","typeDecorators":null,"docString":"If specified, the time in seconds before the operation should be retried. Some errors may indicate\nthe client must take an alternate action - for those errors this field may indicate how long to wait\nbefore taking the alternate action.\n+optional"}],"enumValues":[],"docString":"StatusDetails is a set of additional properties that MAY be set by the\nserver to provide additional information about a response. The Reason\nfield of a Status object defines what attributes will be set. Clients\nmust ignore fields that do not match the defined type of each attribute,\nand should assume that any attribute may be empty, invalid, or under\ndefined.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.StatusReason":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"StatusReason","fields":[],"enumValues":[{"name":"StatusReasonUnknown","docString":"StatusReasonUnknown means the server has declined to indicate a specific reason.\nThe details field may contain other information about this error.\nStatus code 500."},{"name":"StatusReasonUnauthorized","docString":"StatusReasonUnauthorized means the server can be reached and understood the request, but requires\nthe user to present appropriate authorization credentials (identified by the WWW-Authenticate header)\nin order for the action to be completed. If the user has specified credentials on the request, the\nserver considers them insufficient.\nStatus code 401"},{"name":"StatusReasonForbidden","docString":"StatusReasonForbidden means the server can be reached and understood the request, but refuses\nto take any further action.  It is the result of the server being configured to deny access for some reason\nto the requested resource by the client.\nDetails (optional):\n  \"kind\" string - the kind attribute of the forbidden resource\n                  on some operations may differ from the requested\n                  resource.\n  \"id\"   string - the identifier of the forbidden resource\nStatus code 403"},{"name":"StatusReasonNotFound","docString":"StatusReasonNotFound means one or more resources required for this operation\ncould not be found.\nDetails (optional):\n  \"kind\" string - the kind attribute of the missing resource\n                  on some operations may differ from the requested\n                  resource.\n  \"id\"   string - the identifier of the missing resource\nStatus code 404"},{"name":"StatusReasonAlreadyExists","docString":"StatusReasonAlreadyExists means the resource you are creating already exists.\nDetails (optional):\n  \"kind\" string - the kind attribute of the conflicting resource\n  \"id\"   string - the identifier of the conflicting resource\nStatus code 409"},{"name":"StatusReasonConflict","docString":"StatusReasonConflict means the requested operation cannot be completed\ndue to a conflict in the operation. The client may need to alter the\nrequest. Each resource may define custom details that indicate the\nnature of the conflict.\nStatus code 409"},{"name":"StatusReasonGone","docString":"StatusReasonGone means the item is no longer available at the server and no\nforwarding address is known.\nStatus code 410"},{"name":"StatusReasonInvalid","docString":"StatusReasonInvalid means the requested create or update operation cannot be\ncompleted due to invalid data provided as part of the request. The client may\nneed to alter the request. When set, the client may use the StatusDetails\nmessage field as a summary of the issues encountered.\nDetails (optional):\n  \"kind\" string - the kind attribute of the invalid resource\n  \"id\"   string - the identifier of the invalid resource\n  \"causes\"      - one or more StatusCause entries indicating the data in the\n                  provided resource that was invalid.  The code, message, and\n                  field attributes will be set.\nStatus code 422"},{"name":"StatusReasonServerTimeout","docString":"StatusReasonServerTimeout means the server can be reached and understood the request,\nbut cannot complete the action in a reasonable time. The client should retry the request.\nThis is may be due to temporary server load or a transient communication issue with\nanother server. Status code 500 is used because the HTTP spec provides no suitable\nserver-requested client retry and the 5xx class represents actionable errors.\nDetails (optional):\n  \"kind\" string - the kind attribute of the resource being acted on.\n  \"id\"   string - the operation that is being attempted.\n  \"retryAfterSeconds\" int32 - the number of seconds before the operation should be retried\nStatus code 500"},{"name":"StatusReasonStoreReadError","docString":"StatusReasonStoreReadError means that the server encountered an error while\nretrieving resources from the backend object store.\nThis may be due to backend database error, or because processing of the read\nresource failed.\nDetails:\n  \"kind\" string - the kind attribute of the resource being acted on.\n  \"name\" string - the prefix where the reading error(s) occurred\n  \"causes\" []StatusCause\n     - (optional):\n       - \"type\" CauseType - CauseTypeUnexpectedServerResponse\n       - \"message\" string - the error message from the store backend\n       - \"field\" string - the full path with the key of the resource that failed reading\n\nStatus code 500"},{"name":"StatusReasonTimeout","docString":"StatusReasonTimeout means that the request could not be completed within the given time.\nClients can get this response only when they specified a timeout param in the request,\nor if the server cannot complete the operation within a reasonable amount of time.\nThe request might succeed with an increased value of timeout param. The client *should*\nwait at least the number of seconds specified by the retryAfterSeconds field.\nDetails (optional):\n  \"retryAfterSeconds\" int32 - the number of seconds before the operation should be retried\nStatus code 504"},{"name":"StatusReasonTooManyRequests","docString":"StatusReasonTooManyRequests means the server experienced too many requests within a\ngiven window and that the client must wait to perform the action again. A client may\nalways retry the request that led to this error, although the client should wait at least\nthe number of seconds specified by the retryAfterSeconds field.\nDetails (optional):\n  \"retryAfterSeconds\" int32 - the number of seconds before the operation should be retried\nStatus code 429"},{"name":"StatusReasonBadRequest","docString":"StatusReasonBadRequest means that the request itself was invalid, because the request\ndoesn't make any sense, for example deleting a read-only object.  This is different than\nStatusReasonInvalid above which indicates that the API call could possibly succeed, but the\ndata was invalid.  API calls that return BadRequest can never succeed.\nStatus code 400"},{"name":"StatusReasonMethodNotAllowed","docString":"StatusReasonMethodNotAllowed means that the action the client attempted to perform on the\nresource was not supported by the code - for instance, attempting to delete a resource that\ncan only be created. API calls that return MethodNotAllowed can never succeed.\nStatus code 405"},{"name":"StatusReasonNotAcceptable","docString":"StatusReasonNotAcceptable means that the accept types indicated by the client were not acceptable\nto the server - for instance, attempting to receive protobuf for a resource that supports only json and yaml.\nAPI calls that return NotAcceptable can never succeed.\nStatus code 406"},{"name":"StatusReasonRequestEntityTooLarge","docString":"StatusReasonRequestEntityTooLarge means that the request entity is too large.\nStatus code 413"},{"name":"StatusReasonUnsupportedMediaType","docString":"StatusReasonUnsupportedMediaType means that the content type sent by the client is not acceptable\nto the server - for instance, attempting to send protobuf for a resource that supports only json and yaml.\nAPI calls that return UnsupportedMediaType can never succeed.\nStatus code 415"},{"name":"StatusReasonInternalError","docString":"StatusReasonInternalError indicates that an internal error occurred, it is unexpected\nand the outcome of the call is unknown.\nDetails (optional):\n  \"causes\" - The original error\nStatus code 500"},{"name":"StatusReasonExpired","docString":"StatusReasonExpired indicates that the request is invalid because the content you are requesting\nhas expired and is no longer available. It is typically associated with watches that can't be\nserviced.\nStatus code 410 (gone)"},{"name":"StatusReasonServiceUnavailable","docString":"StatusReasonServiceUnavailable means that the request itself was valid,\nbut the requested service is unavailable at this time.\nRetrying the request after some time might succeed.\nStatus code 503"}],"docString":"StatusReason is an enumeration of possible failure causes.  Each StatusReason\nmust map to a single HTTP status code, but multiple reasons may map\nto the same HTTP status code.\nTODO: move to apiserver","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.Table":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"Table","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"ColumnDefinitions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TableColumnDefinition","typeDecorators":["List"],"docString":"columnDefinitions describes each column in the returned items array. The number of cells per row\nwill always match the number of column definitions.\n+listType=atomic"},{"fieldName":"Rows","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TableRow","typeDecorators":["List"],"docString":"rows is the list of items in the table.\n+listType=atomic"}],"enumValues":[],"docString":"Table is a tabular representation of a set of API resources. The server transforms the\nobject into a set of preferred columns for quickly reviewing the objects.\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object\n+protobuf=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.TableColumnDefinition":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"TableColumnDefinition","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"name is a human readable name for the column."},{"fieldName":"Type","typeName":"string","typeDecorators":null,"docString":"type is an OpenAPI type definition for this column, such as number, integer, string, or\narray.\nSee https://github.com/OAI/OpenAPI-Specification/blob/master/versions/2.0.md#data-types for more."},{"fieldName":"Format","typeName":"string","typeDecorators":null,"docString":"format is an optional OpenAPI type modifier for this column. A format modifies the type and\nimposes additional rules, like date or time formatting for a string. The 'name' format is applied\nto the primary identifier column which has type 'string' to assist in clients identifying column\nis the resource name.\nSee https://github.com/OAI/OpenAPI-Specification/blob/master/versions/2.0.md#data-types for more."},{"fieldName":"Description","typeName":"string","typeDecorators":null,"docString":"description is a human readable description of this column."},{"fieldName":"Priority","typeName":"int32","typeDecorators":null,"docString":"priority is an integer defining the relative importance of this column compared to others. Lower\nnumbers are considered higher priority. Columns that may be omitted in limited space scenarios\nshould be given a higher priority."}],"enumValues":[],"docString":"TableColumnDefinition contains information about a column returned in the Table.\n+protobuf=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.TableOptions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"TableOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"NoHeaders","typeName":"bool","typeDecorators":null,"docString":"NoHeaders is only exposed for internal callers. It is not included in our OpenAPI definitions\nand may be removed as a field in a future release."},{"fieldName":"IncludeObject","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.IncludeObjectPolicy","typeDecorators":null,"docString":"includeObject decides whether to include each object along with its columnar information.\nSpecifying \"None\" will return no object, specifying \"Object\" will return the full object contents, and\nspecifying \"Metadata\" (the default) will return the object's metadata in the PartialObjectMetadata kind\nin version v1beta1 of the meta.k8s.io API group."}],"enumValues":[],"docString":"TableOptions are used when a Table is requested by the caller.\n+k8s:conversion-gen:explicit-from=net/url.Values\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.TableRow":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"TableRow","fields":[{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TableRowCondition","typeDecorators":["List"],"docString":"conditions describe additional status of a row that are relevant for a human user. These conditions\napply to the row, not to the object, and will be specific to table output. The only defined\ncondition type is 'Completed', for a row that indicates a resource that has run to completion and\ncan be given less visual priority.\n+optional\n+listType=atomic"},{"fieldName":"Object","typeName":"k8s.io/apimachinery/pkg/runtime.RawExtension","typeDecorators":null,"docString":"This field contains the requested additional information about each object based on the includeObject\npolicy when requesting the Table. If \"None\", this field is empty, if \"Object\" this will be the\ndefault serialization of the object for the current API version, and if \"Metadata\" (the default) will\ncontain the object metadata. Check the returned kind and apiVersion of the object before parsing.\nThe media type of the object will always match the enclosing list - if this as a JSON table, these\nwill be JSON encoded objects.\n+optional"}],"enumValues":[],"docString":"TableRow is an individual row in a table.\n+protobuf=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.TableRowCondition":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"TableRowCondition","fields":[{"fieldName":"Type","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.RowConditionType","typeDecorators":null,"docString":"Type of row condition. The only defined value is 'Completed' indicating that the\nobject this row represents has reached a completed state and may be given less visual\npriority than other rows. Clients are not required to honor any conditions but should\nbe consistent where possible about handling the conditions."},{"fieldName":"Status","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ConditionStatus","typeDecorators":null,"docString":"Status of the condition, one of True, False, Unknown."},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"(brief) machine readable reason for the condition's last transition.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"Human readable message indicating details about last transition.\n+optional"}],"enumValues":[],"docString":"TableRowCondition allows a row to be marked with additional information.\n+protobuf=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.Time":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"Time","fields":[{"fieldName":"Time","typeName":"time.Time","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"Time is a wrapper around time.Time which supports correct\nmarshaling to YAML and JSON.  Wrappers are provided for many\nof the factory methods that the time package offers.\n\n+protobuf.options.marshal=false\n+protobuf.as=Timestamp\n+protobuf.options.(gogoproto.goproto_stringer)=false","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.TimeHolder":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"TimeHolder","fields":[{"fieldName":"T","typeName":"Time","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.Timestamp":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"Timestamp","fields":[{"fieldName":"Seconds","typeName":"int64","typeDecorators":null,"docString":"Represents seconds of UTC time since Unix epoch\n1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to\n9999-12-31T23:59:59Z inclusive."},{"fieldName":"Nanos","typeName":"int32
