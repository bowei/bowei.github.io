k8s.io/gateway-api/apis/v1alpha3","typeName":"BackendTLSPolicy","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha3.BackendTLSPolicySpec","typeDecorators":null,"docString":"Spec defines the desired state of BackendTLSPolicy."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.PolicyStatus","typeDecorators":null,"docString":"Status defines the current state of BackendTLSPolicy."}],"enumValues":[],"docString":"BackendTLSPolicy provides a way to configure how a Gateway\nconnects to a Backend via TLS.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1alpha3.BackendTLSPolicyList":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"BackendTLSPolicyList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha3.BackendTLSPolicy","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"BackendTLSPolicyList contains a list of BackendTLSPolicies\n+kubebuilder:object:root=true","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha3.BackendTLSPolicySpec":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"BackendTLSPolicySpec","fields":[{"fieldName":"TargetRefs","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.LocalPolicyTargetReferenceWithSectionName","typeDecorators":["List"],"docString":"TargetRefs identifies an API object to apply the policy to.\nOnly Services have Extended support. Implementations MAY support\nadditional objects, with Implementation Specific support.\nNote that this config applies to the entire referenced resource\nby default, but this default may change in the future to provide\na more granular application of the policy.\n\nTargetRefs must be _distinct_. This means either that:\n\n* They select different targets. If this is the case, then targetRef\n  entries are distinct. In terms of fields, this means that the\n  multi-part key defined by `group`, `kind`, and `name` must\n  be unique across all targetRef entries in the BackendTLSPolicy.\n* They select different sectionNames in the same target.\n\nSupport: Extended for Kubernetes Service\n\nSupport: Implementation-specific for any other resource\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16\n+kubebuilder:validation:XValidation:message=\"sectionName must be specified when targetRefs includes 2 or more references to the same target\",rule=\"self.all(p1, self.all(p2, p1.group == p2.group \u0026\u0026 p1.kind == p2.kind \u0026\u0026 p1.name == p2.name ? ((!has(p1.sectionName) || p1.sectionName == '') == (!has(p2.sectionName) || p2.sectionName == '')) : true))\"\n+kubebuilder:validation:XValidation:message=\"sectionName must be unique when targetRefs includes 2 or more references to the same target\",rule=\"self.all(p1, self.exists_one(p2, p1.group == p2.group \u0026\u0026 p1.kind == p2.kind \u0026\u0026 p1.name == p2.name \u0026\u0026 (((!has(p1.sectionName) || p1.sectionName == '') \u0026\u0026 (!has(p2.sectionName) || p2.sectionName == '')) || (has(p1.sectionName) \u0026\u0026 has(p2.sectionName) \u0026\u0026 p1.sectionName == p2.sectionName))))\""},{"fieldName":"Validation","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha3.BackendTLSPolicyValidation","typeDecorators":null,"docString":"Validation contains backend TLS validation configuration."},{"fieldName":"Options","typeName":"sigs.k8s.io/gateway-api/apis/v1.AnnotationValue","typeDecorators":["Map[sigs.k8s.io/gateway-api/apis/v1.AnnotationKey]"],"docString":"Options are a list of key/value pairs to enable extended TLS\nconfiguration for each implementation. For example, configuring the\nminimum TLS version or supported cipher suites.\n\nA set of common keys MAY be defined by the API in the future. To avoid\nany ambiguity, implementation-specific definitions MUST use\ndomain-prefixed names, such as `example.com/my-custom-option`.\nUn-prefixed names are reserved for key names defined by Gateway API.\n\nSupport: Implementation-specific\n\n+optional\n+kubebuilder:validation:MaxProperties=16"}],"enumValues":[],"docString":"BackendTLSPolicySpec defines the desired state of BackendTLSPolicy.\n\nSupport: Extended","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha3.BackendTLSPolicyValidation":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"BackendTLSPolicyValidation","fields":[{"fieldName":"CACertificateRefs","typeName":"sigs.k8s.io/gateway-api/apis/v1.LocalObjectReference","typeDecorators":["List"],"docString":"CACertificateRefs contains one or more references to Kubernetes objects that\ncontain a PEM-encoded TLS CA certificate bundle, which is used to\nvalidate a TLS handshake between the Gateway and backend Pod.\n\nIf CACertificateRefs is empty or unspecified, then WellKnownCACertificates must be\nspecified. Only one of CACertificateRefs or WellKnownCACertificates may be specified,\nnot both. If CACertificateRefs is empty or unspecified, the configuration for\nWellKnownCACertificates MUST be honored instead if supported by the implementation.\n\nReferences to a resource in a different namespace are invalid for the\nmoment, although we will revisit this in the future.\n\nA single CACertificateRef to a Kubernetes ConfigMap kind has \"Core\" support.\nImplementations MAY choose to support attaching multiple certificates to\na backend, but this behavior is implementation-specific.\n\nSupport: Core - An optional single reference to a Kubernetes ConfigMap,\nwith the CA certificate in a key named `ca.crt`.\n\nSupport: Implementation-specific (More than one reference, or other kinds\nof resources).\n\n+kubebuilder:validation:MaxItems=8\n+optional"},{"fieldName":"WellKnownCACertificates","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha3.WellKnownCACertificatesType","typeDecorators":["Ptr"],"docString":"WellKnownCACertificates specifies whether system CA certificates may be used in\nthe TLS handshake between the gateway and backend pod.\n\nIf WellKnownCACertificates is unspecified or empty (\"\"), then CACertificateRefs\nmust be specified with at least one entry for a valid configuration. Only one of\nCACertificateRefs or WellKnownCACertificates may be specified, not both. If an\nimplementation does not support the WellKnownCACertificates field or the value\nsupplied is not supported, the Status Conditions on the Policy MUST be\nupdated to include an Accepted: False Condition with Reason: Invalid.\n\nSupport: Implementation-specific\n\n+optional"},{"fieldName":"Hostname","typeName":"sigs.k8s.io/gateway-api/apis/v1.PreciseHostname","typeDecorators":null,"docString":"Hostname is used for two purposes in the connection between Gateways and\nbackends:\n\n1. Hostname MUST be used as the SNI to connect to the backend (RFC 6066).\n2. Hostname MUST be used for authentication and MUST match the certificate served by the matching backend, unless SubjectAltNames is specified.\n\nSupport: Core"},{"fieldName":"SubjectAltNames","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha3.SubjectAltName","typeDecorators":["List"],"docString":"SubjectAltNames contains one or more Subject Alternative Names.\nWhen specified the certificate served from the backend MUST\nhave at least one Subject Alternate Name matching one of the specified SubjectAltNames.\n\nSupport: Extended\n\n+optional\n+kubebuilder:validation:MaxItems=5"}],"enumValues":[],"docString":"BackendTLSPolicyValidation contains backend TLS validation configuration.\n+kubebuilder:validation:XValidation:message=\"must not contain both CACertificateRefs and WellKnownCACertificates\",rule=\"!(has(self.caCertificateRefs) \u0026\u0026 size(self.caCertificateRefs) \u003e 0 \u0026\u0026 has(self.wellKnownCACertificates) \u0026\u0026 self.wellKnownCACertificates != \\\"\\\")\"\n+kubebuilder:validation:XValidation:message=\"must specify either CACertificateRefs or WellKnownCACertificates\",rule=\"(has(self.caCertificateRefs) \u0026\u0026 size(self.caCertificateRefs) \u003e 0 || has(self.wellKnownCACertificates) \u0026\u0026 self.wellKnownCACertificates != \\\"\\\")\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha3.SubjectAltName":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"SubjectAltName","fields":[{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha3.SubjectAltNameType","typeDecorators":null,"docString":"Type determines the format of the Subject Alternative Name. Always required.\n\nSupport: Core"},{"fieldName":"Hostname","typeName":"sigs.k8s.io/gateway-api/apis/v1.Hostname","typeDecorators":null,"docString":"Hostname contains Subject Alternative Name specified in DNS name format.\nRequired when Type is set to Hostname, ignored otherwise.\n\nSupport: Core\n\n+optional"},{"fieldName":"URI","typeName":"sigs.k8s.io/gateway-api/apis/v1.AbsoluteURI","typeDecorators":null,"docString":"URI contains Subject Alternative Name specified in a full URI format.\nIt MUST include both a scheme (e.g., \"http\" or \"ftp\") and a scheme-specific-part.\nCommon values include SPIFFE IDs like \"spiffe://mycluster.example.com/ns/myns/sa/svc1sa\".\nRequired when Type is set to URI, ignored otherwise.\n\nSupport: Core\n\n+optional"}],"enumValues":[],"docString":"SubjectAltName represents Subject Alternative Name.\n+kubebuilder:validation:XValidation:message=\"SubjectAltName element must contain Hostname, if Type is set to Hostname\",rule=\"!(self.type == \\\"Hostname\\\" \u0026\u0026 (!has(self.hostname) || self.hostname == \\\"\\\"))\"\n+kubebuilder:validation:XValidation:message=\"SubjectAltName element must not contain Hostname, if Type is not set to Hostname\",rule=\"!(self.type != \\\"Hostname\\\" \u0026\u0026 has(self.hostname) \u0026\u0026 self.hostname != \\\"\\\")\"\n+kubebuilder:validation:XValidation:message=\"SubjectAltName element must contain URI, if Type is set to URI\",rule=\"!(self.type == \\\"URI\\\" \u0026\u0026 (!has(self.uri) || self.uri == \\\"\\\"))\"\n+kubebuilder:validation:XValidation:message=\"SubjectAltName element must not contain URI, if Type is not set to URI\",rule=\"!(self.type != \\\"URI\\\" \u0026\u0026 has(self.uri) \u0026\u0026 self.uri != \\\"\\\")\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha3.SubjectAltNameType":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"SubjectAltNameType","fields":[],"enumValues":[{"name":"HostnameSubjectAltNameType","docString":"HostnameSubjectAltNameType specifies hostname-based SAN.\n\nSupport: Core"},{"name":"URISubjectAltNameType","docString":"URISubjectAltNameType specifies URI-based SAN, e.g. SPIFFE id.\n\nSupport: Core"}],"docString":"SubjectAltNameType is the type of the Subject Alternative Name.\n+kubebuilder:validation:Enum=Hostname;URI","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha3.TLSRoute":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"TLSRoute","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha3.TLSRouteSpec","typeDecorators":null,"docString":"Spec defines the desired state of TLSRoute."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteStatus","typeDecorators":null,"docString":"Status defines the current state of TLSRoute."}],"enumValues":[],"docString":"The TLSRoute resource is similar to TCPRoute, but can be configured\nto match against TLS-specific metadata. This allows more flexibility\nin matching streams for a given TLS listener.\n\nIf you need to forward traffic to a single target for a TLS listener, you\ncould choose to use a TCPRoute with a TLS listener.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1alpha3.TLSRouteList":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"TLSRouteList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha3.TLSRoute","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"TLSRouteList contains a list of TLSRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha3.TLSRouteSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"TLSRouteSpec","fields":[{"fieldName":"CommonRouteSpec","typeName":"CommonRouteSpec","typeDecorators":null,"docString":""},{"fieldName":"Hostnames","typeName":"Hostname","typeDecorators":["List"],"docString":"Hostnames defines a set of SNI hostnames that should match against the\nSNI attribute of TLS ClientHello message in TLS handshake. This matches\nthe RFC 1123 definition of a hostname with 2 notable exceptions:\n\n1. IPs are not allowed in SNI hostnames per RFC 6066.\n2. A hostname may be prefixed with a wildcard label (`*.`). The wildcard\n   label must appear by itself as the first label.\n\nIf a hostname is specified by both the Listener and TLSRoute, there\nmust be at least one intersecting hostname for the TLSRoute to be\nattached to the Listener. For example:\n\n* A Listener with `test.example.com` as the hostname matches TLSRoutes\n  that have specified at least one of `test.example.com` or\n  `*.example.com`.\n* A Listener with `*.example.com` as the hostname matches TLSRoutes\n  that have specified at least one hostname that matches the Listener\n  hostname. For example, `test.example.com` and `*.example.com` would both\n  match. On the other hand, `example.com` and `test.example.net` would not\n  match.\n\nIf both the Listener and TLSRoute have specified hostnames, any\nTLSRoute hostnames that do not match the Listener hostname MUST be\nignored. For example, if a Listener specified `*.example.com`, and the\nTLSRoute specified `test.example.com` and `test.example.net`,\n`test.example.net` must not be considered for a match.\n\nIf both the Listener and TLSRoute have specified hostnames, and none\nmatch with the criteria above, then the TLSRoute is not accepted. The\nimplementation must raise an 'Accepted' Condition with a status of\n`False` in the corresponding RouteParentStatus.\n\nSupport: Core\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16\n+required"},{"fieldName":"Rules","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteRule","typeDecorators":["List"],"docString":"Rules are a list of TLS matchers and actions.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16\n\u003cgateway:experimental:validation:XValidation:message=\"Rule name must be unique within the route\",rule=\"self.all(l1, !has(l1.name) || self.exists_one(l2, has(l2.name) \u0026\u0026 l1.name == l2.name))\"\u003e"}],"enumValues":[],"docString":"TLSRouteSpec defines the desired state of a TLSRoute resource.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha3.WellKnownCACertificatesType":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha3","typeName":"WellKnownCACertificatesType","fields":[],"enumValues":[{"name":"WellKnownCACertificatesSystem","docString":"WellKnownCACertificatesSystem indicates that well known system CA certificates should be used."}],"docString":"WellKnownCACertificatesType is the type of CA certificate that will be used\nwhen the caCertificateRefs field is unspecified.\n+kubebuilder:validation:Enum=System","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1beta1.GatewayClassList":{"package":"sigs.k8s.io/gateway-api/apis/v1beta1","typeName":"GatewayClassList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1beta1.GatewayClass","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"GatewayClassList contains a list of GatewayClass","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1beta1.GatewayList":{"package":"sigs.k8s.io/gateway-api/apis/v1beta1","typeName":"GatewayList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1beta1.Gateway","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"GatewayList contains a list of Gateways.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1beta1.HTTPRouteList":{"package":"sigs.k8s.io/gateway-api/apis/v1beta1","typeName":"HTTPRouteList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1beta1.HTTPRoute","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"HTTPRouteList contains a list of HTTPRoute.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrant":{"package":"sigs.k8s.io/gateway-api/apis/v1beta1","typeName":"ReferenceGrant","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrantSpec","typeDecorators":null,"docString":"Spec defines the desired state of ReferenceGrant."}],"enumValues":[],"docString":"ReferenceGrant identifies kinds of resources in other namespaces that are\ntrusted to reference the specified kinds of resources in the same namespace\nas the policy.\n\nEach ReferenceGrant can be used to represent a unique trust relationship.\nAdditional Reference Grants can be used to add to the set of trusted\nsources of inbound references for the namespace they are defined within.\n\nAll cross-namespace references in Gateway API (with the exception of cross-namespace\nGateway-route attachment) require a ReferenceGrant.\n\nReferenceGrant is a form of runtime verification allowing users to assert\nwhich cross-namespace object references are permitted. Implementations that\nsupport ReferenceGrant MUST NOT permit cross-namespace references which have\nno grant, and MUST respond to the removal of a grant by revoking the access\nthat the grant allowed.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrantFrom":{"package":"sigs.k8s.io/gateway-api/apis/v1beta1","typeName":"ReferenceGrantFrom","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":null,"docString":"Group is the group of the referent.\nWhen empty, the Kubernetes core API group is inferred.\n\nSupport: Core"},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is the kind of the referent. Although implementations may support\nadditional resources, the following types are part of the \"Core\"\nsupport level for this field.\n\nWhen used to permit a SecretObjectReference:\n\n* Gateway\n\nWhen used to permit a BackendObjectReference:\n\n* GRPCRoute\n* HTTPRoute\n* TCPRoute\n* TLSRoute\n* UDPRoute"},{"fieldName":"Namespace","typeName":"Namespace","typeDecorators":null,"docString":"Namespace is the namespace of the referent.\n\nSupport: Core"}],"enumValues":[],"docString":"ReferenceGrantFrom describes trusted namespaces and kinds.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrantList":{"package":"sigs.k8s.io/gateway-api/apis/v1beta1","typeName":"ReferenceGrantList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrant","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"+kubebuilder:object:root=true\nReferenceGrantList contains a list of ReferenceGrant.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrantSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1beta1","typeName":"ReferenceGrantSpec","fields":[{"fieldName":"From","typeName":"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrantFrom","typeDecorators":["List"],"docString":"From describes the trusted namespaces and kinds that can reference the\nresources described in \"To\". Each entry in this list MUST be considered\nto be an additional place that references can be valid from, or to put\nthis another way, entries MUST be combined using OR.\n\nSupport: Core\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"To","typeName":"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrantTo","typeDecorators":["List"],"docString":"To describes the resources that may be referenced by the resources\ndescribed in \"From\". Each entry in this list MUST be considered to be an\nadditional place that references can be valid to, or to put this another\nway, entries MUST be combined using OR.\n\nSupport: Core\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16"}],"enumValues":[],"docString":"ReferenceGrantSpec identifies a cross namespace relationship that is trusted\nfor Gateway API.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1beta1.ReferenceGrantTo":{"package":"sigs.k8s.io/gateway-api/apis/v1beta1","typeName":"ReferenceGrantTo","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":null,"docString":"Group is the group of the referent.\nWhen empty, the Kubernetes core API group is inferred.\n\nSupport: Core"},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is the kind of the referent. Although implementations may support\nadditional resources, the following types are part of the \"Core\"\nsupport level for this field:\n\n* Secret when used to permit a SecretObjectReference\n* Service when used to permit a BackendObjectReference"},{"fieldName":"Name","typeName":"ObjectName","typeDecorators":["Ptr"],"docString":"Name is the name of the referent. When unspecified, this policy\nrefers to all resources of the specified Group and Kind in the local\nnamespace.\n\n+optional"}],"enumValues":[],"docString":"ReferenceGrantTo describes what Kinds are allowed as targets of the\nreferences.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.BackendTrafficPolicySpec":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"BackendTrafficPolicySpec","fields":[{"fieldName":"TargetRefs","typeName":"LocalPolicyTargetReference","typeDecorators":["List"],"docString":"TargetRefs identifies API object(s) to apply this policy to.\nCurrently, Backends (A grouping of like endpoints such as Service,\nServiceImport, or any implementation-specific backendRef) are the only\nvalid API target references.\n\nCurrently, a TargetRef can not be scoped to a specific port on a\nService.\n\n+listType=map\n+listMapKey=group\n+listMapKey=kind\n+listMapKey=name\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"RetryConstraint","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.RetryConstraint","typeDecorators":["Ptr"],"docString":"RetryConstraint defines the configuration for when to allow or prevent\nfurther retries to a target backend, by dynamically calculating a 'retry\nbudget'. This budget is calculated based on the percentage of incoming\ntraffic composed of retries over a given time interval. Once the budget\nis exceeded, additional retries will be rejected.\n\nFor example, if the retry budget interval is 10 seconds, there have been\n1000 active requests in the past 10 seconds, and the allowed percentage\nof requests that can be retried is 20% (the default), then 200 of those\nrequests may be composed of retries. Active requests will only be\nconsidered for the duration of the interval when calculating the retry\nbudget. Retrying the same original request multiple times within the\nretry budget interval will lead to each retry being counted towards\ncalculating the budget.\n\nConfiguring a RetryConstraint in BackendTrafficPolicy is compatible with\nHTTPRoute Retry settings for each HTTPRouteRule that targets the same\nbackend. While the HTTPRouteRule Retry stanza can specify whether a\nrequest will be retried, and the number of retry attempts each client\nmay perform, RetryConstraint helps prevent cascading failures such as\nretry storms during periods of consistent failures.\n\nAfter the retry budget has been exceeded, additional retries to the\nbackend MUST return a 503 response to the client.\n\nAdditional configurations for defining a constraint on retries MAY be\ndefined in the future.\n\nSupport: Extended\n\n+optional\n\u003cgateway:experimental\u003e"},{"fieldName":"SessionPersistence","typeName":"SessionPersistence","typeDecorators":["Ptr"],"docString":"SessionPersistence defines and configures session persistence\nfor the backend.\n\nSupport: Extended\n\n+optional"}],"enumValues":[],"docString":"BackendTrafficPolicySpec define the desired state of BackendTrafficPolicy\nNote: there is no Override or Default policy configuration.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.BudgetDetails":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"BudgetDetails","fields":[{"fieldName":"Percent","typeName":"int","typeDecorators":["Ptr"],"docString":"Percent defines the maximum percentage of active requests that may\nbe made up of retries.\n\nSupport: Extended\n\n+optional\n+kubebuilder:default=20\n+kubebuilder:validation:Minimum=0\n+kubebuilder:validation:Maximum=100"},{"fieldName":"Interval","typeName":"Duration","typeDecorators":["Ptr"],"docString":"Interval defines the duration in which requests will be considered\nfor calculating the budget for retries.\n\nSupport: Extended\n\n+optional\n+kubebuilder:default=\"10s\"\n+kubebuilder:validation:XValidation:message=\"interval can not be greater than one hour or less than one second\",rule=\"!(duration(self) \u003c duration('1s') || duration(self) \u003e duration('1h'))\""}],"enumValues":[],"docString":"BudgetDetails specifies the details of the budget configuration, like\nthe percentage of requests in the budget, and the interval between\nchecks.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerEntry":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"ListenerEntry","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":null,"docString":"Name is the name of the Listener. This name MUST be unique within a\nListenerSet.\n\nName is not required to be unique across a Gateway and ListenerSets.\nRoutes can attach to a Listener by having a ListenerSet as a parentRef\nand setting the SectionName"},{"fieldName":"Hostname","typeName":"Hostname","typeDecorators":["Ptr"],"docString":"Hostname specifies the virtual hostname to match for protocol types that\ndefine this concept. When unspecified, all hostnames are matched. This\nfield is ignored for protocols that don't require hostname based\nmatching.\n\nImplementations MUST apply Hostname matching appropriately for each of\nthe following protocols:\n\n* TLS: The Listener Hostname MUST match the SNI.\n* HTTP: The Listener Hostname MUST match the Host header of the request.\n* HTTPS: The Listener Hostname SHOULD match at both the TLS and HTTP\n  protocol layers as described above. If an implementation does not\n  ensure that both the SNI and Host header match the Listener hostname,\n  it MUST clearly document that.\n\nFor HTTPRoute and TLSRoute resources, there is an interaction with the\n`spec.hostnames` array. When both listener and route specify hostnames,\nthere MUST be an intersection between the values for a Route to be\naccepted. For more information, refer to the Route specific Hostnames\ndocumentation.\n\nHostnames that are prefixed with a wildcard label (`*.`) are interpreted\nas a suffix match. That means that a match for `*.example.com` would match\nboth `test.example.com`, and `foo.test.example.com`, but not `example.com`.\n\n+optional"},{"fieldName":"Port","typeName":"PortNumber","typeDecorators":null,"docString":"Port is the network port. Multiple listeners may use the\nsame port, subject to the Listener compatibility rules."},{"fieldName":"Protocol","typeName":"ProtocolType","typeDecorators":null,"docString":"Protocol specifies the network protocol this listener expects to receive."},{"fieldName":"TLS","typeName":"GatewayTLSConfig","typeDecorators":["Ptr"],"docString":"TLS is the TLS configuration for the Listener. This field is required if\nthe Protocol field is \"HTTPS\" or \"TLS\". It is invalid to set this field\nif the Protocol field is \"HTTP\", \"TCP\", or \"UDP\".\n\nThe association of SNIs to Certificate defined in GatewayTLSConfig is\ndefined based on the Hostname field for this listener.\n\nThe GatewayClass MUST use the longest matching SNI out of all\navailable certificates for any TLS handshake.\n\n+optional"},{"fieldName":"AllowedRoutes","typeName":"AllowedRoutes","typeDecorators":["Ptr"],"docString":"AllowedRoutes defines the types of routes that MAY be attached to a\nListener and the trusted namespaces where those Route resources MAY be\npresent.\n\nAlthough a client request may match multiple route rules, only one rule\nmay ultimately receive the request. Matching precedence MUST be\ndetermined in order of the following criteria:\n\n* The most specific match as defined by the Route type.\n* The oldest Route based on creation timestamp. For example, a Route with\n  a creation timestamp of \"2020-09-08 01:02:03\" is given precedence over\n  a Route with a creation timestamp of \"2020-09-08 01:02:04\".\n* If everything else is equivalent, the Route appearing first in\n  alphabetical order (namespace/name) should be given precedence. For\n  example, foo/bar is given precedence over foo/baz.\n\nAll valid rules within a Route attached to this Listener should be\nimplemented. Invalid Route rules can be ignored (sometimes that will mean\nthe full Route). If a Route rule transitions from valid to invalid,\nsupport for that Route rule should be dropped to ensure consistency. For\nexample, even if a filter specified by a Route rule is invalid, the rest\nof the rules within that Route should still be supported.\n\n+kubebuilder:default={namespaces:{from: Same}}\n+optional"}],"enumValues":[],"docString":"","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerEntryConditionReason":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"ListenerEntryConditionReason","fields":[],"enumValues":[{"name":"ListenerEntryReasonPortUnavailable","docString":"This reason is used with the \"Accepted\" condition when the Listener\nrequests a port that cannot be used on the Gateway. This reason could be\nused in a number of instances, including:\n\n* The port is already in use.\n* The port is not supported by the implementation.\n* The implementation is unable to assign the port to the Listener."},{"name":"ListenerEntryReasonPending","docString":"This reason is used with the \"Accepted\" and \"Programmed\"\nconditions when the Listener is either not yet reconciled or not yet not\nonline and ready to accept client traffic."},{"name":"ListenerEntryReasonInvalid","docString":"This reason is used with the \"Accepted\" and \"Programmed\" conditions when the\nListener is syntactically or semantically invalid."}],"docString":"ListenerEntryConditionReason defines the set of reasons that explain\nwhy a particular ListenerEntry condition type has been raised.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerEntryStatus":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"ListenerEntryStatus","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":null,"docString":"Name is the name of the Listener that this status corresponds to."},{"fieldName":"Port","typeName":"PortNumber","typeDecorators":null,"docString":"Port is the network port the listener is configured to listen on."},{"fieldName":"SupportedKinds","typeName":"RouteGroupKind","typeDecorators":["List"],"docString":"SupportedKinds is the list indicating the Kinds supported by this\nlistener. This MUST represent the kinds an implementation supports for\nthat Listener configuration.\n\nIf kinds are specified in Spec that are not supported, they MUST NOT\nappear in this list and an implementation MUST set the \"ResolvedRefs\"\ncondition to \"False\" with the \"InvalidRouteKinds\" reason. If both valid\nand invalid Route kinds are specified, the implementation MUST\nreference the valid Route kinds that have been specified.\n\n+kubebuilder:validation:MaxItems=8"},{"fieldName":"AttachedRoutes","typeName":"int32","typeDecorators":null,"docString":"AttachedRoutes represents the total number of Routes that have been\nsuccessfully attached to this Listener.\n\nSuccessful attachment of a Route to a Listener is based solely on the\ncombination of the AllowedRoutes field on the corresponding Listener\nand the Route's ParentRefs field. A Route is successfully attached to\na Listener when it is selected by the Listener's AllowedRoutes field\nAND the Route has a valid ParentRef selecting the whole Gateway\nresource or a specific Listener as a parent resource (more detail on\nattachment semantics can be found in the documentation on the various\nRoute kinds ParentRefs fields). Listener or Route status does not impact\nsuccessful attachment, i.e. the AttachedRoutes field count MUST be set\nfor Listeners with condition Accepted: false and MUST count successfully\nattached Routes that may themselves have Accepted: false conditions.\n\nUses for this field include troubleshooting Route attachment and\nmeasuring blast radius/impact of changes to a Listener."},{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"Conditions describe the current condition of this listener.\n\n+listType=map\n+listMapKey=type\n+kubebuilder:validation:MaxItems=8"}],"enumValues":[],"docString":"ListenerStatus is the status associated with a Listener.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerSetConditionReason":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"ListenerSetConditionReason","fields":[],"enumValues":[{"name":"ListenerSetReasonInvalid","docString":"This reason is used with the \"Programmed\" and \"Accepted\" conditions when\nthe ListenerSet is syntactically or semantically invalid. For example, this\ncould include unspecified TLS configuration, or some unrecognized or\ninvalid values in the TLS configuration."},{"name":"ListenerSetReasonPending","docString":"This reason is used with the \"Accepted\" and \"Programmed\"\nconditions when the status is \"Unknown\" and no controller has reconciled\nthe Gateway."}],"docString":"ListenerSetConditionReason defines the set of reasons that explain why a\nparticular ListenerSet condition type has been raised.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerSetSpec":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"ListenerSetSpec","fields":[{"fieldName":"ParentRef","typeName":"ParentGatewayReference","typeDecorators":null,"docString":"ParentRef references the Gateway that the listeners are attached to."},{"fieldName":"Listeners","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerEntry","typeDecorators":["List"],"docString":"Listeners associated with this ListenerSet. Listeners define\nlogical endpoints that are bound on this referenced parent Gateway's addresses.\n\nListeners in a `Gateway` and their attached `ListenerSets` are concatenated\nas a list when programming the underlying infrastructure. Each listener\nname does not need to be unique across the Gateway and ListenerSets.\nSee ListenerEntry.Name for more details.\n\nImplementations MUST treat the parent Gateway as having the merged\nlist of all listeners from itself and attached ListenerSets using\nthe following precedence:\n\n1. \"parent\" Gateway\n2. ListenerSet ordered by creation time (oldest first)\n3. ListenerSet ordered alphabetically by \"{namespace}/{name}\".\n\nAn implementation MAY reject listeners by setting the ListenerEntryStatus\n`Accepted` condition to False with the Reason `TooManyListeners`\n\nIf a listener has a conflict, this will be reported in the\nStatus.ListenerEntryStatus setting the `Conflicted` condition to True.\n\nImplementations SHOULD be cautious about what information from the\nparent or siblings are reported to avoid accidentally leaking\nsensitive information that the child would not otherwise have access\nto. This can include contents of secrets etc.\n\n+listType=map\n+listMapKey=name\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=64\n+kubebuilder:validation:XValidation:message=\"tls must not be specified for protocols ['HTTP', 'TCP', 'UDP']\",rule=\"self.all(l, l.protocol in ['HTTP', 'TCP', 'UDP'] ? !has(l.tls) : true)\"\n+kubebuilder:validation:XValidation:message=\"tls mode must be Terminate for protocol HTTPS\",rule=\"self.all(l, (l.protocol == 'HTTPS' \u0026\u0026 has(l.tls)) ? (l.tls.mode == '' || l.tls.mode == 'Terminate') : true)\"\n+kubebuilder:validation:XValidation:message=\"hostname must not be specified for protocols ['TCP', 'UDP']\",rule=\"self.all(l, l.protocol in ['TCP', 'UDP']  ? (!has(l.hostname) || l.hostname == '') : true)\"\n+kubebuilder:validation:XValidation:message=\"Listener name must be unique within the Gateway\",rule=\"self.all(l1, self.exists_one(l2, l1.name == l2.name))\"\n+kubebuilder:validation:XValidation:message=\"Combination of port, protocol and hostname must be unique for each listener\",rule=\"self.all(l1, !has(l1.port) || self.exists_one(l2, has(l2.port) \u0026\u0026 l1.port == l2.port \u0026\u0026 l1.protocol == l2.protocol \u0026\u0026 (has(l1.hostname) \u0026\u0026 has(l2.hostname) ? l1.hostname == l2.hostname : !has(l1.hostname) \u0026\u0026 !has(l2.hostname))))\""}],"enumValues":[],"docString":"ListenerSetSpec defines the desired state of a ListenerSet.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerSetStatus":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"ListenerSetStatus","fields":[{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"Conditions describe the current conditions of the ListenerSet.\n\nImplementations MUST express ListenerSet conditions using the\n`ListenerSetConditionType` and `ListenerSetConditionReason`\nconstants so that operators and tools can converge on a common\nvocabulary to describe ListenerSet state.\n\nKnown condition types are:\n\n* \"Accepted\"\n* \"Programmed\"\n\n+optional\n+listType=map\n+listMapKey=type\n+kubebuilder:validation:MaxItems=8\n+kubebuilder:default={{type: \"Accepted\", status: \"Unknown\", reason:\"Pending\", message:\"Waiting for controller\", lastTransitionTime: \"1970-01-01T00:00:00Z\"},{type: \"Programmed\", status: \"Unknown\", reason:\"Pending\", message:\"Waiting for controller\", lastTransitionTime: \"1970-01-01T00:00:00Z\"}}"},{"fieldName":"Listeners","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerEntryStatus","typeDecorators":["List"],"docString":"Listeners provide status for each unique listener port defined in the Spec.\n\n+optional\n+listType=map\n+listMapKey=name\n+kubebuilder:validation:MaxItems=64"}],"enumValues":[],"docString":"","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.ParentGatewayReference":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"ParentGatewayReference","fields":[{"fieldName":"Group","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.Group","typeDecorators":["Ptr"],"docString":"Group is the group of the referent.\n\n+optional\n+kubebuilder:default=\"gateway.networking.k8s.io\""},{"fieldName":"Kind","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.Kind","typeDecorators":["Ptr"],"docString":"Kind is kind of the referent. For example \"Gateway\".\n\n+optional\n+kubebuilder:default=Gateway"},{"fieldName":"Name","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.ObjectName","typeDecorators":null,"docString":"Name is the name of the referent."},{"fieldName":"Namespace","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.Namespace","typeDecorators":["Ptr"],"docString":"Namespace is the namespace of the referent.  If not present,\nthe namespace of the referent is assumed to be the same as\nthe namespace of the referring object.\n\n+optional"}],"enumValues":[],"docString":"ParentGatewayReference identifies an API object including its namespace,\ndefaulting to Gateway.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.RequestRate":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"RequestRate","fields":[{"fieldName":"Count","typeName":"int","typeDecorators":["Ptr"],"docString":"Count specifies the number of requests per time interval.\n\nSupport: Extended\n+kubebuilder:validation:Minimum=1\n+kubebuilder:validation:Maximum=1000000"},{"fieldName":"Interval","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.Duration","typeDecorators":["Ptr"],"docString":"Interval specifies the divisor of the rate of requests, the amount of\ntime during which the given count of requests occur.\n\nSupport: Extended\n+kubebuilder:validation:XValidation:message=\"interval can not be greater than one hour\",rule=\"!(duration(self) == duration('0s') || duration(self) \u003e duration('1h'))\""}],"enumValues":[],"docString":"RequestRate expresses a rate of requests over a given period of time.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.RetryConstraint":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"RetryConstraint","fields":[{"fieldName":"Budget","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.BudgetDetails","typeDecorators":["Ptr"],"docString":"Budget holds the details of the retry budget configuration.\n\n+optional\n+kubebuilder:default={percent: 20, interval: \"10s\"}"},{"fieldName":"MinRetryRate","typeName":"RequestRate","typeDecorators":["Ptr"],"docString":"MinRetryRate defines the minimum rate of retries that will be allowable\nover a specified duration of time.\n\nThe effective overall minimum rate of retries targeting the backend\nservice may be much higher, as there can be any number of clients which\nare applying this setting locally.\n\nThis ensures that requests can still be retried during periods of low\ntraffic, where the budget for retries may be calculated as a very low\nvalue.\n\nSupport: Extended\n\n+optional\n+kubebuilder:default={count: 10, interval: \"1s\"}"}],"enumValues":[],"docString":"RetryConstraint defines the configuration for when to retry a request.","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.XBackendTrafficPolicy":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"XBackendTrafficPolicy","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.BackendTrafficPolicySpec","typeDecorators":null,"docString":"Spec defines the desired state of BackendTrafficPolicy."},{"fieldName":"Status","typeName":"PolicyStatus","typeDecorators":null,"docString":"Status defines the current state of BackendTrafficPolicy."}],"enumValues":[],"docString":"XBackendTrafficPolicy defines the configuration for how traffic to a\ntarget backend should be handled.","isRoot":true},"sigs.k8s.io/gateway-api/apisx/v1alpha1.XBackendTrafficPolicyList":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"XBackendTrafficPolicyList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.XBackendTrafficPolicy","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"XBackendTrafficPolicyList contains a list of BackendTrafficPolicies\n+kubebuilder:object:root=true","isRoot":false},"sigs.k8s.io/gateway-api/apisx/v1alpha1.XListenerSet":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"XListenerSet","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerSetSpec","typeDecorators":null,"docString":"Spec defines the desired state of ListenerSet."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.ListenerSetStatus","typeDecorators":null,"docString":"Status defines the current state of ListenerSet.\n\n+kubebuilder:default={conditions: {{type: \"Accepted\", status: \"Unknown\", reason:\"Pending\", message:\"Waiting for controller\", lastTransitionTime: \"1970-01-01T00:00:00Z\"},{type: \"Programmed\", status: \"Unknown\", reason:\"Pending\", message:\"Waiting for controller\", lastTransitionTime: \"1970-01-01T00:00:00Z\"}}}"}],"enumValues":[],"docString":"XListenerSet defines a set of additional listeners to attach to an existing Gateway.\nThis resource provides a mechanism to merge multiple listeners into a single Gateway.\n\nThe parent Gateway must explicitly allow ListenerSet attachment through its\nAllowedListeners configuration. By default, Gateways do not allow ListenerSet\nattachment.\n\nRoutes can attach to a ListenerSet by specifying it as a parentRef, and can\noptionally target specific listeners using the sectionName field.\n\nPolicy Attachment:\n- Policies that attach to a ListenerSet apply to all listeners defined in that resource\n- Policies do not impact listeners in the parent Gateway\n- Different ListenerSets attached to the same Gateway can have different policies\n- If an implementation cannot apply a policy to specific listeners, it should reject the policy\n\nReferenceGrant Semantics:\n- ReferenceGrants applied to a Gateway are not inherited by child ListenerSets\n- ReferenceGrants applied to a ListenerSet do not grant permission to the parent Gateway's listeners\n- A ListenerSet can reference secrets/backends in its own namespace without a ReferenceGrant\n\nGateway Integration:\n- The parent Gateway's status will include an \"AttachedListenerSets\" condition\n- This condition will be:\n  - True: when AllowedListeners is set and at least one child ListenerSet is attached\n  - False: when AllowedListeners is set but no valid listeners are attached, or when AllowedListeners is not set or false\n  - Unknown: when no AllowedListeners config is present","isRoot":true},"sigs.k8s.io/gateway-api/apisx/v1alpha1.XListenerSetList":{"package":"sigs.k8s.io/gateway-api/apisx/v1alpha1","typeName":"XListenerSetList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apisx/v1alpha1.XListenerSet","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"+kubebuilder:object:root=true","isRoot":false},"sigs.k8s.io/gateway-api/applyconfiguration/apis/v1.AllowedListenersApplyConfiguration":{"package":"sigs.k8s.io/gateway-api/applyconfiguration/apis/v1","typeName":"AllowedListenersApplyConfiguration","fields":[{"fieldName":"Namespaces","typeName":"ListenerNamespacesApplyConfiguration","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"AllowedListenersApplyConfiguration represents a declarative configuration of the AllowedListeners type for use\nwith apply.","isRoot":false},"sigs.k8s.io/gateway-api/applyconfiguration/apis/v1.AllowedRoutesApplyConfiguration":{"package":"sigs.k8s.io/gateway-api/applyconfiguration/apis/v1","typeName":"AllowedRoutesApplyConfiguration","fields":[{"fieldName":"Namespaces","typeName":"RouteNamespacesApplyConfiguration","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Kinds","typeName":"RouteGroupKindApplyConfiguration","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"AllowedRoutesApplyConfiguration represents a declarative configuration of the AllowedRoutes type for use\nwith apply.","isRoot":false},"sigs.k8s.io/gateway-api/applyconfiguration/apis/v1.BackendObjectReferenceApplyConfiguration":{"package":"sigs.k8s.io/gateway-api/applyconfiguration/apis/v1","typeName":"BackendObjectReferenceApplyConfiguration","fields":[{"fieldName":"Group","typeName":"sigs.k8s.io/gateway-api/apis/v1.Group","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Kind","typeName":"sigs.k8s.io/gateway-api/apis/v1.Kind","typeDecorators":["Ptr"],"docString":""}, ],"docString":"GatewayV1Client is used to interact with features provided by the gateway.networking.k8s.io group.","isRoot":false},"sigs.k8s.io/gateway-api/pkg/client/clientset/versioned/typed/apis/v1alpha2.GatewayV1alpha2Client":{"package":"sigs.k8s.io/gateway-api/pkg/client/clientset/versioned/typed/apis/v1alpha2","typeName":"GatewayV1alpha2Client","fields":[],"enumValues":[],"docString":"GatewayV1alpha2Client is used to interact with features provided by the gateway.networking.k8s.io group.","isRoot":false},"sigs.k8s.io/gateway-api/pkg/client/clientset/versioned/typed/apis/v1alpha3.GatewayV1alpha3Client":{"package":"sigs.k8s.io/gateway-api/pkg/client/clientset/versioned/typed/apis/v1alpha3","typeName":"GatewayV1alpha3Client","fields":[],"enumValues":[],"docString":"GatewayV1alpha3Client is used to interact with features provided by the gateway.networking.k8s.io group.","isRoot":false},"sigs.k8s.io/gateway-api/pkg/client/clientset/versioned/typed/apis/v1beta1.GatewayV1beta1Client":{"package":"sigs.k8s.io/gateway-api/pkg/client/clientset/versioned/typed/apis/v1beta1","typeName":"GatewayV1beta1Client","fields":[],"enumValues":[],"docString":"GatewayV1beta1Client is used to interact with features provided by the gateway.networking.k8s.io group.","isRoot":false},"sigs.k8s.io/gateway-api/pkg/client/clientset/versioned/typed/apisx/v1alpha1.ExperimentalV1alpha1Client":{"package":"sigs.k8s.io/gateway-api/pkg/client/clientset/versioned/typed/apisx/v1alpha1","typeName":"ExperimentalV1alpha1Client","fields":[],"enumValues":[],"docString":"ExperimentalV1alpha1Client is used to interact with features provided by the gateway.networking.x-k8s.io group.","isRoot":false}};
  const startTypes = 'sigs.k8s.io\/network-policy-api\/apis\/v1alpha2.ClusterNetworkPolicy'.split(',').filter(s => s.trim() !== '');

  const mainContainer = document.getElementById('main-container');
  const typeSwitcherOverlay = document.getElementById('type-switcher-overlay');
  const typeSwitcherDialog = document.getElementById('type-switcher-dialog');
  const typeSwitcherInput = document.getElementById('type-switcher-input');
  const typeSwitcherList = document.getElementById('type-switcher-list');

  function splitTypeName(fullTypeName) {
      const lastDot = fullTypeName.lastIndexOf('.');
      if (lastDot === -1) {
          return { pkg: '', type: fullTypeName };
      }
      const pkg = fullTypeName.substring(0, lastDot);
      const type = fullTypeName.substring(lastDot + 1);
      return { pkg, type };
  }

  function formatDecorators(decorators) {
      if (!decorators || decorators.length === 0) {
          return '';
      }
      let prefix = '';
      decorators.forEach(dec => {
          if (dec === 'Ptr') {
              prefix += '*';
          } else if (dec === 'List') {
              prefix += '[]';
          } else if (dec.startsWith('Map[')) {
              const keyType = dec.substring(4, dec.length - 1);
              prefix += 'map[' + keyType + ']';
          }
      });
      return prefix;
  }

  function createDocString(docStringText) {
      const container = document.createElement('div');
      container.className = 'doc-string';

      if (!docStringText) {
          return container;
      }

      const sentences = docStringText.split('.');
      const firstSentence = sentences[0] + (sentences.length > 1 && sentences.slice(1).join('.').trim() !== '' ? '.' : '');
      const hasMore = docStringText.trim() !== firstSentence.trim();

      if (hasMore) {
          const textSpan = document.createElement('span');
          textSpan.textContent = firstSentence;
          
          const toggle = document.createElement('span');
          toggle.textContent = ' ...';
          toggle.style.cursor = 'pointer';

          toggle.addEventListener('click', (e) => {
              e.stopPropagation();
              const isExpanded = textSpan.textContent === docStringText;
              if (isExpanded) {
                  textSpan.textContent = firstSentence;
                  toggle.textContent = ' ...';
              } else {
                  textSpan.textContent = docStringText;
                  toggle.textContent = ' (close)';
              }
          });

          container.appendChild(textSpan);
          container.appendChild(toggle);
      } else {
          container.textContent = docStringText;
      }
      return container;
  }

  function createColumn(typeName) {
      const typeInfo = typeData[typeName];
      if (!typeInfo) return;

      const column = document.createElement('div');
      column.className = 'column';

      const header = document.createElement('div');
      header.className = 'column-header';

      const headerType = document.createElement('div');
      headerType.innerHTML = typeInfo.typeName;
      headerType.className = 'header-row';

      const headerPkg = document.createElement('div');
      headerPkg.innerHTML = typeInfo.package;
      headerPkg.className = 'type-name';

      header.appendChild(headerType);
      header.appendChild(headerPkg);

      column.appendChild(header);

      const ul = document.createElement('ul');
      
      if (typeInfo.fields) {
          typeInfo.fields.forEach(field => {
              const li = document.createElement('li');
              li.dataset.fieldName = field.fieldName;
              li.dataset.typeName = field.typeName;
              li.dataset.parentType = typeName;

              const { pkg, type } = splitTypeName(field.typeName);
              const decorators = formatDecorators(field.typeDecorators);

              const line1 = document.createElement('div');
              line1.className = "field-row";

              const fieldName = document.createElement('span');
              fieldName.innerHTML = field.fieldName;
              fieldName.className = 'field-name';

              const fieldType = document.createElement('span');
              fieldType.innerHTML = decorators + type;
              fieldType.className = 'field-type';

              line1.appendChild(fieldName);
              line1.appendChild(fieldType);

              const line2 = document.createElement('div');
              line2.className = 'type-name';
              line2.innerHTML = pkg;

              const contentWrapper = document.createElement('div');
              contentWrapper.appendChild(line1);
              contentWrapper.appendChild(line2);
              if (field.docString) {
                  contentWrapper.appendChild(createDocString(field.docString));
              }

              li.appendChild(contentWrapper);

              if (typeData[field.typeName]) {
                  const chevron = document.createElement('span');
                  chevron.className = 'chevron';
                  li.appendChild(chevron);
              }

              li.addEventListener('click', (event) => {
                  handleFieldClick(event.currentTarget);
              });
              ul.appendChild(li);
          });
      }
      
      if (typeInfo.enumValues) {
          typeInfo.enumValues.forEach(enumVal => {
              const li = document.createElement('li');
              li.style.cursor = 'default';

              const line1 = document.createElement('div');
              line1.className = "field-row";

              const enumName = document.createElement('span');
              enumName.innerHTML = enumVal.name;
              enumName.className = 'field-name';

              line1.appendChild(enumName);

              const contentWrapper = document.createElement('div');
              contentWrapper.appendChild(line1);
              if (enumVal.docString) {
                  contentWrapper.appendChild(createDocString(enumVal.docString));
              }

              li.appendChild(contentWrapper);
              ul.appendChild(li);
          });
      }

      column.appendChild(ul);
      return column;
  }

  function handleFieldClick(listItem) {
      const { typeName, parentType } = listItem.dataset;
      
      let currentColumn = listItem.closest('.column');
      
      while (currentColumn && currentColumn.nextSibling) {
          currentColumn.nextSibling.remove();
      }

      const parentList = listItem.parentElement;
      parentList.querySelectorAll('li.selected').forEach(item => {
          item.classList.remove('selected');
      });

      listItem.classList.add('selected');

      if (typeData[typeName]) {
          const newColumn = createColumn(typeName);
          if (newColumn) {
              mainContainer.appendChild(newColumn);
              newColumn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
          }
      }
  }

  function init() {
      if (startTypes.length > 0) {
          startTypes.forEach(typeName => {
              const initialColumn = createColumn(typeName);
              if (initialColumn) {
                  mainContainer.appendChild(initialColumn);
              }
          });
      } else {
          const firstTypeName = Object.keys(typeData)[0];
          if (firstTypeName) {
              const initialColumn = createColumn(firstTypeName);
              if (initialColumn) {
                  mainContainer.appendChild(initialColumn);
              }
          }
      }
  }

  init();

  function populateTypeSwitcherList(filter = '') {
      typeSwitcherList.innerHTML = '';
      const typeNames = Object.keys(typeData).sort();
      const filteredTypes = typeNames.filter(name => {
          const typeInfo = typeData[name];
          if (!typeInfo.isRoot) {
              return false;
          }
          return name.toLowerCase().includes(filter.toLowerCase());
      });

      filteredTypes.forEach(typeName => {
          const typeInfo = typeData[typeName];

          const li = document.createElement('li');

          const tn = document.createElement('div');
          tn.innerHTML = typeInfo.typeName;
          tn.className = 'type-switcher-type-name';

          const pkg = document.createElement('div');
          pkg.innerHTML = typeInfo.package;
          pkg.className = 'type-switcher-type-pkg';

          li.appendChild(tn);
          li.appendChild(pkg);
          li.dataset.typeName = typeName;

          typeSwitcherList.appendChild(li);
      });

      if (typeSwitcherList.firstChild) {
          typeSwitcherList.firstChild.classList.add('selected');
      }
  }

  function showTypeSwitcher() {
      populateTypeSwitcherList();
      typeSwitcherOverlay.style.display = 'flex';
      typeSwitcherInput.focus();
  }

  function hideTypeSwitcher() {
      typeSwitcherInput.value = '';
      typeSwitcherOverlay.style.display = 'none';
  }

  function selectType(typeName) {
      hideTypeSwitcher();
      mainContainer.innerHTML = '';
      const newColumn = createColumn(typeName);
      if (newColumn) {
          mainContainer.appendChild(newColumn);
      }
  }

  document.addEventListener('keydown', (event) => {
      if (event.key === '/' && event.target.tagName !== 'INPUT') {
          event.preventDefault();
          showTypeSwitcher();
      }
      if (event.key === 'Escape') {
          if (typeSwitcherOverlay.style.display === 'flex') {
              hideTypeSwitcher();
          }
      }
  });

  typeSwitcherInput.addEventListener('input', () => {
      populateTypeSwitcherList(typeSwitcherInput.value);
  });

  typeSwitcherInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
          event.preventDefault();
          const selected = typeSwitcherList.querySelector('li.selected');
          if (selected) {
              selectType(selected.dataset.typeName);
          }
      } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          const selected = typeSwitcherList.querySelector('li.selected');
          if (selected && selected.nextElementSibling) {
              selected.classList.remove('selected');
              selected.nextElementSibling.classList.add('selected');
              selected.nextElementSibling.scrollIntoView({ block: 'nearest' });
          }
      } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          const selected = typeSwitcherList.querySelector('li.selected');
          if (selected && selected.previousElementSibling) {
              selected.classList.remove('selected');
              selected.previousElementSibling.classList.add('selected');
              selected.previousElementSibling.scrollIntoView({ block: 'nearest' });
          }
      }
  });

  typeSwitcherList.addEventListener('click', (event) => {
      if (event.target.tagName === 'LI') {
          selectType(event.target.dataset.typeName);
      }
  });

  typeSwitcherDialog.addEventListener('click', (event) => {
      event.stopPropagation();
  });

  typeSwitcherOverlay.addEventListener('click', () => {
      hideTypeSwitcher();
  });
</script>
