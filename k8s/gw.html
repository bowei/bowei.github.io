efixed with `/foo` AND contains the header `version: v2`\n- path prefix of `/v2/foo`\n\nSee the documentation for HTTPRouteMatch on how to specify multiple\nmatch conditions that should be ANDed together.\n\nIf no matches are specified, the default is a prefix\npath match on \"/\", which has the effect of matching every\nHTTP request.\n\nProxy or Load Balancer routing configuration generated from HTTPRoutes\nMUST prioritize matches based on the following criteria, continuing on\nties. Across all rules specified on applicable Routes, precedence must be\ngiven to the match having:\n\n* \"Exact\" path match.\n* \"Prefix\" path match with largest number of characters.\n* Method match.\n* Largest number of header matches.\n* Largest number of query param matches.\n\nNote: The precedence of RegularExpression path matches are implementation-specific.\n\nIf ties still exist across multiple Routes, matching precedence MUST be\ndetermined in order of the following criteria, continuing on ties:\n\n* The oldest Route based on creation timestamp.\n* The Route appearing first in alphabetical order by\n  \"{namespace}/{name}\".\n\nIf ties still exist within an HTTPRoute, matching precedence MUST be granted\nto the FIRST matching rule (in list order) with a match meeting the above\ncriteria.\n\nWhen no rules matching a request have been successfully attached to the\nparent a request is coming from, a HTTP 404 status code MUST be returned.\n\n+optional\n+kubebuilder:validation:MaxItems=64\n+kubebuilder:default={{path:{ type: \"PathPrefix\", value: \"/\"}}}"},{"fieldName":"Filters","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteFilter","typeDecorators":["List"],"docString":"Filters define the filters that are applied to requests that match\nthis rule.\n\nWherever possible, implementations SHOULD implement filters in the order\nthey are specified.\n\nImplementations MAY choose to implement this ordering strictly, rejecting\nany combination or order of filters that cannot be supported. If implementations\nchoose a strict interpretation of filter ordering, they MUST clearly document\nthat behavior.\n\nTo reject an invalid combination or order of filters, implementations SHOULD\nconsider the Route Rules with this configuration invalid. If all Route Rules\nin a Route are invalid, the entire Route would be considered invalid. If only\na portion of Route Rules are invalid, implementations MUST set the\n\"PartiallyInvalid\" condition for the Route.\n\nConformance-levels at this level are defined based on the type of filter:\n\n- ALL core filters MUST be supported by all implementations.\n- Implementers are encouraged to support extended filters.\n- Implementation-specific custom filters have no API guarantees across\n  implementations.\n\nSpecifying the same filter multiple times is not supported unless explicitly\nindicated in the filter.\n\nAll filters are expected to be compatible with each other except for the\nURLRewrite and RequestRedirect filters, which may not be combined. If an\nimplementation cannot support other combinations of filters, they must clearly\ndocument that limitation. In cases where incompatible or unsupported\nfilters are specified and cause the `Accepted` condition to be set to status\n`False`, implementations may use the `IncompatibleFilters` reason to specify\nthis configuration error.\n\nSupport: Core\n\n+optional\n+kubebuilder:validation:MaxItems=16\n+kubebuilder:validation:XValidation:message=\"May specify either httpRouteFilterRequestRedirect or httpRouteFilterRequestRewrite, but not both\",rule=\"!(self.exists(f, f.type == 'RequestRedirect') \u0026\u0026 self.exists(f, f.type == 'URLRewrite'))\"\n+kubebuilder:validation:XValidation:message=\"RequestHeaderModifier filter cannot be repeated\",rule=\"self.filter(f, f.type == 'RequestHeaderModifier').size() \u003c= 1\"\n+kubebuilder:validation:XValidation:message=\"ResponseHeaderModifier filter cannot be repeated\",rule=\"self.filter(f, f.type == 'ResponseHeaderModifier').size() \u003c= 1\"\n+kubebuilder:validation:XValidation:message=\"RequestRedirect filter cannot be repeated\",rule=\"self.filter(f, f.type == 'RequestRedirect').size() \u003c= 1\"\n+kubebuilder:validation:XValidation:message=\"URLRewrite filter cannot be repeated\",rule=\"self.filter(f, f.type == 'URLRewrite').size() \u003c= 1\""},{"fieldName":"BackendRefs","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPBackendRef","typeDecorators":["List"],"docString":"BackendRefs defines the backend(s) where matching requests should be\nsent.\n\nFailure behavior here depends on how many BackendRefs are specified and\nhow many are invalid.\n\nIf *all* entries in BackendRefs are invalid, and there are also no filters\nspecified in this route rule, *all* traffic which matches this rule MUST\nreceive a 500 status code.\n\nSee the HTTPBackendRef definition for the rules about what makes a single\nHTTPBackendRef invalid.\n\nWhen a HTTPBackendRef is invalid, 500 status codes MUST be returned for\nrequests that would have otherwise been routed to an invalid backend. If\nmultiple backends are specified, and some are invalid, the proportion of\nrequests that would otherwise have been routed to an invalid backend\nMUST receive a 500 status code.\n\nFor example, if two backends are specified with equal weights, and one is\ninvalid, 50 percent of traffic must receive a 500. Implementations may\nchoose how that 50 percent is determined.\n\nWhen a HTTPBackendRef refers to a Service that has no ready endpoints,\nimplementations SHOULD return a 503 for requests to that backend instead.\nIf an implementation chooses to do this, all of the above rules for 500 responses\nMUST also apply for responses that return a 503.\n\nSupport: Core for Kubernetes Service\n\nSupport: Extended for Kubernetes ServiceImport\n\nSupport: Implementation-specific for any other resource\n\nSupport for weight: Core\n\n+optional\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"Timeouts","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteTimeouts","typeDecorators":["Ptr"],"docString":"Timeouts defines the timeouts that can be configured for an HTTP request.\n\nSupport: Extended\n\n+optional"},{"fieldName":"Retry","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteRetry","typeDecorators":["Ptr"],"docString":"Retry defines the configuration for when to retry an HTTP request.\n\nSupport: Extended\n\n+optional\n\u003cgateway:experimental\u003e"},{"fieldName":"SessionPersistence","typeName":"SessionPersistence","typeDecorators":["Ptr"],"docString":"SessionPersistence defines and configures session persistence\nfor the route rule.\n\nSupport: Extended\n\n+optional\n\u003cgateway:experimental\u003e"}],"enumValues":[],"docString":"HTTPRouteRule defines semantics for matching an HTTP request based on\nconditions (matches), processing it (filters), and forwarding the request to\nan API object (backendRefs).\n\n+kubebuilder:validation:XValidation:message=\"RequestRedirect filter must not be used together with backendRefs\",rule=\"(has(self.backendRefs) \u0026\u0026 size(self.backendRefs) \u003e 0) ? (!has(self.filters) || self.filters.all(f, !has(f.requestRedirect))): true\"\n+kubebuilder:validation:XValidation:message=\"When using RequestRedirect filter with path.replacePrefixMatch, exactly one PathPrefix match must be specified\",rule=\"(has(self.filters) \u0026\u0026 self.filters.exists_one(f, has(f.requestRedirect) \u0026\u0026 has(f.requestRedirect.path) \u0026\u0026 f.requestRedirect.path.type == 'ReplacePrefixMatch' \u0026\u0026 has(f.requestRedirect.path.replacePrefixMatch))) ? ((size(self.matches) != 1 || !has(self.matches[0].path) || self.matches[0].path.type != 'PathPrefix') ? false : true) : true\"\n+kubebuilder:validation:XValidation:message=\"When using URLRewrite filter with path.replacePrefixMatch, exactly one PathPrefix match must be specified\",rule=\"(has(self.filters) \u0026\u0026 self.filters.exists_one(f, has(f.urlRewrite) \u0026\u0026 has(f.urlRewrite.path) \u0026\u0026 f.urlRewrite.path.type == 'ReplacePrefixMatch' \u0026\u0026 has(f.urlRewrite.path.replacePrefixMatch))) ? ((size(self.matches) != 1 || !has(self.matches[0].path) || self.matches[0].path.type != 'PathPrefix') ? false : true) : true\"\n+kubebuilder:validation:XValidation:message=\"Within backendRefs, when using RequestRedirect filter with path.replacePrefixMatch, exactly one PathPrefix match must be specified\",rule=\"(has(self.backendRefs) \u0026\u0026 self.backendRefs.exists_one(b, (has(b.filters) \u0026\u0026 b.filters.exists_one(f, has(f.requestRedirect) \u0026\u0026 has(f.requestRedirect.path) \u0026\u0026 f.requestRedirect.path.type == 'ReplacePrefixMatch' \u0026\u0026 has(f.requestRedirect.path.replacePrefixMatch))) )) ? ((size(self.matches) != 1 || !has(self.matches[0].path) || self.matches[0].path.type != 'PathPrefix') ? false : true) : true\"\n+kubebuilder:validation:XValidation:message=\"Within backendRefs, When using URLRewrite filter with path.replacePrefixMatch, exactly one PathPrefix match must be specified\",rule=\"(has(self.backendRefs) \u0026\u0026 self.backendRefs.exists_one(b, (has(b.filters) \u0026\u0026 b.filters.exists_one(f, has(f.urlRewrite) \u0026\u0026 has(f.urlRewrite.path) \u0026\u0026 f.urlRewrite.path.type == 'ReplacePrefixMatch' \u0026\u0026 has(f.urlRewrite.path.replacePrefixMatch))) )) ? ((size(self.matches) != 1 || !has(self.matches[0].path) || self.matches[0].path.type != 'PathPrefix') ? false : true) : true\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteSpec","fields":[{"fieldName":"CommonRouteSpec","typeName":"CommonRouteSpec","typeDecorators":null,"docString":""},{"fieldName":"Hostnames","typeName":"Hostname","typeDecorators":["List"],"docString":"Hostnames defines a set of hostnames that should match against the HTTP Host\nheader to select a HTTPRoute used to process the request. Implementations\nMUST ignore any port value specified in the HTTP Host header while\nperforming a match and (absent of any applicable header modification\nconfiguration) MUST forward this header unmodified to the backend.\n\nValid values for Hostnames are determined by RFC 1123 definition of a\nhostname with 2 notable exceptions:\n\n1. IPs are not allowed.\n2. A hostname may be prefixed with a wildcard label (`*.`). The wildcard\n   label must appear by itself as the first label.\n\nIf a hostname is specified by both the Listener and HTTPRoute, there\nmust be at least one intersecting hostname for the HTTPRoute to be\nattached to the Listener. For example:\n\n* A Listener with `test.example.com` as the hostname matches HTTPRoutes\n  that have either not specified any hostnames, or have specified at\n  least one of `test.example.com` or `*.example.com`.\n* A Listener with `*.example.com` as the hostname matches HTTPRoutes\n  that have either not specified any hostnames or have specified at least\n  one hostname that matches the Listener hostname. For example,\n  `*.example.com`, `test.example.com`, and `foo.test.example.com` would\n  all match. On the other hand, `example.com` and `test.example.net` would\n  not match.\n\nHostnames that are prefixed with a wildcard label (`*.`) are interpreted\nas a suffix match. That means that a match for `*.example.com` would match\nboth `test.example.com`, and `foo.test.example.com`, but not `example.com`.\n\nIf both the Listener and HTTPRoute have specified hostnames, any\nHTTPRoute hostnames that do not match the Listener hostname MUST be\nignored. For example, if a Listener specified `*.example.com`, and the\nHTTPRoute specified `test.example.com` and `test.example.net`,\n`test.example.net` must not be considered for a match.\n\nIf both the Listener and HTTPRoute have specified hostnames, and none\nmatch with the criteria above, then the HTTPRoute is not accepted. The\nimplementation must raise an 'Accepted' Condition with a status of\n`False` in the corresponding RouteParentStatus.\n\nIn the event that multiple HTTPRoutes specify intersecting hostnames (e.g.\noverlapping wildcard matching and exact matching hostnames), precedence must\nbe given to rules from the HTTPRoute with the largest number of:\n\n* Characters in a matching non-wildcard hostname.\n* Characters in a matching hostname.\n\nIf ties exist across multiple Routes, the matching precedence rules for\nHTTPRouteMatches takes over.\n\nSupport: Core\n\n+optional\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"Rules","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteRule","typeDecorators":["List"],"docString":"Rules are a list of HTTP matchers, filters and actions.\n\n+optional\n\u003cgateway:experimental:validation:XValidation:message=\"Rule name must be unique within the route\",rule=\"self.all(l1, !has(l1.name) || self.exists_one(l2, has(l2.name) \u0026\u0026 l1.name == l2.name))\"\u003e\n+kubebuilder:validation:MaxItems=16\n+kubebuilder:default={{matches: {{path: {type: \"PathPrefix\", value: \"/\"}}}}}\n+kubebuilder:validation:XValidation:message=\"While 16 rules and 64 matches per rule are allowed, the total number of matches across all rules in a route must be less than 128\",rule=\"(self.size() \u003e 0 ? self[0].matches.size() : 0) + (self.size() \u003e 1 ? self[1].matches.size() : 0) + (self.size() \u003e 2 ? self[2].matches.size() : 0) + (self.size() \u003e 3 ? self[3].matches.size() : 0) + (self.size() \u003e 4 ? self[4].matches.size() : 0) + (self.size() \u003e 5 ? self[5].matches.size() : 0) + (self.size() \u003e 6 ? self[6].matches.size() : 0) + (self.size() \u003e 7 ? self[7].matches.size() : 0) + (self.size() \u003e 8 ? self[8].matches.size() : 0) + (self.size() \u003e 9 ? self[9].matches.size() : 0) + (self.size() \u003e 10 ? self[10].matches.size() : 0) + (self.size() \u003e 11 ? self[11].matches.size() : 0) + (self.size() \u003e 12 ? self[12].matches.size() : 0) + (self.size() \u003e 13 ? self[13].matches.size() : 0) + (self.size() \u003e 14 ? self[14].matches.size() : 0) + (self.size() \u003e 15 ? self[15].matches.size() : 0) \u003c= 128\""}],"enumValues":[],"docString":"HTTPRouteSpec defines the desired state of HTTPRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteStatus","fields":[{"fieldName":"RouteStatus","typeName":"RouteStatus","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"HTTPRouteStatus defines the observed state of HTTPRoute.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPRouteTimeouts":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPRouteTimeouts","fields":[{"fieldName":"Request","typeName":"Duration","typeDecorators":["Ptr"],"docString":"Request specifies the maximum duration for a gateway to respond to an HTTP request.\nIf the gateway has not been able to respond before this deadline is met, the gateway\nMUST return a timeout error.\n\nFor example, setting the `rules.timeouts.request` field to the value `10s` in an\n`HTTPRoute` will cause a timeout if a client request is taking longer than 10 seconds\nto complete.\n\nSetting a timeout to the zero duration (e.g. \"0s\") SHOULD disable the timeout\ncompletely. Implementations that cannot completely disable the timeout MUST\ninstead interpret the zero duration as the longest possible value to which\nthe timeout can be set.\n\nThis timeout is intended to cover as close to the whole request-response transaction\nas possible although an implementation MAY choose to start the timeout after the entire\nrequest stream has been received instead of immediately after the transaction is\ninitiated by the client.\n\nThe value of Request is a Gateway API Duration string as defined by GEP-2257. When this\nfield is unspecified, request timeout behavior is implementation-specific.\n\nSupport: Extended\n\n+optional"},{"fieldName":"BackendRequest","typeName":"Duration","typeDecorators":["Ptr"],"docString":"BackendRequest specifies a timeout for an individual request from the gateway\nto a backend. This covers the time from when the request first starts being\nsent from the gateway to when the full response has been received from the backend.\n\nSetting a timeout to the zero duration (e.g. \"0s\") SHOULD disable the timeout\ncompletely. Implementations that cannot completely disable the timeout MUST\ninstead interpret the zero duration as the longest possible value to which\nthe timeout can be set.\n\nAn entire client HTTP transaction with a gateway, covered by the Request timeout,\nmay result in more than one call from the gateway to the destination backend,\nfor example, if automatic retries are supported.\n\nThe value of BackendRequest must be a Gateway API Duration string as defined by\nGEP-2257.  When this field is unspecified, its behavior is implementation-specific;\nwhen specified, the value of BackendRequest must be no more than the value of the\nRequest timeout (since the Request timeout encompasses the BackendRequest timeout).\n\nSupport: Extended\n\n+optional"}],"enumValues":[],"docString":"HTTPRouteTimeouts defines timeouts that can be configured for an HTTPRoute.\nTimeout values are represented with Gateway API Duration formatting.\n\n+kubebuilder:validation:XValidation:message=\"backendRequest timeout cannot be longer than request timeout\",rule=\"!(has(self.request) \u0026\u0026 has(self.backendRequest) \u0026\u0026 duration(self.request) != duration('0s') \u0026\u0026 duration(self.backendRequest) \u003e duration(self.request))\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HTTPURLRewriteFilter":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HTTPURLRewriteFilter","fields":[{"fieldName":"Hostname","typeName":"PreciseHostname","typeDecorators":["Ptr"],"docString":"Hostname is the value to be used to replace the Host header value during\nforwarding.\n\nSupport: Extended\n\n+optional"},{"fieldName":"Path","typeName":"sigs.k8s.io/gateway-api/apis/v1.HTTPPathModifier","typeDecorators":["Ptr"],"docString":"Path defines a path rewrite.\n\nSupport: Extended\n\n+optional"}],"enumValues":[],"docString":"HTTPURLRewriteFilter defines a filter that modifies a request during\nforwarding. At most one of these filters may be used on a Route rule. This\nMUST NOT be used on the same Route rule as a HTTPRequestRedirect filter.\n\nSupport: Extended","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.HeaderMatchType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"HeaderMatchType","fields":[],"enumValues":[{"name":"HeaderMatchExact","docString":"HeaderMatchType constants."},{"name":"HeaderMatchRegularExpression","docString":"HeaderMatchType constants."}],"docString":"HeaderMatchType specifies the semantics of how HTTP header values should be\ncompared. Valid HeaderMatchType values, along with their conformance levels, are:\n\n* \"Exact\" - Core\n* \"RegularExpression\" - Implementation Specific\n\nNote that values may be added to this enum, implementations\nmust ensure that unknown values will not cause a crash.\n\nUnknown values here must result in the implementation setting the\nAccepted Condition for the Route to `status: False`, with a\nReason of `UnsupportedValue`.\n\n+kubebuilder:validation:Enum=Exact;RegularExpression","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.Listener":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"Listener","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":null,"docString":"Name is the name of the Listener. This name MUST be unique within a\nGateway.\n\nSupport: Core"},{"fieldName":"Hostname","typeName":"Hostname","typeDecorators":["Ptr"],"docString":"Hostname specifies the virtual hostname to match for protocol types that\ndefine this concept. When unspecified, all hostnames are matched. This\nfield is ignored for protocols that don't require hostname based\nmatching.\n\nImplementations MUST apply Hostname matching appropriately for each of\nthe following protocols:\n\n* TLS: The Listener Hostname MUST match the SNI.\n* HTTP: The Listener Hostname MUST match the Host header of the request.\n* HTTPS: The Listener Hostname SHOULD match both the SNI and Host header.\n  Note that this does not require the SNI and Host header to be the same.\n  The semantics of this are described in more detail below.\n\nTo ensure security, Section 11.1 of RFC-6066 emphasizes that server\nimplementations that rely on SNI hostname matching MUST also verify\nhostnames within the application protocol.\n\nSection 9.1.2 of RFC-7540 provides a mechanism for servers to reject the\nreuse of a connection by responding with the HTTP 421 Misdirected Request\nstatus code. This indicates that the origin server has rejected the\nrequest because it appears to have been misdirected.\n\nTo detect misdirected requests, Gateways SHOULD match the authority of\nthe requests with all the SNI hostname(s) configured across all the\nGateway Listeners on the same port and protocol:\n\n* If another Listener has an exact match or more specific wildcard entry,\n  the Gateway SHOULD return a 421.\n* If the current Listener (selected by SNI matching during ClientHello)\n  does not match the Host:\n    * If another Listener does match the Host the Gateway SHOULD return a\n      421.\n    * If no other Listener matches the Host, the Gateway MUST return a\n      404.\n\nFor HTTPRoute and TLSRoute resources, there is an interaction with the\n`spec.hostnames` array. When both listener and route specify hostnames,\nthere MUST be an intersection between the values for a Route to be\naccepted. For more information, refer to the Route specific Hostnames\ndocumentation.\n\nHostnames that are prefixed with a wildcard label (`*.`) are interpreted\nas a suffix match. That means that a match for `*.example.com` would match\nboth `test.example.com`, and `foo.test.example.com`, but not `example.com`.\n\nSupport: Core\n\n+optional"},{"fieldName":"Port","typeName":"PortNumber","typeDecorators":null,"docString":"Port is the network port. Multiple listeners may use the\nsame port, subject to the Listener compatibility rules.\n\nSupport: Core"},{"fieldName":"Protocol","typeName":"sigs.k8s.io/gateway-api/apis/v1.ProtocolType","typeDecorators":null,"docString":"Protocol specifies the network protocol this listener expects to receive.\n\nSupport: Core"},{"fieldName":"TLS","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayTLSConfig","typeDecorators":["Ptr"],"docString":"TLS is the TLS configuration for the Listener. This field is required if\nthe Protocol field is \"HTTPS\" or \"TLS\". It is invalid to set this field\nif the Protocol field is \"HTTP\", \"TCP\", or \"UDP\".\n\nThe association of SNIs to Certificate defined in GatewayTLSConfig is\ndefined based on the Hostname field for this listener.\n\nThe GatewayClass MUST use the longest matching SNI out of all\navailable certificates for any TLS handshake.\n\nSupport: Core\n\n+optional"},{"fieldName":"AllowedRoutes","typeName":"sigs.k8s.io/gateway-api/apis/v1.AllowedRoutes","typeDecorators":["Ptr"],"docString":"AllowedRoutes defines the types of routes that MAY be attached to a\nListener and the trusted namespaces where those Route resources MAY be\npresent.\n\nAlthough a client request may match multiple route rules, only one rule\nmay ultimately receive the request. Matching precedence MUST be\ndetermined in order of the following criteria:\n\n* The most specific match as defined by the Route type.\n* The oldest Route based on creation timestamp. For example, a Route with\n  a creation timestamp of \"2020-09-08 01:02:03\" is given precedence over\n  a Route with a creation timestamp of \"2020-09-08 01:02:04\".\n* If everything else is equivalent, the Route appearing first in\n  alphabetical order (namespace/name) should be given precedence. For\n  example, foo/bar is given precedence over foo/baz.\n\nAll valid rules within a Route attached to this Listener should be\nimplemented. Invalid Route rules can be ignored (sometimes that will mean\nthe full Route). If a Route rule transitions from valid to invalid,\nsupport for that Route rule should be dropped to ensure consistency. For\nexample, even if a filter specified by a Route rule is invalid, the rest\nof the rules within that Route should still be supported.\n\nSupport: Core\n+kubebuilder:default={namespaces:{from: Same}}\n+optional"}],"enumValues":[],"docString":"Listener embodies the concept of a logical endpoint where a Gateway accepts\nnetwork connections.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.ListenerNamespaces":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"ListenerNamespaces","fields":[{"fieldName":"From","typeName":"sigs.k8s.io/gateway-api/apis/v1.FromNamespaces","typeDecorators":["Ptr"],"docString":"From indicates where ListenerSets can attach to this Gateway. Possible\nvalues are:\n\n* Same: Only ListenerSets in the same namespace may be attached to this Gateway.\n* Selector: ListenerSets in namespaces selected by the selector may be attached to this Gateway.\n* All: ListenerSets in all namespaces may be attached to this Gateway.\n* None: Only listeners defined in the Gateway's spec are allowed\n\nWhile this feature is experimental, the default value None\n\n+optional\n+kubebuilder:default=None\n+kubebuilder:validation:Enum=All;Selector;Same;None"},{"fieldName":"Selector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Selector must be specified when From is set to \"Selector\". In that case,\nonly ListenerSets in Namespaces matching this Selector will be selected by this\nGateway. This field is ignored for other values of \"From\".\n\n+optional"}],"enumValues":[],"docString":"ListenerNamespaces indicate which namespaces ListenerSets should be selected from.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.ListenerStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"ListenerStatus","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":null,"docString":"Name is the name of the Listener that this status corresponds to."},{"fieldName":"SupportedKinds","typeName":"sigs.k8s.io/gateway-api/apis/v1.RouteGroupKind","typeDecorators":["List"],"docString":"SupportedKinds is the list indicating the Kinds supported by this\nlistener. This MUST represent the kinds an implementation supports for\nthat Listener configuration.\n\nIf kinds are specified in Spec that are not supported, they MUST NOT\nappear in this list and an implementation MUST set the \"ResolvedRefs\"\ncondition to \"False\" with the \"InvalidRouteKinds\" reason. If both valid\nand invalid Route kinds are specified, the implementation MUST\nreference the valid Route kinds that have been specified.\n\n+kubebuilder:validation:MaxItems=8"},{"fieldName":"AttachedRoutes","typeName":"int32","typeDecorators":null,"docString":"AttachedRoutes represents the total number of Routes that have been\nsuccessfully attached to this Listener.\n\nSuccessful attachment of a Route to a Listener is based solely on the\ncombination of the AllowedRoutes field on the corresponding Listener\nand the Route's ParentRefs field. A Route is successfully attached to\na Listener when it is selected by the Listener's AllowedRoutes field\nAND the Route has a valid ParentRef selecting the whole Gateway\nresource or a specific Listener as a parent resource (more detail on\nattachment semantics can be found in the documentation on the various\nRoute kinds ParentRefs fields). Listener or Route status does not impact\nsuccessful attachment, i.e. the AttachedRoutes field count MUST be set\nfor Listeners with condition Accepted: false and MUST count successfully\nattached Routes that may themselves have Accepted: false conditions.\n\nUses for this field include troubleshooting Route attachment and\nmeasuring blast radius/impact of changes to a Listener."},{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"Conditions describe the current condition of this listener.\n\n+listType=map\n+listMapKey=type\n+kubebuilder:validation:MaxItems=8"}],"enumValues":[],"docString":"ListenerStatus is the status associated with a Listener.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.LocalObjectReference":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"LocalObjectReference","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":null,"docString":"Group is the group of the referent. For example, \"gateway.networking.k8s.io\".\nWhen unspecified or empty string, core API group is inferred."},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is kind of the referent. For example \"HTTPRoute\" or \"Service\"."},{"fieldName":"Name","typeName":"ObjectName","typeDecorators":null,"docString":"Name is the name of the referent."}],"enumValues":[],"docString":"LocalObjectReference identifies an API object within the namespace of the\nreferrer.\nThe API object must be valid in the cluster; the Group and Kind must\nbe registered in the cluster for this reference to be valid.\n\nReferences to objects with invalid Group and Kind are not valid, and must\nbe rejected by the implementation, with appropriate Conditions set\non the containing object.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.LocalParametersReference":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"LocalParametersReference","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":null,"docString":"Group is the group of the referent."},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is kind of the referent."},{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is the name of the referent.\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=253"}],"enumValues":[],"docString":"LocalParametersReference identifies an API object containing controller-specific\nconfiguration resource within the namespace.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.ObjectReference":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"ObjectReference","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":null,"docString":"Group is the group of the referent. For example, \"gateway.networking.k8s.io\".\nWhen set to the empty string, core API group is inferred."},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is kind of the referent. For example \"ConfigMap\" or \"Service\"."},{"fieldName":"Name","typeName":"ObjectName","typeDecorators":null,"docString":"Name is the name of the referent."},{"fieldName":"Namespace","typeName":"Namespace","typeDecorators":["Ptr"],"docString":"Namespace is the namespace of the referenced object. When unspecified, the local\nnamespace is inferred.\n\nNote that when a namespace different than the local namespace is specified,\na ReferenceGrant object is required in the referent namespace to allow that\nnamespace's owner to accept the reference. See the ReferenceGrant\ndocumentation for details.\n\nSupport: Core\n\n+optional"}],"enumValues":[],"docString":"ObjectReference identifies an API object including its namespace.\n\nThe API object must be valid in the cluster; the Group and Kind must\nbe registered in the cluster for this reference to be valid.\n\nReferences to objects with invalid Group and Kind are not valid, and must\nbe rejected by the implementation, with appropriate Conditions set\non the containing object.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.ParametersReference":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"ParametersReference","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":null,"docString":"Group is the group of the referent."},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is kind of the referent."},{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is the name of the referent.\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=253"},{"fieldName":"Namespace","typeName":"Namespace","typeDecorators":["Ptr"],"docString":"Namespace is the namespace of the referent.\nThis field is required when referring to a Namespace-scoped resource and\nMUST be unset when referring to a Cluster-scoped resource.\n\n+optional"}],"enumValues":[],"docString":"ParametersReference identifies an API object containing controller-specific\nconfiguration resource within the cluster.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.ParentReference":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"ParentReference","fields":[{"fieldName":"Group","typeName":"sigs.k8s.io/gateway-api/apis/v1.Group","typeDecorators":["Ptr"],"docString":"Group is the group of the referent.\nWhen unspecified, \"gateway.networking.k8s.io\" is inferred.\nTo set the core API group (such as for a \"Service\" kind referent),\nGroup must be explicitly set to \"\" (empty string).\n\nSupport: Core\n\n+kubebuilder:default=gateway.networking.k8s.io\n+optional"},{"fieldName":"Kind","typeName":"sigs.k8s.io/gateway-api/apis/v1.Kind","typeDecorators":["Ptr"],"docString":"Kind is kind of the referent.\n\nThere are two kinds of parent resources with \"Core\" support:\n\n* Gateway (Gateway conformance profile)\n* Service (Mesh conformance profile, ClusterIP Services only)\n\nSupport for other resources is Implementation-Specific.\n\n+kubebuilder:default=Gateway\n+optional"},{"fieldName":"Namespace","typeName":"sigs.k8s.io/gateway-api/apis/v1.Namespace","typeDecorators":["Ptr"],"docString":"Namespace is the namespace of the referent. When unspecified, this refers\nto the local namespace of the Route.\n\nNote that there are specific rules for ParentRefs which cross namespace\nboundaries. Cross-namespace references are only valid if they are explicitly\nallowed by something in the namespace they are referring to. For example:\nGateway has the AllowedRoutes field, and ReferenceGrant provides a\ngeneric way to enable any other kind of cross-namespace reference.\n\n\u003cgateway:experimental:description\u003e\nParentRefs from a Route to a Service in the same namespace are \"producer\"\nroutes, which apply default routing rules to inbound connections from\nany namespace to the Service.\n\nParentRefs from a Route to a Service in a different namespace are\n\"consumer\" routes, and these routing rules are only applied to outbound\nconnections originating from the same namespace as the Route, for which\nthe intended destination of the connections are a Service targeted as a\nParentRef of the Route.\n\u003c/gateway:experimental:description\u003e\n\nSupport: Core\n\n+optional"},{"fieldName":"Name","typeName":"sigs.k8s.io/gateway-api/apis/v1.ObjectName","typeDecorators":null,"docString":"Name is the name of the referent.\n\nSupport: Core"},{"fieldName":"SectionName","typeName":"sigs.k8s.io/gateway-api/apis/v1.SectionName","typeDecorators":["Ptr"],"docString":"SectionName is the name of a section within the target resource. In the\nfollowing resources, SectionName is interpreted as the following:\n\n* Gateway: Listener name. When both Port (experimental) and SectionName\nare specified, the name and port of the selected listener must match\nboth specified values.\n* Service: Port name. When both Port (experimental) and SectionName\nare specified, the name and port of the selected listener must match\nboth specified values.\n\nImplementations MAY choose to support attaching Routes to other resources.\nIf that is the case, they MUST clearly document how SectionName is\ninterpreted.\n\nWhen unspecified (empty string), this will reference the entire resource.\nFor the purpose of status, an attachment is considered successful if at\nleast one section in the parent resource accepts it. For example, Gateway\nlisteners can restrict which Routes can attach to them by Route kind,\nnamespace, or hostname. If 1 of 2 Gateway listeners accept attachment from\nthe referencing Route, the Route MUST be considered successfully\nattached. If no Gateway listeners accept attachment from this Route, the\nRoute MUST be considered detached from the Gateway.\n\nSupport: Core\n\n+optional"},{"fieldName":"Port","typeName":"sigs.k8s.io/gateway-api/apis/v1.PortNumber","typeDecorators":["Ptr"],"docString":"Port is the network port this Route targets. It can be interpreted\ndifferently based on the type of parent resource.\n\nWhen the parent resource is a Gateway, this targets all listeners\nlistening on the specified port that also support this kind of Route(and\nselect this Route). It's not recommended to set `Port` unless the\nnetworking behaviors specified in a Route must apply to a specific port\nas opposed to a listener(s) whose port(s) may be changed. When both Port\nand SectionName are specified, the name and port of the selected listener\nmust match both specified values.\n\n\u003cgateway:experimental:description\u003e\nWhen the parent resource is a Service, this targets a specific port in the\nService spec. When both Port (experimental) and SectionName are specified,\nthe name and port of the selected port must match both specified values.\n\u003c/gateway:experimental:description\u003e\n\nImplementations MAY choose to support other parent resources.\nImplementations supporting other types of parent resources MUST clearly\ndocument how/if Port is interpreted.\n\nFor the purpose of status, an attachment is considered successful as\nlong as the parent resource accepts it partially. For example, Gateway\nlisteners can restrict which Routes can attach to them by Route kind,\nnamespace, or hostname. If 1 of 2 Gateway listeners accept attachment\nfrom the referencing Route, the Route MUST be considered successfully\nattached. If no Gateway listeners accept attachment from this Route,\nthe Route MUST be considered detached from the Gateway.\n\nSupport: Extended\n\n+optional"}],"enumValues":[],"docString":"ParentReference identifies an API object (usually a Gateway) that can be considered\na parent of this resource (usually a route). There are two kinds of parent resources\nwith \"Core\" support:\n\n* Gateway (Gateway conformance profile)\n* Service (Mesh conformance profile, ClusterIP Services only)\n\nThis API may be extended in the future to support additional kinds of parent\nresources.\n\nThe API object must be valid in the cluster; the Group and Kind must\nbe registered in the cluster for this reference to be valid.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.PathMatchType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"PathMatchType","fields":[],"enumValues":[{"name":"PathMatchExact","docString":"Matches the URL path exactly and with case sensitivity. This means that\nan exact path match on `/abc` will only match requests to `/abc`, NOT\n`/abc/`, `/Abc`, or `/abcd`."},{"name":"PathMatchPathPrefix","docString":"Matches based on a URL path prefix split by `/`. Matching is\ncase-sensitive and done on a path element by element basis. A\npath element refers to the list of labels in the path split by\nthe `/` separator. When specified, a trailing `/` is ignored.\n\nFor example, the paths `/abc`, `/abc/`, and `/abc/def` would all match\nthe prefix `/abc`, but the path `/abcd` would not.\n\n\"PathPrefix\" is semantically equivalent to the \"Prefix\" path type in the\nKubernetes Ingress API."},{"name":"PathMatchRegularExpression","docString":"Matches if the URL path matches the given regular expression with\ncase sensitivity.\n\nSince `\"RegularExpression\"` has implementation-specific conformance,\nimplementations can support POSIX, PCRE, RE2 or any other regular expression\ndialect.\nPlease read the implementation's documentation to determine the supported\ndialect."}],"docString":"PathMatchType specifies the semantics of how HTTP paths should be compared.\nValid PathMatchType values, along with their support levels, are:\n\n* \"Exact\" - Core\n* \"PathPrefix\" - Core\n* \"RegularExpression\" - Implementation Specific\n\nPathPrefix and Exact paths must be syntactically valid:\n\n- Must begin with the `/` character\n- Must not contain consecutive `/` characters (e.g. `/foo///`, `//`).\n\nNote that values may be added to this enum, implementations\nmust ensure that unknown values will not cause a crash.\n\nUnknown values here must result in the implementation setting the\nAccepted Condition for the Route to `status: False`, with a\nReason of `UnsupportedValue`.\n\n+kubebuilder:validation:Enum=Exact;PathPrefix;RegularExpression","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.ProtocolType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"ProtocolType","fields":[],"enumValues":[{"name":"HTTPProtocolType","docString":"Accepts cleartext HTTP/1.1 sessions over TCP. Implementations MAY also\nsupport HTTP/2 over cleartext. If implementations support HTTP/2 over\ncleartext on \"HTTP\" listeners, that MUST be clearly documented by the\nimplementation."},{"name":"HTTPSProtocolType","docString":"Accepts HTTP/1.1 or HTTP/2 sessions over TLS."},{"name":"TLSProtocolType","docString":"Accepts TLS sessions over TCP."},{"name":"TCPProtocolType","docString":"Accepts TCP sessions."},{"name":"UDPProtocolType","docString":"Accepts UDP packets."}],"docString":"ProtocolType defines the application protocol accepted by a Listener.\nImplementations are not required to accept all the defined protocols. If an\nimplementation does not support a specified protocol, it MUST set the\n\"Accepted\" condition to False for the affected Listener with a reason of\n\"UnsupportedProtocol\".\n\nCore ProtocolType values are listed in the table below.\n\nImplementations can define their own protocols if a core ProtocolType does not\nexist. Such definitions must use prefixed name, such as\n`mycompany.com/my-custom-protocol`. Un-prefixed names are reserved for core\nprotocols. Any protocol defined by implementations will fall under\nImplementation-specific conformance.\n\nValid values include:\n\n* \"HTTP\" - Core support\n* \"example.com/bar\" - Implementation-specific support\n\nInvalid values include:\n\n* \"example.com\" - must include path if domain is used\n* \"foo.example.com\" - must include path if domain is used\n\n+kubebuilder:validation:MinLength=1\n+kubebuilder:validation:MaxLength=255\n+kubebuilder:validation:Pattern=`^[a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?$|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\\/[A-Za-z0-9]+$`","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.QueryParamMatchType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"QueryParamMatchType","fields":[],"enumValues":[{"name":"QueryParamMatchExact","docString":"QueryParamMatchType constants."},{"name":"QueryParamMatchRegularExpression","docString":"QueryParamMatchType constants."}],"docString":"QueryParamMatchType specifies the semantics of how HTTP query parameter\nvalues should be compared. Valid QueryParamMatchType values, along with their\nconformance levels, are:\n\n* \"Exact\" - Core\n* \"RegularExpression\" - Implementation Specific\n\nNote that values may be added to this enum, implementations\nmust ensure that unknown values will not cause a crash.\n\nUnknown values here must result in the implementation setting the\nAccepted Condition for the Route to `status: False`, with a\nReason of `UnsupportedValue`.\n\n+kubebuilder:validation:Enum=Exact;RegularExpression","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.RouteConditionType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"RouteConditionType","fields":[],"enumValues":[{"name":"RouteConditionPartiallyInvalid","docString":"This condition indicates that the Route contains a combination of both\nvalid and invalid rules.\n\nWhen this happens, implementations MUST take one of the following\napproaches:\n\n1) Drop Rule(s): With this approach, implementations will drop the\n   invalid Route Rule(s) until they are fully valid again. The message\n   for this condition MUST start with the prefix \"Dropped Rule\" and\n   include information about which Rules have been dropped. In this\n   state, the \"Accepted\" condition MUST be set to \"True\" with the latest\n   generation of the resource.\n2) Fall Back: With this approach, implementations will fall back to the\n   last known good state of the entire Route. The message for this\n   condition MUST start with the prefix \"Fall Back\" and include\n   information about why the current Rule(s) are invalid. To represent\n   this, the \"Accepted\" condition MUST be set to \"True\" with the\n   generation of the last known good state of the resource.\n\nReverting to the last known good state should only be done by\nimplementations that have a means of restoring that state if/when they\nare restarted.\n\nThis condition MUST NOT be set if a Route is fully valid, fully invalid,\nor not accepted. By extension, that means that this condition MUST only\nbe set when it is \"True\".\n\nPossible reasons for this condition to be True are:\n\n* \"UnsupportedValue\"\n\nControllers may raise this condition with other reasons, but should\nprefer to use the reasons listed above to improve interoperability."}],"docString":"RouteConditionType is a type of condition for a route.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.RouteGroupKind":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"RouteGroupKind","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":["Ptr"],"docString":"Group is the group of the Route.\n\n+optional\n+kubebuilder:default=gateway.networking.k8s.io"},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is the kind of the Route."}],"enumValues":[],"docString":"RouteGroupKind indicates the group and kind of a Route resource.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.RouteNamespaces":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"RouteNamespaces","fields":[{"fieldName":"From","typeName":"sigs.k8s.io/gateway-api/apis/v1.FromNamespaces","typeDecorators":["Ptr"],"docString":"From indicates where Routes will be selected for this Gateway. Possible\nvalues are:\n\n* All: Routes in all namespaces may be used by this Gateway.\n* Selector: Routes in namespaces selected by the selector may be used by\n  this Gateway.\n* Same: Only Routes in the same namespace may be used by this Gateway.\n\nSupport: Core\n\n+optional\n+kubebuilder:default=Same\n+kubebuilder:validation:Enum=All;Selector;Same"},{"fieldName":"Selector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Selector must be specified when From is set to \"Selector\". In that case,\nonly Routes in Namespaces matching this Selector will be selected by this\nGateway. This field is ignored for other values of \"From\".\n\nSupport: Core\n\n+optional"}],"enumValues":[],"docString":"RouteNamespaces indicate which namespaces Routes should be selected from.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.RouteParentStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"RouteParentStatus","fields":[{"fieldName":"ParentRef","typeName":"sigs.k8s.io/gateway-api/apis/v1.ParentReference","typeDecorators":null,"docString":"ParentRef corresponds with a ParentRef in the spec that this\nRouteParentStatus struct describes the status of."},{"fieldName":"ControllerName","typeName":"sigs.k8s.io/gateway-api/apis/v1.GatewayController","typeDecorators":null,"docString":"ControllerName is a domain/path string that indicates the name of the\ncontroller that wrote this status. This corresponds with the\ncontrollerName field on GatewayClass.\n\nExample: \"example.net/gateway-controller\".\n\nThe format of this field is DOMAIN \"/\" PATH, where DOMAIN and PATH are\nvalid Kubernetes names\n(https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names).\n\nControllers MUST populate this field when writing status. Controllers should ensure that\nentries to status populated with their ControllerName are cleaned up when they are no\nlonger necessary."},{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"Conditions describes the status of the route with respect to the Gateway.\nNote that the route's availability is also subject to the Gateway's own\nstatus conditions and listener status.\n\nIf the Route's ParentRef specifies an existing Gateway that supports\nRoutes of this kind AND that Gateway's controller has sufficient access,\nthen that Gateway's controller MUST set the \"Accepted\" condition on the\nRoute, to indicate whether the route has been accepted or rejected by the\nGateway, and why.\n\nA Route MUST be considered \"Accepted\" if at least one of the Route's\nrules is implemented by the Gateway.\n\nThere are a number of cases where the \"Accepted\" condition may not be set\ndue to lack of controller visibility, that includes when:\n\n* The Route refers to a nonexistent parent.\n* The Route is of a type that the controller does not support.\n* The Route is in a namespace the controller does not have access to.\n\n+listType=map\n+listMapKey=type\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=8"}],"enumValues":[],"docString":"RouteParentStatus describes the status of a route with respect to an\nassociated Parent.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.RouteStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"RouteStatus","fields":[{"fieldName":"Parents","typeName":"sigs.k8s.io/gateway-api/apis/v1.RouteParentStatus","typeDecorators":["List"],"docString":"Parents is a list of parent resources (usually Gateways) that are\nassociated with the route, and the status of the route with respect to\neach parent. When this route attaches to a parent, the controller that\nmanages the parent must add an entry to this list when the controller\nfirst sees the route and should update the entry as appropriate when the\nroute or gateway is modified.\n\nNote that parent references that cannot be resolved by an implementation\nof this API will not be added to this list. Implementations of this API\ncan only populate Route status for the Gateways/parent resources they are\nresponsible for.\n\nA maximum of 32 Gateways will be represented in this list. An empty list\nmeans the route has not been attached to any Gateway.\n\n+kubebuilder:validation:MaxItems=32"}],"enumValues":[],"docString":"RouteStatus defines the common attributes that all Routes MUST include within\ntheir status.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.SecretObjectReference":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"SecretObjectReference","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":["Ptr"],"docString":"Group is the group of the referent. For example, \"gateway.networking.k8s.io\".\nWhen unspecified or empty string, core API group is inferred.\n\n+optional\n+kubebuilder:default=\"\""},{"fieldName":"Kind","typeName":"Kind","typeDecorators":["Ptr"],"docString":"Kind is kind of the referent. For example \"Secret\".\n\n+optional\n+kubebuilder:default=Secret"},{"fieldName":"Name","typeName":"ObjectName","typeDecorators":null,"docString":"Name is the name of the referent."},{"fieldName":"Namespace","typeName":"Namespace","typeDecorators":["Ptr"],"docString":"Namespace is the namespace of the referenced object. When unspecified, the local\nnamespace is inferred.\n\nNote that when a namespace different than the local namespace is specified,\na ReferenceGrant object is required in the referent namespace to allow that\nnamespace's owner to accept the reference. See the ReferenceGrant\ndocumentation for details.\n\nSupport: Core\n\n+optional"}],"enumValues":[],"docString":"SecretObjectReference identifies an API object including its namespace,\ndefaulting to Secret.\n\nThe API object must be valid in the cluster; the Group and Kind must\nbe registered in the cluster for this reference to be valid.\n\nReferences to objects with invalid Group and Kind are not valid, and must\nbe rejected by the implementation, with appropriate Conditions set\non the containing object.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.SessionPersistence":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"SessionPersistence","fields":[{"fieldName":"SessionName","typeName":"string","typeDecorators":["Ptr"],"docString":"SessionName defines the name of the persistent session token\nwhich may be reflected in the cookie or the header. Users\nshould avoid reusing session names to prevent unintended\nconsequences, such as rejection or unpredictable behavior.\n\nSupport: Implementation-specific\n\n+optional\n+kubebuilder:validation:MaxLength=128"},{"fieldName":"AbsoluteTimeout","typeName":"sigs.k8s.io/gateway-api/apis/v1.Duration","typeDecorators":["Ptr"],"docString":"AbsoluteTimeout defines the absolute timeout of the persistent\nsession. Once the AbsoluteTimeout duration has elapsed, the\nsession becomes invalid.\n\nSupport: Extended\n\n+optional"},{"fieldName":"IdleTimeout","typeName":"sigs.k8s.io/gateway-api/apis/v1.Duration","typeDecorators":["Ptr"],"docString":"IdleTimeout defines the idle timeout of the persistent session.\nOnce the session has been idle for more than the specified\nIdleTimeout duration, the session becomes invalid.\n\nSupport: Extended\n\n+optional"},{"fieldName":"Type","typeName":"sigs.k8s.io/gateway-api/apis/v1.SessionPersistenceType","typeDecorators":["Ptr"],"docString":"Type defines the type of session persistence such as through\nthe use a header or cookie. Defaults to cookie based session\npersistence.\n\nSupport: Core for \"Cookie\" type\n\nSupport: Extended for \"Header\" type\n\n+optional\n+kubebuilder:default=Cookie"},{"fieldName":"CookieConfig","typeName":"sigs.k8s.io/gateway-api/apis/v1.CookieConfig","typeDecorators":["Ptr"],"docString":"CookieConfig provides configuration settings that are specific\nto cookie-based session persistence.\n\nSupport: Core\n\n+optional"}],"enumValues":[],"docString":"SessionPersistence defines the desired state of SessionPersistence.\n+kubebuilder:validation:XValidation:message=\"AbsoluteTimeout must be specified when cookie lifetimeType is Permanent\",rule=\"!has(self.cookieConfig) || !has(self.cookieConfig.lifetimeType) || self.cookieConfig.lifetimeType != 'Permanent' || has(self.absoluteTimeout)\"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.SessionPersistenceType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"SessionPersistenceType","fields":[],"enumValues":[{"name":"CookieBasedSessionPersistence","docString":"CookieBasedSessionPersistence specifies cookie-based session\npersistence.\n\nSupport: Core"},{"name":"HeaderBasedSessionPersistence","docString":"HeaderBasedSessionPersistence specifies header-based session\npersistence.\n\nSupport: Extended"}],"docString":"+kubebuilder:validation:Enum=Cookie;Header","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.SupportedFeature":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"SupportedFeature","fields":[{"fieldName":"Name","typeName":"sigs.k8s.io/gateway-api/apis/v1.FeatureName","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1.TLSModeType":{"package":"sigs.k8s.io/gateway-api/apis/v1","typeName":"TLSModeType","fields":[],"enumValues":[{"name":"TLSModeTerminate","docString":"In this mode, TLS session between the downstream client\nand the Gateway is terminated at the Gateway."},{"name":"TLSModePassthrough","docString":"In this mode, the TLS session is NOT terminated by the Gateway. This\nimplies that the Gateway can't decipher the TLS stream except for\nthe ClientHello message of the TLS protocol.\n\nNote that SSL passthrough is only supported by TLSRoute."}],"docString":"TLSModeType type defines how a Gateway handles TLS sessions.\n\n+kubebuilder:validation:Enum=Terminate;Passthrough","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.GRPCRouteList":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"GRPCRouteList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.GRPCRoute","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"+kubebuilder:object:root=true","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.LocalPolicyTargetReference":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"LocalPolicyTargetReference","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":null,"docString":"Group is the group of the target resource."},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is kind of the target resource."},{"fieldName":"Name","typeName":"ObjectName","typeDecorators":null,"docString":"Name is the name of the target resource."}],"enumValues":[],"docString":"LocalPolicyTargetReference identifies an API object to apply a direct or\ninherited policy to. This should be used as part of Policy resources\nthat can target Gateway API resources. For more information on how this\npolicy attachment model works, and a sample Policy resource, refer to\nthe policy attachment documentation for Gateway API.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.LocalPolicyTargetReferenceWithSectionName":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"LocalPolicyTargetReferenceWithSectionName","fields":[{"fieldName":"LocalPolicyTargetReference","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.LocalPolicyTargetReference","typeDecorators":null,"docString":""},{"fieldName":"SectionName","typeName":"SectionName","typeDecorators":["Ptr"],"docString":"SectionName is the name of a section within the target resource. When\nunspecified, this targetRef targets the entire resource. In the following\nresources, SectionName is interpreted as the following:\n\n* Gateway: Listener name\n* HTTPRoute: HTTPRouteRule name\n* Service: Port name\n\nIf a SectionName is specified, but does not exist on the targeted object,\nthe Policy must fail to attach, and the policy implementation should record\na `ResolvedRefs` or similar Condition in the Policy's status.\n\n+optional"}],"enumValues":[],"docString":"LocalPolicyTargetReferenceWithSectionName identifies an API object to apply a\ndirect policy to. This should be used as part of Policy resources that can\ntarget single resources. For more information on how this policy attachment\nmode works, and a sample Policy resource, refer to the policy attachment\ndocumentation for Gateway API.\n\nNote: This should only be used for direct policy attachment when references\nto SectionName are actually needed. In all other cases,\nLocalPolicyTargetReference should be used.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.NamespacedPolicyTargetReference":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"NamespacedPolicyTargetReference","fields":[{"fieldName":"Group","typeName":"Group","typeDecorators":null,"docString":"Group is the group of the target resource."},{"fieldName":"Kind","typeName":"Kind","typeDecorators":null,"docString":"Kind is kind of the target resource."},{"fieldName":"Name","typeName":"ObjectName","typeDecorators":null,"docString":"Name is the name of the target resource."},{"fieldName":"Namespace","typeName":"Namespace","typeDecorators":["Ptr"],"docString":"Namespace is the namespace of the referent. When unspecified, the local\nnamespace is inferred. Even when policy targets a resource in a different\nnamespace, it MUST only apply to traffic originating from the same\nnamespace as the policy.\n\n+optional"}],"enumValues":[],"docString":"NamespacedPolicyTargetReference identifies an API object to apply a direct or\ninherited policy to, potentially in a different namespace. This should only\nbe used as part of Policy resources that need to be able to target resources\nin different namespaces. For more information on how this policy attachment\nmodel works, and a sample Policy resource, refer to the policy attachment\ndocumentation for Gateway API.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.PolicyAncestorStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"PolicyAncestorStatus","fields":[{"fieldName":"AncestorRef","typeName":"ParentReference","typeDecorators":null,"docString":"AncestorRef corresponds with a ParentRef in the spec that this\nPolicyAncestorStatus struct describes the status of."},{"fieldName":"ControllerName","typeName":"GatewayController","typeDecorators":null,"docString":"ControllerName is a domain/path string that indicates the name of the\ncontroller that wrote this status. This corresponds with the\ncontrollerName field on GatewayClass.\n\nExample: \"example.net/gateway-controller\".\n\nThe format of this field is DOMAIN \"/\" PATH, where DOMAIN and PATH are\nvalid Kubernetes names\n(https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names).\n\nControllers MUST populate this field when writing status. Controllers should ensure that\nentries to status populated with their ControllerName are cleaned up when they are no\nlonger necessary."},{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"Conditions describes the status of the Policy with respect to the given Ancestor.\n\n+listType=map\n+listMapKey=type\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=8"}],"enumValues":[],"docString":"PolicyAncestorStatus describes the status of a route with respect to an\nassociated Ancestor.\n\nAncestors refer to objects that are either the Target of a policy or above it\nin terms of object hierarchy. For example, if a policy targets a Service, the\nPolicy's Ancestors are, in order, the Service, the HTTPRoute, the Gateway, and\nthe GatewayClass. Almost always, in this hierarchy, the Gateway will be the most\nuseful object to place Policy status on, so we recommend that implementations\nSHOULD use Gateway as the PolicyAncestorStatus object unless the designers\nhave a _very_ good reason otherwise.\n\nIn the context of policy attachment, the Ancestor is used to distinguish which\nresource results in a distinct application of this policy. For example, if a policy\ntargets a Service, it may have a distinct result per attached Gateway.\n\nPolicies targeting the same resource may have different effects depending on the\nancestors of those resources. For example, different Gateways targeting the same\nService may have different capabilities, especially if they have different underlying\nimplementations.\n\nFor example, in BackendTLSPolicy, the Policy attaches to a Service that is\nused as a backend in a HTTPRoute that is itself attached to a Gateway.\nIn this case, the relevant object for status is the Gateway, and that is the\nancestor object referred to in this status.\n\nNote that a parent is also an ancestor, so for objects where the parent is the\nrelevant object for status, this struct SHOULD still be used.\n\nThis struct is intended to be used in a slice that's effectively a map,\nwith a composite key made up of the AncestorRef and the ControllerName.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.PolicyStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"PolicyStatus","fields":[{"fieldName":"Ancestors","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.PolicyAncestorStatus","typeDecorators":["List"],"docString":"Ancestors is a list of ancestor resources (usually Gateways) that are\nassociated with the policy, and the status of the policy with respect to\neach ancestor. When this policy attaches to a parent, the controller that\nmanages the parent and the ancestors MUST add an entry to this list when\nthe controller first sees the policy and SHOULD update the entry as\nappropriate when the relevant ancestor is modified.\n\nNote that choosing the relevant ancestor is left to the Policy designers;\nan important part of Policy design is designing the right object level at\nwhich to namespace this status.\n\nNote also that implementations MUST ONLY populate ancestor status for\nthe Ancestor resources they are responsible for. Implementations MUST\nuse the ControllerName field to uniquely identify the entries in this list\nthat they are responsible for.\n\nNote that to achieve this, the list of PolicyAncestorStatus structs\nMUST be treated as a map with a composite key, made up of the AncestorRef\nand ControllerName fields combined.\n\nA maximum of 16 ancestors will be represented in this list. An empty list\nmeans the Policy is not relevant for any ancestors.\n\nIf this slice is full, implementations MUST NOT add further entries.\nInstead they MUST consider the policy unimplementable and signal that\non any related resources such as the ancestor that would be referenced\nhere. For example, if this list was full on BackendTLSPolicy, no\nadditional Gateways would be able to reference the Service targeted by\nthe BackendTLSPolicy.\n\n+kubebuilder:validation:MaxItems=16"}],"enumValues":[],"docString":"PolicyStatus defines the common attributes that all Policies should include within\ntheir status.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.ReferenceGrantList":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"ReferenceGrantList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.ReferenceGrant","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"+kubebuilder:object:root=true\nReferenceGrantList contains a list of ReferenceGrant.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRoute":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TCPRoute","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRouteSpec","typeDecorators":null,"docString":"Spec defines the desired state of TCPRoute."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRouteStatus","typeDecorators":null,"docString":"Status defines the current state of TCPRoute."}],"enumValues":[],"docString":"TCPRoute provides a way to route TCP requests. When combined with a Gateway\nlistener, it can be used to forward connections on the port specified by the\nlistener to a set of backends specified by the TCPRoute.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRouteList":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TCPRouteList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRoute","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"TCPRouteList contains a list of TCPRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRouteRule":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TCPRouteRule","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":["Ptr"],"docString":"Name is the name of the route rule. This name MUST be unique within a Route if it is set.\n\nSupport: Extended\n+optional"},{"fieldName":"BackendRefs","typeName":"BackendRef","typeDecorators":["List"],"docString":"BackendRefs defines the backend(s) where matching requests should be\nsent. If unspecified or invalid (refers to a nonexistent resource or a\nService with no endpoints), the underlying implementation MUST actively\nreject connection attempts to this backend. Connection rejections must\nrespect weight; if an invalid backend is requested to have 80% of\nconnections, then 80% of connections must be rejected instead.\n\nSupport: Core for Kubernetes Service\n\nSupport: Extended for Kubernetes ServiceImport\n\nSupport: Implementation-specific for any other resource\n\nSupport for weight: Extended\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16"}],"enumValues":[],"docString":"TCPRouteRule is the configuration for a given rule.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRouteSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TCPRouteSpec","fields":[{"fieldName":"CommonRouteSpec","typeName":"CommonRouteSpec","typeDecorators":null,"docString":""},{"fieldName":"Rules","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRouteRule","typeDecorators":["List"],"docString":"Rules are a list of TCP matchers and actions.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16\n\u003cgateway:experimental:validation:XValidation:message=\"Rule name must be unique within the route\",rule=\"self.all(l1, !has(l1.name) || self.exists_one(l2, has(l2.name) \u0026\u0026 l1.name == l2.name))\"\u003e"}],"enumValues":[],"docString":"TCPRouteSpec defines the desired state of TCPRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.TCPRouteStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TCPRouteStatus","fields":[{"fieldName":"RouteStatus","typeName":"RouteStatus","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"TCPRouteStatus defines the observed state of TCPRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRoute":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TLSRoute","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteSpec","typeDecorators":null,"docString":"Spec defines the desired state of TLSRoute."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteStatus","typeDecorators":null,"docString":"Status defines the current state of TLSRoute."}],"enumValues":[],"docString":"The TLSRoute resource is similar to TCPRoute, but can be configured\nto match against TLS-specific metadata. This allows more flexibility\nin matching streams for a given TLS listener.\n\nIf you need to forward traffic to a single target for a TLS listener, you\ncould choose to use a TCPRoute with a TLS listener.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteList":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TLSRouteList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRoute","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"TLSRouteList contains a list of TLSRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteRule":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TLSRouteRule","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":["Ptr"],"docString":"Name is the name of the route rule. This name MUST be unique within a Route if it is set.\n\nSupport: Extended\n+optional"},{"fieldName":"BackendRefs","typeName":"BackendRef","typeDecorators":["List"],"docString":"BackendRefs defines the backend(s) where matching requests should be\nsent. If unspecified or invalid (refers to a nonexistent resource or\na Service with no endpoints), the rule performs no forwarding; if no\nfilters are specified that would result in a response being sent, the\nunderlying implementation must actively reject request attempts to this\nbackend, by rejecting the connection or returning a 500 status code.\nRequest rejections must respect weight; if an invalid backend is\nrequested to have 80% of requests, then 80% of requests must be rejected\ninstead.\n\nSupport: Core for Kubernetes Service\n\nSupport: Extended for Kubernetes ServiceImport\n\nSupport: Implementation-specific for any other resource\n\nSupport for weight: Extended\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16"}],"enumValues":[],"docString":"TLSRouteRule is the configuration for a given rule.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TLSRouteSpec","fields":[{"fieldName":"CommonRouteSpec","typeName":"CommonRouteSpec","typeDecorators":null,"docString":""},{"fieldName":"Hostnames","typeName":"Hostname","typeDecorators":["List"],"docString":"Hostnames defines a set of SNI names that should match against the\nSNI attribute of TLS ClientHello message in TLS handshake. This matches\nthe RFC 1123 definition of a hostname with 2 notable exceptions:\n\n1. IPs are not allowed in SNI names per RFC 6066.\n2. A hostname may be prefixed with a wildcard label (`*.`). The wildcard\n   label must appear by itself as the first label.\n\nIf a hostname is specified by both the Listener and TLSRoute, there\nmust be at least one intersecting hostname for the TLSRoute to be\nattached to the Listener. For example:\n\n* A Listener with `test.example.com` as the hostname matches TLSRoutes\n  that have either not specified any hostnames, or have specified at\n  least one of `test.example.com` or `*.example.com`.\n* A Listener with `*.example.com` as the hostname matches TLSRoutes\n  that have either not specified any hostnames or have specified at least\n  one hostname that matches the Listener hostname. For example,\n  `test.example.com` and `*.example.com` would both match. On the other\n  hand, `example.com` and `test.example.net` would not match.\n\nIf both the Listener and TLSRoute have specified hostnames, any\nTLSRoute hostnames that do not match the Listener hostname MUST be\nignored. For example, if a Listener specified `*.example.com`, and the\nTLSRoute specified `test.example.com` and `test.example.net`,\n`test.example.net` must not be considered for a match.\n\nIf both the Listener and TLSRoute have specified hostnames, and none\nmatch with the criteria above, then the TLSRoute is not accepted. The\nimplementation must raise an 'Accepted' Condition with a status of\n`False` in the corresponding RouteParentStatus.\n\nSupport: Core\n\n+optional\n+kubebuilder:validation:MaxItems=16"},{"fieldName":"Rules","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteRule","typeDecorators":["List"],"docString":"Rules are a list of TLS matchers and actions.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16\n\u003cgateway:experimental:validation:XValidation:message=\"Rule name must be unique within the route\",rule=\"self.all(l1, !has(l1.name) || self.exists_one(l2, has(l2.name) \u0026\u0026 l1.name == l2.name))\"\u003e"}],"enumValues":[],"docString":"TLSRouteSpec defines the desired state of a TLSRoute resource.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.TLSRouteStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"TLSRouteStatus","fields":[{"fieldName":"RouteStatus","typeName":"RouteStatus","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"TLSRouteStatus defines the observed state of TLSRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRoute":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"UDPRoute","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRouteSpec","typeDecorators":null,"docString":"Spec defines the desired state of UDPRoute."},{"fieldName":"Status","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRouteStatus","typeDecorators":null,"docString":"Status defines the current state of UDPRoute."}],"enumValues":[],"docString":"UDPRoute provides a way to route UDP traffic. When combined with a Gateway\nlistener, it can be used to forward traffic on the port specified by the\nlistener to a set of backends specified by the UDPRoute.","isRoot":true},"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRouteList":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"UDPRouteList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRoute","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"UDPRouteList contains a list of UDPRoute","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRouteRule":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"UDPRouteRule","fields":[{"fieldName":"Name","typeName":"SectionName","typeDecorators":["Ptr"],"docString":"Name is the name of the route rule. This name MUST be unique within a Route if it is set.\n\nSupport: Extended\n+optional"},{"fieldName":"BackendRefs","typeName":"BackendRef","typeDecorators":["List"],"docString":"BackendRefs defines the backend(s) where matching requests should be\nsent. If unspecified or invalid (refers to a nonexistent resource or a\nService with no endpoints), the underlying implementation MUST actively\nreject connection attempts to this backend. Packet drops must\nrespect weight; if an invalid backend is requested to have 80% of\nthe packets, then 80% of packets must be dropped instead.\n\nSupport: Core for Kubernetes Service\n\nSupport: Extended for Kubernetes ServiceImport\n\nSupport: Implementation-specific for any other resource\n\nSupport for weight: Extended\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16"}],"enumValues":[],"docString":"UDPRouteRule is the configuration for a given rule.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRouteSpec":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"UDPRouteSpec","fields":[{"fieldName":"CommonRouteSpec","typeName":"CommonRouteSpec","typeDecorators":null,"docString":""},{"fieldName":"Rules","typeName":"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRouteRule","typeDecorators":["List"],"docString":"Rules are a list of UDP matchers and actions.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=16\n\u003cgateway:experimental:validation:XValidation:message=\"Rule name must be unique within the route\",rule=\"self.all(l1, !has(l1.name) || self.exists_one(l2, has(l2.name) \u0026\u0026 l1.name == l2.name))\"\u003e"}],"enumValues":[],"docString":"UDPRouteSpec defines the desired state of UDPRoute.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha2.UDPRouteStatus":{"package":"sigs.k8s.io/gateway-api/apis/v1alpha2","typeName":"UDPRouteStatus","fields":[{"fieldName":"RouteStatus","typeName":"RouteStatus","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"UDPRouteStatus defines the observed state of UDPRoute.","isRoot":false},"sigs.k8s.io/gateway-api/apis/v1alpha3.BackendTLSPolicy":{"package":"sigs.
