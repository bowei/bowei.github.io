io/api/core/v1.TypedLocalObjectReference","typeDecorators":["Ptr"],"docString":"dataSource field can be used to specify either:\n* An existing VolumeSnapshot object (snapshot.storage.k8s.io/VolumeSnapshot)\n* An existing PVC (PersistentVolumeClaim)\nIf the provisioner or an external controller can support the specified data source,\nit will create a new volume based on the contents of the specified data source.\nWhen the AnyVolumeDataSource feature gate is enabled, dataSource contents will be copied to dataSourceRef,\nand dataSourceRef contents will be copied to dataSource when dataSourceRef.namespace is not specified.\nIf the namespace is specified, then dataSourceRef will not be copied to dataSource.\n+optional"},{"fieldName":"DataSourceRef","typeName":"k8s.io/api/core/v1.TypedObjectReference","typeDecorators":["Ptr"],"docString":"dataSourceRef specifies the object from which to populate the volume with data, if a non-empty\nvolume is desired. This may be any object from a non-empty API group (non\ncore object) or a PersistentVolumeClaim object.\nWhen this field is specified, volume binding will only succeed if the type of\nthe specified object matches some installed volume populator or dynamic\nprovisioner.\nThis field will replace the functionality of the dataSource field and as such\nif both fields are non-empty, they must have the same value. For backwards\ncompatibility, when namespace isn't specified in dataSourceRef,\nboth fields (dataSource and dataSourceRef) will be set to the same\nvalue automatically if one of them is empty and the other is non-empty.\nWhen namespace is specified in dataSourceRef,\ndataSource isn't set to the same value and must be empty.\nThere are three important differences between dataSource and dataSourceRef:\n* While dataSource only allows two specific types of objects, dataSourceRef\n  allows any non-core object, as well as PersistentVolumeClaim objects.\n* While dataSource ignores disallowed values (dropping them), dataSourceRef\n  preserves all values, and generates an error if a disallowed value is\n  specified.\n* While dataSource only allows local objects, dataSourceRef allows objects\n  in any namespaces.\n(Beta) Using this field requires the AnyVolumeDataSource feature gate to be enabled.\n(Alpha) Using the namespace field of dataSourceRef requires the CrossNamespaceVolumeDataSource feature gate to be enabled.\n+optional"},{"fieldName":"VolumeAttributesClassName","typeName":"string","typeDecorators":["Ptr"],"docString":"volumeAttributesClassName may be used to set the VolumeAttributesClass used by this claim.\nIf specified, the CSI driver will create or update the volume with the attributes defined\nin the corresponding VolumeAttributesClass. This has a different purpose than storageClassName,\nit can be changed after the claim is created. An empty string value means that no VolumeAttributesClass\nwill be applied to the claim but it's not allowed to reset this field to empty string once it is set.\nIf unspecified and the PersistentVolumeClaim is unbound, the default VolumeAttributesClass\nwill be set by the persistentvolume controller if it exists.\nIf the resource referred to by volumeAttributesClass does not exist, this PersistentVolumeClaim will be\nset to a Pending state, as reflected by the modifyVolumeStatus field, until such as a resource\nexists.\nMore info: https://kubernetes.io/docs/concepts/storage/volume-attributes-classes/\n(Beta) Using this field requires the VolumeAttributesClass feature gate to be enabled (off by default).\n+featureGate=VolumeAttributesClass\n+optional"}],"enumValues":[],"docString":"PersistentVolumeClaimSpec describes the common attributes of storage devices\nand allows a Source for provider-specific attributes","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaimStatus":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimStatus","fields":[{"fieldName":"Phase","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimPhase","typeDecorators":null,"docString":"phase represents the current phase of PersistentVolumeClaim.\n+optional"},{"fieldName":"AccessModes","typeName":"k8s.io/api/core/v1.PersistentVolumeAccessMode","typeDecorators":["List"],"docString":"accessModes contains the actual access modes the volume backing the PVC has.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#access-modes-1\n+optional\n+listType=atomic"},{"fieldName":"Capacity","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"capacity represents the actual resources of the underlying volume.\n+optional"},{"fieldName":"Conditions","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimCondition","typeDecorators":["List"],"docString":"conditions is the current Condition of persistent volume claim. If underlying persistent volume is being\nresized then the Condition will be set to 'Resizing'.\n+optional\n+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"},{"fieldName":"AllocatedResources","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"allocatedResources tracks the resources allocated to a PVC including its capacity.\nKey names follow standard Kubernetes label syntax. Valid values are either:\n\t* Un-prefixed keys:\n\t\t- storage - the capacity of the volume.\n\t* Custom resources must use implementation-defined prefixed names such as \"example.com/my-custom-resource\"\nApart from above values - keys that are unprefixed or have kubernetes.io prefix are considered\nreserved and hence may not be used.\n\nCapacity reported here may be larger than the actual capacity when a volume expansion operation\nis requested.\nFor storage quota, the larger value from allocatedResources and PVC.spec.resources is used.\nIf allocatedResources is not set, PVC.spec.resources alone is used for quota calculation.\nIf a volume expansion capacity request is lowered, allocatedResources is only\nlowered if there are no expansion operations in progress and if the actual volume capacity\nis equal or lower than the requested capacity.\n\nA controller that receives PVC update with previously unknown resourceName\nshould ignore the update for the purpose it was designed. For example - a controller that\nonly is responsible for resizing capacity of the volume, should ignore PVC updates that change other valid\nresources associated with PVC.\n\nThis is an alpha field and requires enabling RecoverVolumeExpansionFailure feature.\n+featureGate=RecoverVolumeExpansionFailure\n+optional"},{"fieldName":"AllocatedResourceStatuses","typeName":"k8s.io/api/core/v1.ClaimResourceStatus","typeDecorators":["Map[k8s.io/api/core/v1.ResourceName]"],"docString":"allocatedResourceStatuses stores status of resource being resized for the given PVC.\nKey names follow standard Kubernetes label syntax. Valid values are either:\n\t* Un-prefixed keys:\n\t\t- storage - the capacity of the volume.\n\t* Custom resources must use implementation-defined prefixed names such as \"example.com/my-custom-resource\"\nApart from above values - keys that are unprefixed or have kubernetes.io prefix are considered\nreserved and hence may not be used.\n\nClaimResourceStatus can be in any of following states:\n\t- ControllerResizeInProgress:\n\t\tState set when resize controller starts resizing the volume in control-plane.\n\t- ControllerResizeFailed:\n\t\tState set when resize has failed in resize controller with a terminal error.\n\t- NodeResizePending:\n\t\tState set when resize controller has finished resizing the volume but further resizing of\n\t\tvolume is needed on the node.\n\t- NodeResizeInProgress:\n\t\tState set when kubelet starts resizing the volume.\n\t- NodeResizeFailed:\n\t\tState set when resizing has failed in kubelet with a terminal error. Transient errors don't set\n\t\tNodeResizeFailed.\nFor example: if expanding a PVC for more capacity - this field can be one of the following states:\n\t- pvc.status.allocatedResourceStatus['storage'] = \"ControllerResizeInProgress\"\n     - pvc.status.allocatedResourceStatus['storage'] = \"ControllerResizeFailed\"\n     - pvc.status.allocatedResourceStatus['storage'] = \"NodeResizePending\"\n     - pvc.status.allocatedResourceStatus['storage'] = \"NodeResizeInProgress\"\n     - pvc.status.allocatedResourceStatus['storage'] = \"NodeResizeFailed\"\nWhen this field is not set, it means that no resize operation is in progress for the given PVC.\n\nA controller that receives PVC update with previously unknown resourceName or ClaimResourceStatus\nshould ignore the update for the purpose it was designed. For example - a controller that\nonly is responsible for resizing capacity of the volume, should ignore PVC updates that change other valid\nresources associated with PVC.\n\nThis is an alpha field and requires enabling RecoverVolumeExpansionFailure feature.\n+featureGate=RecoverVolumeExpansionFailure\n+mapType=granular\n+optional"},{"fieldName":"CurrentVolumeAttributesClassName","typeName":"string","typeDecorators":["Ptr"],"docString":"currentVolumeAttributesClassName is the current name of the VolumeAttributesClass the PVC is using.\nWhen unset, there is no VolumeAttributeClass applied to this PersistentVolumeClaim\nThis is a beta field and requires enabling VolumeAttributesClass feature (off by default).\n+featureGate=VolumeAttributesClass\n+optional"},{"fieldName":"ModifyVolumeStatus","typeName":"k8s.io/api/core/v1.ModifyVolumeStatus","typeDecorators":["Ptr"],"docString":"ModifyVolumeStatus represents the status object of ControllerModifyVolume operation.\nWhen this is unset, there is no ModifyVolume operation being attempted.\nThis is a beta field and requires enabling VolumeAttributesClass feature (off by default).\n+featureGate=VolumeAttributesClass\n+optional"}],"enumValues":[],"docString":"PersistentVolumeClaimStatus is the current status of a persistent volume claim.","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaimTemplate":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimTemplate","fields":[{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"May contain labels and annotations that will be copied into the PVC\nwhen creating it. No other fields are allowed and will be rejected during\nvalidation.\n\n+optional"},{"fieldName":"Spec","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimSpec","typeDecorators":null,"docString":"The specification for the PersistentVolumeClaim. The entire content is\ncopied unchanged into the PVC that gets created from this\ntemplate. The same fields as in a PersistentVolumeClaim\nare also valid here."}],"enumValues":[],"docString":"PersistentVolumeClaimTemplate is used to produce\nPersistentVolumeClaim objects as part of an EphemeralVolumeSource.","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaimVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimVolumeSource","fields":[{"fieldName":"ClaimName","typeName":"string","typeDecorators":null,"docString":"claimName is the name of a PersistentVolumeClaim in the same namespace as the pod using this volume.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly Will force the ReadOnly setting in VolumeMounts.\nDefault false.\n+optional"}],"enumValues":[],"docString":"PersistentVolumeClaimVolumeSource references the user's PVC in the same namespace.\nThis volume finds the bound PV and mounts that volume for the pod. A\nPersistentVolumeClaimVolumeSource is, essentially, a wrapper around another\ntype of volume that is owned by someone else (the system).","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeList":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.PersistentVolume","typeDecorators":["List"],"docString":"items is a list of persistent volumes.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes"}],"enumValues":[],"docString":"PersistentVolumeList is a list of PersistentVolume items.","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeMode":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeMode","fields":[],"enumValues":[{"name":"PersistentVolumeBlock","docString":"PersistentVolumeBlock means the volume will not be formatted with a filesystem and will remain a raw block device."},{"name":"PersistentVolumeFilesystem","docString":"PersistentVolumeFilesystem means the volume will be or is formatted with a filesystem."}],"docString":"PersistentVolumeMode describes how a volume is intended to be consumed, either Block or Filesystem.\n+enum","isRoot":false},"k8s.io/api/core/v1.PersistentVolumePhase":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumePhase","fields":[],"enumValues":[{"name":"VolumePending","docString":"used for PersistentVolumes that are not available"},{"name":"VolumeAvailable","docString":"used for PersistentVolumes that are not yet bound\nAvailable volumes are held by the binder and matched to PersistentVolumeClaims"},{"name":"VolumeBound","docString":"used for PersistentVolumes that are bound"},{"name":"VolumeReleased","docString":"used for PersistentVolumes where the bound PersistentVolumeClaim was deleted\nreleased volumes must be recycled before becoming available again\nthis phase is used by the persistent volume claim binder to signal to another process to reclaim the resource"},{"name":"VolumeFailed","docString":"used for PersistentVolumes that failed to be correctly recycled or deleted after being released from a claim"}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeReclaimPolicy":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeReclaimPolicy","fields":[],"enumValues":[{"name":"PersistentVolumeReclaimRecycle","docString":"PersistentVolumeReclaimRecycle means the volume will be recycled back into the pool of unbound persistent volumes on release from its claim.\nThe volume plugin must support Recycling."},{"name":"PersistentVolumeReclaimDelete","docString":"PersistentVolumeReclaimDelete means the volume will be deleted from Kubernetes on release from its claim.\nThe volume plugin must support Deletion."},{"name":"PersistentVolumeReclaimRetain","docString":"PersistentVolumeReclaimRetain means the volume will be left in its current phase (Released) for manual reclamation by the administrator.\nThe default policy is Retain."}],"docString":"PersistentVolumeReclaimPolicy describes a policy for end-of-life maintenance of persistent volumes.\n+enum","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeSource","fields":[{"fieldName":"GCEPersistentDisk","typeName":"k8s.io/api/core/v1.GCEPersistentDiskVolumeSource","typeDecorators":["Ptr"],"docString":"gcePersistentDisk represents a GCE Disk resource that is attached to a\nkubelet's host machine and then exposed to the pod. Provisioned by an admin.\nDeprecated: GCEPersistentDisk is deprecated. All operations for the in-tree\ngcePersistentDisk type are redirected to the pd.csi.storage.gke.io CSI driver.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk\n+optional"},{"fieldName":"AWSElasticBlockStore","typeName":"k8s.io/api/core/v1.AWSElasticBlockStoreVolumeSource","typeDecorators":["Ptr"],"docString":"awsElasticBlockStore represents an AWS Disk resource that is attached to a\nkubelet's host machine and then exposed to the pod.\nDeprecated: AWSElasticBlockStore is deprecated. All operations for the in-tree\nawsElasticBlockStore type are redirected to the ebs.csi.aws.com CSI driver.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore\n+optional"},{"fieldName":"HostPath","typeName":"k8s.io/api/core/v1.HostPathVolumeSource","typeDecorators":["Ptr"],"docString":"hostPath represents a directory on the host.\nProvisioned by a developer or tester.\nThis is useful for single-node development and testing only!\nOn-host storage is not supported in any way and WILL NOT WORK in a multi-node cluster.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#hostpath\n+optional"},{"fieldName":"Glusterfs","typeName":"k8s.io/api/core/v1.GlusterfsPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"glusterfs represents a Glusterfs volume that is attached to a host and\nexposed to the pod. Provisioned by an admin.\nDeprecated: Glusterfs is deprecated and the in-tree glusterfs type is no longer supported.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md\n+optional"},{"fieldName":"NFS","typeName":"k8s.io/api/core/v1.NFSVolumeSource","typeDecorators":["Ptr"],"docString":"nfs represents an NFS mount on the host. Provisioned by an admin.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#nfs\n+optional"},{"fieldName":"RBD","typeName":"k8s.io/api/core/v1.RBDPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"rbd represents a Rados Block Device mount on the host that shares a pod's lifetime.\nDeprecated: RBD is deprecated and the in-tree rbd type is no longer supported.\nMore info: https://examples.k8s.io/volumes/rbd/README.md\n+optional"},{"fieldName":"ISCSI","typeName":"k8s.io/api/core/v1.ISCSIPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"iscsi represents an ISCSI Disk resource that is attached to a\nkubelet's host machine and then exposed to the pod. Provisioned by an admin.\n+optional"},{"fieldName":"Cinder","typeName":"k8s.io/api/core/v1.CinderPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"cinder represents a cinder volume attached and mounted on kubelets host machine.\nDeprecated: Cinder is deprecated. All operations for the in-tree cinder type\nare redirected to the cinder.csi.openstack.org CSI driver.\nMore info: https://examples.k8s.io/mysql-cinder-pd/README.md\n+optional"},{"fieldName":"CephFS","typeName":"k8s.io/api/core/v1.CephFSPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"cephFS represents a Ceph FS mount on the host that shares a pod's lifetime.\nDeprecated: CephFS is deprecated and the in-tree cephfs type is no longer supported.\n+optional"},{"fieldName":"FC","typeName":"k8s.io/api/core/v1.FCVolumeSource","typeDecorators":["Ptr"],"docString":"fc represents a Fibre Channel resource that is attached to a kubelet's host machine and then exposed to the pod.\n+optional"},{"fieldName":"Flocker","typeName":"k8s.io/api/core/v1.FlockerVolumeSource","typeDecorators":["Ptr"],"docString":"flocker represents a Flocker volume attached to a kubelet's host machine and exposed to the pod for its usage. This depends on the Flocker control service being running.\nDeprecated: Flocker is deprecated and the in-tree flocker type is no longer supported.\n+optional"},{"fieldName":"FlexVolume","typeName":"k8s.io/api/core/v1.FlexPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"flexVolume represents a generic volume resource that is\nprovisioned/attached using an exec based plugin.\nDeprecated: FlexVolume is deprecated. Consider using a CSIDriver instead.\n+optional"},{"fieldName":"AzureFile","typeName":"k8s.io/api/core/v1.AzureFilePersistentVolumeSource","typeDecorators":["Ptr"],"docString":"azureFile represents an Azure File Service mount on the host and bind mount to the pod.\nDeprecated: AzureFile is deprecated. All operations for the in-tree azureFile type\nare redirected to the file.csi.azure.com CSI driver.\n+optional"},{"fieldName":"VsphereVolume","typeName":"k8s.io/api/core/v1.VsphereVirtualDiskVolumeSource","typeDecorators":["Ptr"],"docString":"vsphereVolume represents a vSphere volume attached and mounted on kubelets host machine.\nDeprecated: VsphereVolume is deprecated. All operations for the in-tree vsphereVolume type\nare redirected to the csi.vsphere.vmware.com CSI driver.\n+optional"},{"fieldName":"Quobyte","typeName":"k8s.io/api/core/v1.QuobyteVolumeSource","typeDecorators":["Ptr"],"docString":"quobyte represents a Quobyte mount on the host that shares a pod's lifetime.\nDeprecated: Quobyte is deprecated and the in-tree quobyte type is no longer supported.\n+optional"},{"fieldName":"AzureDisk","typeName":"k8s.io/api/core/v1.AzureDiskVolumeSource","typeDecorators":["Ptr"],"docString":"azureDisk represents an Azure Data Disk mount on the host and bind mount to the pod.\nDeprecated: AzureDisk is deprecated. All operations for the in-tree azureDisk type\nare redirected to the disk.csi.azure.com CSI driver.\n+optional"},{"fieldName":"PhotonPersistentDisk","typeName":"k8s.io/api/core/v1.PhotonPersistentDiskVolumeSource","typeDecorators":["Ptr"],"docString":"photonPersistentDisk represents a PhotonController persistent disk attached and mounted on kubelets host machine.\nDeprecated: PhotonPersistentDisk is deprecated and the in-tree photonPersistentDisk type is no longer supported."},{"fieldName":"PortworxVolume","typeName":"k8s.io/api/core/v1.PortworxVolumeSource","typeDecorators":["Ptr"],"docString":"portworxVolume represents a portworx volume attached and mounted on kubelets host machine.\nDeprecated: PortworxVolume is deprecated. All operations for the in-tree portworxVolume type\nare redirected to the pxd.portworx.com CSI driver when the CSIMigrationPortworx feature-gate\nis on.\n+optional"},{"fieldName":"ScaleIO","typeName":"k8s.io/api/core/v1.ScaleIOPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"scaleIO represents a ScaleIO persistent volume attached and mounted on Kubernetes nodes.\nDeprecated: ScaleIO is deprecated and the in-tree scaleIO type is no longer supported.\n+optional"},{"fieldName":"Local","typeName":"k8s.io/api/core/v1.LocalVolumeSource","typeDecorators":["Ptr"],"docString":"local represents directly-attached storage with node affinity\n+optional"},{"fieldName":"StorageOS","typeName":"k8s.io/api/core/v1.StorageOSPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"storageOS represents a StorageOS volume that is attached to the kubelet's host machine and mounted into the pod.\nDeprecated: StorageOS is deprecated and the in-tree storageos type is no longer supported.\nMore info: https://examples.k8s.io/volumes/storageos/README.md\n+optional"},{"fieldName":"CSI","typeName":"k8s.io/api/core/v1.CSIPersistentVolumeSource","typeDecorators":["Ptr"],"docString":"csi represents storage that is handled by an external CSI driver.\n+optional"}],"enumValues":[],"docString":"PersistentVolumeSource is similar to VolumeSource but meant for the\nadministrator who creates PVs. Exactly one of its members must be set.","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeSpec":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeSpec","fields":[{"fieldName":"Capacity","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"capacity is the description of the persistent volume's resources and capacity.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#capacity\n+optional"},{"fieldName":"PersistentVolumeSource","typeName":"k8s.io/api/core/v1.PersistentVolumeSource","typeDecorators":null,"docString":"persistentVolumeSource is the actual volume backing the persistent volume."},{"fieldName":"AccessModes","typeName":"k8s.io/api/core/v1.PersistentVolumeAccessMode","typeDecorators":["List"],"docString":"accessModes contains all ways the volume can be mounted.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#access-modes\n+optional\n+listType=atomic"},{"fieldName":"ClaimRef","typeName":"k8s.io/api/core/v1.ObjectReference","typeDecorators":["Ptr"],"docString":"claimRef is part of a bi-directional binding between PersistentVolume and PersistentVolumeClaim.\nExpected to be non-nil when bound.\nclaim.VolumeName is the authoritative bind between PV and PVC.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#binding\n+optional\n+structType=granular"},{"fieldName":"PersistentVolumeReclaimPolicy","typeName":"k8s.io/api/core/v1.PersistentVolumeReclaimPolicy","typeDecorators":null,"docString":"persistentVolumeReclaimPolicy defines what happens to a persistent volume when released from its claim.\nValid options are Retain (default for manually created PersistentVolumes), Delete (default\nfor dynamically provisioned PersistentVolumes), and Recycle (deprecated).\nRecycle must be supported by the volume plugin underlying this PersistentVolume.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#reclaiming\n+optional"},{"fieldName":"StorageClassName","typeName":"string","typeDecorators":null,"docString":"storageClassName is the name of StorageClass to which this persistent volume belongs. Empty value\nmeans that this volume does not belong to any StorageClass.\n+optional"},{"fieldName":"MountOptions","typeName":"string","typeDecorators":["List"],"docString":"mountOptions is the list of mount options, e.g. [\"ro\", \"soft\"]. Not validated - mount will\nsimply fail if one is invalid.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#mount-options\n+optional\n+listType=atomic"},{"fieldName":"VolumeMode","typeName":"k8s.io/api/core/v1.PersistentVolumeMode","typeDecorators":["Ptr"],"docString":"volumeMode defines if a volume is intended to be used with a formatted filesystem\nor to remain in raw block state. Value of Filesystem is implied when not included in spec.\n+optional"},{"fieldName":"NodeAffinity","typeName":"k8s.io/api/core/v1.VolumeNodeAffinity","typeDecorators":["Ptr"],"docString":"nodeAffinity defines constraints that limit what nodes this volume can be accessed from.\nThis field influences the scheduling of pods that use this volume.\n+optional"},{"fieldName":"VolumeAttributesClassName","typeName":"string","typeDecorators":["Ptr"],"docString":"Name of VolumeAttributesClass to which this persistent volume belongs. Empty value\nis not allowed. When this field is not set, it indicates that this volume does not belong to any\nVolumeAttributesClass. This field is mutable and can be changed by the CSI driver\nafter a volume has been updated successfully to a new class.\nFor an unbound PersistentVolume, the volumeAttributesClassName will be matched with unbound\nPersistentVolumeClaims during the binding process.\nThis is a beta field and requires enabling VolumeAttributesClass feature (off by default).\n+featureGate=VolumeAttributesClass\n+optional"}],"enumValues":[],"docString":"PersistentVolumeSpec is the specification of a persistent volume.","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeStatus":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeStatus","fields":[{"fieldName":"Phase","typeName":"k8s.io/api/core/v1.PersistentVolumePhase","typeDecorators":null,"docString":"phase indicates if a volume is available, bound to a claim, or released by a claim.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#phase\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"message is a human-readable message indicating details about why the volume is in this state.\n+optional"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"reason is a brief CamelCase string that describes any failure and is meant\nfor machine parsing and tidy display in the CLI.\n+optional"},{"fieldName":"LastPhaseTransitionTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":"lastPhaseTransitionTime is the time the phase transitioned from one to another\nand automatically resets to current time everytime a volume phase transitions.\n+optional"}],"enumValues":[],"docString":"PersistentVolumeStatus is the current status of a persistent volume.","isRoot":false},"k8s.io/api/core/v1.PhotonPersistentDiskVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"PhotonPersistentDiskVolumeSource","fields":[{"fieldName":"PdID","typeName":"string","typeDecorators":null,"docString":"pdID is the ID that identifies Photon Controller persistent disk"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified."}],"enumValues":[],"docString":"Represents a Photon Controller persistent disk resource.","isRoot":false},"k8s.io/api/core/v1.Pod":{"package":"k8s.io/api/core/v1","typeName":"Pod","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Spec","typeName":"k8s.io/api/core/v1.PodSpec","typeDecorators":null,"docString":"Specification of the desired behavior of the pod.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.PodStatus","typeDecorators":null,"docString":"Most recently observed status of the pod.\nThis data may not be up to date.\nPopulated by the system.\nRead-only.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"}],"enumValues":[],"docString":"Pod is a collection of containers that can run on a host. This resource is created\nby clients and scheduled onto hosts.","isRoot":true},"k8s.io/api/core/v1.PodAffinity":{"package":"k8s.io/api/core/v1","typeName":"PodAffinity","fields":[{"fieldName":"RequiredDuringSchedulingIgnoredDuringExecution","typeName":"k8s.io/api/core/v1.PodAffinityTerm","typeDecorators":["List"],"docString":"If the affinity requirements specified by this field are not met at\nscheduling time, the pod will not be scheduled onto the node.\nIf the affinity requirements specified by this field cease to be met\nat some point during pod execution (e.g. due to a pod label update), the\nsystem may or may not try to eventually evict the pod from its node.\nWhen there are multiple elements, the lists of nodes corresponding to each\npodAffinityTerm are intersected, i.e. all terms must be satisfied.\n+optional\n+listType=atomic"},{"fieldName":"PreferredDuringSchedulingIgnoredDuringExecution","typeName":"k8s.io/api/core/v1.WeightedPodAffinityTerm","typeDecorators":["List"],"docString":"The scheduler will prefer to schedule pods to nodes that satisfy\nthe affinity expressions specified by this field, but it may choose\na node that violates one or more of the expressions. The node that is\nmost preferred is the one with the greatest sum of weights, i.e.\nfor each node that meets all of the scheduling requirements (resource\nrequest, requiredDuringScheduling affinity expressions, etc.),\ncompute a sum by iterating through the elements of this field and adding\n\"weight\" to the sum if the node has pods which matches the corresponding podAffinityTerm; the\nnode(s) with the highest sum are the most preferred.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"Pod affinity is a group of inter pod affinity scheduling rules.","isRoot":false},"k8s.io/api/core/v1.PodAffinityTerm":{"package":"k8s.io/api/core/v1","typeName":"PodAffinityTerm","fields":[{"fieldName":"LabelSelector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"A label query over a set of resources, in this case pods.\nIf it's null, this PodAffinityTerm matches with no Pods.\n+optional"},{"fieldName":"Namespaces","typeName":"string","typeDecorators":["List"],"docString":"namespaces specifies a static list of namespace names that the term applies to.\nThe term is applied to the union of the namespaces listed in this field\nand the ones selected by namespaceSelector.\nnull or empty namespaces list and null namespaceSelector means \"this pod's namespace\".\n+optional\n+listType=atomic"},{"fieldName":"TopologyKey","typeName":"string","typeDecorators":null,"docString":"This pod should be co-located (affinity) or not co-located (anti-affinity) with the pods matching\nthe labelSelector in the specified namespaces, where co-located is defined as running on a node\nwhose value of the label with key topologyKey matches that of any node on which any of the\nselected pods is running.\nEmpty topologyKey is not allowed."},{"fieldName":"NamespaceSelector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"A label query over the set of namespaces that the term applies to.\nThe term is applied to the union of the namespaces selected by this field\nand the ones listed in the namespaces field.\nnull selector and null or empty namespaces list means \"this pod's namespace\".\nAn empty selector ({}) matches all namespaces.\n+optional"},{"fieldName":"MatchLabelKeys","typeName":"string","typeDecorators":["List"],"docString":"MatchLabelKeys is a set of pod label keys to select which pods will\nbe taken into consideration. The keys are used to lookup values from the\nincoming pod labels, those key-value labels are merged with `labelSelector` as `key in (value)`\nto select the group of existing pods which pods will be taken into consideration\nfor the incoming pod's pod (anti) affinity. Keys that don't exist in the incoming\npod labels will be ignored. The default value is empty.\nThe same key is forbidden to exist in both matchLabelKeys and labelSelector.\nAlso, matchLabelKeys cannot be set when labelSelector isn't set.\n\n+listType=atomic\n+optional"},{"fieldName":"MismatchLabelKeys","typeName":"string","typeDecorators":["List"],"docString":"MismatchLabelKeys is a set of pod label keys to select which pods will\nbe taken into consideration. The keys are used to lookup values from the\nincoming pod labels, those key-value labels are merged with `labelSelector` as `key notin (value)`\nto select the group of existing pods which pods will be taken into consideration\nfor the incoming pod's pod (anti) affinity. Keys that don't exist in the incoming\npod labels will be ignored. The default value is empty.\nThe same key is forbidden to exist in both mismatchLabelKeys and labelSelector.\nAlso, mismatchLabelKeys cannot be set when labelSelector isn't set.\n\n+listType=atomic\n+optional"}],"enumValues":[],"docString":"Defines a set of pods (namely those matching the labelSelector\nrelative to the given namespace(s)) that this pod should be\nco-located (affinity) or not co-located (anti-affinity) with,\nwhere co-located is defined as running on a node whose value of\nthe label with key \u003ctopologyKey\u003e matches that of any node on which\na pod of the set of pods is running","isRoot":false},"k8s.io/api/core/v1.PodAntiAffinity":{"package":"k8s.io/api/core/v1","typeName":"PodAntiAffinity","fields":[{"fieldName":"RequiredDuringSchedulingIgnoredDuringExecution","typeName":"k8s.io/api/core/v1.PodAffinityTerm","typeDecorators":["List"],"docString":"If the anti-affinity requirements specified by this field are not met at\nscheduling time, the pod will not be scheduled onto the node.\nIf the anti-affinity requirements specified by this field cease to be met\nat some point during pod execution (e.g. due to a pod label update), the\nsystem may or may not try to eventually evict the pod from its node.\nWhen there are multiple elements, the lists of nodes corresponding to each\npodAffinityTerm are intersected, i.e. all terms must be satisfied.\n+optional\n+listType=atomic"},{"fieldName":"PreferredDuringSchedulingIgnoredDuringExecution","typeName":"k8s.io/api/core/v1.WeightedPodAffinityTerm","typeDecorators":["List"],"docString":"The scheduler will prefer to schedule pods to nodes that satisfy\nthe anti-affinity expressions specified by this field, but it may choose\na node that violates one or more of the expressions. The node that is\nmost preferred is the one with the greatest sum of weights, i.e.\nfor each node that meets all of the scheduling requirements (resource\nrequest, requiredDuringScheduling anti-affinity expressions, etc.),\ncompute a sum by iterating through the elements of this field and adding\n\"weight\" to the sum if the node has pods which matches the corresponding podAffinityTerm; the\nnode(s) with the highest sum are the most preferred.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"Pod anti affinity is a group of inter pod anti affinity scheduling rules.","isRoot":false},"k8s.io/api/core/v1.PodAttachOptions":{"package":"k8s.io/api/core/v1","typeName":"PodAttachOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Stdin","typeName":"bool","typeDecorators":null,"docString":"Stdin if true, redirects the standard input stream of the pod for this call.\nDefaults to false.\n+optional"},{"fieldName":"Stdout","typeName":"bool","typeDecorators":null,"docString":"Stdout if true indicates that stdout is to be redirected for the attach call.\nDefaults to true.\n+optional"},{"fieldName":"Stderr","typeName":"bool","typeDecorators":null,"docString":"Stderr if true indicates that stderr is to be redirected for the attach call.\nDefaults to true.\n+optional"},{"fieldName":"TTY","typeName":"bool","typeDecorators":null,"docString":"TTY if true indicates that a tty will be allocated for the attach call.\nThis is passed through the container runtime so the tty\nis allocated on the worker node by the container runtime.\nDefaults to false.\n+optional"},{"fieldName":"Container","typeName":"string","typeDecorators":null,"docString":"The container in which to execute the command.\nDefaults to only container if there is only one container in the pod.\n+optional"}],"enumValues":[],"docString":"PodAttachOptions is the query options to a Pod's remote attach call.\n---\nTODO: merge w/ PodExecOptions below for stdin, stdout, etc\nand also when we cut V2, we should export a \"StreamOptions\" or somesuch that contains Stdin, Stdout, Stder and TTY","isRoot":false},"k8s.io/api/core/v1.PodCondition":{"package":"k8s.io/api/core/v1","typeName":"PodCondition","fields":[{"fieldName":"Type","typeName":"k8s.io/api/core/v1.PodConditionType","typeDecorators":null,"docString":"Type is the type of the condition.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#pod-conditions"},{"fieldName":"ObservedGeneration","typeName":"int64","typeDecorators":null,"docString":"If set, this represents the .metadata.generation that the pod condition was set based upon.\nThis is an alpha field. Enable PodObservedGenerationTracking to be able to use this field.\n+featureGate=PodObservedGenerationTracking\n+optional"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.ConditionStatus","typeDecorators":null,"docString":"Status is the status of the condition.\nCan be True, False, Unknown.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#pod-conditions"},{"fieldName":"LastProbeTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Last time we probed the condition.\n+optional"},{"fieldName":"LastTransitionTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Last time the condition transitioned from one status to another.\n+optional"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"Unique, one-word, CamelCase reason for the condition's last transition.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"Human-readable message indicating details about last transition.\n+optional"}],"enumValues":[],"docString":"PodCondition contains details for the current condition of this pod.","isRoot":false},"k8s.io/api/core/v1.PodConditionType":{"package":"k8s.io/api/core/v1","typeName":"PodConditionType","fields":[],"enumValues":[{"name":"ContainersReady","docString":"ContainersReady indicates whether all containers in the pod are ready."},{"name":"PodInitialized","docString":"PodInitialized means that all init containers in the pod have started successfully."},{"name":"PodReady","docString":"PodReady means the pod is able to service requests and should be added to the\nload balancing pools of all matching services."},{"name":"PodScheduled","docString":"PodScheduled represents status of the scheduling process for this pod."},{"name":"DisruptionTarget","docString":"DisruptionTarget indicates the pod is about to be terminated due to a\ndisruption (such as preemption, eviction API or garbage-collection)."},{"name":"PodReadyToStartContainers","docString":"PodReadyToStartContainers pod sandbox is successfully configured and\nthe pod is ready to launch containers."},{"name":"PodResizePending","docString":"PodResizePending indicates that the pod has been resized, but kubelet has not\nyet allocated the resources. If both PodResizePending and PodResizeInProgress\nare set, it means that a new resize was requested in the middle of a previous\npod resize that is still in progress."},{"name":"PodResizeInProgress","docString":"PodResizeInProgress indicates that a resize is in progress, and is present whenever\nthe Kubelet has allocated resources for the resize, but has not yet actuated all of\nthe required changes.\nIf both PodResizePending and PodResizeInProgress are set, it means that a new resize was\nrequested in the middle of a previous pod resize that is still in progress."}],"docString":"PodConditionType is a valid value for PodCondition.Type","isRoot":false},"k8s.io/api/core/v1.PodDNSConfig":{"package":"k8s.io/api/core/v1","typeName":"PodDNSConfig","fields":[{"fieldName":"Nameservers","typeName":"string","typeDecorators":["List"],"docString":"A list of DNS name server IP addresses.\nThis will be appended to the base nameservers generated from DNSPolicy.\nDuplicated nameservers will be removed.\n+optional\n+listType=atomic"},{"fieldName":"Searches","typeName":"string","typeDecorators":["List"],"docString":"A list of DNS search domains for host-name lookup.\nThis will be appended to the base search paths generated from DNSPolicy.\nDuplicated search paths will be removed.\n+optional\n+listType=atomic"},{"fieldName":"Options","typeName":"k8s.io/api/core/v1.PodDNSConfigOption","typeDecorators":["List"],"docString":"A list of DNS resolver options.\nThis will be merged with the base options generated from DNSPolicy.\nDuplicated entries will be removed. Resolution options given in Options\nwill override those that appear in the base DNSPolicy.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"PodDNSConfig defines the DNS parameters of a pod in addition to\nthose generated from DNSPolicy.","isRoot":false},"k8s.io/api/core/v1.PodDNSConfigOption":{"package":"k8s.io/api/core/v1","typeName":"PodDNSConfigOption","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is this DNS resolver option's name.\nRequired."},{"fieldName":"Value","typeName":"string","typeDecorators":["Ptr"],"docString":"Value is this DNS resolver option's value.\n+optional"}],"enumValues":[],"docString":"PodDNSConfigOption defines DNS resolver options of a pod.","isRoot":false},"k8s.io/api/core/v1.PodExecOptions":{"package":"k8s.io/api/core/v1","typeName":"PodExecOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Stdin","typeName":"bool","typeDecorators":null,"docString":"Redirect the standard input stream of the pod for this call.\nDefaults to false.\n+optional"},{"fieldName":"Stdout","typeName":"bool","typeDecorators":null,"docString":"Redirect the standard output stream of the pod for this call.\n+optional"},{"fieldName":"Stderr","typeName":"bool","typeDecorators":null,"docString":"Redirect the standard error stream of the pod for this call.\n+optional"},{"fieldName":"TTY","typeName":"bool","typeDecorators":null,"docString":"TTY if true indicates that a tty will be allocated for the exec call.\nDefaults to false.\n+optional"},{"fieldName":"Container","typeName":"string","typeDecorators":null,"docString":"Container in which to execute the command.\nDefaults to only container if there is only one container in the pod.\n+optional"},{"fieldName":"Command","typeName":"string","typeDecorators":["List"],"docString":"Command is the remote command to execute. argv array. Not executed within a shell.\n+listType=atomic"}],"enumValues":[],"docString":"PodExecOptions is the query options to a Pod's remote exec call.\n---\nTODO: This is largely identical to PodAttachOptions above, make sure they stay in sync and see about merging\nand also when we cut V2, we should export a \"StreamOptions\" or somesuch that contains Stdin, Stdout, Stder and TTY","isRoot":false},"k8s.io/api/core/v1.PodFSGroupChangePolicy":{"package":"k8s.io/api/core/v1","typeName":"PodFSGroupChangePolicy","fields":[],"enumValues":[{"name":"FSGroupChangeOnRootMismatch","docString":"FSGroupChangeOnRootMismatch indicates that volume's ownership and permissions will be changed\nonly when permission and ownership of root directory does not match with expected\npermissions on the volume. This can help shorten the time it takes to change\nownership and permissions of a volume."},{"name":"FSGroupChangeAlways","docString":"FSGroupChangeAlways indicates that volume's ownership and permissions\nshould always be changed whenever volume is mounted inside a Pod. This the default\nbehavior."}],"docString":"PodFSGroupChangePolicy holds policies that will be used for applying fsGroup to a volume\nwhen volume is mounted.\n+enum","isRoot":false},"k8s.io/api/core/v1.PodIP":{"package":"k8s.io/api/core/v1","typeName":"PodIP","fields":[{"fieldName":"IP","typeName":"string","typeDecorators":null,"docString":"IP is the IP address assigned to the pod\n+required"}],"enumValues":[],"docString":"PodIP represents a single IP address allocated to the pod.","isRoot":false},"k8s.io/api/core/v1.PodList":{"package":"k8s.io/api/core/v1","typeName":"PodList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.Pod","typeDecorators":["List"],"docString":"List of pods.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md"}],"enumValues":[],"docString":"PodList is a list of Pods.","isRoot":false},"k8s.io/api/core/v1.PodLogOptions":{"package":"k8s.io/api/core/v1","typeName":"PodLogOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Container","typeName":"string","typeDecorators":null,"docString":"The container for which to stream logs. Defaults to only container if there is one container in the pod.\n+optional"},{"fieldName":"Follow","typeName":"bool","typeDecorators":null,"docString":"Follow the log stream of the pod. Defaults to false.\n+optional"},{"fieldName":"Previous","typeName":"bool","typeDecorators":null,"docString":"Return previous terminated container logs. Defaults to false.\n+optional"},{"fieldName":"SinceSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"A relative time in seconds before the current time from which to show logs. If this value\nprecedes the time a pod was started, only logs since the pod start will be returned.\nIf this value is in the future, no logs will be returned.\nOnly one of sinceSeconds or sinceTime may be specified.\n+optional"},{"fieldName":"SinceTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":"An RFC3339 timestamp from which to show logs. If this value\nprecedes the time a pod was started, only logs since the pod start will be returned.\nIf this value is in the future, no logs will be returned.\nOnly one of sinceSeconds or sinceTime may be specified.\n+optional"},{"fieldName":"Timestamps","typeName":"bool","typeDecorators":null,"docString":"If true, add an RFC3339 or RFC3339Nano timestamp at the beginning of every line\nof log output. Defaults to false.\n+optional"},{"fieldName":"TailLines","typeName":"int64","typeDecorators":["Ptr"],"docString":"If set, the number of lines from the end of the logs to show. If not specified,\nlogs are shown from the creation of the container or sinceSeconds or sinceTime.\nNote that when \"TailLines\" is specified, \"Stream\" can only be set to nil or \"All\".\n+optional"},{"fieldName":"LimitBytes","typeName":"int64","typeDecorators":["Ptr"],"docString":"If set, the number of bytes to read from the server before terminating the\nlog output. This may not display a complete final line of logging, and may return\nslightly more or slightly less than the specified limit.\n+optional"},{"fieldName":"InsecureSkipTLSVerifyBackend","typeName":"bool","typeDecorators":null,"docString":"insecureSkipTLSVerifyBackend indicates that the apiserver should not confirm the validity of the\nserving certificate of the backend it is connecting to.  This will make the HTTPS connection between the apiserver\nand the backend insecure. This means the apiserver cannot verify the log data it is receiving came from the real\nkubelet.  If the kubelet is configured to verify the apiserver's TLS credentials, it does not mean the\nconnection to the real kubelet is vulnerable to a man in the middle attack (e.g. an attacker could not intercept\nthe actual log data coming from the real kubelet).\n+optional"},{"fieldName":"Stream","typeName":"string","typeDecorators":["Ptr"],"docString":"Specify which container log stream to return to the client.\nAcceptable values are \"All\", \"Stdout\" and \"Stderr\". If not specified, \"All\" is used, and both stdout and stderr\nare returned interleaved.\nNote that when \"TailLines\" is specified, \"Stream\" can only be set to nil or \"All\".\n+featureGate=PodLogsQuerySplitStreams\n+optional"}],"enumValues":[],"docString":"PodLogOptions is the query options for a Pod's logs REST call.","isRoot":false},"k8s.io/api/core/v1.PodOS":{"package":"k8s.io/api/core/v1","typeName":"PodOS","fields":[{"fieldName":"Name","typeName":"k8s.io/api/core/v1.OSName","typeDecorators":null,"docString":"Name is the name of the operating system. The currently supported values are linux and windows.\nAdditional value may be defined in future and can be one of:\nhttps://github.com/opencontainers/runtime-spec/blob/master/config.md#platform-specific-configuration\nClients should expect to handle additional values and treat unrecognized values in this field as os: null"}],"enumValues":[],"docString":"PodOS defines the OS parameters of a pod.","isRoot":false},"k8s.io/api/core/v1.PodPhase":{"package":"k8s.io/api/core/v1","typeName":"PodPhase","fields":[],"enumValues":[{"name":"PodPending","docString":"PodPending means the pod has been accepted by the system, but one or more of the containers\nhas not been started. This includes time before being bound to a node, as well as time spent\npulling images onto the host."},{"name":"PodRunning","docString":"PodRunning means the pod has been bound to a node and all of the containers have been started.\nAt least one container is still running or is in the process of being restarted."},{"name":"PodSucceeded","docString":"PodSucceeded means that all containers in the pod have voluntarily terminated\nwith a container exit code of 0, and the system is not going to restart any of these containers."},{"name":"PodFailed","docString":"PodFailed means that all containers in the pod have terminated, and at least one container has\nterminated in a failure (exited with a non-zero exit code or was stopped by the system)."},{"name":"PodUnknown","docString":"PodUnknown means that for some reason the state of the pod could not be obtained, typically due\nto an error in communicating with the host of the pod.\nDeprecated: It isn't being set since 2015 (74da3b14b0c0f658b3bb8d2def5094686d0e9095)"}],"docString":"PodPhase is a label for the condition of a pod at the current time.\n+enum","isRoot":false},"k8s.io/api/core/v1.PodPortForwardOptions":{"package":"k8s.io/api/core/v1","typeName":"PodPortForwardOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Ports","typeName":"int32","typeDecorators":["List"],"docString":"List of ports to forward\nRequired when using WebSockets\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"PodPortForwardOptions is the query options to a Pod's port forward call\nwhen using WebSockets.\nThe `port` query parameter must specify the port or\nports (comma separated) to forward over.\nPort forwarding over SPDY does not use these options. It requires the port\nto be passed in the `port` header as part of request.","isRoot":false},"k8s.io/api/core/v1.PodProxyOptions":{"package":"k8s.io/api/core/v1","typeName":"PodProxyOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"Path is the URL path to use for the current proxy request to pod.\n+optional"}],"enumValues":[],"docString":"PodProxyOptions is the query options to a Pod's proxy call.","isRoot":false},"k8s.io/api/core/v1.PodQOSClass":{"package":"k8s.io/api/core/v1","typeName":"PodQOSClass","fields":[],"enumValues":[{"name":"PodQOSGuaranteed","docString":"PodQOSGuaranteed is the Guaranteed qos class."},{"name":"PodQOSBurstable","docString":"PodQOSBurstable is the Burstable qos class."},{"name":"PodQOSBestEffort","docString":"PodQOSBestEffort is the BestEffort qos class."}],"docString":"PodQOSClass defines the supported qos classes of Pods.\n+enum","isRoot":false},"k8s.io/api/core/v1.PodReadinessGate":{"package":"k8s.io/api/core/v1","typeName":"PodReadinessGate","fields":[{"fieldName":"ConditionType","typeName":"k8s.io/api/core/v1.PodConditionType","typeDecorators":null,"docString":"ConditionType refers to a condition in the pod's condition list with matching type."}],"enumValues":[],"docString":"PodReadinessGate contains the reference to a pod condition","isRoot":false},"k8s.io/api/core/v1.PodResizeStatus":{"package":"k8s.io/api/core/v1","typeName":"PodResizeStatus","fields":[],"enumValues":[{"name":"PodResizeStatusInProgress","docString":"Pod resources resize has been accepted by node and is being actuated."},{"name":"PodResizeStatusDeferred","docString":"Node cannot resize the pod at this time and will keep retrying."},{"name":"PodResizeStatusInfeasible","docString":"Requested pod resize is not feasible and will not be re-evaluated."}],"docString":"Deprecated: PodResizeStatus shows status of desired resize of a pod's containers.","isRoot":false},"k8s.io/api/core/v1.PodResourceClaim":{"package":"k8s.io/api/core/v1","typeName":"PodResourceClaim","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name uniquely identifies this resource claim inside the pod.\nThis must be a DNS_LABEL."},{"fieldName":"ResourceClaimName","typeName":"string","typeDecorators":["Ptr"],"docString":"ResourceClaimName is the name of a ResourceClaim object in the same\nnamespace as this pod.\n\nExactly one of ResourceClaimName and ResourceClaimTemplateName must\nbe set."},{"fieldName":"ResourceClaimTemplateName","typeName":"string","typeDecorators":["Ptr"],"docString":"ResourceClaimTemplateName is the name of a ResourceClaimTemplate\nobject in the same namespace as this pod.\n\nThe template will be used to create a new ResourceClaim, which will\nbe bound to this pod. When this pod is deleted, the ResourceClaim\nwill also be deleted. The pod name and resource name, along with a\ngenerated component, will be used to form a unique name for the\nResourceClaim, which will be recorded in pod.status.resourceClaimStatuses.\n\nThis field is immutable and no changes will be made to the\ncorresponding ResourceClaim by the control plane after creating the\nResourceClaim.\n\nExactly one of ResourceClaimName and ResourceClaimTemplateName must\nbe set."}],"enumValues":[],"docString":"PodResourceClaim references exactly one ResourceClaim, either directly\nor by naming a ResourceClaimTemplate which is then turned into a ResourceClaim\nfor the pod.\n\nIt adds a name to it that uniquely identifies the ResourceClaim inside the Pod.\nContainers that need access to the ResourceClaim reference it with this name.","isRoot":false},"k8s.io/api/core/v1.PodResourceClaimStatus":{"package":"k8s.io/api/core/v1","typeName":"PodResourceClaimStatus","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name uniquely identifies this resource claim inside the pod.\nThis must match the name of an entry in pod.spec.resourceClaims,\nwhich implies that the string must be a DNS_LABEL."},{"fieldName":"ResourceClaimName","typeName":"string","typeDecorators":["Ptr"],"docString":"ResourceClaimName is the name of the ResourceClaim that was\ngenerated for the Pod in the namespace of the Pod. If this is\nunset, then generating a ResourceClaim was not necessary. The\npod.spec.resourceClaims entry can be ignored in this case.\n\n+optional"}],"enumValues":[],"docString":"PodResourceClaimStatus is stored in the PodStatus for each PodResourceClaim\nwhich references a ResourceClaimTemplate. It stores the generated name for\nthe corresponding ResourceClaim.","isRoot":false},"k8s.io/api/core/v1.PodSELinuxChangePolicy":{"package":"k8s.io/api/core/v1","typeName":"PodSELinuxChangePolicy","fields":[],"enumValues":[{"name":"SELinuxChangePolicyRecursive","docString":"Recursive relabeling of all Pod volumes by the container runtime.\nThis may be slow for large volumes, but allows mixing privileged and unprivileged Pods sharing the same volume on the same node."},{"name":"SELinuxChangePolicyMountOption","docString":"MountOption mounts all eligible Pod volumes with `-o context` mount option.\nThis requires all Pods that share the same volume to use the same SELinux label.\nIt is not possible to share the same volume among privileged and unprivileged Pods.\nEligible volumes are in-tree FibreChannel and iSCSI volumes, and all CSI volumes\nwhose CSI driver announces SELinux support by setting spec.seLinuxMount: true in their\nCSIDriver instance. Other volumes are always re-labelled recursively."}],"docString":"PodSELinuxChangePolicy defines how the container's SELinux label is applied to all volumes used by the Pod.","isRoot":false},"k8s.io/api/core/v1.PodSchedulingGate":{"package":"k8s.io/api/core/v1","typeName":"PodSchedulingGate","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name of the scheduling gate.\nEach scheduling gate must have a unique name field."}],"enumValues":[],"docString":"PodSchedulingGate is associated to a Pod to guard its scheduling.","isRoot":false},"k8s.io/api/core/v1.PodSecurityContext":{"package":"k8s.io/api/core/v1","typeName":"PodSecurityContext","fields":[{"fieldName":"SELinuxOptions","typeName":"k8s.io/api/core/v1.SELinuxOptions","typeDecorators":["Ptr"],"docString":"The SELinux context to be applied to all containers.\nIf unspecified, the container runtime will allocate a random SELinux context for each\ncontainer.  May also be set in SecurityContext.  If set in\nboth SecurityContext and PodSecurityContext, the value specified in SecurityContext\ntakes precedence for that container.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"WindowsOptions","typeName":"k8s.io/api/core/v1.WindowsSecurityContextOptions","typeDecorators":["Ptr"],"docString":"The Windows specific settings applied to all containers.\nIf unspecified, the options within a container's SecurityContext will be used.\nIf set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.\nNote that this field cannot be set when spec.os.name is linux.\n+optional"},{"fieldName":"RunAsUser","typeName":"int64","typeDecorators":["Ptr"],"docString":"The UID to run the entrypoint of the container process.\nDefaults to user specified in image metadata if unspecified.\nMay also be set in SecurityContext.  If set in both SecurityContext and\nPodSecurityContext, the value specified in SecurityContext takes precedence\nfor that container.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"RunAsGroup","typeName":"int64","typeDecorators":["Ptr"],"docString":"The GID to run the entrypoint of the container process.\nUses runtime default if unset.\nMay also be set in SecurityContext.  If set in both SecurityContext and\nPodSecurityContext, the value specified in SecurityContext takes precedence\nfor that container.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"RunAsNonRoot","typeName":"bool","typeDecorators":["Ptr"],"docString":"Indicates that the container must run as a non-root user.\nIf true, the Kubelet will validate the image at runtime to ensure that it\ndoes not run as UID 0 (root) and fail to start the container if it does.\nIf unset or false, no such validation will be performed.\nMay also be set in SecurityContext.  If set in both SecurityContext and\nPodSecurityContext, the value specified in SecurityContext takes precedence.\n+optional"},{"fieldName":"SupplementalGroups","typeName":"int64","typeDecorators":["List"],"docString":"A list of groups applied to the first process run in each container, in\naddition to the container's primary GID and fsGroup (if specified).  If\nthe SupplementalGroupsPolicy feature is enabled, the\nsupplementalGroupsPolicy field determines whether these are in addition\nto or instead of any group memberships defined in the container image.\nIf unspecified, no additional groups are added, though group memberships\ndefined in the container image may still be used, depending on the\nsupplementalGroupsPolicy field.\nNote that this field cannot be set when spec.os.name is windows.\n+optional\n+listType=atomic"},{"fieldName":"SupplementalGroupsPolicy","typeName":"k8s.io/api/core/v1.SupplementalGroupsPolicy","typeDecorators":["Ptr"],"docString":"Defines how supplemental groups of the first container processes are calculated.\nValid values are \"Merge\" and \"Strict\". If not specified, \"Merge\" is used.\n(Alpha) Using the field requires the SupplementalGroupsPolicy feature gate to be enabled\nand the container runtime must implement support for this feature.\nNote that this field cannot be set when spec.os.name is windows.\nTODO: update the default value to \"Merge\" when spec.os.name is not windows in v1.34\n+featureGate=SupplementalGroupsPolicy\n+optional"},{"fieldName":"FSGroup","typeName":"int64","typeDecorators":["Ptr"],"docString":"A special supplemental group that applies to all containers in a pod.\nSome volume types allow the Kubelet to change the ownership of that volume\nto be owned by the pod:\n\n1. The owning GID will be the FSGroup\n2. The setgid bit is set (new files created in the volume will be owned by FSGroup)\n3. The permission bits are OR'd with rw-rw----\n\nIf unset, the Kubelet will not modify the ownership and permissions of any volume.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"Sysctls","typeName":"k8s.io/api/core/v1.Sysctl","typeDecorators":["List"],"docString":"Sysctls hold a list of namespaced sysctls used for the pod. Pods with unsupported\nsysctls (by the container runtime) might fail to launch.\nNote that this field cannot be set when spec.os.name is windows.\n+optional\n+listType=atomic"},{"fieldName":"FSGroupChangePolicy","typeName":"k8s.io/api/core/v1.PodFSGroupChangePolicy","typeDecorators":["Ptr"],"docString":"fsGroupChangePolicy defines behavior of changing ownership and permission of the volume\nbefore being exposed inside Pod. This field will only apply to\nvolume types which support fsGroup based ownership(and permissions).\nIt will have no effect on ephemeral volume types such as: secret, configmaps\nand emptydir.\nValid values are \"OnRootMismatch\" and \"Always\". If not specified, \"Always\" is used.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"SeccompProfile","typeName":"k8s.io/api/core/v1.SeccompProfile","typeDecorators":["Ptr"],"docString":"The seccomp options to use by the containers in this pod.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"AppArmorProfile","typeName":"k8s.io/api/core/v1.AppArmorProfile","typeDecorators":["Ptr"],"docString":"appArmorProfile is the AppArmor options to use by the containers in this pod.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"SELinuxChangePolicy","typeName":"k8s.io/api/core/v1.PodSELinuxChangePolicy","typeDecorators":["Ptr"],"docString":"seLinuxChangePolicy defines how the container's SELinux label is applied to all volumes used by the Pod.\nIt has no effect on nodes that do not support SELinux or to volumes does not support SELinux.\nValid values are \"MountOption\" and \"Recursive\".\n\n\"Recursive\" means relabeling of all files on all Pod volumes by the container runtime.\nThis may be slow for large volumes, but allows mixing privileged and unprivileged Pods sharing the same volume on the same node.\n\n\"MountOption\" mounts all eligible Pod volumes with `-o context` mount option.\nThis requires all Pods that share the same volume to use the same SELinux label.\nIt is not possible to share the same volume among privileged and unprivileged Pods.\nEligible volumes are in-tree FibreChannel and iSCSI volumes, and all CSI volumes\nwhose CSI driver announces SELinux support by setting spec.seLinuxMount: true in their\nCSIDriver instance. Other volumes are always re-labelled recursively.\n\"MountOption\" value is allowed only when SELinuxMount feature gate is enabled.\n\nIf not specified and SELinuxMount feature gate is enabled, \"MountOption\" is used.\nIf not specified and SELinuxMount feature gate is disabled, \"MountOption\" is used for ReadWriteOncePod volumes\nand \"Recursive\" for all other volumes.\n\nThis field affects only Pods that have SELinux label set, either in PodSecurityContext or in SecurityContext of all containers.\n\nAll Pods that use the same volume should use the same seLinuxChangePolicy, otherwise some pods can get stuck in ContainerCreating state.\nNote that this field cannot be set when spec.os.name is windows.\n+featureGate=SELinuxChangePolicy\n+optional"}],"enumValues":[],"docString":"PodSecurityContext holds pod-level security attributes and common container settings.\nSome fields are also present in container.securityContext.  Field values of\ncontainer.securityContext take precedence over field values of PodSecurityContext.","isRoot":false},"k8s.io/api/core/v1.PodSignature":{"package":"k8s.io/api/core/v1","typeName":"PodSignature","fields":[{"fieldName":"PodController","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.OwnerReference","typeDecorators":["Ptr"],"docString":"Reference to controller whose pods should avoid this node.\n+optional"}],"enumValues":[],"docString":"Describes the class of pods that should avoid this node.\nExactly one field should be set.","isRoot":false},"k8s.io/api/core/v1.PodSpec":{"package":"k8s.io/api/core/v1","typeName":"PodSpec","fields":[{"fieldName":"Volumes","typeName":"k8s.io/api/core/v1.Volume","typeDecorators":["List"],"docString":"List of volumes that can be mounted by containers belonging to the pod.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes\n+optional\n+patchMergeKey=name\n+patchStrategy=merge,retainKeys\n+listType=map\n+listMapKey=name"},{"fieldName":"InitContainers","typeName":"k8s.io/api/core/v1.Container","typeDecorators":["List"],"docString":"List of initialization containers belonging to the pod.\nInit containers are executed in order prior to containers being started. If any\ninit container fails, the pod is considered to have failed and is handled according\nto its restartPolicy. The name for an init container or normal container must be\nunique among all containers.\nInit containers may not have Lifecycle actions, Readiness probes, Liveness probes, or Startup probes.\nThe resourceRequirements of an init container are taken into account during scheduling\nby finding the highest request/limit for each resource type, and then using the max of\nthat value or the sum of the normal containers. Limits are applied to init containers\nin a similar fashion.\nInit containers cannot currently be added or removed.\nCannot be updated.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name"},{"fieldName":"Containers","typeName":"k8s.io/api/core/v1.Container","typeDecorators":["List"],"docString":"List of containers belonging to the pod.\nContainers cannot currently be added or removed.\nThere must be at least one container in a Pod.\nCannot be updated.\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name"},{"fieldName":"EphemeralContainers","typeName":"k8s.io/api/core/v1.EphemeralContainer","typeDecorators":["List"],"docString":"List of ephemeral containers run in this pod. Ephemeral containers may be run in an existing\npod to perform user-initiated actions such as debugging. This list cannot be specified when\ncreating a pod, and it cannot be modified by updating the pod spec. In order to add an\nephemeral container to an existing pod, use the pod's ephemeralcontainers subresource.\n+optional\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name"},{"fieldName":"RestartPolicy","typeName":"k8s.io/api/core/v1.RestartPolicy","typeDecorators":null,"docString":"Restart policy for all containers within the pod.\nOne of Always, OnFailure, Never. In some contexts, only a subset of those values may be permitted.\nDefault to Always.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#restart-policy\n+optional"},{"fieldName":"TerminationGracePeriodSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"Optional duration in seconds the pod needs to terminate gracefully. May be decreased in delete request.\nValue must be non-negative integer. The value zero indicates stop immediately via\nthe kill signal (no opportunity to shut down).\nIf this value is nil, the default grace period will be used instead.\nThe grace period is the duration in seconds after the processes running in the pod are sent\na termination signal and the time when the processes are forcibly halted with a kill signal.\nSet this value longer than the expected cleanup time for your process.\nDefaults to 30 seconds.\n+optional"},{"fieldName":"ActiveDeadlineSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"Optional duration in seconds the pod may be active on the node relative to\nStartTime before the system will actively try to mark it failed and kill associated containers.\nValue must be a positive integer.\n+optional"},{"fieldName":"DNSPolicy","typeName":"k8s.io/api/core/v1.DNSPolicy","typeDecorators":null,"docString":"Set DNS policy for the pod.\nDefaults to \"ClusterFirst\".\nValid values are 'ClusterFirstWithHostNet', 'ClusterFirst', 'Default' or 'None'.\nDNS parameters given in DNSConfig will be merged with the policy selected with DNSPolicy.\nTo have DNS options set along with hostNetwork, you have to specify DNS policy\nexplicitly to 'ClusterFirstWithHostNet'.\n+optional"},{"fieldName":"NodeSelector","typeName":"string","typeDecorators":["Map[string]"],"docString":"NodeSelector is a selector which must be true for the pod to fit on a node.\nSelector which must match a node's labels for the pod to be scheduled on that node.\nMore info: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/\n+optional\n+mapType=atomic"},{"fieldName":"ServiceAccountName","typeName":"string","typeDecorators":null,"docString":"ServiceAccountName is the name of the ServiceAccount to use to run this pod.\nMore info: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/\n+optional"},{"fieldName":"DeprecatedServiceAccount","typeName":"string","typeDecorators":null,"docString":"DeprecatedServiceAccount is a deprecated alias for ServiceAccountName.\nDeprecated: Use serviceAccountName instead.\n+k8s:conversion-gen=false\n+optional"},{"fieldName":"AutomountServiceAccountToken","typeName":"bool","typeDecorators":["Ptr"],"docString":"AutomountServiceAccountToken indicates whether a service account token should be automatically mounted.\n+optional"},{"fieldName":"NodeName","typeName":"string","typeDecorators":null,"docString":"NodeName indicates in which node this pod is scheduled.\nIf empty, this pod is a candidate for scheduling by the scheduler defined in schedulerName.\nOnce this field is set, the kubelet for this node becomes responsible for the lifecycle of this pod.\nThis field should not be used to express a desire for the pod to be scheduled on a specific node.\nhttps://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodename\n+optional"},{"fieldName":"HostNetwork","typeName":"bool","typeDecorators":null,"docString":"Host networking requested for this pod. Use the host's network namespace.\nIf this option is set, the ports that will be used must be specified.\nDefault to false.\n+k8s:conversion-gen=false\n+optional"},{"fieldName":"HostPID","typeName":"bool","typeDecorators":null,"docString":"Use the host's pid namespace.\nOptional: Default to false.\n+k8s:conversion-gen=false\n+optional"},{"fieldName":"HostIPC","typeName":"bool","typeDecorators":null,"docString":"Use the host's ipc namespace.\nOptional: Default to false.\n+k8s:conversion-gen=false\n+optional"},{"fieldName":"ShareProcessNamespace","typeName":"bool","typeDecorators":["Ptr"],"docString":"Share a single process namespace between all of the containers in a pod.\nWhen this is set containers will be able to view and signal processes from other containers\nin the same pod, and the first process in each container will not be assigned PID 1.\nHostPID and ShareProcessNamespace cannot both be set.\nOptional: Default to false.\n+k8s:conversion-gen=false\n+optional"},{"fieldName":"SecurityContext","typeName":"k8s.io/api/core/v1.PodSecurityContext","typeDecorators":["Ptr"],"docString":"SecurityContext holds pod-level security attributes and common container settings.\nOptional: Defaults to empty.  See type description for default values of each field.\n+optional"},{"fieldName":"ImagePullSecrets","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":["List"],"docString":"ImagePullSecrets is an optional list of references to secrets in the same namespace to use for pulling any of the images used by this PodSpec.\nIf specified, these secrets will be passed to individual puller implementations for them to use.\nMore info: https://kubernetes.io/docs/concepts/containers/images#specifying-imagepullsecrets-on-a-pod\n+optional\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name"},{"fieldName":"Hostname","typeName":"string","typeDecorators":null,"docString":"Specifies the hostname of the Pod\nIf not specified, the pod's hostname will be set to a system-defined value.\n+optional"},{"fieldName":"Subdomain","typeName":"string","typeDecorators":null,"docString":"If specified, the fully qualified Pod hostname will be \"\u003chostname\u003e.\u003csubdomain\u003e.\u003cpod namespace\u003e.svc.\u003ccluster domain\u003e\".\nIf not specified, the pod will not have a domainname at all.\n+optional"},{"fieldName":"Affinity","typeName":"k8s.io/api/core/v1.Affinity","typeDecorators":["Ptr"],"docString":"If specified, the pod's scheduling constraints\n+optional"},{"fieldName":"SchedulerName","typeName":"string","typeDecorators":null,"docString":"If specified, the pod will be dispatched by specified scheduler.\nIf not specified, the pod will be dispatched by default scheduler.\n+optional"},{"fieldName":"Tolerations","typeName":"k8s.io/api/core/v1.Toleration","typeDecorators":["List"],"docString":"If specified, the pod's tolerations.\n+optional\n+listType=atomic"},{"fieldName":"HostAliases","typeName":"k8s.io/api/core/v1.HostAlias","typeDecorators":["List"],"docString":"HostAliases is an optional list of hosts and IPs that will be injected into the pod's hosts\nfile if specified.\n+optional\n+patchMergeKey=ip\n+patchStrategy=merge\n+listType=map\n+listMapKey=ip"},{"fieldName":"PriorityClassName","typeName":"string","typeDecorators":null,"docString":"If specified, indicates the pod's priority. \"system-node-critical\" and\n\"system-cluster-critical\" are two special keywords which indicate the\nhighest priorities with the former being the highest priority. Any other\nname must be defined by creating a PriorityClass object with that name.\nIf not specified, the pod priority will be default or zero if there is no\ndefault.\n+optional"},{"fieldName":"Priority","typeName":"int32","typeDecorators":["Ptr"],"docString":"The priority value. Various system components use this field to find the\npriority of the pod. When Priority Admission Controller is enabled, it\nprevents users from setting this field. The admission controller populates\nthis field from PriorityClassName.\nThe higher the value, the higher the priority.\n+optional"},{"fieldName":"DNSConfig","typeName":"k8s.io/api/core/v1.PodDNSConfig","typeDecorators":["Ptr"],"docString":"Specifies the DNS parameters of a pod.\nParameters specified here will be merged to the generated DNS\nconfiguration based on DNSPolicy.\n+optional"},{"fieldName":"ReadinessGates","typeName":"k8s.io/api/core/v1.PodReadinessGate","typeDecorators":["List"],"docString":"If specified, all readiness gates will be evaluated for pod readiness.\nA pod is ready when all its containers are ready AND\nall conditions specified in the readiness gates have status equal to \"True\"\nMore info: https://git.k8s.io/enhancements/keps/sig-network/580-pod-readiness-gates\n+optional\n+listType=atomic"},{"fieldName":"RuntimeClassName","typeName":"string","typeDecorators":["Ptr"],"docString":"RuntimeClassName refers to a RuntimeClass object in the node.k8s.io group, which should be used\nto run this pod.  If no RuntimeClass resource matches the named class, the pod will not be run.\nIf unset or empty, the \"legacy\" RuntimeClass will be used, which is an implicit class with an\nempty definition that uses the default runtime handler.\nMore info: https://git.k8s.io/enhancements/keps/sig-node/585-runtime-class\n+optional"},{"fieldName":"EnableServiceLinks","typeName":"bool","typeDecorators":["Ptr"],"docString":"EnableServiceLinks indicates whether information about services should be injected into pod's\nenvironment variables, matching the syntax of Docker links.
