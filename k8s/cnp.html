ators":["Ptr"],"docString":""},{"fieldName":"Time","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":""},{"fieldName":"FieldsType","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"FieldsV1","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.FieldsV1","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Subresource","typeName":"string","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"ManagedFieldsEntryApplyConfiguration represents a declarative configuration of the ManagedFieldsEntry type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.ObjectMetaApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"ObjectMetaApplyConfiguration","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"GenerateName","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Namespace","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":["Ptr"],"docString":""},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Generation","typeName":"int64","typeDecorators":["Ptr"],"docString":""},{"fieldName":"CreationTimestamp","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":""},{"fieldName":"DeletionTimestamp","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":""},{"fieldName":"DeletionGracePeriodSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Labels","typeName":"string","typeDecorators":["Map[string]"],"docString":""},{"fieldName":"Annotations","typeName":"string","typeDecorators":["Map[string]"],"docString":""},{"fieldName":"OwnerReferences","typeName":"OwnerReferenceApplyConfiguration","typeDecorators":["List"],"docString":""},{"fieldName":"Finalizers","typeName":"string","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"ObjectMetaApplyConfiguration represents a declarative configuration of the ObjectMeta type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.OwnerReferenceApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"OwnerReferenceApplyConfiguration","fields":[{"fieldName":"APIVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Kind","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Name","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Controller","typeName":"bool","typeDecorators":["Ptr"],"docString":""},{"fieldName":"BlockOwnerDeletion","typeName":"bool","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"OwnerReferenceApplyConfiguration represents a declarative configuration of the OwnerReference type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.PreconditionsApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"PreconditionsApplyConfiguration","fields":[{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":["Ptr"],"docString":""},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"PreconditionsApplyConfiguration represents a declarative configuration of the Preconditions type for use\nwith apply.","isRoot":false},"k8s.io/client-go/applyconfigurations/meta/v1.TypeMetaApplyConfiguration":{"package":"k8s.io/client-go/applyconfigurations/meta/v1","typeName":"TypeMetaApplyConfiguration","fields":[{"fieldName":"Kind","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"APIVersion","typeName":"string","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"TypeMetaApplyConfiguration represents a declarative configuration of the TypeMeta type for use\nwith apply.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicy":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicy","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicySpec","typeDecorators":null,"docString":"Specification of the desired behavior of AdminNetworkPolicy."},{"fieldName":"Status","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyStatus","typeDecorators":null,"docString":"Status is the status to be reported by the implementation.\n+optional"}],"enumValues":[],"docString":"+genclient\n+genclient:nonNamespaced\n+kubebuilder:object:root=true\n+kubebuilder:subresource:status\n+kubebuilder:resource:shortName=anp,scope=Cluster\n+kubebuilder:printcolumn:name=\"Priority\",type=string,JSONPath=\".spec.priority\"\n+kubebuilder:printcolumn:name=\"Age\",type=\"date\",JSONPath=\".metadata.creationTimestamp\"\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object\nAdminNetworkPolicy is  a cluster level resource that is part of the\nAdminNetworkPolicy API.","isRoot":true},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyEgressPeer":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicyEgressPeer","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Namespaces defines a way to select all pods within a set of Namespaces.\nNote that host-networked pods are not included in this type of peer.\n\n+optional"},{"fieldName":"Pods","typeName":"NamespacedPod","typeDecorators":["Ptr"],"docString":"Pods defines a way to select a set of pods in\na set of namespaces. Note that host-networked pods\nare not included in this type of peer.\n\n+optional"},{"fieldName":"Nodes","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Nodes defines a way to select a set of nodes in\nthe cluster (based on the node's labels). It selects\nthe nodeIPs as the peer type by matching on the IPs\npresent in the node.Status.Addresses field of the node.\nThis field follows standard label selector\nsemantics; if present but empty, it selects all Nodes.\n\n\u003cnetwork-policy-api:experimental\u003e\n+optional"},{"fieldName":"Networks","typeName":"CIDR","typeDecorators":["List"],"docString":"Networks defines a way to select peers via CIDR blocks.\nThis is intended for representing entities that live outside the cluster,\nwhich can't be selected by pods, namespaces and nodes peers, but note\nthat cluster-internal traffic will be checked against the rule as\nwell. So if you Allow or Deny traffic to `\"0.0.0.0/0\"`, that will allow\nor deny all IPv4 pod-to-pod traffic as well. If you don't want that,\nadd a rule that Passes all pod traffic before the Networks rule.\n\nEach item in Networks should be provided in the CIDR format and should be\nIPv4 or IPv6, for example \"10.0.0.0/8\" or \"fd00::/8\".\n\nNetworks can have upto 25 CIDRs specified.\n\n+optional\n+listType=set\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=25"},{"fieldName":"DomainNames","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.DomainName","typeDecorators":["List"],"docString":"DomainNames provides a way to specify domain names as peers.\n\nDomainNames is only supported for ALLOW rules. In order to control\naccess, DomainNames Allow rules should be used with a lower priority\negress deny -- this allows the admin to maintain an explicit \"allowlist\"\nof reachable domains.\n\nDomainNames can have up to 25 domain names specified in one rule.\n\n\u003cnetwork-policy-api:experimental\u003e\n+optional\n+listType=set\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=25"}],"enumValues":[],"docString":"AdminNetworkPolicyEgressPeer defines a peer to allow traffic to.\n\nExactly one of the fields must be set for a given peer and this is enforced\nby the validation rules on the CRD. If an implementation sees no fields are\nset then it can infer that the deployed CRD is of an incompatible version\nwith an unknown field.  In that case it should fail closed.\n\nFor \"Allow\" rules, \"fail closed\" means: \"treat the rule as matching no\ntraffic\". For \"Deny\" and \"Pass\" rules, \"fail closed\" means: \"treat the rule\nas a 'Deny all' rule\".\n\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyEgressRule":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicyEgressRule","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is an identifier for this rule, that may be no more than 100 characters\nin length. This field should be used by the implementation to help\nimprove observability, readability and error-reporting for any applied\nAdminNetworkPolicies.\n\n+optional\n+kubebuilder:validation:MaxLength=100"},{"fieldName":"Action","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyRuleAction","typeDecorators":null,"docString":"Action specifies the effect this rule will have on matching traffic.\nCurrently the following actions are supported:\nAllow: allows the selected traffic (even if it would otherwise have been denied by NetworkPolicy)\nDeny: denies the selected traffic\nPass: instructs the selected traffic to skip any remaining ANP rules, and\nthen pass execution to any NetworkPolicies that select the pod.\nIf the pod is not selected by any NetworkPolicies then execution\nis passed to any BaselineAdminNetworkPolicies that select the pod."},{"fieldName":"To","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyEgressPeer","typeDecorators":["List"],"docString":"To is the List of destinations whose traffic this rule applies to.\nIf any element matches the destination of outgoing\ntraffic then the specified action is applied.\nThis field must be defined and contain at least one item.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Ports","typeName":"AdminNetworkPolicyPort","typeDecorators":["Ptr","List"],"docString":"Ports allows for matching traffic based on port and protocols.\nThis field is a list of destination ports for the outgoing egress traffic.\nIf Ports is not set then the rule does not filter traffic via port.\n\n+optional\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"AdminNetworkPolicyEgressRule describes an action to take on a particular\nset of traffic originating from pods selected by a AdminNetworkPolicy's\nSubject field.\n\u003cnetwork-policy-api:experimental:validation\u003e\n+kubebuilder:validation:XValidation:rule=\"!(self.to.exists(peer, has(peer.networks) || has(peer.nodes) || has(peer.domainNames)) \u0026\u0026 has(self.ports) \u0026\u0026 self.ports.exists(port, has(port.namedPort)))\",message=\"networks/nodes/domainNames peer cannot be set with namedPorts since there are no namedPorts for networks/nodes/domainNames\"","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyIngressPeer":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicyIngressPeer","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Namespaces defines a way to select all pods within a set of Namespaces.\nNote that host-networked pods are not included in this type of peer.\n\n+optional"},{"fieldName":"Pods","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.NamespacedPod","typeDecorators":["Ptr"],"docString":"Pods defines a way to select a set of pods in\na set of namespaces. Note that host-networked pods\nare not included in this type of peer.\n\n+optional"}],"enumValues":[],"docString":"AdminNetworkPolicyIngressPeer defines a peer to allow traffic to.\n\nExactly one of the fields must be set for a given peer and this is enforced\nby the validation rules on the CRD. If an implementation sees no fields are\nset then it can infer that the deployed CRD is of an incompatible version\nwith an unknown field.  In that case it should fail closed.\n\nFor \"Allow\" rules, \"fail closed\" means: \"treat the rule as matching no\ntraffic\". For \"Deny\" and \"Pass\" rules, \"fail closed\" means: \"treat the rule\nas a 'Deny all' rule\".\n\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyIngressRule":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicyIngressRule","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is an identifier for this rule, that may be no more than 100 characters\nin length. This field should be used by the implementation to help\nimprove observability, readability and error-reporting for any applied\nAdminNetworkPolicies.\n\n+optional\n+kubebuilder:validation:MaxLength=100"},{"fieldName":"Action","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyRuleAction","typeDecorators":null,"docString":"Action specifies the effect this rule will have on matching traffic.\nCurrently the following actions are supported:\nAllow: allows the selected traffic (even if it would otherwise have been denied by NetworkPolicy)\nDeny: denies the selected traffic\nPass: instructs the selected traffic to skip any remaining ANP rules, and\nthen pass execution to any NetworkPolicies that select the pod.\nIf the pod is not selected by any NetworkPolicies then execution\nis passed to any BaselineAdminNetworkPolicies that select the pod."},{"fieldName":"From","typeName":"AdminNetworkPolicyIngressPeer","typeDecorators":["List"],"docString":"From is the list of sources whose traffic this rule applies to.\nIf any element matches the source of incoming\ntraffic then the specified action is applied.\nThis field must be defined and contain at least one item.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Ports","typeName":"AdminNetworkPolicyPort","typeDecorators":["Ptr","List"],"docString":"Ports allows for matching traffic based on port and protocols.\nThis field is a list of ports which should be matched on\nthe pods selected for this policy i.e the subject of the policy.\nSo it matches on the destination port for the ingress traffic.\nIf Ports is not set then the rule does not filter traffic via port.\n\n+optional\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"AdminNetworkPolicyIngressRule describes an action to take on a particular\nset of traffic destined for pods selected by an AdminNetworkPolicy's\nSubject field.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyList":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicyList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicy","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"AdminNetworkPolicyList contains a list of AdminNetworkPolicy","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyPort":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicyPort","fields":[{"fieldName":"PortNumber","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.Port","typeDecorators":["Ptr"],"docString":"Port selects a port on a pod(s) based on number.\n\n+optional"},{"fieldName":"NamedPort","typeName":"string","typeDecorators":["Ptr"],"docString":"NamedPort selects a port on a pod(s) based on name.\n\n\u003cnetwork-policy-api:experimental\u003e\n+optional"},{"fieldName":"PortRange","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.PortRange","typeDecorators":["Ptr"],"docString":"PortRange selects a port range on a pod(s) based on provided start and end\nvalues.\n\n+optional"}],"enumValues":[],"docString":"AdminNetworkPolicyPort describes how to select network ports on pod(s).\nExactly one field must be set.\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyRuleAction":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicyRuleAction","fields":[],"enumValues":[{"name":"AdminNetworkPolicyRuleActionAllow","docString":"AdminNetworkPolicyRuleActionAllow indicates that matching traffic will be\nallowed regardless of NetworkPolicy and BaselineAdminNetworkPolicy\nrules. Users cannot block traffic which has been matched by an \"Allow\"\nrule in an AdminNetworkPolicy."},{"name":"AdminNetworkPolicyRuleActionDeny","docString":"AdminNetworkPolicyRuleActionDeny indicates that matching traffic will be\ndenied before being checked against NetworkPolicy or\nBaselineAdminNetworkPolicy rules. Pods will never receive traffic which\nhas been matched by a \"Deny\" rule in an AdminNetworkPolicy."},{"name":"AdminNetworkPolicyRuleActionPass","docString":"AdminNetworkPolicyRuleActionPass indicates that matching traffic will\nbypass further AdminNetworkPolicy processing (ignoring rules with lower\nprecedence) and be allowed or denied based on NetworkPolicy and\nBaselineAdminNetworkPolicy rules."}],"docString":"AdminNetworkPolicyRuleAction string describes the AdminNetworkPolicy action type.\n\n+enum\n+kubebuilder:validation:Enum={\"Allow\", \"Deny\", \"Pass\"}","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicySpec":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicySpec","fields":[{"fieldName":"Priority","typeName":"int32","typeDecorators":null,"docString":"Priority is a value from 0 to 1000. Policies with lower priority values have\nhigher precedence, and are checked before policies with higher priority values.\nAll AdminNetworkPolicy rules have higher precedence than NetworkPolicy or\nBaselineAdminNetworkPolicy rules.\nIf two (or more) policies with the same priority could both match a connection,\nthen the implementation can apply any of the matching policies to the\nconnection, and there is no way for the user to reliably determine which one it\nwill choose. Administrators must be careful about assigning the priorities for\npolicies with rules that will match many connections, and ensure that policies\nhave unique priority values in cases where ambiguity would be unacceptable.\n\n+kubebuilder:validation:Minimum=0\n+kubebuilder:validation:Maximum=1000"},{"fieldName":"Subject","typeName":"AdminNetworkPolicySubject","typeDecorators":null,"docString":"Subject defines the pods to which this AdminNetworkPolicy applies.\nNote that host-networked pods are not included in subject selection."},{"fieldName":"Ingress","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyIngressRule","typeDecorators":["List"],"docString":"Ingress is the list of Ingress rules to be applied to the selected pods.\nA total of 100 rules will be allowed in each ANP instance.\nThe relative precedence of ingress rules within a single ANP object (all of\nwhich share the priority) will be determined by the order in which the rule\nis written. Thus, a rule that appears at the top of the ingress rules\nwould take the highest precedence.\nANPs with no ingress rules do not affect ingress traffic.\n\n+optional\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Egress","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyEgressRule","typeDecorators":["List"],"docString":"Egress is the list of Egress rules to be applied to the selected pods.\nA total of 100 rules will be allowed in each ANP instance.\nThe relative precedence of egress rules within a single ANP object (all of\nwhich share the priority) will be determined by the order in which the rule\nis written. Thus, a rule that appears at the top of the egress rules\nwould take the highest precedence.\nANPs with no egress rules do not affect egress traffic.\n\n+optional\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"AdminNetworkPolicySpec defines the desired state of AdminNetworkPolicy.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyStatus":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicyStatus","fields":[{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"}],"enumValues":[],"docString":"AdminNetworkPolicyStatus defines the observed state of AdminNetworkPolicy.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicySubject":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"AdminNetworkPolicySubject","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Namespaces is used to select pods via namespace selectors.\n+optional"},{"fieldName":"Pods","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.NamespacedPod","typeDecorators":["Ptr"],"docString":"Pods is used to select pods via namespace AND pod selectors.\n+optional"}],"enumValues":[],"docString":"AdminNetworkPolicySubject defines what resources the policy applies to.\nExactly one field must be set.\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicy":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"BaselineAdminNetworkPolicy","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicySpec","typeDecorators":null,"docString":"Specification of the desired behavior of BaselineAdminNetworkPolicy."},{"fieldName":"Status","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyStatus","typeDecorators":null,"docString":"Status is the status to be reported by the implementation.\n+optional"}],"enumValues":[],"docString":"+genclient\n+genclient:nonNamespaced\n+kubebuilder:object:root=true\n+kubebuilder:subresource:status\n+kubebuilder:resource:shortName=banp,scope=Cluster\n+kubebuilder:printcolumn:name=\"Age\",type=\"date\",JSONPath=\".metadata.creationTimestamp\"\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object\n+kubebuilder:validation:XValidation:rule=\"self.metadata.name == 'default'\",message=\"Only one baseline admin network policy with metadata.name=\\\"default\\\" can be created in the cluster\"\nBaselineAdminNetworkPolicy is a cluster level resource that is part of the\nAdminNetworkPolicy API.","isRoot":true},"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyEgressPeer":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"BaselineAdminNetworkPolicyEgressPeer","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Namespaces defines a way to select all pods within a set of Namespaces.\nNote that host-networked pods are not included in this type of peer.\n\n+optional"},{"fieldName":"Pods","typeName":"NamespacedPod","typeDecorators":["Ptr"],"docString":"Pods defines a way to select a set of pods in\na set of namespaces. Note that host-networked pods\nare not included in this type of peer.\n\n+optional"},{"fieldName":"Nodes","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Nodes defines a way to select a set of nodes in\nthe cluster (based on the node's labels). It selects\nthe nodeIPs as the peer type by matching on the IPs\npresent in the node.Status.Addresses field of the node.\nThis field follows standard label selector\nsemantics; if present but empty, it selects all Nodes.\n\n\u003cnetwork-policy-api:experimental\u003e\n+optional"},{"fieldName":"Networks","typeName":"CIDR","typeDecorators":["List"],"docString":"Networks defines a way to select peers via CIDR blocks.\nThis is intended for representing entities that live outside the cluster,\nwhich can't be selected by pods, namespaces and nodes peers, but note\nthat cluster-internal traffic will be checked against the rule as\nwell. So if you Allow or Deny traffic to `\"0.0.0.0/0\"`, that will allow\nor deny all IPv4 pod-to-pod traffic as well. If you don't want that,\nadd a rule that Passes all pod traffic before the Networks rule.\n\nEach item in Networks should be provided in the CIDR format and should be\nIPv4 or IPv6, for example \"10.0.0.0/8\" or \"fd00::/8\".\n\nNetworks can have upto 25 CIDRs specified.\n\n+optional\n+listType=set\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=25"}],"enumValues":[],"docString":"BaselineAdminNetworkPolicyEgressPeer defines a peer to allow traffic to.\n\nExactly one of the fields must be set for a given peer and this is enforced\nby the validation rules on the CRD. If an implementation sees no fields are\nset then it can infer that the deployed CRD is of an incompatible version\nwith an unknown field.  In that case it should fail closed.\n\nFor \"Allow\" rules, \"fail closed\" means: \"treat the rule as matching no\ntraffic\". For \"Deny\" and \"Pass\" rules, \"fail closed\" means: \"treat the rule\nas a 'Deny all' rule\".\n\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyEgressRule":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"BaselineAdminNetworkPolicyEgressRule","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is an identifier for this rule, that may be no more than 100 characters\nin length. This field should be used by the implementation to help\nimprove observability, readability and error-reporting for any applied\nBaselineAdminNetworkPolicies.\n\n+optional\n+kubebuilder:validation:MaxLength=100"},{"fieldName":"Action","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyRuleAction","typeDecorators":null,"docString":"Action specifies the effect this rule will have on matching traffic.\nCurrently the following actions are supported:\nAllow: allows the selected traffic\nDeny: denies the selected traffic"},{"fieldName":"To","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyEgressPeer","typeDecorators":["List"],"docString":"To is the list of destinations whose traffic this rule applies to.\nIf any element matches the destination of outgoing\ntraffic then the specified action is applied.\nThis field must be defined and contain at least one item.\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Ports","typeName":"AdminNetworkPolicyPort","typeDecorators":["Ptr","List"],"docString":"Ports allows for matching traffic based on port and protocols.\nThis field is a list of destination ports for the outgoing egress traffic.\nIf Ports is not set then the rule does not filter traffic via port.\n+optional\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"BaselineAdminNetworkPolicyEgressRule describes an action to take on a particular\nset of traffic originating from pods selected by a BaselineAdminNetworkPolicy's\nSubject field.\n\u003cnetwork-policy-api:experimental:validation\u003e\n+kubebuilder:validation:XValidation:rule=\"!(self.to.exists(peer, has(peer.networks) || has(peer.nodes)) \u0026\u0026 has(self.ports) \u0026\u0026 self.ports.exists(port, has(port.namedPort)))\",message=\"networks/nodes peer cannot be set with namedPorts since there are no namedPorts for networks/nodes\"","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyIngressRule":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"BaselineAdminNetworkPolicyIngressRule","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is an identifier for this rule, that may be no more than 100 characters\nin length. This field should be used by the implementation to help\nimprove observability, readability and error-reporting for any applied\nBaselineAdminNetworkPolicies.\n\n+optional\n+kubebuilder:validation:MaxLength=100"},{"fieldName":"Action","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyRuleAction","typeDecorators":null,"docString":"Action specifies the effect this rule will have on matching traffic.\nCurrently the following actions are supported:\nAllow: allows the selected traffic\nDeny: denies the selected traffic"},{"fieldName":"From","typeName":"AdminNetworkPolicyIngressPeer","typeDecorators":["List"],"docString":"From is the list of sources whose traffic this rule applies to.\nIf any element matches the source of incoming\ntraffic then the specified action is applied.\nThis field must be defined and contain at least one item.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Ports","typeName":"AdminNetworkPolicyPort","typeDecorators":["Ptr","List"],"docString":"Ports allows for matching traffic based on port and protocols.\nThis field is a list of ports which should be matched on\nthe pods selected for this policy i.e the subject of the policy.\nSo it matches on the destination port for the ingress traffic.\nIf Ports is not set then the rule does not filter traffic via port.\n\n+optional\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"BaselineAdminNetworkPolicyIngressRule describes an action to take on a particular\nset of traffic destined for pods selected by a BaselineAdminNetworkPolicy's\nSubject field.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyList":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"BaselineAdminNetworkPolicyList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicy","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"BaselineAdminNetworkPolicyList contains a list of BaselineAdminNetworkPolicy","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyRuleAction":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"BaselineAdminNetworkPolicyRuleAction","fields":[],"enumValues":[{"name":"BaselineAdminNetworkPolicyRuleActionDeny","docString":"BaselineAdminNetworkPolicyRuleActionDeny enables admins to deny traffic."},{"name":"BaselineAdminNetworkPolicyRuleActionAllow","docString":"BaselineAdminNetworkPolicyRuleActionAllow enables admins to allow certain traffic."}],"docString":"BaselineAdminNetworkPolicyRuleAction string describes the BaselineAdminNetworkPolicy\naction type.\n\n+enum\n+kubebuilder:validation:Enum={\"Allow\", \"Deny\"}","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicySpec":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"BaselineAdminNetworkPolicySpec","fields":[{"fieldName":"Subject","typeName":"AdminNetworkPolicySubject","typeDecorators":null,"docString":"Subject defines the pods to which this BaselineAdminNetworkPolicy applies.\nNote that host-networked pods are not included in subject selection."},{"fieldName":"Ingress","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyIngressRule","typeDecorators":["List"],"docString":"Ingress is the list of Ingress rules to be applied to the selected pods\nif they are not matched by any AdminNetworkPolicy or NetworkPolicy rules.\nA total of 100 Ingress rules will be allowed in each BANP instance.\nThe relative precedence of ingress rules within a single BANP object\nwill be determined by the order in which the rule is written.\nThus, a rule that appears at the top of the ingress rules\nwould take the highest precedence.\nBANPs with no ingress rules do not affect ingress traffic.\n\n+optional\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Egress","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyEgressRule","typeDecorators":["List"],"docString":"Egress is the list of Egress rules to be applied to the selected pods if\nthey are not matched by any AdminNetworkPolicy or NetworkPolicy rules.\nA total of 100 Egress rules will be allowed in each BANP instance.\nThe relative precedence of egress rules within a single BANP object\nwill be determined by the order in which the rule is written.\nThus, a rule that appears at the top of the egress rules\nwould take the highest precedence.\nBANPs with no egress rules do not affect egress traffic.\n\n+optional\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"BaselineAdminNetworkPolicySpec defines the desired state of\nBaselineAdminNetworkPolicy.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.BaselineAdminNetworkPolicyStatus":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"BaselineAdminNetworkPolicyStatus","fields":[{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"}],"enumValues":[],"docString":"BaselineAdminNetworkPolicyStatus defines the observed state of\nBaselineAdminNetworkPolicy.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.NamespacedPod":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"NamespacedPod","fields":[{"fieldName":"NamespaceSelector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":null,"docString":"NamespaceSelector follows standard label selector semantics; if empty,\nit selects all Namespaces."},{"fieldName":"PodSelector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":null,"docString":"PodSelector is used to explicitly select pods within a namespace; if empty,\nit selects all Pods."}],"enumValues":[],"docString":"NamespacedPod allows the user to select a given set of pod(s) in\nselected namespace(s).","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.Port":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"Port","fields":[{"fieldName":"Protocol","typeName":"k8s.io/api/core/v1.Protocol","typeDecorators":null,"docString":"Protocol is the network protocol (TCP, UDP, or SCTP) which traffic must\nmatch. If not specified, this field defaults to TCP.\n+kubebuilder:default=TCP"},{"fieldName":"Port","typeName":"int32","typeDecorators":null,"docString":"Number defines a network port value.\n+kubebuilder:validation:Minimum=1\n+kubebuilder:validation:Maximum=65535"}],"enumValues":[],"docString":"","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha1.PortRange":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha1","typeName":"PortRange","fields":[{"fieldName":"Protocol","typeName":"k8s.io/api/core/v1.Protocol","typeDecorators":null,"docString":"Protocol is the network protocol (TCP, UDP, or SCTP) which traffic must\nmatch. If not specified, this field defaults to TCP.\n+kubebuilder:default=TCP"},{"fieldName":"Start","typeName":"int32","typeDecorators":null,"docString":"Start defines a network port that is the start of a port range, the Start\nvalue must be less than End.\n+kubebuilder:validation:Minimum=1\n+kubebuilder:validation:Maximum=65535"},{"fieldName":"End","typeName":"int32","typeDecorators":null,"docString":"End defines a network port that is the end of a port range, the End value\nmust be greater than Start.\n+kubebuilder:validation:Minimum=1\n+kubebuilder:validation:Maximum=65535"}],"enumValues":[],"docString":"PortRange defines an inclusive range of ports from the the assigned Start value\nto End value.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicy":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicy","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":""},{"fieldName":"Spec","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicySpec","typeDecorators":null,"docString":"Spec defines the desired behavior of ClusterNetworkPolicy."},{"fieldName":"Status","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyStatus","typeDecorators":null,"docString":"Status is the status to be reported by the implementation.\n+optional"}],"enumValues":[],"docString":"ClusterNetworkPolicy is a cluster-wide network policy resource.\n\n+genclient\n+genclient:nonNamespaced\n+kubebuilder:object:root=true\n+kubebuilder:subresource:status\n+kubebuilder:resource:shortName=cnp,scope=Cluster\n+kubebuilder:printcolumn:name=\"Tier\",type=string,JSONPath=\".spec.tier\"\n+kubebuilder:printcolumn:name=\"Priority\",type=string,JSONPath=\".spec.priority\"\n+kubebuilder:printcolumn:name=\"Age\",type=\"date\",JSONPath=\".metadata.creationTimestamp\"\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object","isRoot":true},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyEgressPeer":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicyEgressPeer","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Namespaces defines a way to select all pods within a set of Namespaces.\nNote that host-networked pods are not included in this type of peer.\n\n+optional"},{"fieldName":"Pods","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.NamespacedPod","typeDecorators":["Ptr"],"docString":"Pods defines a way to select a set of pods in\na set of namespaces. Note that host-networked pods\nare not included in this type of peer.\n\n+optional"},{"fieldName":"Nodes","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Nodes defines a way to select a set of nodes in\nthe cluster (based on the node's labels). It selects\nthe nodeIPs as the peer type by matching on the IPs\npresent in the node.Status.Addresses field of the node.\nThis field follows standard label selector\nsemantics; if present but empty, it selects all Nodes.\n\n\u003cnetwork-policy-api:experimental\u003e\n+optional"},{"fieldName":"Networks","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.CIDR","typeDecorators":["List"],"docString":"Networks defines a way to select peers via CIDR blocks.\nThis is intended for representing entities that live outside the cluster,\nwhich can't be selected by pods, namespaces and nodes peers, but note\nthat cluster-internal traffic will be checked against the rule as\nwell. So if you Accept or Deny traffic to `\"0.0.0.0/0\"`, that will allow\nor deny all IPv4 pod-to-pod traffic as well. If you don't want that,\nadd a rule that Passes all pod traffic before the Networks rule.\n\nEach item in Networks should be provided in the CIDR format and should be\nIPv4 or IPv6, for example \"10.0.0.0/8\" or \"fd00::/8\".\n\nNetworks can have upto 25 CIDRs specified.\n\n+optional\n+listType=set\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=25"},{"fieldName":"DomainNames","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.DomainName","typeDecorators":["List"],"docString":"DomainNames provides a way to specify domain names as peers.\n\nDomainNames is only supported for Accept rules. In order to control\naccess, DomainNames Accept rules should be used with a lower precedence\negress deny -- this allows the admin to maintain an explicit \"allowlist\"\nof reachable domains.\n\nDomainNames can have up to 25 domain names specified in one rule.\n\n\u003cnetwork-policy-api:experimental\u003e\n+optional\n+listType=set\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=25"}],"enumValues":[],"docString":"ClusterNetworkPolicyEgressPeer defines a peer to allow traffic to.\n\nExactly one of the fields must be set for a given peer and this is enforced\nby the validation rules on the CRD. If an implementation sees no fields are\nset then it can infer that the deployed CRD is of an incompatible version\nwith an unknown field.  In that case it should fail closed.\n\nFor \"Accept\" rules, \"fail closed\" means: \"treat the rule as matching no\ntraffic\". For \"Deny\" and \"Pass\" rules, \"fail closed\" means: \"treat the rule\nas a 'Deny all' rule\".\n\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyEgressRule":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicyEgressRule","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is an identifier for this rule, that may be no more than\n100 characters in length. This field should be used by the implementation\nto help improve observability, readability and error-reporting\nfor any applied AdminNetworkPolicies.\n\n+optional\n+kubebuilder:validation:MaxLength=100"},{"fieldName":"Action","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyRuleAction","typeDecorators":null,"docString":"Action specifies the effect this rule will have on matching\ntraffic.  Currently the following actions are supported:\n\n- Accept: Accepts the selected traffic, allowing it to\n  egress. No further ClusterNetworkPolicy or NetworkPolicy\n  rules will be processed.\n\n- Deny: Drops the selected traffic. No further\n  ClusterNetworkPolicy or NetworkPolicy rules will be\n  processed.\n\n- Pass: Skips all further ClusterNetworkPolicy rules in the\n  current tier for the selected traffic, and passes\n  evaluation to the next tier."},{"fieldName":"To","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyEgressPeer","typeDecorators":["List"],"docString":"To is the List of destinations whose traffic this rule applies to.\nIf any element matches the destination of outgoing\ntraffic then the specified action is applied.\nThis field must be defined and contain at least one item.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Ports","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyPort","typeDecorators":["Ptr","List"],"docString":"Ports allows for matching traffic based on port and protocols.\nThis field is a list of destination ports for the outgoing egress traffic.\nIf Ports is not set then the rule does not filter traffic via port.\n\n+optional\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"ClusterNetworkPolicyEgressRule describes an action to take on a particular\nset of traffic originating from pods selected by a ClusterNetworkPolicy's\nSubject field.\n\u003cnetwork-policy-api:experimental:validation\u003e\n+kubebuilder:validation:XValidation:rule=\"!(self.to.exists(peer, has(peer.networks) || has(peer.nodes) || has(peer.domainNames)) \u0026\u0026 has(self.ports) \u0026\u0026 self.ports.exists(port, has(port.namedPort)))\",message=\"networks/nodes/domainNames peer cannot be set with namedPorts since there are no namedPorts for networks/nodes/domainNames\"","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyIngressPeer":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicyIngressPeer","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Namespaces defines a way to select all pods within a set of Namespaces.\nNote that host-networked pods are not included in this type of peer.\n\n+optional"},{"fieldName":"Pods","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.NamespacedPod","typeDecorators":["Ptr"],"docString":"Pods defines a way to select a set of pods in\na set of namespaces. Note that host-networked pods\nare not included in this type of peer.\n\n+optional"}],"enumValues":[],"docString":"ClusterNetworkPolicyIngressPeer defines a peer to allow traffic from.\n\nExactly one of the fields must be set for a given peer and this is enforced\nby the validation rules on the CRD. If an implementation sees no fields are\nset then it can infer that the deployed CRD is of an incompatible version\nwith an unknown field.  In that case it should fail closed.\n\nFor \"Accept\" rules, \"fail closed\" means: \"treat the rule as matching no\ntraffic\". For \"Deny\" and \"Pass\" rules, \"fail closed\" means: \"treat the rule\nas a 'Deny all' rule\".\n\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyIngressRule":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicyIngressRule","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is an identifier for this rule, that may be no more than\n100 characters in length. This field should be used by the implementation\nto help improve observability, readability and error-reporting\nfor any applied AdminNetworkPolicies.\n\n+optional\n+kubebuilder:validation:MaxLength=100"},{"fieldName":"Action","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyRuleAction","typeDecorators":null,"docString":"Action specifies the effect this rule will have on matching\ntraffic. Currently the following actions are supported:\n\n- Accept: Accepts the selected traffic, allowing it into\n  the destination. No further ClusterNetworkPolicy or\n  NetworkPolicy rules will be processed.\n\n  Note: while Accept ensures traffic is accepted by\n  Kubernetes network policy, it is still possible that the\n  packet is blocked in other ways: custom nftable rules,\n  high-layers e.g. service mesh.\n\n- Deny: Drops the selected traffic. No further\n  ClusterNetworkPolicy or NetworkPolicy rules will be\n  processed.\n\n- Pass: Skips all further ClusterNetworkPolicy rules in the\n  current tier for the selected traffic, and passes\n  evaluation to the next tier."},{"fieldName":"From","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyIngressPeer","typeDecorators":["List"],"docString":"From is the list of sources whose traffic this rule applies to.\nIf any element matches the source of incoming\ntraffic then the specified action is applied.\nThis field must be defined and contain at least one item.\n\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Ports","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyPort","typeDecorators":["Ptr","List"],"docString":"Ports allows for matching traffic based on port and protocols.\nThis field is a list of ports which should be matched on\nthe pods selected for this policy i.e the subject of the policy.\nSo it matches on the destination port for the ingress traffic.\nIf Ports is not set then the rule does not filter traffic via port.\n\n+optional\n+kubebuilder:validation:MinItems=1\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"ClusterNetworkPolicyIngressRule describes an action to take on a particular\nset of traffic destined for pods selected by a ClusterNetworkPolicy's\nSubject field.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyList":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicyList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicy","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"ClusterNetworkPolicyList contains a list of ClusterNetworkPolicy\n+kubebuilder:object:root=true\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyPort":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicyPort","fields":[{"fieldName":"PortNumber","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.Port","typeDecorators":["Ptr"],"docString":"Port selects a destination port based on protocol and port number.\n\n+optional"},{"fieldName":"PortRange","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.PortRange","typeDecorators":["Ptr"],"docString":"PortRange selects a destination port range based on protocol and\nstart and end port numbers.\n\n+optional"},{"fieldName":"NamedPort","typeName":"string","typeDecorators":["Ptr"],"docString":"NamedPort selects a destination port on a pod based on the ContainerPort\nname. You can't use this in a rule with Nodes or Networks peers,\nbecause they do not have named ports.\n\n\u003cnetwork-policy-api:experimental\u003e\n+optional"}],"enumValues":[],"docString":"ClusterNetworkPolicyPort describes how to select destination network ports.\nExactly one field must be set.\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyRuleAction":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicyRuleAction","fields":[],"enumValues":[{"name":"ClusterNetworkPolicyRuleActionAccept","docString":"ClusterNetworkPolicyRuleActionAccept indicates that\nmatching traffic will be accepted and no further policy\nevaluation will be done. This is a final decision."},{"name":"ClusterNetworkPolicyRuleActionDeny","docString":"ClusterNetworkPolicyRuleActionDeny indicates that matching traffic\nwill be denied and no further policy evaluation will be done.\nThis is a final decision."},{"name":"ClusterNetworkPolicyRuleActionPass","docString":"ClusterNetworkPolicyRuleActionPass indicates that matching traffic\nwill jump to the next tier evaluation. That means that all the rules\nwith lower precedence at the same tier will be ignored,\nbut evaluation will continue at the next tier.\nFor example, if an Admin tier CNP uses Pass action,\nNetworkPolicy evaluation will happen next."}],"docString":"ClusterNetworkPolicyRuleAction string describes the ClusterNetworkPolicy\naction type.\n\n+enum\n+kubebuilder:validation:Enum={\"Accept\", \"Deny\", \"Pass\"}","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicySpec":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicySpec","fields":[{"fieldName":"Tier","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.Tier","typeDecorators":null,"docString":"Tier is used as the top-level grouping for network policy prioritization.\n\nPolicy tiers are evaluated in the following order:\n* Admin tier\n* NetworkPolicy tier\n* Baseline tier\n\nClusterNetworkPolicy can use 2 of these tiers: Admin and Baseline.\n\nThe Admin tier takes precedence over all other policies. Policies\ndefined in this tier are used to set cluster-wide security rules\nthat cannot be overridden in the other tiers. If Admin tier has\nmade a final decision (Accept or Deny) on a connection, then no\nfurther evaluation is done.\n\nNetworkPolicy tier is the tier for the namespaced v1.NetworkPolicy.\nThese policies are intended for the application developer to describe\nthe security policy associated with their deployments inside their\nnamespace. v1.NetworkPolicy always makes a final decision for selected\npods. Further evaluation only happens for Pods not selected by a\nv1.NetworkPolicy.\n\nBaseline tier is a cluster-wide policy that can be overridden by the\nv1.NetworkPolicy. If Baseline tier has made a final decision (Accept or\nDeny) on a connection, then no further evaluation is done.\n\nIf a given connection wasn't allowed or denied by any of the tiers,\nthe default kubernetes policy is applied, which says that\nall pods can communicate with each other."},{"fieldName":"Priority","typeName":"int32","typeDecorators":null,"docString":"Priority is a value from 0 to 1000 indicating the precedence of\nthe policy within its tier. Policies with lower priority values have\nhigher precedence, and are checked before policies with higher priority\nvalues in the same tier. All Admin tier rules have higher precedence than\nNetworkPolicy or Baseline tier rules.\nIf two (or more) policies in the same tier with the same priority\ncould match a connection, then the implementation can apply any of the\nmatching policies to the connection, and there is no way for the user to\nreliably determine which one it will choose. Administrators must be\ncareful about assigning the priorities for policies with rules that will\nmatch many connections, and ensure that policies have unique priority\nvalues in cases where ambiguity would be unacceptable.\n\n+kubebuilder:validation:Minimum=0\n+kubebuilder:validation:Maximum=1000"},{"fieldName":"Subject","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicySubject","typeDecorators":null,"docString":"Subject defines the pods to which this ClusterNetworkPolicy applies."},{"fieldName":"Ingress","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyIngressRule","typeDecorators":["List"],"docString":"Ingress is the list of Ingress rules to be applied to the selected pods.\nA total of 100 rules will be allowed in each CNP instance.\nThe relative precedence of ingress rules within a single CNP object\n(all of which share the priority) will be determined by the order\nin which the rule is written.\nThus, a rule that appears at the top of the ingress rules\nwould take the highest precedence.\nCNPs with no ingress rules do not affect ingress traffic.\n\n+optional\n+kubebuilder:validation:MaxItems=100"},{"fieldName":"Egress","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyEgressRule","typeDecorators":["List"],"docString":"Egress is the list of Egress rules to be applied to the selected pods.\nA total of 100 rules will be allowed in each CNP instance.\nThe relative precedence of egress rules within a single CNP object\n(all of which share the priority) will be determined by the order\nin which the rule is written.\nThus, a rule that appears at the top of the egress rules\nwould take the highest precedence.\nCNPs with no egress rules do not affect egress traffic.\n\n+optional\n+kubebuilder:validation:MaxItems=100"}],"enumValues":[],"docString":"ClusterNetworkPolicySpec defines the desired state of ClusterNetworkPolicy.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicyStatus":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicyStatus","fields":[{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"}],"enumValues":[],"docString":"ClusterNetworkPolicyStatus defines the observed state of\nClusterNetworkPolicy.","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.ClusterNetworkPolicySubject":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"ClusterNetworkPolicySubject","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Namespaces is used to select pods via namespace selectors.\n+optional"},{"fieldName":"Pods","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha2.NamespacedPod","typeDecorators":["Ptr"],"docString":"Pods is used to select pods via namespace AND pod selectors.\n+optional"}],"enumValues":[],"docString":"ClusterNetworkPolicySubject defines what resources the policy applies to.\nExactly one field must be set.\nNote that host-networked pods are not included in subject selection.\n+kubebuilder:validation:MaxProperties=1\n+kubebuilder:validation:MinProperties=1","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.NamespacedPod":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"NamespacedPod","fields":[{"fieldName":"NamespaceSelector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":null,"docString":"NamespaceSelector follows standard label selector semantics; if empty,\nit selects all Namespaces."},{"fieldName":"PodSelector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":null,"docString":"PodSelector is used to explicitly select pods within a namespace;\nif empty, it selects all Pods."}],"enumValues":[],"docString":"NamespacedPod allows the user to select a given set of pod(s) in\nselected namespace(s).","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.Port":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"Port","fields":[{"fieldName":"Protocol","typeName":"k8s.io/api/core/v1.Protocol","typeDecorators":null,"docString":"Protocol is the network protocol (TCP, UDP, or SCTP) which traffic must\nmatch. If not specified, this field defaults to TCP.\n+kubebuilder:default=TCP"},{"fieldName":"Port","typeName":"int32","typeDecorators":null,"docString":"Number defines a network port value.\n+kubebuilder:validation:Minimum=1\n+kubebuilder:validation:Maximum=65535"}],"enumValues":[],"docString":"","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.PortRange":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"PortRange","fields":[{"fieldName":"Protocol","typeName":"k8s.io/api/core/v1.Protocol","typeDecorators":null,"docString":"Protocol is the network protocol (TCP, UDP, or SCTP) which traffic must\nmatch. If not specified, this field defaults to TCP.\n+kubebuilder:default=TCP"},{"fieldName":"Start","typeName":"int32","typeDecorators":null,"docString":"Start defines a network port that is the start of a port range, the Start\nvalue must be less than End.\n+kubebuilder:validation:Minimum=1\n+kubebuilder:validation:Maximum=65535"},{"fieldName":"End","typeName":"int32","typeDecorators":null,"docString":"End defines a network port that is the end of a port range, the End value\nmust be greater than Start.\n+kubebuilder:validation:Minimum=1\n+kubebuilder:validation:Maximum=65535"}],"enumValues":[],"docString":"PortRange defines an inclusive range of ports from the assigned\nStart value to End value.\n+kubebuilder:validation:XValidation:rule=\"self.start \u003c self.end\", message=\"Start port must be less than End port\"","isRoot":false},"sigs.k8s.io/network-policy-api/apis/v1alpha2.Tier":{"package":"sigs.k8s.io/network-policy-api/apis/v1alpha2","typeName":"Tier","fields":[],"enumValues":[{"name":"AdminTier","docString":""},{"name":"BaselineTier","docString":""}],"docString":"+kubebuilder:validation:Enum={\"Admin\", \"Baseline\"}","isRoot":false},"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1.AdminNetworkPolicyApplyConfiguration":{"package":"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1","typeName":"AdminNetworkPolicyApplyConfiguration","fields":[{"fieldName":"TypeMetaApplyConfiguration","typeName":"k8s.io/client-go/applyconfigurations/meta/v1.TypeMetaApplyConfiguration","typeDecorators":null,"docString":""},{"fieldName":"ObjectMetaApplyConfiguration","typeName":"k8s.io/client-go/applyconfigurations/meta/v1.ObjectMetaApplyConfiguration","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Spec","typeName":"AdminNetworkPolicySpecApplyConfiguration","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Status","typeName":"AdminNetworkPolicyStatusApplyConfiguration","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"AdminNetworkPolicyApplyConfiguration represents a declarative configuration of the AdminNetworkPolicy type for use\nwith apply.","isRoot":false},"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1.AdminNetworkPolicyEgressPeerApplyConfiguration":{"package":"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1","typeName":"AdminNetworkPolicyEgressPeerApplyConfiguration","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/client-go/applyconfigurations/meta/v1.LabelSelectorApplyConfiguration","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Pods","typeName":"NamespacedPodApplyConfiguration","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Nodes","typeName":"k8s.io/client-go/applyconfigurations/meta/v1.LabelSelectorApplyConfiguration","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Networks","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.CIDR","typeDecorators":["List"],"docString":""},{"fieldName":"DomainNames","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.DomainName","typeDecorators":["List"],"docString":""}],"enumValues":[],"docString":"AdminNetworkPolicyEgressPeerApplyConfiguration represents a declarative configuration of the AdminNetworkPolicyEgressPeer type for use\nwith apply.","isRoot":false},"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1.AdminNetworkPolicyEgressRuleApplyConfiguration":{"package":"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1","typeName":"AdminNetworkPolicyEgressRuleApplyConfiguration","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Action","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyRuleAction","typeDecorators":["Ptr"],"docString":""},{"fieldName":"To","typeName":"AdminNetworkPolicyEgressPeerApplyConfiguration","typeDecorators":["List"],"docString":""},{"fieldName":"Ports","typeName":"AdminNetworkPolicyPortApplyConfiguration","typeDecorators":["Ptr","List"],"docString":""}],"enumValues":[],"docString":"AdminNetworkPolicyEgressRuleApplyConfiguration represents a declarative configuration of the AdminNetworkPolicyEgressRule type for use\nwith apply.","isRoot":false},"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1.AdminNetworkPolicyIngressPeerApplyConfiguration":{"package":"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1","typeName":"AdminNetworkPolicyIngressPeerApplyConfiguration","fields":[{"fieldName":"Namespaces","typeName":"k8s.io/client-go/applyconfigurations/meta/v1.LabelSelectorApplyConfiguration","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Pods","typeName":"NamespacedPodApplyConfiguration","typeDecorators":["Ptr"],"docString":""}],"enumValues":[],"docString":"AdminNetworkPolicyIngressPeerApplyConfiguration represents a declarative configuration of the AdminNetworkPolicyIngressPeer type for use\nwith apply.","isRoot":false},"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1.AdminNetworkPolicyIngressRuleApplyConfiguration":{"package":"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1","typeName":"AdminNetworkPolicyIngressRuleApplyConfiguration","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":["Ptr"],"docString":""},{"fieldName":"Action","typeName":"sigs.k8s.io/network-policy-api/apis/v1alpha1.AdminNetworkPolicyRuleAction","typeDecorators":["Ptr"],"docString":""},{"fieldName":"From","typeName":"AdminNetworkPolicyIngressPeerApplyConfiguration","typeDecorators":["List"],"docString":""},{"fieldName":"Ports","typeName":"AdminNetworkPolicyPortApplyConfiguration","typeDecorators":["Ptr","List"],"docString":""}],"enumValues":[],"docString":"AdminNetworkPolicyIngressRuleApplyConfiguration represents a declarative configuration of the AdminNetworkPolicyIngressRule type for use\nwith apply.","isRoot":false},"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1.AdminNetworkPolicyPortApplyConfiguration":{"package":"sigs.k8s.io/network-policy-api/pkg/client/applyconfiguration/apis/v1alpha1","typeName":"AdminNetworkPolicyPort   const startTypes = 'sigs.k8s.io\/network-policy-api\/apis\/v1alpha2.ClusterNetworkPolicy'.split(',').filter(s => s.trim() !== '');

  const mainContainer = document.getElementById('main-container');
  const typeSwitcherOverlay = document.getElementById('type-switcher-overlay');
  const typeSwitcherDialog = document.getElementById('type-switcher-dialog');
  const typeSwitcherInput = document.getElementById('type-switcher-input');
  const typeSwitcherList = document.getElementById('type-switcher-list');

  function splitTypeName(fullTypeName) {
      const lastDot = fullTypeName.lastIndexOf('.');
      if (lastDot === -1) {
          return { pkg: '', type: fullTypeName };
      }
      const pkg = fullTypeName.substring(0, lastDot);
      const type = fullTypeName.substring(lastDot + 1);
      return { pkg, type };
  }

  function formatDecorators(decorators) {
      if (!decorators || decorators.length === 0) {
          return '';
      }
      let prefix = '';
      decorators.forEach(dec => {
          if (dec === 'Ptr') {
              prefix += '*';
          } else if (dec === 'List') {
              prefix += '[]';
          } else if (dec.startsWith('Map[')) {
              const keyType = dec.substring(4, dec.length - 1);
              prefix += 'map[' + keyType + ']';
          }
      });
      return prefix;
  }

  function createDocString(docStringText) {
      const container = document.createElement('div');
      container.className = 'doc-string';

      if (!docStringText) {
          return container;
      }

      const sentences = docStringText.split('.');
      const firstSentence = sentences[0] + (sentences.length > 1 && sentences.slice(1).join('.').trim() !== '' ? '.' : '');
      const hasMore = docStringText.trim() !== firstSentence.trim();

      if (hasMore) {
          const textSpan = document.createElement('span');
          textSpan.textContent = firstSentence;
          
          const toggle = document.createElement('span');
          toggle.textContent = ' ...';
          toggle.style.cursor = 'pointer';

          toggle.addEventListener('click', (e) => {
              e.stopPropagation();
              const isExpanded = textSpan.textContent === docStringText;
              if (isExpanded) {
                  textSpan.textContent = firstSentence;
                  toggle.textContent = ' ...';
              } else {
                  textSpan.textContent = docStringText;
                  toggle.textContent = ' (close)';
              }
          });

          container.appendChild(textSpan);
          container.appendChild(toggle);
      } else {
          container.textContent = docStringText;
      }
      return container;
  }

  function createColumn(typeName) {
      const typeInfo = typeData[typeName];
      if (!typeInfo) return;

      const column = document.createElement('div');
      column.className = 'column';

      const header = document.createElement('div');
      header.className = 'column-header';

      const headerType = document.createElement('div');
      headerType.innerHTML = typeInfo.typeName;
      headerType.className = 'header-row';

      const headerPkg = document.createElement('div');
      headerPkg.innerHTML = typeInfo.package;
      headerPkg.className = 'type-name';

      header.appendChild(headerType);
      header.appendChild(headerPkg);

      column.appendChild(header);

      const ul = document.createElement('ul');
      
      if (typeInfo.fields) {
          typeInfo.fields.forEach(field => {
              const li = document.createElement('li');
              li.dataset.fieldName = field.fieldName;
              li.dataset.typeName = field.typeName;
              li.dataset.parentType = typeName;

              const { pkg, type } = splitTypeName(field.typeName);
              const decorators = formatDecorators(field.typeDecorators);

              const line1 = document.createElement('div');
              line1.className = "field-row";

              const fieldName = document.createElement('span');
              fieldName.innerHTML = field.fieldName;
              fieldName.className = 'field-name';

              const fieldType = document.createElement('span');
              fieldType.innerHTML = decorators + type;
              fieldType.className = 'field-type';

              line1.appendChild(fieldName);
              line1.appendChild(fieldType);

              const line2 = document.createElement('div');
              line2.className = 'type-name';
              line2.innerHTML = pkg;

              const contentWrapper = document.createElement('div');
              contentWrapper.appendChild(line1);
              contentWrapper.appendChild(line2);
              if (field.docString) {
                  contentWrapper.appendChild(createDocString(field.docString));
              }

              li.appendChild(contentWrapper);

              if (typeData[field.typeName]) {
                  const chevron = document.createElement('span');
                  chevron.className = 'chevron';
                  li.appendChild(chevron);
              }

              li.addEventListener('click', (event) => {
                  handleFieldClick(event.currentTarget);
              });
              ul.appendChild(li);
          });
      }
      
      if (typeInfo.enumValues) {
          typeInfo.enumValues.forEach(enumVal => {
              const li = document.createElement('li');
              li.style.cursor = 'default';

              const line1 = document.createElement('div');
              line1.className = "field-row";

              const enumName = document.createElement('span');
              enumName.innerHTML = enumVal.name;
              enumName.className = 'field-name';

              line1.appendChild(enumName);

              const contentWrapper = document.createElement('div');
              contentWrapper.appendChild(line1);
              if (enumVal.docString) {
                  contentWrapper.appendChild(createDocString(enumVal.docString));
              }

              li.appendChild(contentWrapper);
              ul.appendChild(li);
          });
      }

      column.appendChild(ul);
      return column;
  }

  function handleFieldClick(listItem) {
      const { typeName, parentType } = listItem.dataset;
      
      let currentColumn = listItem.closest('.column');
      
      while (currentColumn && currentColumn.nextSibling) {
          currentColumn.nextSibling.remove();
      }

      const parentList = listItem.parentElement;
      parentList.querySelectorAll('li.selected').forEach(item => {
          item.classList.remove('selected');
      });

      listItem.classList.add('selected');

      if (typeData[typeName]) {
          const newColumn = createColumn(typeName);
          if (newColumn) {
              mainContainer.appendChild(newColumn);
              newColumn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
          }
      }
  }

  function init() {
      if (startTypes.length > 0) {
          startTypes.forEach(typeName => {
              const initialColumn = createColumn(typeName);
              if (initialColumn) {
                  mainContainer.appendChild(initialColumn);
              }
          });
      } else {
          const firstTypeName = Object.keys(typeData)[0];
          if (firstTypeName) {
              const initialColumn = createColumn(firstTypeName);
              if (initialColumn) {
                  mainContainer.appendChild(initialColumn);
              }
          }
      }
  }

  init();

  function populateTypeSwitcherList(filter = '') {
      typeSwitcherList.innerHTML = '';
      const typeNames = Object.keys(typeData).sort();
      const filteredTypes = typeNames.filter(name => {
          const typeInfo = typeData[name];
          if (!typeInfo.isRoot) {
              return false;
          }
          return name.toLowerCase().includes(filter.toLowerCase());
      });

      filteredTypes.forEach(typeName => {
          const typeInfo = typeData[typeName];

          const li = document.createElement('li');

          const tn = document.createElement('div');
          tn.innerHTML = typeInfo.typeName;
          tn.className = 'type-switcher-type-name';

          const pkg = document.createElement('div');
          pkg.innerHTML = typeInfo.package;
          pkg.className = 'type-switcher-type-pkg';

          li.appendChild(tn);
          li.appendChild(pkg);
          li.dataset.typeName = typeName;

          typeSwitcherList.appendChild(li);
      });

      if (typeSwitcherList.firstChild) {
          typeSwitcherList.firstChild.classList.add('selected');
      }
  }

  function showTypeSwitcher() {
      populateTypeSwitcherList();
      typeSwitcherOverlay.style.display = 'flex';
      typeSwitcherInput.focus();
  }

  function hideTypeSwitcher() {
      typeSwitcherInput.value = '';
      typeSwitcherOverlay.style.display = 'none';
  }

  function selectType(typeName) {
      hideTypeSwitcher();
      mainContainer.innerHTML = '';
      const newColumn = createColumn(typeName);
      if (newColumn) {
          mainContainer.appendChild(newColumn);
      }
  }

  document.addEventListener('keydown', (event) => {
      if (event.key === '/' && event.target.tagName !== 'INPUT') {
          event.preventDefault();
          showTypeSwitcher();
      }
      if (event.key === 'Escape') {
          if (typeSwitcherOverlay.style.display === 'flex') {
              hideTypeSwitcher();
          }
      }
  });

  typeSwitcherInput.addEventListener('input', () => {
      populateTypeSwitcherList(typeSwitcherInput.value);
  });

  typeSwitcherInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
          event.preventDefault();
          const selected = typeSwitcherList.querySelector('li.selected');
          if (selected) {
              selectType(selected.dataset.typeName);
          }
      } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          const selected = typeSwitcherList.querySelector('li.selected');
          if (selected && selected.nextElementSibling) {
              selected.classList.remove('selected');
              selected.nextElementSibling.classList.add('selected');
              selected.nextElementSibling.scrollIntoView({ block: 'nearest' });
          }
      } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          const selected = typeSwitcherList.querySelector('li.selected');
          if (selected && selected.previousElementSibling) {
              selected.classList.remove('selected');
              selected.previousElementSibling.classList.add('selected');
              selected.previousElementSibling.scrollIntoView({ block: 'nearest' });
          }
      }
  });

  typeSwitcherList.addEventListener('click', (event) => {
      if (event.target.tagName === 'LI') {
          selectType(event.target.dataset.typeName);
      }
  });

  typeSwitcherDialog.addEventListener('click', (event) => {
      event.stopPropagation();
  });

  typeSwitcherOverlay.addEventListener('click', () => {
      hideTypeSwitcher();
  });
</script>
</body>
</html>
