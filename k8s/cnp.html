 address. Setting this to \"None\" makes a\n\"headless service\" (no virtual IP), which is useful when direct endpoint\nconnections are preferred and proxying is not required.  Only applies to\ntypes ClusterIP, NodePort, and LoadBalancer. If this field is specified\nwhen creating a Service of type ExternalName, creation will fail. This\nfield will be wiped when updating a Service to type ExternalName.\nMore info: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies\n+optional"},{"fieldName":"ClusterIPs","typeName":"string","typeDecorators":["List"],"docString":"ClusterIPs is a list of IP addresses assigned to this service, and are\nusually assigned randomly.  If an address is specified manually, is\nin-range (as per system configuration), and is not in use, it will be\nallocated to the service; otherwise creation of the service will fail.\nThis field may not be changed through updates unless the type field is\nalso being changed to ExternalName (which requires this field to be\nempty) or the type field is being changed from ExternalName (in which\ncase this field may optionally be specified, as describe above).  Valid\nvalues are \"None\", empty string (\"\"), or a valid IP address.  Setting\nthis to \"None\" makes a \"headless service\" (no virtual IP), which is\nuseful when direct endpoint connections are preferred and proxying is\nnot required.  Only applies to types ClusterIP, NodePort, and\nLoadBalancer. If this field is specified when creating a Service of type\nExternalName, creation will fail. This field will be wiped when updating\na Service to type ExternalName.  If this field is not specified, it will\nbe initialized from the clusterIP field.  If this field is specified,\nclients must ensure that clusterIPs[0] and clusterIP have the same\nvalue.\n\nThis field may hold a maximum of two entries (dual-stack IPs, in either order).\nThese IPs must correspond to the values of the ipFamilies field. Both\nclusterIPs and ipFamilies are governed by the ipFamilyPolicy field.\nMore info: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies\n+listType=atomic\n+optional"},{"fieldName":"Type","typeName":"k8s.io/api/core/v1.ServiceType","typeDecorators":null,"docString":"type determines how the Service is exposed. Defaults to ClusterIP. Valid\noptions are ExternalName, ClusterIP, NodePort, and LoadBalancer.\n\"ClusterIP\" allocates a cluster-internal IP address for load-balancing\nto endpoints. Endpoints are determined by the selector or if that is not\nspecified, by manual construction of an Endpoints object or\nEndpointSlice objects. If clusterIP is \"None\", no virtual IP is\nallocated and the endpoints are published as a set of endpoints rather\nthan a virtual IP.\n\"NodePort\" builds on ClusterIP and allocates a port on every node which\nroutes to the same endpoints as the clusterIP.\n\"LoadBalancer\" builds on NodePort and creates an external load-balancer\n(if supported in the current cloud) which routes to the same endpoints\nas the clusterIP.\n\"ExternalName\" aliases this service to the specified externalName.\nSeveral other fields do not apply to ExternalName services.\nMore info: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types\n+optional"},{"fieldName":"ExternalIPs","typeName":"string","typeDecorators":["List"],"docString":"externalIPs is a list of IP addresses for which nodes in the cluster\nwill also accept traffic for this service.  These IPs are not managed by\nKubernetes.  The user is responsible for ensuring that traffic arrives\nat a node with this IP.  A common example is external load-balancers\nthat are not part of the Kubernetes system.\n+optional\n+listType=atomic"},{"fieldName":"SessionAffinity","typeName":"k8s.io/api/core/v1.ServiceAffinity","typeDecorators":null,"docString":"Supports \"ClientIP\" and \"None\". Used to maintain session affinity.\nEnable client IP based session affinity.\nMust be ClientIP or None.\nDefaults to None.\nMore info: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies\n+optional"},{"fieldName":"LoadBalancerIP","typeName":"string","typeDecorators":null,"docString":"Only applies to Service Type: LoadBalancer.\nThis feature depends on whether the underlying cloud-provider supports specifying\nthe loadBalancerIP when a load balancer is created.\nThis field will be ignored if the cloud-provider does not support the feature.\nDeprecated: This field was under-specified and its meaning varies across implementations.\nUsing it is non-portable and it may not support dual-stack.\nUsers are encouraged to use implementation-specific annotations when available.\n+optional"},{"fieldName":"LoadBalancerSourceRanges","typeName":"string","typeDecorators":["List"],"docString":"If specified and supported by the platform, this will restrict traffic through the cloud-provider\nload-balancer will be restricted to the specified client IPs. This field will be ignored if the\ncloud-provider does not support the feature.\"\nMore info: https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/\n+optional\n+listType=atomic"},{"fieldName":"ExternalName","typeName":"string","typeDecorators":null,"docString":"externalName is the external reference that discovery mechanisms will\nreturn as an alias for this service (e.g. a DNS CNAME record). No\nproxying will be involved.  Must be a lowercase RFC-1123 hostname\n(https://tools.ietf.org/html/rfc1123) and requires `type` to be \"ExternalName\".\n+optional"},{"fieldName":"ExternalTrafficPolicy","typeName":"k8s.io/api/core/v1.ServiceExternalTrafficPolicy","typeDecorators":null,"docString":"externalTrafficPolicy describes how nodes distribute service traffic they\nreceive on one of the Service's \"externally-facing\" addresses (NodePorts,\nExternalIPs, and LoadBalancer IPs). If set to \"Local\", the proxy will configure\nthe service in a way that assumes that external load balancers will take care\nof balancing the service traffic between nodes, and so each node will deliver\ntraffic only to the node-local endpoints of the service, without masquerading\nthe client source IP. (Traffic mistakenly sent to a node with no endpoints will\nbe dropped.) The default value, \"Cluster\", uses the standard behavior of\nrouting to all endpoints evenly (possibly modified by topology and other\nfeatures). Note that traffic sent to an External IP or LoadBalancer IP from\nwithin the cluster will always get \"Cluster\" semantics, but clients sending to\na NodePort from within the cluster may need to take traffic policy into account\nwhen picking a node.\n+optional"},{"fieldName":"HealthCheckNodePort","typeName":"int32","typeDecorators":null,"docString":"healthCheckNodePort specifies the healthcheck nodePort for the service.\nThis only applies when type is set to LoadBalancer and\nexternalTrafficPolicy is set to Local. If a value is specified, is\nin-range, and is not in use, it will be used.  If not specified, a value\nwill be automatically allocated.  External systems (e.g. load-balancers)\ncan use this port to determine if a given node holds endpoints for this\nservice or not.  If this field is specified when creating a Service\nwhich does not need it, creation will fail. This field will be wiped\nwhen updating a Service to no longer need it (e.g. changing type).\nThis field cannot be updated once set.\n+optional"},{"fieldName":"PublishNotReadyAddresses","typeName":"bool","typeDecorators":null,"docString":"publishNotReadyAddresses indicates that any agent which deals with endpoints for this\nService should disregard any indications of ready/not-ready.\nThe primary use case for setting this field is for a StatefulSet's Headless Service to\npropagate SRV DNS records for its Pods for the purpose of peer discovery.\nThe Kubernetes controllers that generate Endpoints and EndpointSlice resources for\nServices interpret this to mean that all endpoints are considered \"ready\" even if the\nPods themselves are not. Agents which consume only Kubernetes generated endpoints\nthrough the Endpoints or EndpointSlice resources can safely assume this behavior.\n+optional"},{"fieldName":"SessionAffinityConfig","typeName":"k8s.io/api/core/v1.SessionAffinityConfig","typeDecorators":["Ptr"],"docString":"sessionAffinityConfig contains the configurations of session affinity.\n+optional"},{"fieldName":"IPFamilies","typeName":"k8s.io/api/core/v1.IPFamily","typeDecorators":["List"],"docString":"IPFamilies is a list of IP families (e.g. IPv4, IPv6) assigned to this\nservice. This field is usually assigned automatically based on cluster\nconfiguration and the ipFamilyPolicy field. If this field is specified\nmanually, the requested family is available in the cluster,\nand ipFamilyPolicy allows it, it will be used; otherwise creation of\nthe service will fail. This field is conditionally mutable: it allows\nfor adding or removing a secondary IP family, but it does not allow\nchanging the primary IP family of the Service. Valid values are \"IPv4\"\nand \"IPv6\".  This field only applies to Services of types ClusterIP,\nNodePort, and LoadBalancer, and does apply to \"headless\" services.\nThis field will be wiped when updating a Service to type ExternalName.\n\nThis field may hold a maximum of two entries (dual-stack families, in\neither order).  These families must correspond to the values of the\nclusterIPs field, if specified. Both clusterIPs and ipFamilies are\ngoverned by the ipFamilyPolicy field.\n+listType=atomic\n+optional"},{"fieldName":"IPFamilyPolicy","typeName":"k8s.io/api/core/v1.IPFamilyPolicy","typeDecorators":["Ptr"],"docString":"IPFamilyPolicy represents the dual-stack-ness requested or required by\nthis Service. If there is no value provided, then this field will be set\nto SingleStack. Services can be \"SingleStack\" (a single IP family),\n\"PreferDualStack\" (two IP families on dual-stack configured clusters or\na single IP family on single-stack clusters), or \"RequireDualStack\"\n(two IP families on dual-stack configured clusters, otherwise fail). The\nipFamilies and clusterIPs fields depend on the value of this field. This\nfield will be wiped when updating a service to type ExternalName.\n+optional"},{"fieldName":"AllocateLoadBalancerNodePorts","typeName":"bool","typeDecorators":["Ptr"],"docString":"allocateLoadBalancerNodePorts defines if NodePorts will be automatically\nallocated for services with type LoadBalancer.  Default is \"true\". It\nmay be set to \"false\" if the cluster load-balancer does not rely on\nNodePorts.  If the caller requests specific NodePorts (by specifying a\nvalue), those requests will be respected, regardless of this field.\nThis field may only be set for services with type LoadBalancer and will\nbe cleared if the type is changed to any other type.\n+optional"},{"fieldName":"LoadBalancerClass","typeName":"string","typeDecorators":["Ptr"],"docString":"loadBalancerClass is the class of the load balancer implementation this Service belongs to.\nIf specified, the value of this field must be a label-style identifier, with an optional prefix,\ne.g. \"internal-vip\" or \"example.com/internal-vip\". Unprefixed names are reserved for end-users.\nThis field can only be set when the Service type is 'LoadBalancer'. If not set, the default load\nbalancer implementation is used, today this is typically done through the cloud provider integration,\nbut should apply for any default implementation. If set, it is assumed that a load balancer\nimplementation is watching for Services with a matching class. Any default load balancer\nimplementation (e.g. cloud providers) should ignore Services that set this field.\nThis field can only be set when creating or updating a Service to type 'LoadBalancer'.\nOnce set, it can not be changed. This field will be wiped when a service is updated to a non 'LoadBalancer' type.\n+optional"},{"fieldName":"InternalTrafficPolicy","typeName":"k8s.io/api/core/v1.ServiceInternalTrafficPolicy","typeDecorators":["Ptr"],"docString":"InternalTrafficPolicy describes how nodes distribute service traffic they\nreceive on the ClusterIP. If set to \"Local\", the proxy will assume that pods\nonly want to talk to endpoints of the service on the same node as the pod,\ndropping the traffic if there are no local endpoints. The default value,\n\"Cluster\", uses the standard behavior of routing to all endpoints evenly\n(possibly modified by topology and other features).\n+optional"},{"fieldName":"TrafficDistribution","typeName":"string","typeDecorators":["Ptr"],"docString":"TrafficDistribution offers a way to express preferences for how traffic\nis distributed to Service endpoints. Implementations can use this field\nas a hint, but are not required to guarantee strict adherence. If the\nfield is not set, the implementation will apply its default routing\nstrategy. If set to \"PreferClose\", implementations should prioritize\nendpoints that are in the same zone.\n+featureGate=ServiceTrafficDistribution\n+optional"}],"enumValues":[],"docString":"ServiceSpec describes the attributes that a user creates on a service.","isRoot":false},"k8s.io/api/core/v1.ServiceStatus":{"package":"k8s.io/api/core/v1","typeName":"ServiceStatus","fields":[{"fieldName":"LoadBalancer","typeName":"k8s.io/api/core/v1.LoadBalancerStatus","typeDecorators":null,"docString":"LoadBalancer contains the current status of the load-balancer,\nif one is present.\n+optional"},{"fieldName":"Conditions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Condition","typeDecorators":["List"],"docString":"Current service state\n+optional\n+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"}],"enumValues":[],"docString":"ServiceStatus represents the current status of a service.","isRoot":false},"k8s.io/api/core/v1.ServiceType":{"package":"k8s.io/api/core/v1","typeName":"ServiceType","fields":[],"enumValues":[{"name":"ServiceTypeClusterIP","docString":"ServiceTypeClusterIP means a service will only be accessible inside the\ncluster, via the cluster IP."},{"name":"ServiceTypeNodePort","docString":"ServiceTypeNodePort means a service will be exposed on one port of\nevery node, in addition to 'ClusterIP' type."},{"name":"ServiceTypeLoadBalancer","docString":"ServiceTypeLoadBalancer means a service will be exposed via an\nexternal load balancer (if the cloud provider supports it), in addition\nto 'NodePort' type."},{"name":"ServiceTypeExternalName","docString":"ServiceTypeExternalName means a service consists of only a reference to\nan external name that kubedns or equivalent will return as a CNAME\nrecord, with no exposing or proxying of any pods involved."}],"docString":"Service Type string describes ingress methods for a service\n+enum","isRoot":false},"k8s.io/api/core/v1.SessionAffinityConfig":{"package":"k8s.io/api/core/v1","typeName":"SessionAffinityConfig","fields":[{"fieldName":"ClientIP","typeName":"k8s.io/api/core/v1.ClientIPConfig","typeDecorators":["Ptr"],"docString":"clientIP contains the configurations of Client IP based session affinity.\n+optional"}],"enumValues":[],"docString":"SessionAffinityConfig represents the configurations of session affinity.","isRoot":false},"k8s.io/api/core/v1.Signal":{"package":"k8s.io/api/core/v1","typeName":"Signal","fields":[],"enumValues":[{"name":"SIGABRT","docString":""},{"name":"SIGALRM","docString":""},{"name":"SIGBUS","docString":""},{"name":"SIGCHLD","docString":""},{"name":"SIGCLD","docString":""},{"name":"SIGCONT","docString":""},{"name":"SIGFPE","docString":""},{"name":"SIGHUP","docString":""},{"name":"SIGILL","docString":""},{"name":"SIGINT","docString":""},{"name":"SIGIO","docString":""},{"name":"SIGIOT","docString":""},{"name":"SIGKILL","docString":""},{"name":"SIGPIPE","docString":""},{"name":"SIGPOLL","docString":""},{"name":"SIGPROF","docString":""},{"name":"SIGPWR","docString":""},{"name":"SIGQUIT","docString":""},{"name":"SIGSEGV","docString":""},{"name":"SIGSTKFLT","docString":""},{"name":"SIGSTOP","docString":""},{"name":"SIGSYS","docString":""},{"name":"SIGTERM","docString":""},{"name":"SIGTRAP","docString":""},{"name":"SIGTSTP","docString":""},{"name":"SIGTTIN","docString":""},{"name":"SIGTTOU","docString":""},{"name":"SIGURG","docString":""},{"name":"SIGUSR1","docString":""},{"name":"SIGUSR2","docString":""},{"name":"SIGVTALRM","docString":""},{"name":"SIGWINCH","docString":""},{"name":"SIGXCPU","docString":""},{"name":"SIGXFSZ","docString":""},{"name":"SIGRTMIN","docString":""},{"name":"SIGRTMINPLUS1","docString":""},{"name":"SIGRTMINPLUS2","docString":""},{"name":"SIGRTMINPLUS3","docString":""},{"name":"SIGRTMINPLUS4","docString":""},{"name":"SIGRTMINPLUS5","docString":""},{"name":"SIGRTMINPLUS6","docString":""},{"name":"SIGRTMINPLUS7","docString":""},{"name":"SIGRTMINPLUS8","docString":""},{"name":"SIGRTMINPLUS9","docString":""},{"name":"SIGRTMINPLUS10","docString":""},{"name":"SIGRTMINPLUS11","docString":""},{"name":"SIGRTMINPLUS12","docString":""},{"name":"SIGRTMINPLUS13","docString":""},{"name":"SIGRTMINPLUS14","docString":""},{"name":"SIGRTMINPLUS15","docString":""},{"name":"SIGRTMAXMINUS14","docString":""},{"name":"SIGRTMAXMINUS13","docString":""},{"name":"SIGRTMAXMINUS12","docString":""},{"name":"SIGRTMAXMINUS11","docString":""},{"name":"SIGRTMAXMINUS10","docString":""},{"name":"SIGRTMAXMINUS9","docString":""},{"name":"SIGRTMAXMINUS8","docString":""},{"name":"SIGRTMAXMINUS7","docString":""},{"name":"SIGRTMAXMINUS6","docString":""},{"name":"SIGRTMAXMINUS5","docString":""},{"name":"SIGRTMAXMINUS4","docString":""},{"name":"SIGRTMAXMINUS3","docString":""},{"name":"SIGRTMAXMINUS2","docString":""},{"name":"SIGRTMAXMINUS1","docString":""},{"name":"SIGRTMAX","docString":""}],"docString":"Signal defines the stop signal of containers\n+enum","isRoot":false},"k8s.io/api/core/v1.SleepAction":{"package":"k8s.io/api/core/v1","typeName":"SleepAction","fields":[{"fieldName":"Seconds","typeName":"int64","typeDecorators":null,"docString":"Seconds is the number of seconds to sleep."}],"enumValues":[],"docString":"SleepAction describes a \"sleep\" action.","isRoot":false},"k8s.io/api/core/v1.StorageMedium":{"package":"k8s.io/api/core/v1","typeName":"StorageMedium","fields":[],"enumValues":[{"name":"StorageMediumDefault","docString":""},{"name":"StorageMediumMemory","docString":""},{"name":"StorageMediumHugePages","docString":""},{"name":"StorageMediumHugePagesPrefix","docString":""}],"docString":"StorageMedium defines ways that storage can be allocated to a volume.","isRoot":false},"k8s.io/api/core/v1.StorageOSPersistentVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"StorageOSPersistentVolumeSource","fields":[{"fieldName":"VolumeName","typeName":"string","typeDecorators":null,"docString":"volumeName is the human-readable name of the StorageOS volume.  Volume\nnames are only unique within a namespace."},{"fieldName":"VolumeNamespace","typeName":"string","typeDecorators":null,"docString":"volumeNamespace specifies the scope of the volume within StorageOS.  If no\nnamespace is specified then the Pod's namespace will be used.  This allows the\nKubernetes name scoping to be mirrored within StorageOS for tighter integration.\nSet VolumeName to any name to override the default behaviour.\nSet to \"default\" if you are not using namespaces within StorageOS.\nNamespaces that do not pre-exist within StorageOS will be created.\n+optional"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified.\n+optional"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly defaults to false (read/write). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\n+optional"},{"fieldName":"SecretRef","typeName":"k8s.io/api/core/v1.ObjectReference","typeDecorators":["Ptr"],"docString":"secretRef specifies the secret to use for obtaining the StorageOS API\ncredentials.  If not specified, default values will be attempted.\n+optional"}],"enumValues":[],"docString":"Represents a StorageOS persistent volume resource.","isRoot":false},"k8s.io/api/core/v1.StorageOSVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"StorageOSVolumeSource","fields":[{"fieldName":"VolumeName","typeName":"string","typeDecorators":null,"docString":"volumeName is the human-readable name of the StorageOS volume.  Volume\nnames are only unique within a namespace."},{"fieldName":"VolumeNamespace","typeName":"string","typeDecorators":null,"docString":"volumeNamespace specifies the scope of the volume within StorageOS.  If no\nnamespace is specified then the Pod's namespace will be used.  This allows the\nKubernetes name scoping to be mirrored within StorageOS for tighter integration.\nSet VolumeName to any name to override the default behaviour.\nSet to \"default\" if you are not using namespaces within StorageOS.\nNamespaces that do not pre-exist within StorageOS will be created.\n+optional"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified.\n+optional"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly defaults to false (read/write). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\n+optional"},{"fieldName":"SecretRef","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":["Ptr"],"docString":"secretRef specifies the secret to use for obtaining the StorageOS API\ncredentials.  If not specified, default values will be attempted.\n+optional"}],"enumValues":[],"docString":"Represents a StorageOS persistent volume resource.","isRoot":false},"k8s.io/api/core/v1.SupplementalGroupsPolicy":{"package":"k8s.io/api/core/v1","typeName":"SupplementalGroupsPolicy","fields":[],"enumValues":[{"name":"SupplementalGroupsPolicyMerge","docString":"SupplementalGroupsPolicyMerge means that the container's provided\nSupplementalGroups and FsGroup (specified in SecurityContext) will be\nmerged with the primary user's groups as defined in the container image\n(in /etc/group)."},{"name":"SupplementalGroupsPolicyStrict","docString":"SupplementalGroupsPolicyStrict means that the container's provided\nSupplementalGroups and FsGroup (specified in SecurityContext) will be\nused instead of any groups defined in the container image."}],"docString":"SupplementalGroupsPolicy defines how supplemental groups\nof the first container processes are calculated.\n+enum","isRoot":false},"k8s.io/api/core/v1.Sysctl":{"package":"k8s.io/api/core/v1","typeName":"Sysctl","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name of a property to set"},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"Value of a property to set"}],"enumValues":[],"docString":"Sysctl defines a kernel parameter to be set","isRoot":false},"k8s.io/api/core/v1.TCPSocketAction":{"package":"k8s.io/api/core/v1","typeName":"TCPSocketAction","fields":[{"fieldName":"Port","typeName":"k8s.io/apimachinery/pkg/util/intstr.IntOrString","typeDecorators":null,"docString":"Number or name of the port to access on the container.\nNumber must be in the range 1 to 65535.\nName must be an IANA_SVC_NAME."},{"fieldName":"Host","typeName":"string","typeDecorators":null,"docString":"Optional: Host name to connect to, defaults to the pod IP.\n+optional"}],"enumValues":[],"docString":"TCPSocketAction describes an action based on opening a socket","isRoot":false},"k8s.io/api/core/v1.Taint":{"package":"k8s.io/api/core/v1","typeName":"Taint","fields":[{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"Required. The taint key to be applied to a node."},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"The taint value corresponding to the taint key.\n+optional"},{"fieldName":"Effect","typeName":"k8s.io/api/core/v1.TaintEffect","typeDecorators":null,"docString":"Required. The effect of the taint on pods\nthat do not tolerate the taint.\nValid effects are NoSchedule, PreferNoSchedule and NoExecute."},{"fieldName":"TimeAdded","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":"TimeAdded represents the time at which the taint was added.\nIt is only written for NoExecute taints.\n+optional"}],"enumValues":[],"docString":"The node this Taint is attached to has the \"effect\" on\nany pod that does not tolerate the Taint.","isRoot":false},"k8s.io/api/core/v1.TaintEffect":{"package":"k8s.io/api/core/v1","typeName":"TaintEffect","fields":[],"enumValues":[{"name":"TaintEffectNoSchedule","docString":"Do not allow new pods to schedule onto the node unless they tolerate the taint,\nbut allow all pods submitted to Kubelet without going through the scheduler\nto start, and allow all already-running pods to continue running.\nEnforced by the scheduler."},{"name":"TaintEffectPreferNoSchedule","docString":"Like TaintEffectNoSchedule, but the scheduler tries not to schedule\nnew pods onto the node, rather than prohibiting new pods from scheduling\nonto the node entirely. Enforced by the scheduler."},{"name":"TaintEffectNoExecute","docString":"Evict any already-running pods that do not tolerate the taint.\nCurrently enforced by NodeController."}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.TerminationMessagePolicy":{"package":"k8s.io/api/core/v1","typeName":"TerminationMessagePolicy","fields":[],"enumValues":[{"name":"TerminationMessageReadFile","docString":"TerminationMessageReadFile is the default behavior and will set the container status message to\nthe contents of the container's terminationMessagePath when the container exits."},{"name":"TerminationMessageFallbackToLogsOnError","docString":"TerminationMessageFallbackToLogsOnError will read the most recent contents of the container logs\nfor the container status message when the container exits with an error and the\nterminationMessagePath has no contents."}],"docString":"TerminationMessagePolicy describes how termination messages are retrieved from a container.\n+enum","isRoot":false},"k8s.io/api/core/v1.Toleration":{"package":"k8s.io/api/core/v1","typeName":"Toleration","fields":[{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"Key is the taint key that the toleration applies to. Empty means match all taint keys.\nIf the key is empty, operator must be Exists; this combination means to match all values and all keys.\n+optional"},{"fieldName":"Operator","typeName":"k8s.io/api/core/v1.TolerationOperator","typeDecorators":null,"docString":"Operator represents a key's relationship to the value.\nValid operators are Exists and Equal. Defaults to Equal.\nExists is equivalent to wildcard for value, so that a pod can\ntolerate all taints of a particular category.\n+optional"},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"Value is the taint value the toleration matches to.\nIf the operator is Exists, the value should be empty, otherwise just a regular string.\n+optional"},{"fieldName":"Effect","typeName":"k8s.io/api/core/v1.TaintEffect","typeDecorators":null,"docString":"Effect indicates the taint effect to match. Empty means match all taint effects.\nWhen specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.\n+optional"},{"fieldName":"TolerationSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"TolerationSeconds represents the period of time the toleration (which must be\nof effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,\nit is not set, which means tolerate the taint forever (do not evict). Zero and\nnegative values will be treated as 0 (evict immediately) by the system.\n+optional"}],"enumValues":[],"docString":"The pod this Toleration is attached to tolerates any taint that matches\nthe triple \u003ckey,value,effect\u003e using the matching operator \u003coperator\u003e.","isRoot":false},"k8s.io/api/core/v1.TolerationOperator":{"package":"k8s.io/api/core/v1","typeName":"TolerationOperator","fields":[],"enumValues":[{"name":"TolerationOpExists","docString":""},{"name":"TolerationOpEqual","docString":""}],"docString":"A toleration operator is the set of operators that can be used in a toleration.\n+enum","isRoot":false},"k8s.io/api/core/v1.TopologySelectorLabelRequirement":{"package":"k8s.io/api/core/v1","typeName":"TopologySelectorLabelRequirement","fields":[{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"The label key that the selector applies to."},{"fieldName":"Values","typeName":"string","typeDecorators":["List"],"docString":"An array of string values. One value must match the label to be selected.\nEach entry in Values is ORed.\n+listType=atomic"}],"enumValues":[],"docString":"A topology selector requirement is a selector that matches given label.\nThis is an alpha feature and may change in the future.","isRoot":false},"k8s.io/api/core/v1.TopologySelectorTerm":{"package":"k8s.io/api/core/v1","typeName":"TopologySelectorTerm","fields":[{"fieldName":"MatchLabelExpressions","typeName":"k8s.io/api/core/v1.TopologySelectorLabelRequirement","typeDecorators":["List"],"docString":"A list of topology selector requirements by labels.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"A topology selector term represents the result of label queries.\nA null or empty topology selector term matches no objects.\nThe requirements of them are ANDed.\nIt provides a subset of functionality as NodeSelectorTerm.\nThis is an alpha feature and may change in the future.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.TopologySpreadConstraint":{"package":"k8s.io/api/core/v1","typeName":"TopologySpreadConstraint","fields":[{"fieldName":"MaxSkew","typeName":"int32","typeDecorators":null,"docString":"MaxSkew describes the degree to which pods may be unevenly distributed.\nWhen `whenUnsatisfiable=DoNotSchedule`, it is the maximum permitted difference\nbetween the number of matching pods in the target topology and the global minimum.\nThe global minimum is the minimum number of matching pods in an eligible domain\nor zero if the number of eligible domains is less than MinDomains.\nFor example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same\nlabelSelector spread as 2/2/1:\nIn this case, the global minimum is 1.\n+-------+-------+-------+\n| zone1 | zone2 | zone3 |\n+-------+-------+-------+\n|  P P  |  P P  |   P   |\n+-------+-------+-------+\n- if MaxSkew is 1, incoming pod can only be scheduled to zone3 to become 2/2/2;\nscheduling it onto zone1(zone2) would make the ActualSkew(3-1) on zone1(zone2)\nviolate MaxSkew(1).\n- if MaxSkew is 2, incoming pod can be scheduled onto any zone.\nWhen `whenUnsatisfiable=ScheduleAnyway`, it is used to give higher precedence\nto topologies that satisfy it.\nIt's a required field. Default value is 1 and 0 is not allowed."},{"fieldName":"TopologyKey","typeName":"string","typeDecorators":null,"docString":"TopologyKey is the key of node labels. Nodes that have a label with this key\nand identical values are considered to be in the same topology.\nWe consider each \u003ckey, value\u003e as a \"bucket\", and try to put balanced number\nof pods into each bucket.\nWe define a domain as a particular instance of a topology.\nAlso, we define an eligible domain as a domain whose nodes meet the requirements of\nnodeAffinityPolicy and nodeTaintsPolicy.\ne.g. If TopologyKey is \"kubernetes.io/hostname\", each Node is a domain of that topology.\nAnd, if TopologyKey is \"topology.kubernetes.io/zone\", each zone is a domain of that topology.\nIt's a required field."},{"fieldName":"WhenUnsatisfiable","typeName":"k8s.io/api/core/v1.UnsatisfiableConstraintAction","typeDecorators":null,"docString":"WhenUnsatisfiable indicates how to deal with a pod if it doesn't satisfy\nthe spread constraint.\n- DoNotSchedule (default) tells the scheduler not to schedule it.\n- ScheduleAnyway tells the scheduler to schedule the pod in any location,\n  but giving higher precedence to topologies that would help reduce the\n  skew.\nA constraint is considered \"Unsatisfiable\" for an incoming pod\nif and only if every possible node assignment for that pod would violate\n\"MaxSkew\" on some topology.\nFor example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same\nlabelSelector spread as 3/1/1:\n+-------+-------+-------+\n| zone1 | zone2 | zone3 |\n+-------+-------+-------+\n| P P P |   P   |   P   |\n+-------+-------+-------+\nIf WhenUnsatisfiable is set to DoNotSchedule, incoming pod can only be scheduled\nto zone2(zone3) to become 3/2/1(3/1/2) as ActualSkew(2-1) on zone2(zone3) satisfies\nMaxSkew(1). In other words, the cluster can still be imbalanced, but scheduler\nwon't make it *more* imbalanced.\nIt's a required field."},{"fieldName":"LabelSelector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"LabelSelector is used to find matching pods.\nPods that match this label selector are counted to determine the number of pods\nin their corresponding topology domain.\n+optional"},{"fieldName":"MinDomains","typeName":"int32","typeDecorators":["Ptr"],"docString":"MinDomains indicates a minimum number of eligible domains.\nWhen the number of eligible domains with matching topology keys is less than minDomains,\nPod Topology Spread treats \"global minimum\" as 0, and then the calculation of Skew is performed.\nAnd when the number of eligible domains with matching topology keys equals or greater than minDomains,\nthis value has no effect on scheduling.\nAs a result, when the number of eligible domains is less than minDomains,\nscheduler won't schedule more than maxSkew Pods to those domains.\nIf value is nil, the constraint behaves as if MinDomains is equal to 1.\nValid values are integers greater than 0.\nWhen value is not nil, WhenUnsatisfiable must be DoNotSchedule.\n\nFor example, in a 3-zone cluster, MaxSkew is set to 2, MinDomains is set to 5 and pods with the same\nlabelSelector spread as 2/2/2:\n+-------+-------+-------+\n| zone1 | zone2 | zone3 |\n+-------+-------+-------+\n|  P P  |  P P  |  P P  |\n+-------+-------+-------+\nThe number of domains is less than 5(MinDomains), so \"global minimum\" is treated as 0.\nIn this situation, new pod with the same labelSelector cannot be scheduled,\nbecause computed skew will be 3(3 - 0) if new Pod is scheduled to any of the three zones,\nit will violate MaxSkew.\n+optional"},{"fieldName":"NodeAffinityPolicy","typeName":"k8s.io/api/core/v1.NodeInclusionPolicy","typeDecorators":["Ptr"],"docString":"NodeAffinityPolicy indicates how we will treat Pod's nodeAffinity/nodeSelector\nwhen calculating pod topology spread skew. Options are:\n- Honor: only nodes matching nodeAffinity/nodeSelector are included in the calculations.\n- Ignore: nodeAffinity/nodeSelector are ignored. All nodes are included in the calculations.\n\nIf this value is nil, the behavior is equivalent to the Honor policy.\n+optional"},{"fieldName":"NodeTaintsPolicy","typeName":"k8s.io/api/core/v1.NodeInclusionPolicy","typeDecorators":["Ptr"],"docString":"NodeTaintsPolicy indicates how we will treat node taints when calculating\npod topology spread skew. Options are:\n- Honor: nodes without taints, along with tainted nodes for which the incoming pod\nhas a toleration, are included.\n- Ignore: node taints are ignored. All nodes are included.\n\nIf this value is nil, the behavior is equivalent to the Ignore policy.\n+optional"},{"fieldName":"MatchLabelKeys","typeName":"string","typeDecorators":["List"],"docString":"MatchLabelKeys is a set of pod label keys to select the pods over which\nspreading will be calculated. The keys are used to lookup values from the\nincoming pod labels, those key-value labels are ANDed with labelSelector\nto select the group of existing pods over which spreading will be calculated\nfor the incoming pod. The same key is forbidden to exist in both MatchLabelKeys and LabelSelector.\nMatchLabelKeys cannot be set when LabelSelector isn't set.\nKeys that don't exist in the incoming pod labels will\nbe ignored. A null or empty list means only match against labelSelector.\n\nThis is a beta field and requires the MatchLabelKeysInPodTopologySpread feature gate to be enabled (enabled by default).\n+listType=atomic\n+optional"}],"enumValues":[],"docString":"TopologySpreadConstraint specifies how to spread matching pods among the given topology.","isRoot":false},"k8s.io/api/core/v1.TypedLocalObjectReference":{"package":"k8s.io/api/core/v1","typeName":"TypedLocalObjectReference","fields":[{"fieldName":"APIGroup","typeName":"string","typeDecorators":["Ptr"],"docString":"APIGroup is the group for the resource being referenced.\nIf APIGroup is not specified, the specified Kind must be in the core API group.\nFor any other third-party types, APIGroup is required.\n+optional"},{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":"Kind is the type of resource being referenced"},{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is the name of resource being referenced"}],"enumValues":[],"docString":"TypedLocalObjectReference contains enough information to let you locate the\ntyped referenced object inside the same namespace.\n---\nNew uses of this type are discouraged because of difficulty describing its usage when embedded in APIs.\n 1. Invalid usage help.  It is impossible to add specific help for individual usage.  In most embedded usages, there are particular\n    restrictions like, \"must refer only to types A and B\" or \"UID not honored\" or \"name must be restricted\".\n    Those cannot be well described when embedded.\n 2. Inconsistent validation.  Because the usages are different, the validation rules are different by usage, which makes it hard for users to predict what will happen.\n 3. The fields are both imprecise and overly precise.  Kind is not a precise mapping to a URL. This can produce ambiguity\n    during interpretation and require a REST mapping.  In most cases, the dependency is on the group,resource tuple\n    and the version of the actual struct is irrelevant.\n 4. We cannot easily change it.  Because this type is embedded in many locations, updates to this type\n    will affect numerous schemas.  Don't make new APIs embed an underspecified API type they do not control.\n\nInstead of using this type, create a locally provided and used type that is well-focused on your reference.\nFor example, ServiceReferences for admission registration: https://github.com/kubernetes/api/blob/release-1.17/admissionregistration/v1/types.go#L533 .\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.TypedObjectReference":{"package":"k8s.io/api/core/v1","typeName":"TypedObjectReference","fields":[{"fieldName":"APIGroup","typeName":"string","typeDecorators":["Ptr"],"docString":"APIGroup is the group for the resource being referenced.\nIf APIGroup is not specified, the specified Kind must be in the core API group.\nFor any other third-party types, APIGroup is required.\n+optional"},{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":"Kind is the type of resource being referenced"},{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is the name of resource being referenced"},{"fieldName":"Namespace","typeName":"string","typeDecorators":["Ptr"],"docString":"Namespace is the namespace of resource being referenced\nNote that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details.\n(Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.\n+featureGate=CrossNamespaceVolumeDataSource\n+optional"}],"enumValues":[],"docString":"TypedObjectReference contains enough information to let you locate the typed referenced object","isRoot":false},"k8s.io/api/core/v1.URIScheme":{"package":"k8s.io/api/core/v1","typeName":"URIScheme","fields":[],"enumValues":[{"name":"URISchemeHTTP","docString":"URISchemeHTTP means that the scheme used will be http://"},{"name":"URISchemeHTTPS","docString":"URISchemeHTTPS means that the scheme used will be https://"}],"docString":"URIScheme identifies the scheme used for connection to a host for Get actions\n+enum","isRoot":false},"k8s.io/api/core/v1.UnsatisfiableConstraintAction":{"package":"k8s.io/api/core/v1","typeName":"UnsatisfiableConstraintAction","fields":[],"enumValues":[{"name":"DoNotSchedule","docString":"DoNotSchedule instructs the scheduler not to schedule the pod\nwhen constraints are not satisfied."},{"name":"ScheduleAnyway","docString":"ScheduleAnyway instructs the scheduler to schedule the pod\neven if constraints are not satisfied."}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.Volume":{"package":"k8s.io/api/core/v1","typeName":"Volume","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"name of the volume.\nMust be a DNS_LABEL and unique within the pod.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names"},{"fieldName":"VolumeSource","typeName":"k8s.io/api/core/v1.VolumeSource","typeDecorators":null,"docString":"volumeSource represents the location and type of the mounted volume.\nIf not specified, the Volume is implied to be an EmptyDir.\nThis implied behavior is deprecated and will be removed in a future version."}],"enumValues":[],"docString":"Volume represents a named volume in a pod that may be accessed by any container in the pod.","isRoot":false},"k8s.io/api/core/v1.VolumeDevice":{"package":"k8s.io/api/core/v1","typeName":"VolumeDevice","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"name must match the name of a persistentVolumeClaim in the pod"},{"fieldName":"DevicePath","typeName":"string","typeDecorators":null,"docString":"devicePath is the path inside of the container that the device will be mapped to."}],"enumValues":[],"docString":"volumeDevice describes a mapping of a raw block device within a container.","isRoot":false},"k8s.io/api/core/v1.VolumeMount":{"package":"k8s.io/api/core/v1","typeName":"VolumeMount","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"This must match the Name of a Volume."},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"Mounted read-only if true, read-write otherwise (false or unspecified).\nDefaults to false.\n+optional"},{"fieldName":"RecursiveReadOnly","typeName":"k8s.io/api/core/v1.RecursiveReadOnlyMode","typeDecorators":["Ptr"],"docString":"RecursiveReadOnly specifies whether read-only mounts should be handled\nrecursively.\n\nIf ReadOnly is false, this field has no meaning and must be unspecified.\n\nIf ReadOnly is true, and this field is set to Disabled, the mount is not made\nrecursively read-only.  If this field is set to IfPossible, the mount is made\nrecursively read-only, if it is supported by the container runtime.  If this\nfield is set to Enabled, the mount is made recursively read-only if it is\nsupported by the container runtime, otherwise the pod will not be started and\nan error will be generated to indicate the reason.\n\nIf this field is set to IfPossible or Enabled, MountPropagation must be set to\nNone (or be unspecified, which defaults to None).\n\nIf this field is not specified, it is treated as an equivalent of Disabled.\n\n+featureGate=RecursiveReadOnlyMounts\n+optional"},{"fieldName":"MountPath","typeName":"string","typeDecorators":null,"docString":"Path within the container at which the volume should be mounted.  Must\nnot contain ':'."},{"fieldName":"SubPath","typeName":"string","typeDecorators":null,"docString":"Path within the volume from which the container's volume should be mounted.\nDefaults to \"\" (volume's root).\n+optional"},{"fieldName":"MountPropagation","typeName":"k8s.io/api/core/v1.MountPropagationMode","typeDecorators":["Ptr"],"docString":"mountPropagation determines how mounts are propagated from the host\nto container and the other way around.\nWhen not set, MountPropagationNone is used.\nThis field is beta in 1.10.\nWhen RecursiveReadOnly is set to IfPossible or to Enabled, MountPropagation must be None or unspecified\n(which defaults to None).\n+optional"},{"fieldName":"SubPathExpr","typeName":"string","typeDecorators":null,"docString":"Expanded path within the volume from which the container's volume should be mounted.\nBehaves similarly to SubPath but environment variable references $(VAR_NAME) are expanded using the container's environment.\nDefaults to \"\" (volume's root).\nSubPathExpr and SubPath are mutually exclusive.\n+optional"}],"enumValues":[],"docString":"VolumeMount describes a mounting of a Volume within a container.","isRoot":false},"k8s.io/api/core/v1.VolumeMountStatus":{"package":"k8s.io/api/core/v1","typeName":"VolumeMountStatus","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name corresponds to the name of the original VolumeMount."},{"fieldName":"MountPath","typeName":"string","typeDecorators":null,"docString":"MountPath corresponds to the original VolumeMount."},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"ReadOnly corresponds to the original VolumeMount.\n+optional"},{"fieldName":"RecursiveReadOnly","typeName":"k8s.io/api/core/v1.RecursiveReadOnlyMode","typeDecorators":["Ptr"],"docString":"RecursiveReadOnly must be set to Disabled, Enabled, or unspecified (for non-readonly mounts).\nAn IfPossible value in the original VolumeMount must be translated to Disabled or Enabled,\ndepending on the mount result.\n+featureGate=RecursiveReadOnlyMounts\n+optional"}],"enumValues":[],"docString":"VolumeMountStatus shows status of volume mounts.","isRoot":false},"k8s.io/api/core/v1.VolumeNodeAffinity":{"package":"k8s.io/api/core/v1","typeName":"VolumeNodeAffinity","fields":[{"fieldName":"Required","typeName":"k8s.io/api/core/v1.NodeSelector","typeDecorators":["Ptr"],"docString":"required specifies hard node constraints that must be met."}],"enumValues":[],"docString":"VolumeNodeAffinity defines constraints that limit what nodes this volume can be accessed from.","isRoot":false},"k8s.io/api/core/v1.VolumeProjection":{"package":"k8s.io/api/core/v1","typeName":"VolumeProjection","fields":[{"fieldName":"Secret","typeName":"k8s.io/api/core/v1.SecretProjection","typeDecorators":["Ptr"],"docString":"secret information about the secret data to project\n+optional"},{"fieldName":"DownwardAPI","typeName":"k8s.io/api/core/v1.DownwardAPIProjection","typeDecorators":["Ptr"],"docString":"downwardAPI information about the downwardAPI data to project\n+optional"},{"fieldName":"ConfigMap","typeName":"k8s.io/api/core/v1.ConfigMapProjection","typeDecorators":["Ptr"],"docString":"configMap information about the configMap data to project\n+optional"},{"fieldName":"ServiceAccountToken","typeName":"k8s.io/api/core/v1.ServiceAccountTokenProjection","typeDecorators":["Ptr"],"docString":"serviceAccountToken is information about the serviceAccountToken data to project\n+optional"},{"fieldName":"ClusterTrustBundle","typeName":"k8s.io/api/core/v1.ClusterTrustBundleProjection","typeDecorators":["Ptr"],"docString":"ClusterTrustBundle allows a pod to access the `.spec.trustBundle` field\nof ClusterTrustBundle objects in an auto-updating file.\n\nAlpha, gated by the ClusterTrustBundleProjection feature gate.\n\nClusterTrustBundle objects can either be selected by name, or by the\ncombination of signer name and a label selector.\n\nKubelet performs aggressive normalization of the PEM contents written\ninto the pod filesystem.  Esoteric PEM features such as inter-block\ncomments and block headers are stripped.  Certificates are deduplicated.\nThe ordering of certificates within the file is arbitrary, and Kubelet\nmay change the order over time.\n\n+featureGate=ClusterTrustBundleProjection\n+optional"}],"enumValues":[],"docString":"Projection that may be projected along with other supported volume types.\nExactly one of these fields must be set.","isRoot":false},"k8s.io/api/core/v1.VolumeResourceRequirements":{"package":"k8s.io/api/core/v1","typeName":"VolumeResourceRequirements","fields":[{"fieldName":"Limits","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Limits describes the maximum amount of compute resources allowed.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/\n+optional"},{"fieldName":"Requests","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Requests describes the minimum amount of compute resources required.\nIf Requests is omitted for a container, it defaults to Limits if that is explicitly specified,\notherwise to an implementation-defined value. Requests cannot exceed Limits.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/\n+optional"}],"enumValues":[],"docString":"VolumeResourceRequirements describes the storage resource requirements for a volume.","isRoot":false},"k8s.io/api/core/v1.VolumeSource":{"package":"k8s.io/api/core/v1","typeName":"VolumeSource","fields":[{"fieldName":"HostPath","typeName":"k8s.io/api/core/v1.HostPathVolumeSource","typeDecorators":["Ptr"],"docString":"hostPath represents a pre-existing file or directory on the host\nmachine that is directly exposed to the container. This is generally\nused for system agents or other privileged things that are allowed\nto see the host machine. Most containers will NOT need this.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#hostpath\n---\nTODO(jonesdl) We need to restrict who can use host directory mounts and who can/can not\nmount host directories as read/write.\n+optional"},{"fieldName":"EmptyDir","typeName":"k8s.io/api/core/v1.EmptyDirVolumeSource","typeDecorators":["Ptr"],"docString":"emptyDir represents a temporary directory that shares a pod's lifetime.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir\n+optional"},{"fieldName":"GCEPersistentDisk","typeName":"k8s.io/api/core/v1.GCEPersistentDiskVolumeSource","typeDecorators":["Ptr"],"docString":"gcePersistentDisk represents a GCE Disk resource that is attached to a\nkubelet's host machine and then exposed to the pod.\nDeprecated: GCEPersistentDisk is deprecated. All operations for the in-tree\ngcePersistentDisk type are redirected to the pd.csi.storage.gke.io CSI driver.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk\n+optional"},{"fieldName":"AWSElasticBlockStore","typeName":"k8s.io/api/core/v1.AWSElasticBlockStoreVolumeSource","typeDecorators":["Ptr"],"docString":"awsElasticBlockStore represents an AWS Disk resource that is attached to a\nkubelet's host machine and then exposed to the pod.\nDeprecated: AWSElasticBlockStore is deprecated. All operations for the in-tree\nawsElasticBlockStore type are redirected to the ebs.csi.aws.com CSI driver.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore\n+optional"},{"fieldName":"GitRepo","typeName":"k8s.io/api/core/v1.GitRepoVolumeSource","typeDecorators":["Ptr"],"docString":"gitRepo represents a git repository at a particular revision.\nDeprecated: GitRepo is deprecated. To provision a container with a git repo, mount an\nEmptyDir into an InitContainer that clones the repo using git, then mount the EmptyDir\ninto the Pod's container.\n+optional"},{"fieldName":"Secret","typeName":"k8s.io/api/core/v1.SecretVolumeSource","typeDecorators":["Ptr"],"docString":"secret represents a secret that should populate this volume.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#secret\n+optional"},{"fieldName":"NFS","typeName":"k8s.io/api/core/v1.NFSVolumeSource","typeDecorators":["Ptr"],"docString":"nfs represents an NFS mount on the host that shares a pod's lifetime\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#nfs\n+optional"},{"fieldName":"ISCSI","typeName":"k8s.io/api/core/v1.ISCSIVolumeSource","typeDecorators":["Ptr"],"docString":"iscsi represents an ISCSI Disk resource that is attached to a\nkubelet's host machine and then exposed to the pod.\nMore info: https://examples.k8s.io/volumes/iscsi/README.md\n+optional"},{"fieldName":"Glusterfs","typeName":"k8s.io/api/core/v1.GlusterfsVolumeSource","typeDecorators":["Ptr"],"docString":"glusterfs represents a Glusterfs mount on the host that shares a pod's lifetime.\nDeprecated: Glusterfs is deprecated and the in-tree glusterfs type is no longer supported.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md\n+optional"},{"fieldName":"PersistentVolumeClaim","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimVolumeSource","typeDecorators":["Ptr"],"docString":"persistentVolumeClaimVolumeSource represents a reference to a\nPersistentVolumeClaim in the same namespace.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims\n+optional"},{"fieldName":"RBD","typeName":"k8s.io/api/core/v1.RBDVolumeSource","typeDecorators":["Ptr"],"docString":"rbd represents a Rados Block Device mount on the host that shares a pod's lifetime.\nDeprecated: RBD is deprecated and the in-tree rbd type is no longer supported.\nMore info: https://examples.k8s.io/volumes/rbd/README.md\n+optional"},{"fieldName":"FlexVolume","typeName":"k8s.io/api/core/v1.FlexVolumeSource","typeDecorators":["Ptr"],"docString":"flexVolume represents a generic volume resource that is\nprovisioned/attached using an exec based plugin.\nDeprecated: FlexVolume is deprecated. Consider using a CSIDriver instead.\n+optional"},{"fieldName":"Cinder","typeName":"k8s.io/api/core/v1.CinderVolumeSource","typeDecorators":["Ptr"],"docString":"cinder represents a cinder volume attached and mounted on kubelets host machine.\nDeprecated: Cinder is deprecated. All operations for the in-tree cinder type\nare redirected to the cinder.csi.openstack.org CSI driver.\nMore info: https://examples.k8s.io/mysql-cinder-pd/README.md\n+optional"},{"fieldName":"CephFS","typeName":"k8s.io/api/core/v1.CephFSVolumeSource","typeDecorators":["Ptr"],"docString":"cephFS represents a Ceph FS mount on the host that shares a pod's lifetime.\nDeprecated: CephFS is deprecated and the in-tree cephfs type is no longer supported.\n+optional"},{"fieldName":"Flocker","typeName":"k8s.io/api/core/v1.FlockerVolumeSource","typeDecorators":["Ptr"],"docString":"flocker represents a Flocker volume attached to a kubelet's host machine. This depends on the Flocker control service being running.\nDeprecated: Flocker is deprecated and the in-tree flocker type is no longer supported.\n+optional"},{"fieldName":"DownwardAPI","typeName":"k8s.io/api/core/v1.DownwardAPIVolumeSource","typeDecorators":["Ptr"],"docString":"downwardAPI represents downward API about the pod that should populate this volume\n+optional"},{"fieldName":"FC","typeName":"k8s.io/api/core/v1.FCVolumeSource","typeDecorators":["Ptr"],"docString":"fc represents a Fibre Channel resource that is attached to a kubelet's host machine and then exposed to the pod.\n+optional"},{"fieldName":"AzureFile","typeName":"k8s.io/api/core/v1.AzureFileVolumeSource","typeDecorators":["Ptr"],"docString":"azureFile represents an Azure File Service mount on the host and bind mount to the pod.\nDeprecated: AzureFile is deprecated. All operations for the in-tree azureFile type\nare redirected to the file.csi.azure.com CSI driver.\n+optional"},{"fieldName":"ConfigMap","typeName":"k8s.io/api/core/v1.ConfigMapVolumeSource","typeDecorators":["Ptr"],"docString":"configMap represents a configMap that should populate this volume\n+optional"},{"fieldName":"VsphereVolume","typeName":"k8s.io/api/core/v1.VsphereVirtualDiskVolumeSource","typeDecorators":["Ptr"],"docString":"vsphereVolume represents a vSphere volume attached and mounted on kubelets host machine.\nDeprecated: VsphereVolume is deprecated. All operations for the in-tree vsphereVolume type\nare redirected to the csi.vsphere.vmware.com CSI driver.\n+optional"},{"fieldName":"Quobyte","typeName":"k8s.io/api/core/v1.QuobyteVolumeSource","typeDecorators":["Ptr"],"docString":"quobyte represents a Quobyte mount on the host that shares a pod's lifetime.\nDeprecated: Quobyte is deprecated and the in-tree quobyte type is no longer supported.\n+optional"},{"fieldName":"AzureDisk","typeName":"k8s.io/api/core/v1.AzureDiskVolumeSource","typeDecorators":["Ptr"],"docString":"azureDisk represents an Azure Data Disk mount on the host and bind mount to the pod.\nDeprecated: AzureDisk is deprecated. All operations for the in-tree azureDisk type\nare redirected to the disk.csi.azure.com CSI driver.\n+optional"},{"fieldName":"PhotonPersistentDisk","typeName":"k8s.io/api/core/v1.PhotonPersistentDiskVolumeSource","typeDecorators":["Ptr"],"docString":"photonPersistentDisk represents a PhotonController persistent disk attached and mounted on kubelets host machine.\nDeprecated: PhotonPersistentDisk is deprecated and the in-tree photonPersistentDisk type is no longer supported."},{"fieldName":"Projected","typeName":"k8s.io/api/core/v1.ProjectedVolumeSource","typeDecorators":["Ptr"],"docString":"projected items for all in one resources secrets, configmaps, and downward API"},{"fieldName":"PortworxVolume","typeName":"k8s.io/api/core/v1.PortworxVolumeSource","typeDecorators":["Ptr"],"docString":"portworxVolume represents a portworx volume attached and mounted on kubelets host machine.\nDeprecated: PortworxVolume is deprecated. All operations for the in-tree portworxVolume type\nare redirected to the pxd.portworx.com CSI driver when the CSIMigrationPortworx feature-gate\nis on.\n+optional"},{"fieldName":"ScaleIO","typeName":"k8s.io/api/core/v1.ScaleIOVolumeSource","typeDecorators":["Ptr"],"docString":"scaleIO represents a ScaleIO persistent volume attached and mounted on Kubernetes nodes.\nDeprecated: ScaleIO is deprecated and the in-tree scaleIO type is no longer supported.\n+optional"},{"fieldName":"StorageOS","typeName":"k8s.io/api/core/v1.StorageOSVolumeSource","typeDecorators":["Ptr"],"docString":"storageOS represents a StorageOS volume attached and mounted on Kubernetes nodes.\nDeprecated: StorageOS is deprecated and the in-tree storageos type is no longer supported.\n+optional"},{"fieldName":"CSI","typeName":"k8s.io/api/core/v1.CSIVolumeSource","typeDecorators":["Ptr"],"docString":"csi (Container Storage Interface) represents ephemeral storage that is handled by certain external CSI drivers.\n+optional"},{"fieldName":"Ephemeral","typeName":"k8s.io/api/core/v1.EphemeralVolumeSource","typeDecorators":["Ptr"],"docString":"ephemeral represents a volume that is handled by a cluster storage driver.\nThe volume's lifecycle is tied to the pod that defines it - it will be created before the pod starts,\nand deleted when the pod is removed.\n\nUse this if:\na) the volume is only needed while the pod runs,\nb) features of normal volumes like restoring from snapshot or capacity\n   tracking are needed,\nc) the storage driver is specified through a storage class, and\nd) the storage driver supports dynamic volume provisioning through\n   a PersistentVolumeClaim (see EphemeralVolumeSource for more\n   information on the connection between this volume type\n   and PersistentVolumeClaim).\n\nUse PersistentVolumeClaim or one of the vendor-specific\nAPIs for volumes that persist for longer than the lifecycle\nof an individual pod.\n\nUse CSI for light-weight local ephemeral volumes if the CSI driver is meant to\nbe used that way - see the documentation of the driver for\nmore information.\n\nA pod can use both types of ephemeral volumes and\npersistent volumes at the same time.\n\n+optional"},{"fieldName":"Image","typeName":"k8s.io/api/core/v1.ImageVolumeSource","typeDecorators":["Ptr"],"docString":"image represents an OCI object (a container image or artifact) pulled and mounted on the kubelet's host machine.\nThe volume is resolved at pod startup depending on which PullPolicy value is provided:\n\n- Always: the kubelet always attempts to pull the reference. Container creation will fail If the pull fails.\n- Never: the kubelet never pulls the reference and only uses a local image or artifact. Container creation will fail if the reference isn't present.\n- IfNotPresent: the kubelet pulls if the reference isn't already present on disk. Container creation will fail if the reference isn't present and the pull fails.\n\nThe volume gets re-resolved if the pod gets deleted and recreated, which means that new remote content will become available on pod recreation.\nA failure to resolve or pull the image during pod startup will block containers from starting and may add significant latency. Failures will be retried using normal volume backoff and will be reported on the pod reason and message.\nThe types of objects that may be mounted by this volume are defined by the container runtime implementation on a host machine and at minimum must include all valid types supported by the container image field.\nThe OCI object gets mounted in a single directory (spec.containers[*].volumeMounts.mountPath) by merging the manifest layers in the same way as for container images.\nThe volume will be mounted read-only (ro) and non-executable files (noexec).\nSub path mounts for containers are not supported (spec.containers[*].volumeMounts.subpath) before 1.33.\nThe field spec.securityContext.fsGroupChangePolicy has no effect on this volume type.\n+featureGate=ImageVolume\n+optional"}],"enumValues":[],"docString":"Represents the source of a volume to mount.\nOnly one of its members may be specified.","isRoot":false},"k8s.io/api/core/v1.VsphereVirtualDiskVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"VsphereVirtualDiskVolumeSource","fields":[{"fieldName":"VolumePath","typeName":"string","typeDecorators":null,"docString":"volumePath is the path that identifies vSphere volume vmdk"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified.\n+optional"},{"fieldName":"StoragePolicyName","typeName":"string","typeDecorators":null,"docString":"storagePolicyName is the storage Policy Based Management (SPBM) profile name.\n+optional"},{"fieldName":"StoragePolicyID","typeName":"string","typeDecorators":null,"docString":"storagePolicyID is the storage Policy Based Management (SPBM) profile ID associated with the StoragePolicyName.\n+optional"}],"enumValues":[],"docString":"Represents a vSphere volume resource.","isRoot":false},"k8s.io/api/core/v1.WeightedPodAffinityTerm":{"package":"k8s.io/api/core/v1","typeName":"WeightedPodAffinityTerm","fields":[{"fieldName":"Weight","typeName":"int32","typeDecorators":null,"docString":"weight associated with matching the corresponding podAffinityTerm,\nin the range 1-100."},{"fieldName":"PodAffinityTerm","typeName":"k8s.io/api/core/v1.PodAffinityTerm","typeDecorators":null,"docString":"Required. A pod affinity term, associated with the corresponding weight."}],"enumValues":[],"docString":"The weights of all of the matched WeightedPodAffinityTerm fields are added per-node to find the most preferred node(s)","isRoot":false},"k8s.io/api/core/v1.WindowsSecurityContextOptions":{"package":"k8s.io/api/core/v1","typeName":"WindowsSecurityContextOptions","fields":[{"fieldName":"GMSACredentialSpecName","typeName":"string","typeDecorators":["Ptr"],"docString":"GMSACredentialSpecName is the name of the GMSA credential spec to use.\n+optional"},{"fieldName":"GMSACredentialSpec","typeName":"string","typeDecorators":["Ptr"],"docString":"GMSACredentialSpec is where the GMSA admission webhook\n(https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the\nGMSA credential spec named by the GMSACredentialSpecName field.\n+optional"},{"fieldName":"RunAsUserName","typeName":"string","typeDecorators":["Ptr"],"docString":"The UserName in Windows to run the entrypoint of the container process.\nDefaults to the user specified in image metadata if unspecified.\nMay also be set in PodSecurityContext. If set in both SecurityContext and\nPodSecurityContext, the value specified in SecurityContext takes precedence.\n+optional"},{"fieldName":"HostProcess","typeName":"bool","typeDecorators":["Ptr"],"docString":"HostProcess determines if a container should be run as a 'Host Process' container.\nAll of a Pod's containers must have the same effective HostProcess value\n(it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).\nIn addition, if HostProcess is true then HostNetwork must also be set to true.\n+optional"}],"enumValues":[],"docString":"WindowsSecurityContextOptions contain Windows-specific options and credentials.","isRoot":false},"k8s.io/apimachinery/pkg/api/resource.Quantity":{"package":"k8s.io/apimachinery/pkg/api/resource","typeName":"Quantity","fields":[{"fieldName":"Format","typeName":"k8s.io/apimachinery/pkg/api/resource.Format","typeDecorators":null,"docString":"Change Format at will. See the comment for Canonicalize for\nmore details."}],"enumValues":[],"docString":"Quantity is a fixed-point representation of a number.\nIt provides convenient marshaling/unmarshaling in JSON and YAML,\nin addition to String() and AsInt64() accessors.\n\nThe serialization format is:\n\n```\n\u003cquantity\u003e        ::= \u003csignedNumber\u003e\u003csuffix\u003e\n\n\t(Note that \u003csuffix\u003e may be empty, from the \"\" case in \u003cdecimalSI\u003e.)\n\n\u003cdigit\u003e           ::= 0 | 1 | ... | 9\n\u003cdigits\u003e          ::= \u003cdigit\u003e | \u003cdigit\u003e\u003cdigits\u003e\n\u003cnumber\u003e          ::= \u003cdigits\u003e | \u003cdigits\u003e.\u003cdigits\u003e | \u003cdigits\u003e. | .\u003cdigits\u003e\n\u003csign\u003e            ::= \"+\" | \"-\"\n\u003csignedNumber\u003e    ::= \u003cnumber\u003e | \u003csign\u003e\u003cnumber\u003e\n\u003csuffix\u003e          ::= \u003cbinarySI\u003e | \u003cdecimalExponent\u003e | \u003cdecimalSI\u003e\n\u003cbinarySI\u003e        ::= Ki | Mi | Gi | Ti | Pi | Ei\n\n\t(International System of units; See: http://physics.nist.gov/cuu/Units/binary.html)\n\n\u003cdecimalSI\u003e       ::= m | \"\" | k | M | G | T | P | E\n\n\t(Note that 1024 = 1Ki but 1000 = 1k; I didn't choose the capitalization.)\n\n\u003cdecimalExponent\u003e ::= \"e\" \u003csignedNumber\u003e | \"E\" \u003csignedNumber\u003e\n```\n\nNo matter which of the three exponent forms is used, no quantity may represent\na number greater than 2^63-1 in magnitude, nor may it have more than 3 decimal\nplaces. Numbers larger or more precise will be capped or rounded up.\n(E.g.: 0.1m will rounded up to 1m.)\nThis may be extended in the future if we require larger or smaller quantities.\n\nWhen a Quantity is parsed from a string, it will remember the type of suffix\nit had, and will use the same type again when it is serialized.\n\nBefore serializing, Quantity will be put in \"canonical form\".\nThis means that Exponent/suffix will be adjusted up or down (with a\ncorresponding increase or decrease in Mantissa) such that:\n\n- No precision is lost\n- No fractional digits will be emitted\n- The exponent (or suffix) is as large as possible.\n\nThe sign will be omitted unless the number is negative.\n\nExamples:\n\n- 1.5 will be serialized as \"1500m\"\n- 1.5Gi will be serialized as \"1536Mi\"\n\nNote that the quantity will NEVER be internally represented by a\nfloating point number. That is the whole point of this exercise.\n\nNon-canonical values will still parse as long as they are well formed,\nbut will be re-emitted in their canonical form. (So always use canonical\nform, or don't diff.)\n\nThis format is intended to make it difficult to use these numbers without\nwriting some sort of special handling code in the hopes that that will\ncause implementors to also use a fixed point implementation.\n\n+protobuf=true\n+protobuf.embed=string\n+protobuf.options.marshal=false\n+protobuf.options.(gogoproto.goproto_stringer)=false\n+k8s:deepcopy-gen=true\n+k8s:openapi-gen=true","isRoot":false},"k8s.io/apimachinery/pkg/api/resource.QuantityValue":{"package":"k8s.io/apimachinery/pkg/api/resource","typeName":"QuantityValue","fields":[{"fieldName":"Quantity","typeName":"k8s.io/apimachinery/pkg/api/resource.Quantity","typeDecorators":null,"docString":""}],"enumValues":[],"docString":"QuantityValue makes it possible to use a Quantity as value for a command\nline parameter.\n\n+protobuf=true\n+protobuf.embed=string\n+protobuf.options.marshal=false\n+protobuf.options.(gogoproto.goproto_stringer)=false\n+k8s:deepcopy-gen=true","isRoot":false},"k8s.io/apimachinery/pkg/api/resource.Scale":{"package":"k8s.io/apimachinery/pkg/api/resource","typeName":"Scale","fields":[],"enumValues":[{"name":"Nano","docString":""},{"name":"Micro","docString":""},{"name":"Milli","docString":""},{"name":"Kilo","docString":""},{"name":"Mega","docString":""},{"name":"Giga","docString":""},{"name":"Tera","docString":""},{"name":"Peta","docString":""},{"name":"Exa","docString":""}],"docString":"Scale is used for getting and setting the base-10 scaled value.\nBase-2 scales are omitted for mathematical simplicity.\nSee Quantity.ScaledValue for more details.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.APIGroup":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"APIGroup","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"name is the name of the group."},{"fieldName":"Versions","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.GroupVersionForDiscovery","typeDecorators":["List"],"docString":"versions are the versions supported in this group.\n+listType=atomic"},{"fieldName":"PreferredVersion","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.GroupVersionForDiscovery","typeDecorators":null,"docString":"preferredVersion is the version preferred by the API server, which\nprobably is the storage version.\n+optional"},{"fieldName":"ServerAddressByClientCIDRs","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ServerAddressByClientCIDR","typeDecorators":["List"],"docString":"a map of client CIDR to server address that is serving this group.\nThis is to help clients reach servers in the most network-efficient way possible.\nClients can use the appropriate server address as per the CIDR that they match.\nIn case of multiple matches, clients should use the longest matching CIDR.\nThe server returns only those CIDRs that it thinks that the client can match.\nFor example: the master will return an internal IP CIDR only, if the client reaches the server using an internal IP.\nServer looks at X-Forwarded-For header or X-Real-Ip header or request.RemoteAddr (in that order) to get the client IP.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"APIGroup contains the name, the supported versions, and the preferred version\nof a group.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.APIGroupList":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"APIGroupList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Groups","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.APIGroup","typeDecorators":["List"],"docString":"groups is a list of APIGroup.\n+listType=atomic"}],"enumValues":[],"docString":"APIGroupList is a list of APIGroup, to allow clients to discover the API at\n/apis.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.APIResource":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"APIResource","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"name is the plural name of the resource."},{"fieldName":"SingularName","typeName":"string","typeDecorators":null,"docString":"singularName is the singular name of the resource.  This allows clients to handle plural and singular opaquely.\nThe singularName is more correct for reporting status on a single item and both singular and plural are allowed\nfrom the kubectl CLI interface."},{"fieldName":"Namespaced","typeName":"bool","typeDecorators":null,"docString":"namespaced indicates if a resource is namespaced or not."},{"fieldName":"Group","typeName":"string","typeDecorators":null,"docString":"group is the preferred group of the resource.  Empty implies the group of the containing resource list.\nFor subresources, this may have a different value, for example: Scale\"."},{"fieldName":"Version","typeName":"string","typeDecorators":null,"docString":"version is the preferred version of the resource.  Empty implies the version of the containing resource list\nFor subresources, this may have a different value, for example: v1 (while inside a v1beta1 version of the core resource's group)\"."},{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":"kind is the kind for the resource (e.g. 'Foo' is the kind for a resource 'foo')"},{"fieldName":"Verbs","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Verbs","typeDecorators":null,"docString":"verbs is a list of supported kube verbs (this includes get, list, watch, create,\nupdate, patch, delete, deletecollection, and proxy)"},{"fieldName":"ShortNames","typeName":"string","typeDecorators":["List"],"docString":"shortNames is a list of suggested short names of the resource.\n+listType=atomic"},{"fieldName":"Categories","typeName":"string","typeDecorators":["List"],"docString":"categories is a list of the grouped resources this resource belongs to (e.g. 'all')\n+listType=atomic"},{"fieldName":"StorageVersionHash","typeName":"string","typeDecorators":null,"docString":"The hash value of the storage version, the version this resource is\nconverted to when written to the data store. Value must be treated\nas opaque by clients. Only equality comparison on the value is valid.\nThis is an alpha feature and may change or be removed in the future.\nThe field is populated by the apiserver only if the\nStorageVersionHash feature gate is enabled.\nThis field will remain optional even if it graduates.\n+optional"}],"enumValues":[],"docString":"APIResource specifies the name of a resource and whether it is namespaced.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.APIResourceList":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"APIResourceList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"GroupVersion","typeName":"string","typeDecorators":null,"docString":"groupVersion is the group and version this APIResourceList is for."},{"fieldName":"APIResources","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.APIResource","typeDecorators":["List"],"docString":"resources contains the name of the resources and if they are namespaced.\n+listType=atomic"}],"enumValues":[],"docString":"APIResourceList is a list of APIResource, it is used to expose the name of the\nresources supported in a specific group and version, and if the resource\nis namespaced.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.APIVersions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"APIVersions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Versions","typeName":"string","typeDecorators":["List"],"docString":"versions are the api versions that are available.\n+listType=atomic"},{"fieldName":"ServerAddressByClientCIDRs","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ServerAddressByClientCIDR","typeDecorators":["List"],"docString":"a map of client CIDR to server address that is serving this group.\nThis is to help clients reach servers in the most network-efficient way possible.\nClients can use the appropriate server address as per the CIDR that they match.\nIn case of multiple matches, clients should use the longest matching CIDR.\nThe server returns only those CIDRs that it thinks that the client can match.\nFor example: the master will return an internal IP CIDR only, if the client reaches the server using an internal IP.\nServer looks at X-Forwarded-For header or X-Real-Ip header or request.RemoteAddr (in that order) to get the client IP.\n+listType=atomic"}],"enumValues":[],"docString":"APIVersions lists the versions that are available, to allow clients to\ndiscover the API at /api, which is the root path of the legacy v1 API.\n\n+protobuf.options.(gogoproto.goproto_stringer)=false\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.ApplyOptions":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"ApplyOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"DryRun","typeName":"string","typeDecorators":["List"],"docString":"When present, indicates that modifications should not be\npersisted. An invalid or unrecognized dryRun directive will\nresult in an error response and no further processing of the\nrequest. Valid values are:\n- All: all dry run stages will be processed\n+optional\n+listType=atomic"},{"fieldName":"Force","typeName":"bool","typeDecorators":null,"docString":"Force is going to \"force\" Apply requests. It means user will\nre-acquire conflicting fields owned by other people."},{"fieldName":"FieldManager","typeName":"string","typeDecorators":null,"docString":"fieldManager is a name associated with the actor or entity\nthat is making these changes. The value must be less than or\n128 characters long, and only contain printable characters,\nas defined by https://golang.org/pkg/unicode/#IsPrint. This\nfield is required."}],"enumValues":[],"docString":"ApplyOptions may be provided when applying an API object.\nFieldManager is required for apply requests.\nApplyOptions is equivalent to PatchOptions. It is provided as a convenience with documentation\nthat speaks specifically to how the options fields relate to apply.","isRoot":false},"k8s.io/apimachinery/pkg/apis/meta/v1.CauseType":{"package":"k8s.io/apimachinery/pkg/apis/meta/v1","typeName":"CauseType","fields":[],"enumValues":[{"name":"CauseTypeFieldValueNotFound","docString":"CauseTypeFieldValueNotFound is used to report failure to find a requested value\n(e.g. looking up an ID)."},{"name":"CauseTypeFieldValueRequired","docString":"CauseTypeFieldValueRequired is used to report required values that are not\nprovided (e.g. empty strings, null values, or empty arrays)."},{"name":"CauseTypeFieldValueDuplicate","docString":"CauseTypeFieldValueDuplicate is used to report collisions of values that must be\nunique (e.g. unique IDs)."},{"name":"CauseTypeFieldValueInvalid","docString":"CauseTypeFieldValueInvalid is used to report malformed values (e.g. failed regex\nmatch)."},{"name":"CauseTypeFieldValueNotSupported","docString":"CauseTypeFieldValueNotSupported is used to report valid (as per formatting rules)\nvalues that can not be handled (e.g. an enumerated string)."},{"name":"CauseTypeForbidden","docString":"CauseTypeForbidden is used to report valid (as per formatting
