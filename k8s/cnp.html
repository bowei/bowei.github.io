\nOptional: Defaults to true.\n+optional"},{"fieldName":"PreemptionPolicy","typeName":"k8s.io/api/core/v1.PreemptionPolicy","typeDecorators":["Ptr"],"docString":"PreemptionPolicy is the Policy for preempting pods with lower priority.\nOne of Never, PreemptLowerPriority.\nDefaults to PreemptLowerPriority if unset.\n+optional"},{"fieldName":"Overhead","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Overhead represents the resource overhead associated with running a pod for a given RuntimeClass.\nThis field will be autopopulated at admission time by the RuntimeClass admission controller. If\nthe RuntimeClass admission controller is enabled, overhead must not be set in Pod create requests.\nThe RuntimeClass admission controller will reject Pod create requests which have the overhead already\nset. If RuntimeClass is configured and selected in the PodSpec, Overhead will be set to the value\ndefined in the corresponding RuntimeClass, otherwise it will remain unset and treated as zero.\nMore info: https://git.k8s.io/enhancements/keps/sig-node/688-pod-overhead/README.md\n+optional"},{"fieldName":"TopologySpreadConstraints","typeName":"k8s.io/api/core/v1.TopologySpreadConstraint","typeDecorators":["List"],"docString":"TopologySpreadConstraints describes how a group of pods ought to spread across topology\ndomains. Scheduler will schedule pods in a way which abides by the constraints.\nAll topologySpreadConstraints are ANDed.\n+optional\n+patchMergeKey=topologyKey\n+patchStrategy=merge\n+listType=map\n+listMapKey=topologyKey\n+listMapKey=whenUnsatisfiable"},{"fieldName":"SetHostnameAsFQDN","typeName":"bool","typeDecorators":["Ptr"],"docString":"If true the pod's hostname will be configured as the pod's FQDN, rather than the leaf name (the default).\nIn Linux containers, this means setting the FQDN in the hostname field of the kernel (the nodename field of struct utsname).\nIn Windows containers, this means setting the registry value of hostname for the registry key HKEY_LOCAL_MACHINE\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\Tcpip\\\\Parameters to FQDN.\nIf a pod does not have FQDN, this has no effect.\nDefault to false.\n+optional"},{"fieldName":"OS","typeName":"k8s.io/api/core/v1.PodOS","typeDecorators":["Ptr"],"docString":"Specifies the OS of the containers in the pod.\nSome pod and container fields are restricted if this is set.\n\nIf the OS field is set to linux, the following fields must be unset:\n-securityContext.windowsOptions\n\nIf the OS field is set to windows, following fields must be unset:\n- spec.hostPID\n- spec.hostIPC\n- spec.hostUsers\n- spec.securityContext.appArmorProfile\n- spec.securityContext.seLinuxOptions\n- spec.securityContext.seccompProfile\n- spec.securityContext.fsGroup\n- spec.securityContext.fsGroupChangePolicy\n- spec.securityContext.sysctls\n- spec.shareProcessNamespace\n- spec.securityContext.runAsUser\n- spec.securityContext.runAsGroup\n- spec.securityContext.supplementalGroups\n- spec.securityContext.supplementalGroupsPolicy\n- spec.containers[*].securityContext.appArmorProfile\n- spec.containers[*].securityContext.seLinuxOptions\n- spec.containers[*].securityContext.seccompProfile\n- spec.containers[*].securityContext.capabilities\n- spec.containers[*].securityContext.readOnlyRootFilesystem\n- spec.containers[*].securityContext.privileged\n- spec.containers[*].securityContext.allowPrivilegeEscalation\n- spec.containers[*].securityContext.procMount\n- spec.containers[*].securityContext.runAsUser\n- spec.containers[*].securityContext.runAsGroup\n+optional"},{"fieldName":"HostUsers","typeName":"bool","typeDecorators":["Ptr"],"docString":"Use the host's user namespace.\nOptional: Default to true.\nIf set to true or not present, the pod will be run in the host user namespace, useful\nfor when the pod needs a feature only available to the host user namespace, such as\nloading a kernel module with CAP_SYS_MODULE.\nWhen set to false, a new userns is created for the pod. Setting false is useful for\nmitigating container breakout vulnerabilities even allowing users to run their\ncontainers as root without actually having root privileges on the host.\nThis field is alpha-level and is only honored by servers that enable the UserNamespacesSupport feature.\n+k8s:conversion-gen=false\n+optional"},{"fieldName":"SchedulingGates","typeName":"k8s.io/api/core/v1.PodSchedulingGate","typeDecorators":["List"],"docString":"SchedulingGates is an opaque list of values that if specified will block scheduling the pod.\nIf schedulingGates is not empty, the pod will stay in the SchedulingGated state and the\nscheduler will not attempt to schedule the pod.\n\nSchedulingGates can only be set at pod creation time, and be removed only afterwards.\n\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name\n+optional"},{"fieldName":"ResourceClaims","typeName":"k8s.io/api/core/v1.PodResourceClaim","typeDecorators":["List"],"docString":"ResourceClaims defines which ResourceClaims must be allocated\nand reserved before the Pod is allowed to start. The resources\nwill be made available to those containers which consume them\nby name.\n\nThis is an alpha field and requires enabling the\nDynamicResourceAllocation feature gate.\n\nThis field is immutable.\n\n+patchMergeKey=name\n+patchStrategy=merge,retainKeys\n+listType=map\n+listMapKey=name\n+featureGate=DynamicResourceAllocation\n+optional"},{"fieldName":"Resources","typeName":"k8s.io/api/core/v1.ResourceRequirements","typeDecorators":["Ptr"],"docString":"Resources is the total amount of CPU and Memory resources required by all\ncontainers in the pod. It supports specifying Requests and Limits for\n\"cpu\" and \"memory\" resource names only. ResourceClaims are not supported.\n\nThis field enables fine-grained control over resource allocation for the\nentire pod, allowing resource sharing among containers in a pod.\nTODO: For beta graduation, expand this comment with a detailed explanation.\n\nThis is an alpha field and requires enabling the PodLevelResources feature\ngate.\n\n+featureGate=PodLevelResources\n+optional"}],"enumValues":[],"docString":"PodSpec is a description of a pod.","isRoot":false},"k8s.io/api/core/v1.PodStatus":{"package":"k8s.io/api/core/v1","typeName":"PodStatus","fields":[{"fieldName":"ObservedGeneration","typeName":"int64","typeDecorators":null,"docString":"If set, this represents the .metadata.generation that the pod status was set based upon.\nThis is an alpha field. Enable PodObservedGenerationTracking to be able to use this field.\n+featureGate=PodObservedGenerationTracking\n+optional"},{"fieldName":"Phase","typeName":"k8s.io/api/core/v1.PodPhase","typeDecorators":null,"docString":"The phase of a Pod is a simple, high-level summary of where the Pod is in its lifecycle.\nThe conditions array, the reason and message fields, and the individual container status\narrays contain more detail about the pod's status.\nThere are five possible phase values:\n\nPending: The pod has been accepted by the Kubernetes system, but one or more of the\ncontainer images has not been created. This includes time before being scheduled as\nwell as time spent downloading images over the network, which could take a while.\nRunning: The pod has been bound to a node, and all of the containers have been created.\nAt least one container is still running, or is in the process of starting or restarting.\nSucceeded: All containers in the pod have terminated in success, and will not be restarted.\nFailed: All containers in the pod have terminated, and at least one container has\nterminated in failure. The container either exited with non-zero status or was terminated\nby the system.\nUnknown: For some reason the state of the pod could not be obtained, typically due to an\nerror in communicating with the host of the pod.\n\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#pod-phase\n+optional"},{"fieldName":"Conditions","typeName":"k8s.io/api/core/v1.PodCondition","typeDecorators":["List"],"docString":"Current service state of pod.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#pod-conditions\n+optional\n+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"A human readable message indicating details about why the pod is in this condition.\n+optional"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"A brief CamelCase message indicating details about why the pod is in this state.\ne.g. 'Evicted'\n+optional"},{"fieldName":"NominatedNodeName","typeName":"string","typeDecorators":null,"docString":"nominatedNodeName is set only when this pod preempts other pods on the node, but it cannot be\nscheduled right away as preemption victims receive their graceful termination periods.\nThis field does not guarantee that the pod will be scheduled on this node. Scheduler may decide\nto place the pod elsewhere if other nodes become available sooner. Scheduler may also decide to\ngive the resources on this node to a higher priority pod that is created after preemption.\nAs a result, this field may be different than PodSpec.nodeName when the pod is\nscheduled.\n+optional"},{"fieldName":"HostIP","typeName":"string","typeDecorators":null,"docString":"hostIP holds the IP address of the host to which the pod is assigned. Empty if the pod has not started yet.\nA pod can be assigned to a node that has a problem in kubelet which in turns mean that HostIP will\nnot be updated even if there is a node is assigned to pod\n+optional"},{"fieldName":"HostIPs","typeName":"k8s.io/api/core/v1.HostIP","typeDecorators":["List"],"docString":"hostIPs holds the IP addresses allocated to the host. If this field is specified, the first entry must\nmatch the hostIP field. This list is empty if the pod has not started yet.\nA pod can be assigned to a node that has a problem in kubelet which in turns means that HostIPs will\nnot be updated even if there is a node is assigned to this pod.\n+optional\n+patchStrategy=merge\n+patchMergeKey=ip\n+listType=atomic"},{"fieldName":"PodIP","typeName":"string","typeDecorators":null,"docString":"podIP address allocated to the pod. Routable at least within the cluster.\nEmpty if not yet allocated.\n+optional"},{"fieldName":"PodIPs","typeName":"k8s.io/api/core/v1.PodIP","typeDecorators":["List"],"docString":"podIPs holds the IP addresses allocated to the pod. If this field is specified, the 0th entry must\nmatch the podIP field. Pods may be allocated at most 1 value for each of IPv4 and IPv6. This list\nis empty if no IPs have been allocated yet.\n+optional\n+patchStrategy=merge\n+patchMergeKey=ip\n+listType=map\n+listMapKey=ip"},{"fieldName":"StartTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":["Ptr"],"docString":"RFC 3339 date and time at which the object was acknowledged by the Kubelet.\nThis is before the Kubelet pulled the container image(s) for the pod.\n+optional"},{"fieldName":"InitContainerStatuses","typeName":"k8s.io/api/core/v1.ContainerStatus","typeDecorators":["List"],"docString":"Statuses of init containers in this pod. The most recent successful non-restartable\ninit container will have ready = true, the most recently started container will have\nstartTime set.\nEach init container in the pod should have at most one status in this list,\nand all statuses should be for containers in the pod.\nHowever this is not enforced.\nIf a status for a non-existent container is present in the list, or the list has duplicate names,\nthe behavior of various Kubernetes components is not defined and those statuses might be\nignored.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#pod-and-container-status\n+listType=atomic"},{"fieldName":"ContainerStatuses","typeName":"k8s.io/api/core/v1.ContainerStatus","typeDecorators":["List"],"docString":"Statuses of containers in this pod.\nEach container in the pod should have at most one status in this list,\nand all statuses should be for containers in the pod.\nHowever this is not enforced.\nIf a status for a non-existent container is present in the list, or the list has duplicate names,\nthe behavior of various Kubernetes components is not defined and those statuses might be\nignored.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#pod-and-container-status\n+optional\n+listType=atomic"},{"fieldName":"QOSClass","typeName":"k8s.io/api/core/v1.PodQOSClass","typeDecorators":null,"docString":"The Quality of Service (QOS) classification assigned to the pod based on resource requirements\nSee PodQOSClass type for available QOS classes\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/#quality-of-service-classes\n+optional"},{"fieldName":"EphemeralContainerStatuses","typeName":"k8s.io/api/core/v1.ContainerStatus","typeDecorators":["List"],"docString":"Statuses for any ephemeral containers that have run in this pod.\nEach ephemeral container in the pod should have at most one status in this list,\nand all statuses should be for containers in the pod.\nHowever this is not enforced.\nIf a status for a non-existent container is present in the list, or the list has duplicate names,\nthe behavior of various Kubernetes components is not defined and those statuses might be\nignored.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#pod-and-container-status\n+optional\n+listType=atomic"},{"fieldName":"Resize","typeName":"k8s.io/api/core/v1.PodResizeStatus","typeDecorators":null,"docString":"Status of resources resize desired for pod's containers.\nIt is empty if no resources resize is pending.\nAny changes to container resources will automatically set this to \"Proposed\"\nDeprecated: Resize status is moved to two pod conditions PodResizePending and PodResizeInProgress.\nPodResizePending will track states where the spec has been resized, but the Kubelet has not yet allocated the resources.\nPodResizeInProgress will track in-progress resizes, and should be present whenever allocated resources != acknowledged resources.\n+featureGate=InPlacePodVerticalScaling\n+optional"},{"fieldName":"ResourceClaimStatuses","typeName":"k8s.io/api/core/v1.PodResourceClaimStatus","typeDecorators":["List"],"docString":"Status of resource claims.\n+patchMergeKey=name\n+patchStrategy=merge,retainKeys\n+listType=map\n+listMapKey=name\n+featureGate=DynamicResourceAllocation\n+optional"}],"enumValues":[],"docString":"PodStatus represents information about the status of a pod. Status may trail the actual\nstate of a system, especially if the node that hosts the pod cannot contact the control\nplane.","isRoot":false},"k8s.io/api/core/v1.PodStatusResult":{"package":"k8s.io/api/core/v1","typeName":"PodStatusResult","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.PodStatus","typeDecorators":null,"docString":"Most recently observed status of the pod.\nThis data may not be up to date.\nPopulated by the system.\nRead-only.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"}],"enumValues":[],"docString":"PodStatusResult is a wrapper for PodStatus returned by kubelet that can be encode/decoded","isRoot":true},"k8s.io/api/core/v1.PodTemplate":{"package":"k8s.io/api/core/v1","typeName":"PodTemplate","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Template","typeName":"k8s.io/api/core/v1.PodTemplateSpec","typeDecorators":null,"docString":"Template defines the pods that will be created from this pod template.\nhttps://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"}],"enumValues":[],"docString":"PodTemplate describes a template for creating copies of a predefined pod.","isRoot":true},"k8s.io/api/core/v1.PodTemplateList":{"package":"k8s.io/api/core/v1","typeName":"PodTemplateList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.PodTemplate","typeDecorators":["List"],"docString":"List of pod templates"}],"enumValues":[],"docString":"PodTemplateList is a list of PodTemplates.","isRoot":false},"k8s.io/api/core/v1.PodTemplateSpec":{"package":"k8s.io/api/core/v1","typeName":"PodTemplateSpec","fields":[{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Spec","typeName":"k8s.io/api/core/v1.PodSpec","typeDecorators":null,"docString":"Specification of the desired behavior of the pod.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"}],"enumValues":[],"docString":"PodTemplateSpec describes the data a pod should have when created from a template","isRoot":false},"k8s.io/api/core/v1.PortStatus":{"package":"k8s.io/api/core/v1","typeName":"PortStatus","fields":[{"fieldName":"Port","typeName":"int32","typeDecorators":null,"docString":"Port is the port number of the service port of which status is recorded here"},{"fieldName":"Protocol","typeName":"k8s.io/api/core/v1.Protocol","typeDecorators":null,"docString":"Protocol is the protocol of the service port of which status is recorded here\nThe supported values are: \"TCP\", \"UDP\", \"SCTP\""},{"fieldName":"Error","typeName":"string","typeDecorators":["Ptr"],"docString":"Error is to record the problem with the service port\nThe format of the error shall comply with the following rules:\n- built-in error values shall be specified in this file and those shall use\n  CamelCase names\n- cloud provider specific error values must have names that comply with the\n  format foo.example.com/CamelCase.\n---\nThe regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)\n+optional\n+kubebuilder:validation:Required\n+kubebuilder:validation:Pattern=`^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$`\n+kubebuilder:validation:MaxLength=316"}],"enumValues":[],"docString":"PortStatus represents the error condition of a service port","isRoot":false},"k8s.io/api/core/v1.PortworxVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"PortworxVolumeSource","fields":[{"fieldName":"VolumeID","typeName":"string","typeDecorators":null,"docString":"volumeID uniquely identifies a Portworx volume"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fSType represents the filesystem type to mount\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\". Implicitly inferred to be \"ext4\" if unspecified."},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly defaults to false (read/write). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\n+optional"}],"enumValues":[],"docString":"PortworxVolumeSource represents a Portworx volume resource.","isRoot":false},"k8s.io/api/core/v1.Preconditions":{"package":"k8s.io/api/core/v1","typeName":"Preconditions","fields":[{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":["Ptr"],"docString":"Specifies the target UID.\n+optional"}],"enumValues":[],"docString":"Preconditions must be fulfilled before an operation (update, delete, etc.) is carried out.\n+k8s:openapi-gen=false","isRoot":false},"k8s.io/api/core/v1.PreemptionPolicy":{"package":"k8s.io/api/core/v1","typeName":"PreemptionPolicy","fields":[],"enumValues":[{"name":"PreemptLowerPriority","docString":"PreemptLowerPriority means that pod can preempt other pods with lower priority."},{"name":"PreemptNever","docString":"PreemptNever means that pod never preempts other pods with lower priority."}],"docString":"PreemptionPolicy describes a policy for if/when to preempt a pod.\n+enum","isRoot":false},"k8s.io/api/core/v1.PreferAvoidPodsEntry":{"package":"k8s.io/api/core/v1","typeName":"PreferAvoidPodsEntry","fields":[{"fieldName":"PodSignature","typeName":"k8s.io/api/core/v1.PodSignature","typeDecorators":null,"docString":"The class of pods."},{"fieldName":"EvictionTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Time at which this entry was added to the list.\n+optional"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"(brief) reason why this entry was added to the list.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"Human readable message indicating why this entry was added to the list.\n+optional"}],"enumValues":[],"docString":"Describes a class of pods that should avoid this node.","isRoot":false},"k8s.io/api/core/v1.PreferredSchedulingTerm":{"package":"k8s.io/api/core/v1","typeName":"PreferredSchedulingTerm","fields":[{"fieldName":"Weight","typeName":"int32","typeDecorators":null,"docString":"Weight associated with matching the corresponding nodeSelectorTerm, in the range 1-100."},{"fieldName":"Preference","typeName":"k8s.io/api/core/v1.NodeSelectorTerm","typeDecorators":null,"docString":"A node selector term, associated with the corresponding weight."}],"enumValues":[],"docString":"An empty preferred scheduling term matches all objects with implicit weight 0\n(i.e. it's a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).","isRoot":false},"k8s.io/api/core/v1.Probe":{"package":"k8s.io/api/core/v1","typeName":"Probe","fields":[{"fieldName":"ProbeHandler","typeName":"k8s.io/api/core/v1.ProbeHandler","typeDecorators":null,"docString":"The action taken to determine the health of a container"},{"fieldName":"InitialDelaySeconds","typeName":"int32","typeDecorators":null,"docString":"Number of seconds after the container has started before liveness probes are initiated.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes\n+optional"},{"fieldName":"TimeoutSeconds","typeName":"int32","typeDecorators":null,"docString":"Number of seconds after which the probe times out.\nDefaults to 1 second. Minimum value is 1.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes\n+optional"},{"fieldName":"PeriodSeconds","typeName":"int32","typeDecorators":null,"docString":"How often (in seconds) to perform the probe.\nDefault to 10 seconds. Minimum value is 1.\n+optional"},{"fieldName":"SuccessThreshold","typeName":"int32","typeDecorators":null,"docString":"Minimum consecutive successes for the probe to be considered successful after having failed.\nDefaults to 1. Must be 1 for liveness and startup. Minimum value is 1.\n+optional"},{"fieldName":"FailureThreshold","typeName":"int32","typeDecorators":null,"docString":"Minimum consecutive failures for the probe to be considered failed after having succeeded.\nDefaults to 3. Minimum value is 1.\n+optional"},{"fieldName":"TerminationGracePeriodSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"Optional duration in seconds the pod needs to terminate gracefully upon probe failure.\nThe grace period is the duration in seconds after the processes running in the pod are sent\na termination signal and the time when the processes are forcibly halted with a kill signal.\nSet this value longer than the expected cleanup time for your process.\nIf this value is nil, the pod's terminationGracePeriodSeconds will be used. Otherwise, this\nvalue overrides the value provided by the pod spec.\nValue must be non-negative integer. The value zero indicates stop immediately via\nthe kill signal (no opportunity to shut down).\nThis is a beta field and requires enabling ProbeTerminationGracePeriod feature gate.\nMinimum value is 1. spec.terminationGracePeriodSeconds is used if unset.\n+optional"}],"enumValues":[],"docString":"Probe describes a health check to be performed against a container to determine whether it is\nalive or ready to receive traffic.","isRoot":false},"k8s.io/api/core/v1.ProbeHandler":{"package":"k8s.io/api/core/v1","typeName":"ProbeHandler","fields":[{"fieldName":"Exec","typeName":"k8s.io/api/core/v1.ExecAction","typeDecorators":["Ptr"],"docString":"Exec specifies a command to execute in the container.\n+optional"},{"fieldName":"HTTPGet","typeName":"k8s.io/api/core/v1.HTTPGetAction","typeDecorators":["Ptr"],"docString":"HTTPGet specifies an HTTP GET request to perform.\n+optional"},{"fieldName":"TCPSocket","typeName":"k8s.io/api/core/v1.TCPSocketAction","typeDecorators":["Ptr"],"docString":"TCPSocket specifies a connection to a TCP port.\n+optional"},{"fieldName":"GRPC","typeName":"k8s.io/api/core/v1.GRPCAction","typeDecorators":["Ptr"],"docString":"GRPC specifies a GRPC HealthCheckRequest.\n+optional"}],"enumValues":[],"docString":"ProbeHandler defines a specific action that should be taken in a probe.\nOne and only one of the fields must be specified.","isRoot":false},"k8s.io/api/core/v1.ProcMountType":{"package":"k8s.io/api/core/v1","typeName":"ProcMountType","fields":[],"enumValues":[{"name":"DefaultProcMount","docString":"DefaultProcMount uses the container runtime defaults for readonly and masked\npaths for /proc.  Most container runtimes mask certain paths in /proc to avoid\naccidental security exposure of special devices or information."},{"name":"UnmaskedProcMount","docString":"UnmaskedProcMount bypasses the default masking behavior of the container\nruntime and ensures the newly created /proc the container stays in tact with\nno modifications."}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.ProjectedVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"ProjectedVolumeSource","fields":[{"fieldName":"Sources","typeName":"k8s.io/api/core/v1.VolumeProjection","typeDecorators":["List"],"docString":"sources is the list of volume projections. Each entry in this list\nhandles one source.\n+optional\n+listType=atomic"},{"fieldName":"DefaultMode","typeName":"int32","typeDecorators":["Ptr"],"docString":"defaultMode are the mode bits used to set permissions on created files by default.\nMust be an octal value between 0000 and 0777 or a decimal value between 0 and 511.\nYAML accepts both octal and decimal values, JSON requires decimal values for mode bits.\nDirectories within the path are not affected by this setting.\nThis might be in conflict with other options that affect the file\nmode, like fsGroup, and the result can be other mode bits set.\n+optional"}],"enumValues":[],"docString":"Represents a projected volume source","isRoot":false},"k8s.io/api/core/v1.Protocol":{"package":"k8s.io/api/core/v1","typeName":"Protocol","fields":[],"enumValues":[{"name":"ProtocolTCP","docString":"ProtocolTCP is the TCP protocol."},{"name":"ProtocolUDP"," Name":"Tenant","typeName":"string","typeDecorators":null,"docString":"tenant owning the given Quobyte volume in the Backend\nUsed with dynamically provisioned Quobyte volumes, value is set by the plugin\n+optional"}],"enumValues":[],"docString":"Represents a Quobyte mount that lasts the lifetime of a pod.\nQuobyte volumes do not support ownership management or SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.RBDPersistentVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"RBDPersistentVolumeSource","fields":[{"fieldName":"CephMonitors","typeName":"string","typeDecorators":["List"],"docString":"monitors is a collection of Ceph monitors.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it\n+listType=atomic"},{"fieldName":"RBDImage","typeName":"string","typeDecorators":null,"docString":"image is the rados image name.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type of the volume that you want to mount.\nTip: Ensure that the filesystem type is supported by the host operating system.\nExamples: \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#rbd\nTODO: how do we prevent errors in the filesystem from compromising the machine\n+optional"},{"fieldName":"RBDPool","typeName":"string","typeDecorators":null,"docString":"pool is the rados pool name.\nDefault is rbd.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it\n+optional\n+default=\"rbd\""},{"fieldName":"RadosUser","typeName":"string","typeDecorators":null,"docString":"user is the rados user name.\nDefault is admin.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it\n+optional\n+default=\"admin\""},{"fieldName":"Keyring","typeName":"string","typeDecorators":null,"docString":"keyring is the path to key ring for RBDUser.\nDefault is /etc/ceph/keyring.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it\n+optional\n+default=\"/etc/ceph/keyring\""},{"fieldName":"SecretRef","typeName":"k8s.io/api/core/v1.SecretReference","typeDecorators":["Ptr"],"docString":"secretRef is name of the authentication secret for RBDUser. If provided\noverrides keyring.\nDefault is nil.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it\n+optional"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly here will force the ReadOnly setting in VolumeMounts.\nDefaults to false.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it\n+optional"}],"enumValues":[],"docString":"Represents a Rados Block Device mount that lasts the lifetime of a pod.\nRBD volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.RBDVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"RBDVolumeSource","fields":[{"fieldName":"CephMonitors","typeName":"string","typeDecorators":["List"],"docString":"monitors is a collection of Ceph monitors.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it\n+listType=atomic"},{"fieldName":"RBDImage","typeName":"string","typeDecorators":null,"docString":"image is the rados image name.\nMore info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type of the volume that you want to mount.\nTip: Ensure that the filesystem type is supported by the host operating system.\nExamples: \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#rbd\nTODO: how do we prevent errors in the filesystem from compromising the machine\n+optional"},{"fieldName":"RBDPool","typeName":"string","typeDecorators":null,"docString":"pool is the rados pool name.\nDefault is rbd.\nMore o be controlled by this replication\ncontroller, if empty defaulted to labels on Pod template.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#label-selectors\n+optional\n+mapType=atomic"},{"fieldName":"Template","typeName":"k8s.io/api/core/v1.PodTemplateSpec","typeDecorators":["Ptr"],"docString":"Template is the object that describes the pod that will be created if\ninsufficient replicas are detected. This takes precedence over a TemplateRef.\nThe only allowed template.spec.restartPolicy value is \"Always\".\nMore info: https://kubernetes.io/docs/concepts/workloads/controllers/replicationcontroller#pod-template\n+optional"}],"enumValues":[],"docString":"ReplicationControllerSpec is the specification of a replication controller.","isRoot":false},"k8s.io/api/core/v1.ReplicationControllerStatus":{"package":"k8s.io/api/core/v1","typeName":"ReplicationControllerStatus","fields":[{"fieldName":"Replicas","typeName":"int32","typeDecorators":null,"docString":"Replicas is the most recently observed number of replicas.\nMore info: https://kubernetes.io/docs/concepts/workloads/controllers/replicationcontroller#what-is-a-replicationcontroller"},{"fieldName":"FullyLabeledReplicas","typeName":"int32","typeDecorators":null,"docString":"The number of pods that have labels matching the labels of the pod template of the replication controller.\n+optional"},{"fieldName":"ReadyReplicas","typeName":"int32","typeDecorators":null,"docString":"The number of ready replicas for this replication controller.\n+optional"},{"fieldName":"AvailableReplicas","typeName":"int32","typeDecorators":null,"docString":"The number of available replicas (ready for at least minReadySeconds) for this replication controller.\n+optional"},{"fieldName":"ObservedGeneration","typeName":"int64","typeDecorators":null,"docString":"ObservedGeneration reflects the generation of the most recently observed replication controller.\n+optional"},{"fieldName":"Conditions","typeName":"k8s.io/api/core/v1.ReplicationControllerCondition","typeDecorators":["List"],"docString":"Represents the latest available observations of a replication controller's current state.\n+optional\n+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"}],"enumValues":[],"docString":"ReplicationControllerStatus represents the current status of a replication\ncontroller.","isRoot":false},"k8s.io/api/core/v1.ResourceClaim":{"package":"k8s.io/api/core/v1","typeName":"ResourceClaim","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name must match the name of one entry in pod.spec.resourceClaims of\nthe Pod where this field is used. It makes that resource available\ninside a container."},{"fieldName":"Request","typeName":"string","typeDecorators":null,"docString":"Request is the name chosen for a request in the referenced claim.\nIf empty, everything from the claim is made available, otherwise\nonly the result of this request.\n\n+optional"}],"enumValues":[],"docString":"ResourceClaim references one entry in PodSpec.ResourceClaims.","isRoot":false},"k8s.io/api/core/v1.ResourceFieldSelector":{"package":"k8s.io/api/core/v1","typeName":"ResourceFieldSelector","fields":[{"fieldName":"ContainerName","typeName":"string","typeDecorators":null,"docString":"Container name: required for volumes, optional for env vars\n+optional"},{"fieldName":"Resource","typeName":"string","typeDecorators":null,"docString":"Required: resource to select"},{"fieldName":"Divisor","typeName":"k8s.io/apimachinery/pkg/api/resource.Quantity","typeDecorators":null,"docString":"Specifies the output format of the exposed resources, defaults to \"1\"\n+optional"}],"enumValues":[],"docString":"ResourceFieldSelector represents container resources (cpu, memory) and their output format\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.ResourceHealth":{"package":"k8s.io/api/core/v1","typeName":"ResourceHealth","fields":[{"fieldName":"ResourceID","typeName":"k8s.io/api/core/v1.ResourceID","typeDecorators":null,"docString":"ResourceID is the unique identifier of the resource. See the ResourceID type for more information."},{"fieldName":"Health","typeName":"k8s.io/api/core/v1.ResourceHealthStatus","typeDecorators":null,"docString":"Health of the resource.\ncan be one of:\n - Healthy: operates as normal\n - Unhealthy: reported unhealthy. We consider this a temporary health issue\n              since we do not have a mechanism today to distinguish\n              temporary and permanent issues.\n - Unknown: The status cannot be determined.\n            For example, Device Plugin got unregistered and hasn't been re-registered since.\n\nIn future we may want to introduce the PermanentlyUnhealthy Status."}],"enumValues":[],"docString":"ResourceHealth represents the health of a resource. It has the latest device health information.\nThis is a part of KEP https://kep.k8s.io/4680.","isRoot":false},"k8s.io/api/core/v1.ResourceHealthStatus":{"package":"k8s.io/api/core/v1","typeName":"ResourceHealthStatus","fields":[],"enumValues":[{"name":"ResourceHealthStatusHealthy","docString":""},{"name":"ResourceHealthStatusUnhealthy","docString":""},{"name":"ResourceHealthStatusUnknown","docString":""}],"docString":"","isRoot":false},"k8s.io/api/core/v1.ResourceName":{"package":"k8s.io/api/core/v1","typeName":"ResourceName","fields":[],"enumValues":[{"name":"ResourceCPU","docString":"CPU, in cores. (500m = .5 cores)"},{"name":"ResourceMemory","docString":"Memory, in bytes. (500Gi = 500GiB = 500 * 1024 * 1024 * 1024)"},{"name":"ResourceStorage","docString":"Volume size, in bytes (e,g. 5Gi = 5GiB = 5 * 1024 * 1024 * 1024)"},{"name":"ResourceEphemeralStorage","docString":"Local ephemeral storage, in bytes. (500Gi = 500GiB = 500 * 1024 * 1024 * 1024)"}],"docString":"ResourceName is the name identifying various resources in a ResourceList.","isRoot":false},"k8s.io/api/core/v1.ResourceQuota":{"package":"k8s.io/api/core/v1","typeName":"ResourceQuota","f "name":"ResourceQuotaScopeTerminating","docString":"Match all pod objects where spec.activeDeadlineSeconds \u003e=0"},{"name":"ResourceQuotaScopeNotTerminating","docString":"Match all pod objects where spec.activeDeadlineSeconds is nil"},{"name":"ResourceQuotaScopeBestEffort","docString":"Match all pod objects that have best effort quality of service"},{"name":"ResourceQuotaScopeNotBestEffort","docString":"Match all pod objects that do not have best effort quality of service"},{"name":"ResourceQuotaScopePriorityClass","docString":"Match all pod objects that have priority class mentioned"},{"name":"ResourceQuotaScopeCrossNamespacePodAffinity","docString":"Match all pod objects that have cross-namespace pod (anti)affinity mentioned."},{"name":"ResourceQuotaScopeVolumeAttributesClass","docString":"Match all pvc objects that have volume attributes class mentioned."}],"docString":"A ResourceQuotaScope defines a filter that must match each object tracked by a quota\n+enum","isRoot":false},"k8s.io/api/core/v1.ResourceQuotaSpec":{"package":"k8s.io/api/core/v1","typeName":"ResourceQuotaSpec","fields":[{"fieldName":"Hard","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"hard is the set of desired hard limits for each named resource.\nMore info: https://kubernetes.io/docs/concepts/policy/resource-quotas/\n+optional"},{"fieldName":"Scopes","typeName":"k8s.io/api/core/v1.ResourceQuotaScope","typeDecorators":["List"],"docString":"A collection of filters that must match each object tracked by a quota.\nIf not specified, the quota matches all objects.\n+optional\n+listType=atomic"},{"fieldName":"ScopeSelector","typeName":"k8s.io/api/core/v1.ScopeSelector","typeDecorators":["Ptr"],"docString":"scopeSelector is also a collection of filters like scopes that must match each object tracked by a quota\nbut expressed using ScopeSelectorOperator in combination with possible values.\nFor a resource to match, both scopes AND scopeSelector (if specified in spec), must be matched.\n+optional"}],"enumValues":[],"docString":"ResourceQuotaSpec defines the desired hard limits to enforce for Quota.","isRoot":false},"k8s.io/api/core/v1.ResourceQuotaStatus":{"package":"k8s.io/api/core/v1","typeName":"ResourceQuotaStatus","fields":[{"fieldName":"Hard","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Hard is the set of enforced hard limits for each named resource.\nMore info: https://kubernetes.io/docs/concepts/policy/resource-quotas/\n+optional"},{"fieldName":"Used","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Used is the current observed total usage of the resource in the namespace.\n+optional"}],"enumValues":[],"docString":"ResourceQuotaStatus defines the enforced hard limits and observed use.","isRoot":false},"k8s.io/api/core/v1.ResourceRequirements":{"package":"k8s.io/api/core/v1","typeName":"ResourceRequirements","fields":[{"fieldName":"Limits","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Limits describes the maximum amount of compute resources allowed.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/\n+optional"},{"fieldName":"Requests","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Requests describes the minimum amount of compute resources required.\nIf Requests is omitted for a container, it defaults to Limits if that is explicitly specified,\notherwise to an implementation-defined value. Requests cannot exceed Limits.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/\n+optional"},{"fieldName":"Claims","typeName":"k8s.io/api/core/v1.ResourceClaim","typeDecorators":["List"],"docString":"Claims lists the names of resources, defined in spec.resourceClaims,\nthat are used by this container.\n\nThis is an alpha field and requires enabling the\nDynamicResourceAllocation feature gate.\n\nThis field is immutable. It can only be set for containers.\n\n+listType=map\n+listMapKey=name\n+featureGate=DynamicResourceAllocation\n+optional"}],"enumValues":[],"docString":"ResourceRequirements describes the compute resource requirements.","isRoot":false},"k8s.io/api/core/v1.ResourceResizeRestartPolicy":{"package":"k8s.io/api/core/v1","typeName":"ResourceResizeRestartPolicy","fields":[],"enumValues":[{"name":"NotRequired","docString":"'NotRequired' means Kubernetes will try to resize the container\nwithout restarting it, if possible. Kubernetes may however choose to\nrestart the container if it is unable to actuate resize without a\nrestart. For e.g. the runtime doesn't support restart-free resizing."},{"name":"RestartContainer","docString":"'RestartContainer' means Kubernetes will resize the container in-place\nby stopping and starting the container when new resources are applied.\nThis is needed for legacy applications. For e.g. java apps using the\n-xmxN flag which are unable to use resized memory without restarting."}],"docString":"ResourceResizeRestartPolicy specifies how to handle container resource resize.","isRoot":false},"k8s.io/api/core/v1.ResourceStatus":{"package":"k8s.io/api/core/v1","typeName":"ResourceStatus","fields":[{"fieldName":"Name","typeName":"k8s.io/api/core/v1.ResourceName","typeDecorators":null,"docString":"Name of the resource. Must be unique within the pod and in case of non-DRA resource, match one of the resources from the pod spec.\nFor DRA resources, the value must be \"claim:\u003cclaim_name\u003e/\u003crequest\u003e\".\nWhen this status is reported about a container, the \"claim_name\" and \"request\" must match one of the claims of this container.\n+required"},{"fieldName":"Resources","typeName":"k8s.io/api/core/v1.ResourceHealth","typeDecorators":["List"],"docString":"List of unique resources health. Each element in the list contains an unique resource ID and its health.\nAt a minimum, for the lifetime of a Pod, resource ID must uniquely identify the resource allocated to the Pod on the Node.\nIf other Pod on the same Node reports the status with the same resource ID, it must be the same resource they share.\nSee ResourceID type definition for a specific format it has in various use cases.\n+listType=map\n+listMapKey=resourceID"}],"enumValues":[],"docString":"ResourceStatus represents the status of a single resource allocated to a Pod.","isRoot":false},"k8s.io/api/core/v1.RestartPolicy":{"package":"k8s.io/api/core/v1","typeName":"RestartPolicy","fields":[],"enumValues":[{"name":"RestartPolicyAlways","docString":""},{"name":"RestartPolicyOnFailure","docString":""},{"name":"RestartPolicyNever","docString":""}],"docString":"RestartPolicy describes how the container should be restarted.\nOnly one of the following restart policies may be specified.\nIf none of the following policies is specified, the default one\nis RestartPolicyAlways.\n+enum","isRoot":false},"k8s.io/api/core/v1.SELinuxOptions":{"package":"k8s.io/api/core/v1","typeName":"SELinuxOptions","fields":[{"fieldName":"User","typeName":"string","typeDecorators":null,"docString":"User is a SELinux user label that applies to the container.\n+optional"},{"fieldName":"Role","typeName":"string","typeDecorators":null,"docString":"Role is a SELinux role label that applies to the container.\n+optional"},{"fieldName":"Type","typeName":"string","typeDecorators":null,"docString":"Type is a SELinux type label that applies to the container.\n+optional"},{"fieldName":"Level","typeName":"string","typeDecorators":null,"docString":"Level is SELinux level label that applies to the container.\n+optional"}],"enumValues":[],"docString":"SELinuxOptions are the labels to be applied to the container","isRoot":false},"k8s.io/api/core/v1.ScaleIOPersistentVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"ScaleIOPersistentVolumeSource","fields":[{"fieldName":"Gateway","typeName":"string","typeDecorators":null,"docString":"gateway is the host address of the ScaleIO API Gateway."},{"fieldName":"System","typeName":"string","typeDecorators":null,"docString":"system is the name of the storage system as configured in ScaleIO."},{"fieldName":"SecretRef","typeName":"k8s.io/api/core/v1.SecretReference","typeDecorators":["Ptr"],"docString":"secretRef references to the secret for ScaleIO user and other\nsensitive information. If this is not provided, Login operation will fail."},{"fieldName":"SSLEnabled","typeName":"bool","typeDecorators":null,"docString":"sslEnabled is the flag to enable/disable SSL communication with Gateway, default false\n+optional"},{"fieldName":"ProtectionDomain","typeName":"string","typeDecorators":null,"docString":"protectionDomain is the name of the ScaleIO Protection Domain for the configured storage.\n+optional"},{"fieldName":"StoragePool","typeName":"string","typeDecorators":null,"docString":"storagePool is the ScaleIO Storage Pool associated with the protection domain.\n+optional"},{"fieldName":"StorageMode","typeName":"string","typeDecorators":null,"docString":"storageMode indicates whether the storage for a volume should be ThickProvisioned or ThinProvisioned.\nDefault is ThinProvisioned.\n+optional\n+default=\"ThinProvisioned\""},{"fieldName":"VolumeName","typeName":"string","typeDecorators":null,"docString":"volumeName is the name of a volume already created in the ScaleIO system\nthat is associated with this volume source."},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\".\nDefault is \"xfs\"\n+optional\n+default=\"xfs\""},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly defaults to false (read/write). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\n+optional"}],"enumValues":[],"docString":"ScaleIOPersistentVolumeSource represents a persistent ScaleIO volume","isRoot":false},"k8s.io/api/core/v1.ScaleIO te). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\n+optional"}],"enumValues":[],"docString":"ScaleIOVolumeSource represents a persistent ScaleIO volume","isRoot":false},"k8s.io/api/core/v1.ScopeSelector":{"package":"k8s.io/api/core/v1","typeName":"ScopeSelector","fields":[{"fieldName":"MatchExpressions","typeName":"k8s.io/api/core/v1.ScopedResourceSelectorRequirement","typeDecorators":["List"],"docString":"A list of scope selector requirements by scope of the resources.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"A scope selector represents the AND of the selectors represented\nby the scoped-resource selector requirements.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.ScopeSelectorOperator":{"package":"k8s.io/api/core/v1","typeName":"ScopeSelectorOperator","fields":[],"enumValues":[{"name":"ScopeSelectorOpIn","docString":""},{"name":"ScopeSelectorOpNotIn","docString":""},{"name":"ScopeSelectorOpExists","docString":""},{"name":"ScopeSelectorOpDoesNotExist","docString":""}],"docString":"A scope selector operator is the set of operators that can be used in\na scope selector requirement.\n+enum","isRoot":false},"k8s.io/api/core/v1.ScopedResourceSelectorRequirement":{"package":"k8s.io/api/core/v1","typeName":"ScopedResourceSelectorRequirement","fields":[{"fieldName":"ScopeName","typeName":"k8s.io/api/core/v1.ResourceQuotaScope","typeDecorators":null,"docString":"The name of the scope that the selector applies to."},{"fieldName":"Operator","typeName":"k8s.io/api/core/v1.ScopeSelectorOperator","typeDecorators":null,"docString":"Represents a scope's relationship to a set of values.\nValid operators are In, NotIn, Exists, DoesNotExist."},{"fieldName":"Values","typeName":"string","typeDecorators":["List"],"docString":"An array of string values. If the operator is In or NotIn,\nthe values array must be non-empty. If the operator is Exists or DoesNotExist,\nthe values array must be empty.\nThis array is replaced during a strategic merge patch.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"A scoped-resource selector requirement is a selector that contains values, a scope name, and an operator\nthat relates the scope name and values.","isRoot":false},"k8s.io/api/core/v1.SeccompProfile":{"package":"k8s.io/api/core/v1","typeName":"SeccompProfile","fields":[{"fieldName":"Type","typeName":"k8s.io/api/core/v1.SeccompProfileType","typeDecorators":null,"docString":"type indicates which kind of seccomp profile will be applied.\nValid options are:\n\nLocalhost - a profile defined in a file on the node should be used.\nRuntimeDefault - the container runtime default profile should be used.\nUnconfined - no profile should be applied.\n+unionDiscriminator"},{"fieldName":"LocalhostProfile","typeName":"string","typeDecorators":["Ptr"],"docString":"localhostProfile indicates a profile defined in a file on the node should be used.\nThe profile must be preconfigured on the node to work.\nMust be a descending path, relative to the kubelet's configured seccomp profile location.\nMust be set if type is \"Localhost\". Must NOT be set for any other type.\n+optional"}],"enumValues":[],"docString":"SeccompProfile defines a pod/container's seccomp profile settings.\nOnly one profile source may be set.\n+union","isRoot":false},"k8s.io/api/core/v1.SeccompProfileType":{"package":"k8s.io/api/core/v1","typeName":"SeccompProfileType","fields":[],"enumValues":[{"name":"SeccompProfileTypeUnconfined","docString":"SeccompProfileTypeUnconfined indicates no seccomp profile is applied (A.K.A. unconfined)."},{"name":"SeccompProfileTypeRuntimeDefault","docString":"SeccompProfileTypeRuntimeDefault represents the default container runtime seccomp profile."},{"name":"SeccompProfileTypeLocalhost","docString":"SeccompProfileTypeLocalhost indicates a profile defined in a file on the node should be used.\nThe file's location relative to \u003ckubelet-root-dir\u003e/seccomp."}],"docString":"SeccompProfileType defines the supported seccomp profile types.\n+enum","isRoot":false},"k8s.io/api/core/v1.Secret":{"package":"k8s.io/api/core/v1","typeName":"Secret","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Immutable","typeName":"bool","typeDecorators":["Ptr"],"docString":"Immutable, if set to true, ensures that data stored in the Secret cannot\nbe updated (only object metadata can be modified).\nIf not set to true, the field can be modified at any time.\nDefaulted to nil.\n+optional"},{"fieldName":"Data","typeName":"byte","typeDecorators":["Map[string]","List"],"docString":"Data contains the secret data. Each key must consist of alphanumeric\ncharacters, '-', '_' or '.'. The serialized form of the secret data is a\nbase64 encoded string, representing the arbitrary (possibly non-string)\ndata value here. Described in https://tools.ietf.org/html/rfc4648#section-4\n+optional"},{"fieldName":"StringData","typeName":"string","typeDecorators":["Map[string]"],"docString":"stringData allows specifying non-binary secret data in string form.\nIt is provided as a write-only input field for convenience.\nAll keys and values are merged into the data field on write, overwriting any existing values.\nThe stringData field is never output when reading from the API.\n+k8s:conversion-gen=false\n+optional"},{"fieldName":"Type","typeName":"k8s.io/api/core/v1.SecretType","typeDecorators":null,"docString":"Used to facilitate programmatic handling of secret data.\nMore info: https://kubernetes.io/docs/concepts/configuration/secret/#secret-types\n+optional"}],"enumValues":[],"docString":"Secret holds secret data of a certain type. The total bytes of the values in\nthe Data field must be less than MaxSecretSize bytes.","isRoot":true},"k8s.io/api/core/v1.SecretEnvSource":{"package":"k8s.io/api/core/v1","typeName":"SecretEnvSource","fields":[{"fieldName":"LocalObjectReference","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":null,"docString":"The Secret to select from."},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"Specify whether the Secret must be defined\n+optional"}],"enumValues":[],"docString":"SecretEnvSource selects a Secret to populate the environment\nvariables with.\n\nThe contents of the target Secret's Data field will represent the\nkey-value pairs as environment variables.","isRoot":false},"k8s.io/api/core/v1.SecretKeySelector":{"package":"k8s.io/api/core/v1","typeName":"SecretKeySelector","fields":[{"fieldName":"LocalObjectReference","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":null,"docString":"The name of the secret in the pod's namespace to select from."},{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"The key of the secret to select from.  Must be a valid secret key."},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"Specify whether the Secret or its key must be defined\n+optional"}],"enumValues":[],"docString":"SecretKeySelector selects a key of a Secret.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.SecretList":{"package":"k8s.io/api/core/v1","typeName":"SecretList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.Secret","typeDecorators":["List"],"docString":"Items is a list of secret objects.\nMore info: https://kubernetes.io/docs/concepts/configuration/secret"}],"enumValues":[],"docString":"SecretList is a list of Secret.","isRoot":false},"k8s.io/api/core/v1.SecretProjection":{"package":"k8s.io/api/core/v1","typeName":"SecretProjection","fields":[{"fieldName":"LocalObjectReference","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.KeyToPath","typeDecorators":["List"],"docString":"items if unspecified, each key-value pair in the Data field of the referenced\nSecret will be projected into the volume as a file whose name is the\nkey and content is the value. If specified, the listed keys will be\nprojected into the specified paths, and unlisted keys will not be\npresent. If a key is specified which is not present in the Secret,\nthe volume setup will error unless it is marked optional. Paths must be\nrelative and may not contain the '..' path or start with '..'.\n+optional\n+listType=atomic"},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"optional field specify whether the Secret or its key must be defined\n+optional"}],"enumValues":[],"docString":"Adapts a secret into a projected volume.\n\nThe contents of the target Secret's Data field will be presented in a\nprojected volume as files using the keys in the Data field as the file names.\nNote that this is identical to a secret volume source without the default\nmode.","isRoot":false},"k8s.io/api/core/v1.SecretReference":{"package":"k8s.io/api/core/v1","typeName":"SecretReference","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"name is unique within a namespace to reference a secret resource.\n+optional"},{"fieldName":"Namespace","typeName":"string","typeDecorators":null,"docString":"namespace defines the space within which the secret name must be unique.\n+optional"}],"enumValues":[],"docString":"SecretReference represents a Secret Reference. It has enough information to retrieve secret\nin any namespace\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.SecretVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"SecretVolumeSource","fields":[{"fieldName":"SecretName","typeName":"string","typeDecorators":null,"docString":"secretName is the name of the secret in the pod's namespace to use.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#secret\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.KeyToPath","typeDecorators":["List"],"docString":"items If unspecified, each key-value pair in the Data field of the referenced\nSecret will be projected into the volume as a file whose name is the\nkey and content is the value. If specified, the listed keys will be\nprojected into the specified paths, and unlisted keys will not be\npresent. If a key is specified which is not present in the Secret,\nthe volume setup will error unless it is marked optional. Paths must be\nrelative and may not contain the '..' path or start with '..'.\n+optional\n+listType=atomic"},{"fieldName":"DefaultMode","typeName":"int32","typeDecorators":["Ptr"],"docString":"defaultMode is Optional: mode bits used to set permissions on created files by default.\nMust be an octal value between 0000 and 0777 or a decimal value between 0 and 511.\nYAML accepts both octal and decimal values, JSON requires decimal values\nfor mode bits. Defaults to 0644.\nDirectories within the path are not affected by this setting.\nThis might be in conflict with other options that affect the file\nmode, like fsGroup, and the result can be other mode bits set.\n+optional"},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"optional field specify whether the Secret or its keys must be defined\n+optional"}],"enumValues":[],"docString":"Adapts a Secret into a volume.\n\nThe contents of the target Secret's Data field will be presented in a volume\nas files using the keys in the Data field as the file names.\nSecret volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.SecurityContext":{"package":"k8s.io/api/core/v1","typeName":"SecurityContext","fields":[{"fieldName":"Capabilities","typeName":"k8s.io/api/core/v1.Capabilities","typeDecorators":["Ptr"],"docString":"The capabilities to add/drop when running containers.\nDefaults to the default set of capabilities granted by the container runtime.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"Privileged","typeName":"bool","typeDecorators":["Ptr"],"docString":"Run container in privileged mode.\nProcesses in privileged containers are essentially equivalent to root on the host.\nDefaults to false.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"SELinuxOptions","typeName":"k8s.io/api/core/v1.SELinuxOptions","typeDecorators":["Ptr"],"docString":"The SELinux context to be applied to the container.\nIf unspecified, the container runtime will allocate a random SELinux context for each\ncontainer.  May also be set in PodSecurityContext.  If set in both SecurityContext and\nPodSecurityContext, the value specified in SecurityContext takes precedence.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"WindowsOptions","typeName":"k8s.io/api/core/v1.WindowsSecurityContextOptions","typeDecorators":["Ptr"],"docString":"The Windows specific settings applied to all containers.\nIf unspecified, the options from the PodSecurityContext will be used.\nIf set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.\nNote that this field cannot be set when spec.os.name is linux.\n+optional"},{"fieldName":"RunAsUser","typeName":"int64","typeDecorators":["Ptr"],"docString":"The UID to run the entrypoint of the container process.\nDefaults to user specified in image metadata if unspecified.\nMay also be set in PodSecurityContext.  If set in both SecurityContext and\nPodSecurityContext, the value specified in SecurityContext takes precedence.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"RunAsGroup","typeName":"int64","typeDecorators":["Ptr"],"docString":"The GID to run the entrypoint of the container process.\nUses runtime default if unset.\nMay also be set in PodSecurityContext.  If set in both SecurityContext and\nPodSecurityContext, the value specified in SecurityContext takes precedence.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"RunAsNonRoot","typeName":"bool","typeDecorators":["Ptr"],"docString":"Indicates that the container must run as a non-root user.\nIf true, the Kubelet will validate the image at runtime to ensure that it\ndoes not run as UID 0 (root) and fail to start the container if it does.\nIf unset or false, no such validation will be performed.\nMay also be set in PodSecurityContext.  If set in both SecurityContext and\nPodSecurityContext, the value specified in SecurityContext takes precedence.\n+optional"},{"fieldName":"ReadOnlyRootFilesystem","typeName":"bool","typeDecorators":["Ptr"],"docString":"Whether this container has a read-only root filesystem.\nDefault is false.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"AllowPrivilegeEscalation","typeName":"bool","typeDecorators":["Ptr"],"docString":"AllowPrivilegeEscalation controls whether a process can gain more\nprivileges than its parent process. This bool directly controls if\nthe no_new_privs flag will be set on the container process.\nAllowPrivilegeEscalation is true always when the container is:\n1) run as Privileged\n2) has CAP_SYS_ADMIN\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"ProcMount","typeName":"k8s.io/api/core/v1.ProcMountType","typeDecorators":["Ptr"],"docString":"procMount denotes the type of proc mount to use for the containers.\nThe default value is Default which uses the container runtime defaults for\nreadonly paths and masked paths.\nThis requires the ProcMountType feature flag to be enabled.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"SeccompProfile","typeName":"k8s.io/api/core/v1.SeccompProfile","typeDecorators":["Ptr"],"docString":"The seccomp options to use by this container. If seccomp options are\nprovided at both the pod \u0026 container level, the container options\noverride the pod options.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"},{"fieldName":"AppArmorProfile","typeName":"k8s.io/api/core/v1.AppArmorProfile","typeDecorators":["Ptr"],"docString":"appArmorProfile is the AppArmor options to use by this container. If set, this profile\noverrides the pod's appArmorProfile.\nNote that this field cannot be set when spec.os.name is windows.\n+optional"}],"enumValues":[],"docString":"SecurityContext holds security configuration that will be applied to a container.\nSome fields are present in both SecurityContext and PodSecurityContext.  When both\nare set, the values in SecurityContext take precedence.","isRoot":false},"k8s.io/api/core/v1.SerializedReference":{"package":"k8s.io/api/core/v1","typeName":"SerializedReference","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Reference","typeName":"k8s.io/api/core/v1.ObjectReference","typeDecorators":null,"docString":"The reference to an object in the system.\n+optional"}],"enumValues":[],"docString":"SerializedReference is a reference to serialized object.","isRoot":false},"k8s.io/api/core/v1.Service":{"package":"k8s.io/api/core/v1","typeName":"Service","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Spec","typeName":"k8s.io/api/core/v1.ServiceSpec","typeDecorators":null,"docString":"Spec defines the behavior of a service.\nhttps://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.ServiceStatus","typeDecorators":null,"docString":"Most recently observed status of the service.\nPopulated by the system.\nRead-only.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"}],"enumValues":[],"docString":"Service is a named abstraction of software service (for example, mysql) consisting of local port\n(for example 3306) that the proxy listens on, and the selector that determines which pods\nwill answer requests sent through the proxy.","isRoot":true},"k8s.io/api/core/v1.ServiceAccount":{"package":"k8s.io/api/core/v1","typeName":"ServiceAccount","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Secrets","typeName":"k8s.io/api/core/v1.ObjectReference","typeDecorators":["List"],"docString":"Secrets is a list of the secrets in the same namespace that pods running using this ServiceAccount are allowed to use.\nPods are only limited to this list if this service account has a \"kubernetes.io/enforce-mountable-secrets\" annotation set to \"true\".\nThe \"kubernetes.io/enforce-mountable-secrets\" annotation is deprecated since v1.32.\nPrefer separate namespaces to isolate access to mounted secrets.\nThis field should not be used to find auto-generated service account token secrets for use outside of pods.\nInstead, tokens can be requested directly using the TokenRequest API, or service account token secrets can be manually created.\nMore info: https://kubernetes.io/docs/concepts/configuration/secret\n+optional\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name"},{"fieldName":"ImagePullSecrets","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":["List"],"docString":"ImagePullSecrets is a list of references to secrets in the same namespace to use for pulling any images\nin pods that reference this ServiceAccount. ImagePullSecrets are distinct from Secrets because Secrets\ncan be mounted in the pod, but ImagePullSecrets are only accessed by the kubelet.\nMore info: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod\n+optional\n+listType=atomic"},{"fieldName":"AutomountServiceAccountToken","typeName":"bool","typeDecorators":["Ptr"],"docString":"AutomountServiceAccountToken indicates whether pods running as this service account should have an API token automatically mounted.\nCan be overridden at the pod level.\n+optional"}],"enumValues":[],"docString":"ServiceAccount binds together:\n* a name, understood by users, and perhaps by peripheral systems, for an identity\n* a principal that can be authenticated and authorized\n* a set of secrets","isRoot":true},"k8s.io/api/core/v1.ServiceAccountList":{"package":"k8s.io/api/core/v1","typeName":"ServiceAccountList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.ServiceAccount","typeDecorators":["List"],"docString":"List of ServiceAccounts.\nMore info: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/"}],"enumValues":[],"docString":"ServiceAccountList is a list of ServiceAccount objects","isRoot":false},"k8s.io/api/core/v1.ServiceAccountTokenProjection":{"package":"k8s.io/api/core/v1","typeName":"ServiceAccountTokenProjection","fields":[{"fieldName":"Audience","typeName":"string","typeDecorators":null,"docString":"audience is the intended audience of the token. A recipient of a token\nmust identify itself with an identifier specified in the audience of the\ntoken, and otherwise should reject the token. The audience defaults to the\nidentifier of the apiserver.\n+optional"},{"fieldName":"ExpirationSeconds","typeName":"int64","typeDecorators":["Ptr"],"docString":"expirationSeconds is the requested duration of validity of the service\naccount token. As the token approaches expiration, the kubelet volume\nplugin will proactively rotate the service account token. The kubelet will\nstart trying to rotate the token if the token is older than 80 percent of\nits time to live or if the token is older than 24 hours.Defaults to 1 hour\nand must be at least 10 minutes.\n+optional"},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"path is the path relative to the mount point of the file to project the\ntoken into."}],"enumValues":[],"docString":"ServiceAccountTokenProjection represents a projected service account token\nvolume. This projection can be used to insert a service account token into\nthe pods runtime filesystem for use against APIs (Kubernetes API Server or\notherwise).","isRoot":false},"k8s.io/api/core/v1.ServiceAffinity":{"package":"k8s.io/api/core/v1","typeName":"ServiceAffinity","fields":[],"enumValues":[{"name":"ServiceAffinityClientIP","docString":"ServiceAffinityClientIP is the Client IP based."},{"name":"ServiceAffinityNone","docString":"ServiceAffinityNone - no session affinity."}],"docString":"Session Affinity Type string\n+enum","isRoot":false},"k8s.io/api/core/v1.ServiceExternalTrafficPolicy":{"package":"k8s.io/api/core/v1","typeName":"ServiceExternalTrafficPolicy","fields":[],"enumValues":[{"name":"ServiceExternalTrafficPolicyCluster","docString":"ServiceExternalTrafficPolicyCluster routes traffic to all endpoints."},{"name":"ServiceExternalTrafficPolicyLocal","docString":"ServiceExternalTrafficPolicyLocal preserves the source IP of the traffic by\nrouting only to endpoints on the same node as the traffic was received on\n(dropping the traffic if there are no local endpoints)."}],"docString":"ServiceExternalTrafficPolicy describes how nodes distribute service traffic they\nreceive on one of the Service's \"externally-facing\" addresses (NodePorts, ExternalIPs,\nand LoadBalancer IPs.\n+enum","isRoot":false},"k8s.io/api/core/v1.ServiceInternalTrafficPolicy":{"package":"k8s.io/api/core/v1","typeName":"ServiceInternalTrafficPolicy","fields":[],"enumValues":[{"name":"ServiceInternalTrafficPolicyCluster","docString":"ServiceInternalTrafficPolicyCluster routes traffic to all endpoints."},{"name":"ServiceInternalTrafficPolicyLocal","docString":"ServiceInternalTrafficPolicyLocal routes traffic only to endpoints on the same\nnode as the client pod (dropping the traffic if there are no local endpoints)."}],"docString":"ServiceInternalTrafficPolicy describes how nodes distribute service traffic they\nreceive on the ClusterIP.\n+enum","isRoot":false},"k8s.io/api/core/v1.ServiceList":{"package":"k8s.io/api/core/v1","typeName":"ServiceList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.Service","typeDecorators":["List"],"docString":"List of services"}],"enumValues":[],"docString":"ServiceList holds a list of services.","isRoot":false},"k8s.io/api/core/v1.ServicePort":{"package":"k8s.io/api/core/v1","typeName":"ServicePort","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"The name of this port within the service. This must be a DNS_LABEL.\nAll ports within a ServiceSpec must have unique names. When considering\nthe endpoints for a Service, this must match the 'name' field in the\nEndpointPort.\nOptional if only one ServicePort is defined on this service.\n+optional"},{"fieldName":"Protocol","typeName":"k8s.io/api/core/v1.Protocol","typeDecorators":null,"docString":"The IP protocol for this port. Supports \"TCP\", \"UDP\", and \"SCTP\".\nDefault is TCP.\n+default=\"TCP\"\n+optional"},{"fieldName":"AppProtocol","typeName":"string","typeDecorators":["Ptr"],"docString":"The application protocol for this port.\nThis is used as a hint for implementations to offer richer behavior for protocols that they understand.\nThis field follows standard Kubernetes label syntax.\nValid values are either:\n\n* Un-prefixed protocol names - reserved for IANA standard service names (as per\nRFC-6335 and https://www.iana.org/assignments/service-names).\n\n* Kubernetes-defined prefixed names:\n  * 'kubernetes.io/h2c' - HTTP/2 prior knowledge over cleartext as described in https://www.rfc-editor.org/rfc/rfc9113.html#name-starting-http-2-with-prior-\n  * 'kubernetes.io/ws'  - WebSocket over cleartext as described in https://www.rfc-editor.org/rfc/rfc6455\n  * 'kubernetes.io/wss' - WebSocket over TLS as described in https://www.rfc-editor.org/rfc/rfc6455\n\n* Other protocols should use implementation-defined prefixed names such as\nmycompany.com/my-custom-protocol.\n+optional"},{"fieldName":"Port","typeName":"int32","typeDecorators":null,"docString":"The port that will be exposed by this service."},{"fieldName":"TargetPort","typeName":"k8s.io/apimachinery/pkg/util/intstr.IntOrString","typeDecorators":null,"docString":"Number or name of the port to access on the pods targeted by the service.\nNumber must be in the range 1 to 65535. Name must be an IANA_SVC_NAME.\nIf this is a string, it will be looked up as a named port in the\ntarget Pod's container ports. If this is not specified, the value\nof the 'port' field is used (an identity map).\nThis field is ignored for services with clusterIP=None, and should be\nomitted or set equal to the 'port' field.\nMore info: https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service\n+optional"},{"fieldName":"NodePort","typeName":"int32","typeDecorators":null,"docString":"The port on each node on which this service is exposed when type is\nNodePort or LoadBalancer.  Usually assigned by the system. If a value is\nspecified, in-range, and not in use it will be used, otherwise the\noperation will fail.  If not specified, a port will be allocated if this\nService requires one.  If this field is specified when creating a\nService which does not need it, creation will fail. This field will be\nwiped when updating a Service to no longer need it (e.g. changing type\nfrom NodePort to ClusterIP).\nMore info: https://kubernetes.io/docs/concepts/services-networking/service/#type-nodeport\n+optional"}],"enumValues":[],"docString":"ServicePort contains information on service's port.","isRoot":false},"k8s.io/api/core/v1.ServiceProxyOptions":{"package":"k8s.io/api/core/v1","typeName":"ServiceProxyOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"Path is the part of URLs that include service endpoints, suffixes,\nand parameters to use for the current proxy request to service.\nFor example, the whole request URL is\nhttp://localhost/api/v1/namespaces/kube-system/services/elasticsearch-logging/_search?q=user:kimchy.\nPath is _search?q=user:kimchy.\n+optional"}],"enumValues":[],"docString":"ServiceProxyOptions is the query options to a Service's proxy call.","isRoot":false},"k8s.io/api/core/v1.ServiceSpec":{"package":"k8s.io/api/core/v1","typeName":"ServiceSpec","fields":[{"fieldName":"Ports","typeName":"k8s.io/api/core/v1.ServicePort","typeDecorators":["List"],"docString":"The list of ports that are exposed by this service.\nMore info: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies\n+patchMergeKey=port\n+patchStrategy=merge\n+listType=map\n+listMapKey=port\n+listMapKey=protocol"},{"fieldName":"Selector","typeName":"string","typeDecorators":["Map[string]"],"docString":"Route service traffic to pods with label keys and values matching this\nselector. If empty or not present, the service is assumed to have an\nexternal process managing its endpoints, which Kubernetes will not\nmodify. Only applies to types ClusterIP, NodePort, and LoadBalancer.\nIgnored if type is ExternalName.\nMore info: https://kubernetes.io/docs/concepts/services-networking/service/\n+optional\n+mapType=atomic"},{"fieldName":"ClusterIP","typeName":"string","typeDecorators":null,"docString":"clusterIP is the IP address of the service and is usually assigned\nrandomly. If an address is specified manually, is in-range (as per\nsystem configuration), and is not in use, it will be allocated to the\nservice; otherwise creation of the service will fail. This field may not\nbe changed through updates unless the type field is also being changed\nto ExternalName (which requires this field to be blank) or the type\nfield is being changed from ExternalName (in which case this field may\noptionally be specified, as describe above).  Valid values are \"None\",\nempty string (\"\"), or a valid IP
