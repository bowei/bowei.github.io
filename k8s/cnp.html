
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godoc Multi-Column</title>
    <style>
      body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          margin: 0;
          padding: 20px;
          background-color: #f8f9fa;
          color: #212529;
      }
      h1 {
          font-weight: 500;
          margin-bottom: 20px;
      }

      kbd {
          background-color: #e9ecef;
          padding: 0.2em 0.4em;
          border-radius: 4px;
          border: 1px solid #ced4da;
          box-shadow: 0 2px 0 #ced4da;
          color: #212529;
          font-family: monospace;
          font-size: 0.9em;
          margin: 0 0.2em;
           
          position: relative;
          top: -1px;
      }

      #main-container {
          display: flex;
          flex-direction: row;
          height: calc(100vh - 100px);
          border: 1px solid #dee2e6;
          border-radius: 8px;
          overflow-x: auto;
          background-color: #fff;
      }
      .column {
          min-width: 250px;
          border-right: 1px solid #dee2e6;
          overflow-y: auto;
          flex-shrink: 0;
      }
      .column:last-child {
          border-right: none;
      }
      .column-header {
          padding: 12px 16px;
          font-weight: 600;
          border-bottom: 1px solid #dee2e6;
          background-color: #f1f3f5;
          position: sticky;
          top: 0;
          z-index: 1;
      }
      ul {
          list-style-type: none;
          margin: 0;
          padding: 0;
      }
      li {
          padding: 10px 16px;
          cursor: pointer;
          border-bottom: 1px solid #e9ecef;
          display: flex;
          justify-content: space-between;
          align-items: center;
      }
      li:last-child {
          border-bottom: none;
      }
      li:hover {
          background-color: #e9ecef;
      }
      li.selected {
          background-color: #0d6efd;
          color: white;
      }
      .type-name {
          color: #6c757d;
          font-size: 8pt;
      }
      
      .header-row {
          font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      .field-row {
          font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .field-name {
          font-size: 10pt;
      }
      .field-type {
          font-size: 10pt;
          margin-left: 6pt;
          color: #6c757d;
      }

      .doc-string {
          max-width: 400px;
          margin-top: 10pt;
          font-size: 9pt;
      }

      li.selected .field-type {
          color: #e0e0e0;
      }

      li.selected .type-name {
          color: #e0e0e0;
      }
      .chevron::after {
          content: '>';
          font-weight: bold;
          color: #adb5bd;
      }
      li.selected .chevron::after {
          color: white;
      }

      #type-switcher-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.5);
          z-index: 100;
          display: none;
          justify-content: center;
          align-items: center;
      }
      #type-switcher-dialog {
          background-color: white;
          padding: 20px;
          border-radius: 8px;
          width: 80%;
          max-width: 900px;
          box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      }
      #type-switcher-dialog h2 {
          margin-top: 0;
      }
      #type-switcher-input {
          width: 100%;
          padding: 10px;
          margin-bottom: 10px;
          box-sizing: border-box;
          border: 1px solid #ccc;
          border-radius: 4px;
      }
      #type-switcher-list {
          list-style-type: none;
          padding: 0;
          margin: 0;
          max-height: 400px;
          overflow-y: auto;
          column-count: 3;
      }
      #type-switcher-list li {
          cursor: pointer;
          padding: 8px;
          border-radius: 4px;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          height: 30px;
      }
      #type-switcher-list li:hover, #type-switcher-list li.selected {
          background-color: #0d6efd;
          color: #ffffff;
      }
      .type-switcher-type-name {
          font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
          font-size: 10pt;
      }
      .type-switcher-type-pkg {
          font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
          font-size: 8pt;
          color: #6c757d;
      }
    </style>
  </head>
  <body>
    <div id="help-text">
      Type<kbd>/</kbd>to change Object</p>
</div>
<div id="main-container"></div>

<div id="type-switcher-overlay">
  <div id="type-switcher-dialog">
    <h2>Switch Type</h2>
    <input type="text" id="type-switcher-input" placeholder="Filter types...">
    <ul id="type-switcher-list"></ul>
  </div>
</div>

ed to connect\nto OpenStack.\n+optional"}],"enumValues":[],"docString":"Represents a cinder volume resource in Openstack.\nA Cinder volume must exist before mounting to a container.\nThe volume must also be in the same region as the kubelet.\nCinder volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.CinderVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"CinderVolumeSource","fields":[{"fieldName":"VolumeID","typeName":"string","typeDecorators":null,"docString":"volumeID used to identify the volume in cinder.\nMore info: https://examples.k8s.io/mysql-cinder-pd/README.md"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nExamples: \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified.\nMore info: https://examples.k8s.io/mysql-cinder-pd/README.md\n+optional"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly defaults to false (read/write). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\nMore info: https://examples.k8s.io/mysql-cinder-pd/README.md\n+optional"},{"fieldName":"SecretRef","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":["Ptr"],"docString":"secretRef is optional: points to a secret object containing parameters used to connect\nto OpenStack.\n+optional"}],"enumValues":[],"docString":"Represents a cinder volume resource in Openstack.\nA Cinder volume must exist before mounting to a container.\nThe volume must also be in the same region as the kubelet.\nCinder volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.ClaimResourceStatus":{"package":"k8s.io/api/core/v1","typeName":"ClaimResourceStatus","fields":[],"enumValues":[{"name":"PersistentVolumeClaimControllerResizeInProgress","docString":"State set when resize controller starts resizing the volume in control-plane."},{"name":"PersistentVolumeClaimControllerResizeInfeasible","docString":"State set when resize has failed in resize controller with a terminal unrecoverable error.\nTransient errors such as timeout should not set this status and should leave allocatedResourceStatus\nunmodified, so as resize controller can resume the volume expansion."},{"name":"PersistentVolumeClaimNodeResizePending","docString":"State set when resize controller has finished resizing the volume but further resizing of volume\nis needed on the node."},{"name":"PersistentVolumeClaimNodeResizeInProgress","docString":"State set when kubelet starts resizing the volume."},{"name":"PersistentVolumeClaimNodeResizeInfeasible","docString":"State set when resizing has failed in kubelet with a terminal unrecoverable error. Transient errors\nshouldn't set this status"}],"docString":"+enum\nWhen a controller receives persistentvolume claim update with ClaimResourceStatus for a resource\nthat it does not recognizes, then it should ignore that update and let other controllers\nhandle it.","isRoot":false},"k8s.io/api/core/v1.ClientIPConfig":{"package":"k8s.io/api/core/v1","typeName":"ClientIPConfig","fields":[{"fieldName":"TimeoutSeconds","typeName":"int32","typeDecorators":["Ptr"],"docString":"timeoutSeconds specifies the seconds of ClientIP type session sticky time.\nThe value must be \u003e0 \u0026\u0026 \u003c=86400(for 1 day) if ServiceAffinity == \"ClientIP\".\nDefault value is 10800(for 3 hours).\n+optional"}],"enumValues":[],"docString":"ClientIPConfig represents the configurations of Client IP based session affinity.","isRoot":false},"k8s.io/api/core/v1.ClusterTrustBundleProjection":{"package":"k8s.io/api/core/v1","typeName":"ClusterTrustBundleProjection","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":["Ptr"],"docString":"Select a single ClusterTrustBundle by object name.  Mutually-exclusive\nwith signerName and labelSelector.\n+optional"},{"fieldName":"SignerName","typeName":"string","typeDecorators":["Ptr"],"docString":"Select all ClusterTrustBundles that match this signer name.\nMutually-exclusive with name.  The contents of all selected\nClusterTrustBundles will be unified and deduplicated.\n+optional"},{"fieldName":"LabelSelector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"Select all ClusterTrustBundles that match this label selector.  Only has\neffect if signerName is set.  Mutually-exclusive with name.  If unset,\ninterpreted as \"match nothing\".  If set but empty, interpreted as \"match\neverything\".\n+optional"},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"If true, don't block pod startup if the referenced ClusterTrustBundle(s)\naren't available.  If using name, then the named ClusterTrustBundle is\nallowed not to exist.  If using signerName, then the combination of\nsignerName and labelSelector is allowed to match zero\nClusterTrustBundles.\n+optional"},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"Relative path from the volume root to write the bundle."}],"enumValues":[],"docString":"ClusterTrustBundleProjection describes how to select a set of\nClusterTrustBundle objects and project their contents into the pod\nfilesystem.","isRoot":false},"k8s.io/api/core/v1.ComponentCondition":{"package":"k8s.io/api/core/v1","typeName":"ComponentCondition","fields":[{"fieldName":"Type","typeName":"k8s.io/api/core/v1.ComponentConditionType","typeDecorators":null,"docString":"Type of condition for a component.\nValid value: \"Healthy\""},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.ConditionStatus","typeDecorators":null,"docString":"Status of the condition for a component.\nValid values for \"Healthy\": \"True\", \"False\", or \"Unknown\"."},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"Message about the condition for a component.\nFor example, information about a health check.\n+optional"},{"fieldName":"Error","typeName":"string","typeDecorators":null,"docString":"Condition error code for a component.\nFor example, a health check error code.\n+optional"}],"enumValues":[],"docString":"Information about the condition of a component.","isRoot":false},"k8s.io/api/core/v1.ComponentConditionType":{"package":"k8s.io/api/core/v1","typeName":"ComponentConditionType","fields":[],"enumValues":[{"name":"ComponentHealthy","docString":"These are the valid conditions for the component."}],"docString":"Type and constants for component health validation.","isRoot":false},"k8s.io/api/core/v1.ComponentStatus":{"package":"k8s.io/api/core/v1","typeName":"ComponentStatus","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Conditions","typeName":"k8s.io/api/core/v1.ComponentCondition","typeDecorators":["List"],"docString":"List of component conditions observed\n+optional\n+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"}],"enumValues":[],"docString":"ComponentStatus (and ComponentStatusList) holds the cluster validation info.\nDeprecated: This API is deprecated in v1.19+","isRoot":true},"k8s.io/api/core/v1.ComponentStatusList":{"package":"k8s.io/api/core/v1","typeName":"ComponentStatusList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.ComponentStatus","typeDecorators":["List"],"docString":"List of ComponentStatus objects."}],"enumValues":[],"docString":"Status of all the conditions for the component as a list of ComponentStatus objects.\nDeprecated: This API is deprecated in v1.19+","isRoot":false},"k8s.io/api/core/v1.ConditionStatus":{"package":"k8s.io/api/core/v1","typeName":"ConditionStatus","fields":[],"enumValues":[{"name":"ConditionTrue","docString":"These are valid condition statuses. \"ConditionTrue\" means a resource is in the condition.\n\"ConditionFalse\" means a resource is not in the condition. \"ConditionUnknown\" means kubernetes\ncan't decide if a resource is in the condition or not. In the future, we could add other\nintermediate conditions, e.g. ConditionDegraded."},{"name":"ConditionFalse","docString":"These are valid condition statuses. \"ConditionTrue\" means a resource is in the condition.\n\"ConditionFalse\" means a resource is not in the condition. \"ConditionUnknown\" means kubernetes\ncan't decide if a resource is in the condition or not. In the future, we could add other\nintermediate conditions, e.g. ConditionDegraded."},{"name":"ConditionUnknown","docString":"These are valid condition statuses. \"ConditionTrue\" means a resource is in the condition.\n\"ConditionFalse\" means a resource is not in the condition. \"ConditionUnknown\" means kubernetes\ncan't decide if a resource is in the condition or not. In the future, we could add other\nintermediate conditions, e.g. ConditionDegraded."}],"docString":"","isRoot":false},"k8s.io/api/core/v1.ConfigMap":{"package":"k8s.io/api/core/v1","typeName":"ConfigMap","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Immutable","typeName":"bool","typeDecorators":["Ptr"],"docString":"Immutable, if set to true, ensures that data stored in the ConfigMap cannot\nbe updated (only object metadata can be modified).\nIf not set to true, the field can be modified at any time.\nDefaulted to nil.\n+optional"},{"fieldName":"Data","typeName":"string","typeDecorators":["Map[string]"],"docString":"Data contains the configuration data.\nEach key must consist of alphanumeric characters, '-', '_' or '.'.\nValues with non-UTF-8 byte sequences must use the BinaryData field.\nThe keys stored in Data must not overlap with the keys in\nthe BinaryData field, this is enforced during validation process.\n+optional"},{"fieldName":"BinaryData","typeName":"byte","typeDecorators":["Map[string]","List"],"docString":"BinaryData contains the binary data.\nEach key must consist of alphanumeric characters, '-', '_' or '.'.\nBinaryData can contain byte sequences that are not in the UTF-8 range.\nThe keys stored in BinaryData must not overlap with the ones in\nthe Data field, this is enforced during validation process.\nUsing this field will require 1.10+ apiserver and\nkubelet.\n+optional"}],"enumValues":[],"docString":"ConfigMap holds configuration data for pods to consume.","isRoot":true},"k8s.io/api/core/v1.ConfigMapEnvSource":{"package":"k8s.io/api/core/v1","typeName":"ConfigMapEnvSource","fields":[{"fieldName":"LocalObjectReference","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":null,"docString":"The ConfigMap to select from."},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"Specify whether the ConfigMap must be defined\n+optional"}],"enumValues":[],"docString":"ConfigMapEnvSource selects a ConfigMap to populate the environment\nvariables with.\n\nThe contents of the target ConfigMap's Data field will represent the\nkey-value pairs as environment variables.","isRoot":false},"k8s.io/api/core/v1.ConfigMapKeySelector":{"package":"k8s.io/api/core/v1","typeName":"ConfigMapKeySelector","fields":[{"fieldName":"LocalObjectReference","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":null,"docString":"The ConfigMap to select from."},{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"The key to select."},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"Specify whether the ConfigMap or its key must be defined\n+optional"}],"enumValues":[],"docString":"Selects a key from a ConfigMap.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.ConfigMapList":{"package":"k8s.io/api/core/v1","typeName":"ConfigMapList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.ConfigMap","typeDecorators":["List"],"docString":"Items is the list of ConfigMaps."}],"enumValues":[],"docString":"ConfigMapList is a resource containing a list of ConfigMap objects.","isRoot":false},"k8s.io/api/core/v1.ConfigMapNodeConfigSource":{"package":"k8s.io/api/core/v1","typeName":"ConfigMapNodeConfigSource","fields":[{"fieldName":"Namespace","typeName":"string","typeDecorators":null,"docString":"Namespace is the metadata.namespace of the referenced ConfigMap.\nThis field is required in all cases."},{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is the metadata.name of the referenced ConfigMap.\nThis field is required in all cases."},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":null,"docString":"UID is the metadata.UID of the referenced ConfigMap.\nThis field is forbidden in Node.Spec, and required in Node.Status.\n+optional"},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":null,"docString":"ResourceVersion is the metadata.ResourceVersion of the referenced ConfigMap.\nThis field is forbidden in Node.Spec, and required in Node.Status.\n+optional"},{"fieldName":"KubeletConfigKey","typeName":"string","typeDecorators":null,"docString":"KubeletConfigKey declares which key of the referenced ConfigMap corresponds to the KubeletConfiguration structure\nThis field is required in all cases."}],"enumValues":[],"docString":"ConfigMapNodeConfigSource contains the information to reference a ConfigMap as a config source for the Node.\nThis API is deprecated since 1.22: https://git.k8s.io/enhancements/keps/sig-node/281-dynamic-kubelet-configuration","isRoot":false},"k8s.io/api/core/v1.ConfigMapProjection":{"package":"k8s.io/api/core/v1","typeName":"ConfigMapProjection","fields":[{"fieldName":"LocalObjectReference","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.KeyToPath","typeDecorators":["List"],"docString":"items if unspecified, each key-value pair in the Data field of the referenced\nConfigMap will be projected into the volume as a file whose name is the\nkey and content is the value. If specified, the listed keys will be\nprojected into the specified paths, and unlisted keys will not be\npresent. If a key is specified which is not present in the ConfigMap,\nthe volume setup will error unless it is marked optional. Paths must be\nrelative and may not contain the '..' path or start with '..'.\n+optional\n+listType=atomic"},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"optional specify whether the ConfigMap or its keys must be defined\n+optional"}],"enumValues":[],"docString":"Adapts a ConfigMap into a projected volume.\n\nThe contents of the target ConfigMap's Data field will be presented in a\nprojected volume as files using the keys in the Data field as the file names,\nunless the items element is populated with specific mappings of keys to paths.\nNote that this is identical to a configmap volume source without the default\nmode.","isRoot":false},"k8s.io/api/core/v1.ConfigMapVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"ConfigMapVolumeSource","fields":[{"fieldName":"LocalObjectReference","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":null,"docString":""},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.KeyToPath","typeDecorators":["List"],"docString":"items if unspecified, each key-value pair in the Data field of the referenced\nConfigMap will be projected into the volume as a file whose name is the\nkey and content is the value. If specified, the listed keys will be\nprojected into the specified paths, and unlisted keys will not be\npresent. If a key is specified which is not present in the ConfigMap,\nthe volume setup will error unless it is marked optional. Paths must be\nrelative and may not contain the '..' path or start with '..'.\n+optional\n+listType=atomic"},{"fieldName":"DefaultMode","typeName":"int32","typeDecorators":["Ptr"],"docString":"defaultMode is optional: mode bits used to set permissions on created files by default.\nMust be an octal value between 0000 and 0777 or a decimal value between 0 and 511.\nYAML accepts both octal and decimal values, JSON requires decimal values for mode bits.\nDefaults to 0644.\nDirectories within the path are not affected by this setting.\nThis might be in conflict with other options that affect the file\nmode, like fsGroup, and the result can be other mode bits set.\n+optional"},{"fieldName":"Optional","typeName":"bool","typeDecorators":["Ptr"],"docString":"optional specify whether the ConfigMap or its keys must be defined\n+optional"}],"enumValues":[],"docString":"Adapts a ConfigMap into a volume.\n\nThe contents of the target ConfigMap's Data field will be presented in a\nvolume as files using the keys in the Data field as the file names, unless\nthe items element is populated with specific mappings of keys to paths.\nConfigMap volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.Container":{"package":"k8s.io/api/core/v1","typeName":"Container","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name of the container specified as a DNS_LABEL.\nEach container in a pod must have a unique name (DNS_LABEL).\nCannot be updated."},{"fieldName":"Image","typeName":"string","typeDecorators":null,"docString":"Container image name.\nMore info: https://kubernetes.io/docs/concepts/containers/images\nThis field is optional to allow higher level config management to default or override\ncontainer images in workload controllers like Deployments and StatefulSets.\n+optional"},{"fieldName":"Command","typeName":"string","typeDecorators":["List"],"docString":"Entrypoint array. Not executed within a shell.\nThe container image's ENTRYPOINT is used if this is not provided.\nVariable references $(VAR_NAME) are expanded using the container's environment. If a variable\ncannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced\nto a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. \"$$(VAR_NAME)\" will\nproduce the string literal \"$(VAR_NAME)\". Escaped references will never be expanded, regardless\nof whether the variable exists or not. Cannot be updated.\nMore info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell\n+optional\n+listType=atomic"},{"fieldName":"Args","typeName":"string","typeDecorators":["List"],"docString":"Arguments to the entrypoint.\nThe container image's CMD is used if this is not provided.\nVariable references $(VAR_NAME) are expanded using the container's environment. If a variable\ncannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced\nto a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. \"$$(VAR_NAME)\" will\nproduce the string literal \"$(VAR_NAME)\". Escaped references will never be expanded, regardless\nof whether the variable exists or not. Cannot be updated.\nMore info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell\n+optional\n+listType=atomic"},{"fieldName":"WorkingDir","typeName":"string","typeDecorators":null,"docString":"Container's working directory.\nIf not specified, the container runtime's default will be used, which\nmight be configured in the container image.\nCannot be updated.\n+optional"},{"fieldName":"Ports","typeName":"k8s.io/api/core/v1.ContainerPort","typeDecorators":["List"],"docString":"List of ports to expose from the container. Not specifying a port here\nDOES NOT prevent that port from being exposed. Any port which is\nlistening on the default \"0.0.0.0\" address inside a container will be\naccessible from the network.\nModifying this array with strategic merge patch may corrupt the data.\nFor more information See https://github.com/kubernetes/kubernetes/issues/108255.\nCannot be updated.\n+optional\n+patchMergeKey=containerPort\n+patchStrategy=merge\n+listType=map\n+listMapKey=containerPort\n+listMapKey=protocol"},{"fieldName":"EnvFrom","typeName":"k8s.io/api/core/v1.EnvFromSource","typeDecorators":["List"],"docString":"List of sources to populate environment variables in the container.\nThe keys defined within a source must be a C_IDENTIFIER. All invalid keys\nwill be reported as an event when the container is starting. When a key exists in multiple\nsources, the value associated with the last source will take precedence.\nValues defined by an Env with a duplicate key will take precedence.\nCannot be updated.\n+optional\n+listType=atomic"},{"fieldName":"Env","typeName":"k8s.io/api/core/v1.EnvVar","typeDecorators":["List"],"docString":"List of environment variables to set in the container.\nCannot be updated.\n+optional\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name"},{"fieldName":"Resources","typeName":"k8s.io/api/core/v1.ResourceRequirements","typeDecorators":null,"docString":"Compute Resources required by this container.\nCannot be updated.\nMore info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/\n+optional"},{"fieldName":"ResizePolicy","typeName":"k8s.io/api/core/v1.ContainerResizePolicy","typeDecorators":["List"],"docString":"Resources resize policy for the container.\n+featureGate=InPlacePodVerticalScaling\n+optional\n+listType=atomic"},{"fieldName":"RestartPolicy","typeName":"k8s.io/api/core/v1.ContainerRestartPolicy","typeDecorators":["Ptr"],"docString":"RestartPolicy defines the restart behavior of individual containers in a pod.\nThis field may only be set for init containers, and the only allowed value is \"Always\".\nFor non-init containers or when this field is not specified,\nthe restart behavior is defined by the Pod's restart policy and the container type.\nSetting the RestartPolicy as \"Always\" for the init container will have the following effect:\nthis init container will be continually restarted on\nexit until all regular containers have terminated. Once all regular\ncontainers have completed, all init containers with restartPolicy \"Always\"\nwill be shut down. This lifecycle differs from normal init containers and\nis often referred to as a \"sidecar\" container. Although this init\ncontainer still starts in the init container sequence, it does not wait\nfor the container to complete before proceeding to the next init\ncontainer. Instead, the next init container starts immediately after this\ninit container is started, or after any startupProbe has successfully\ncompleted.\n+featureGate=SidecarContainers\n+optional"},{"fieldName":"VolumeMounts","typeName":"k8s.io/api/core/v1.VolumeMount","typeDecorators":["List"],"docString":"Pod volumes to mount into the container's filesystem.\nCannot be updated.\n+optional\n+patchMergeKey=mountPath\n+patchStrategy=merge\n+listType=map\n+listMapKey=mountPath"},{"fieldName":"VolumeDevices","typeName":"k8s.io/api/core/v1.VolumeDevice","typeDecorators":["List"],"docString":"volumeDevices is the list of block devices to be used by the container.\n+patchMergeKey=devicePath\n+patchStrategy=merge\n+listType=map\n+listMapKey=devicePath\n+optional"},{"fieldName":"LivenessProbe","typeName":"k8s.io/api/core/v1.Probe","typeDecorators":["Ptr"],"docString":"Periodic probe of container liveness.\nContainer will be restarted if the probe fails.\nCannot be updated.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes\n+optional"},{"fieldName":"ReadinessProbe","typeName":"k8s.io/api/core/v1.Probe","typeDecorators":["Ptr"],"docString":"Periodic probe of container service readiness.\nContainer will be removed from service endpoints if the probe fails.\nCannot be updated.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes\n+optional"},{"fieldName":"StartupProbe","typeName":"k8s.io/api/core/v1.Probe","typeDecorators":["Ptr"],"docString":"StartupProbe indicates that the Pod has successfully initialized.\nIf specified, no other probes are executed until this completes successfully.\nIf this probe fails, the Pod will be restarted, just as if the livenessProbe failed.\nThis can be used to provide different probe parameters at the beginning of a Pod's lifecycle,\nwhen it might take a long time to load data or warm a cache, than during steady-state operation.\nThis cannot be updated.\nMore info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes\n+optional"},{"fieldName":"Lifecycle","typeName":"k8s.io/api/core/v1.Lifecycle","typeDecorators":["Ptr"],"docString":"Actions that the management system should take in response to container lifecycle events.\nCannot be updated.\n+optional"},{"fieldName":"TerminationMessagePath","typeName":"string","typeDecorators":null,"docString":"Optional: Path at which the file to which the container's termination message\nwill be written is mounted into the container's filesystem.\nMessage written is intended to be brief final status, such as an assertion failure message.\nWill be truncated by the node if greater than 4096 bytes. The total message length across\nall containers will be limited to 12kb.\nDefaults to /dev/termination-log.\nCannot be updated.\n+optional"},{"fieldName":"TerminationMessagePolicy","typeName":"k8s.io/api/core/v1.TerminationMessagePolicy","typeDecorators":null,"docString":"Indicate how the termination message should be populated. File will use the contents of\nterminationMessagePath to populate the container status message on both success and failure.\nFallbackToLogsOnError will use the last chunk of container log output if the termination\nmessage file is empty and the container exited with an error.\nThe log output is limited to 2048 bytes or 80 lines, whichever is smaller.\nDefaults to File.\nCannot be updated.\n+optional"},{"fieldName":"ImagePullPolicy","typeName":"k8s.io/api/core/v1.PullPolicy","typeDecorators":null,"docString":"Image pull policy.\nOne of Always, Never, IfNotPresent.\nDefaults to Always if :latest tag is specified, or IfNotPresent otherwise.\nCannot be updated.\nMore info: https://kubernetes.io/docs/concepts/containers/images#updating-images\n+optional"},{"fieldName":"SecurityContext","typeName":"k8s.io/api/core/v1.SecurityContext","typeDecorators":["Ptr"],"docString":"SecurityContext defines the security options the container should be run with.\nIf set, the fields of SecurityContext override the equivalent fields of PodSecurityContext.\nMore info: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/\n+optional"},{"fieldName":"Stdin","typeName":"bool","typeDecorators":null,"docString":"Whether this container should allocate a buffer for stdin in the container runtime. If this\nis not set, reads from stdin in the container will always result in EOF.\nDefault is false.\n+optional"},{"fieldName":"StdinOnce","typeName":"bool","typeDecorators":null,"docString":"Whether the container runtime should close the stdin channel after it has been opened by\na single attach. When stdin is true the stdin stream will remain open across multiple attach\nsessions. If stdinOnce is set to true, stdin is opened on container start, is empty until the\nfirst client attaches to stdin, and then remains open and accepts data until the client disconnects,\nat which time stdin is closed and remains closed until the container is restarted. If this\nflag is false, a container processes that reads from stdin will never receive an EOF.\nDefault is false\n+optional"},{"fieldName":"TTY","typeName":"bool","typeDecorators":null,"docString":"Whether this container should allocate a TTY for itself, also requires 'stdin' to be true.\nDefault is false.\n+optional"}],"enumValues":[],"docString":"A single application container that you want to run within a pod.","isRoot":false},"k8s.io/api/core/v1.ContainerImage":{"package":"k8s.io/api/core/v1","typeName":"ContainerImage","fields":[{"fieldName":"Names","typeName":"string","typeDecorators":["List"],"docString":"Names by which this image is known.\ne.g. [\"kubernetes.example/hyperkube:v1.0.7\", \"cloud-vendor.registry.example/cloud-vendor/hyperkube:v1.0.7\"]\n+optional\n+listType=atomic"},{"fieldName":"SizeBytes","typeName":"int64","typeDecorators":null,"docString":"The size of the image in bytes.\n+optional"}],"enumValues":[],"docString":"Describe a container image","isRoot":false},"k8s.io/api/core/v1.ContainerPort":{"package":"k8s.io/api/core/v1","typeName":"ContainerPort","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"If specified, this must be an IANA_SVC_NAME and unique within the pod. Each\nnamed port in a pod must have a unique name. Name for the port that can be\nreferred to by services.\n+optional"},{"fieldName":"HostPort","typeName":"int32","typeDecorators":null,"docString":"Number of port to expose on the host.\nIf specified, this must be a valid port number, 0 \u003c x \u003c 65536.\nIf HostNetwork is specified, this must match ContainerPort.\nMost containers do not need this.\n+optional"},{"fieldName":"ContainerPort","typeName":"int32","typeDecorators":null,"docString":"Number of port to expose on the pod's IP address.\nThis must be a valid port number, 0 \u003c x \u003c 65536."},{"fieldName":"Protocol","typeName":"k8s.io/api/core/v1.Protocol","typeDecorators":null,"docString":"Protocol for port. Must be UDP, TCP, or SCTP.\nDefaults to \"TCP\".\n+optional\n+default=\"TCP\""},{"fieldName":"HostIP","typeName":"string","typeDecorators":null,"docString":"What host IP to bind the external port to.\n+optional"}],"enumValues":[],"docString":"ContainerPort represents a network port in a single container.","isRoot":false},"k8s.io/api/core/v1.ContainerResizePolicy":{"package":"k8s.io/api/core/v1","typeName":"ContainerResizePolicy","fields":[{"fieldName":"ResourceName","typeName":"k8s.io/api/core/v1.ResourceName","typeDecorators":null,"docString":"Name of the resource to which this resource resize policy applies.\nSupported values: cpu, memory."},{"fieldName":"RestartPolicy","typeName":"k8s.io/api/core/v1.ResourceResizeRestartPolicy","typeDecorators":null,"docString":"Restart policy to apply when specified resource is resized.\nIf not specified, it defaults to NotRequired."}],"enumValues":[],"docString":"ContainerResizePolicy represents resource resize policy for the container.","isRoot":false},"k8s.io/api/core/v1.ContainerRestartPolicy":{"package":"k8s.io/api/core/v1","typeName":"ContainerRestartPolicy","fields":[],"enumValues":[{"name":"ContainerRestartPolicyAlways","docString":""}],"docString":"ContainerRestartPolicy is the restart policy for a single container.\nThis may only be set for init containers and only allowed value is \"Always\".","isRoot":false},"k8s.io/api/core/v1.ContainerState":{"package":"k8s.io/api/core/v1","typeName":"ContainerState","fields":[{"fieldName":"Waiting","typeName":"k8s.io/api/core/v1.ContainerStateWaiting","typeDecorators":["Ptr"],"docString":"Details about a waiting container\n+optional"},{"fieldName":"Running","typeName":"k8s.io/api/core/v1.ContainerStateRunning","typeDecorators":["Ptr"],"docString":"Details about a running container\n+optional"},{"fieldName":"Terminated","typeName":"k8s.io/api/core/v1.ContainerStateTerminated","typeDecorators":["Ptr"],"docString":"Details about a terminated container\n+optional"}],"enumValues":[],"docString":"ContainerState holds a possible state of container.\nOnly one of its members may be specified.\nIf none of them is specified, the default one is ContainerStateWaiting.","isRoot":false},"k8s.io/api/core/v1.ContainerStateRunning":{"package":"k8s.io/api/core/v1","typeName":"ContainerStateRunning","fields":[{"fieldName":"StartedAt","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Time at which the container was last (re-)started\n+optional"}],"enumValues":[],"docString":"ContainerStateRunning is a running state of a container.","isRoot":false},"k8s.io/api/core/v1.ContainerStateTerminated":{"package":"k8s.io/api/core/v1","typeName":"ContainerStateTerminated","fields":[{"fieldName":"ExitCode","typeName":"int32","typeDecorators":null,"docString":"Exit status from the last termination of the container"},{"fieldName":"Signal","typeName":"int32","typeDecorators":null,"docString":"Signal from the last termination of the container\n+optional"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"(brief) reason from the last termination of the container\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"Message regarding the last termination of the container\n+optional"},{"fieldName":"StartedAt","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Time at which previous execution of the container started\n+optional"},{"fieldName":"FinishedAt","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Time at which the container last terminated\n+optional"},{"fieldName":"ContainerID","typeName":"string","typeDecorators":null,"docString":"Container's ID in the format '\u003ctype\u003e://\u003ccontainer_id\u003e'\n+optional"}],"enumValues":[],"docString":"ContainerStateTerminated is a terminated state of a container.","isRoot":false},"k8s.io/api/core/v1.ContainerStateWaiting":{"package":"k8s.io/api/core/v1","typeName":"ContainerStateWaiting","fields":[{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"(brief) reason the container is not yet running.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"Message regarding why the container is not yet running.\n+optional"}],"enumValues":[],"docString":"ContainerStateWaiting is a waiting state of a container.","isRoot":false},"k8s.io/api/core/v1.ContainerStatus":{"package":"k8s.io/api/core/v1","typeName":"ContainerStatus","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name is a DNS_LABEL representing the unique name of the container.\nEach container in a pod must have a unique name across all container types.\nCannot be updated."},{"fieldName":"State","typeName":"k8s.io/api/core/v1.ContainerState","typeDecorators":null,"docString":"State holds details about the container's current condition.\n+optional"},{"fieldName":"LastTerminationState","typeName":"k8s.io/api/core/v1.ContainerState","typeDecorators":null,"docString":"LastTerminationState holds the last termination state of the container to\nhelp debug container crashes and restarts. This field is not\npopulated if the container is still running and RestartCount is 0.\n+optional"},{"fieldName":"Ready","typeName":"bool","typeDecorators":null,"docString":"Ready specifies whether the container is currently passing its readiness check.\nThe value will change as readiness probes keep executing. If no readiness\nprobes are specified, this field defaults to true once the container is\nfully started (see Started field).\n\nThe value is typically used to determine whether a container is ready to\naccept traffic."},{"fieldName":"RestartCount","typeName":"int32","typeDecorators":null,"docString":"RestartCount holds the number of times the container has been restarted.\nKubelet makes an effort to always increment the value, but there\nare cases when the state may be lost due to node restarts and then the value\nmay be reset to 0. The value is never negative."},{"fieldName":"Image","typeName":"string","typeDecorators":null,"docString":"Image is the name of container image that the container is running.\nThe container image may not match the image used in the PodSpec,\nas it may have been resolved by the runtime.\nMore info: https://kubernetes.io/docs/concepts/containers/images."},{"fieldName":"ImageID","typeName":"string","typeDecorators":null,"docString":"ImageID is the image ID of the container's image. The image ID may not\nmatch the image ID of the image used in the PodSpec, as it may have been\nresolved by the runtime."},{"fieldName":"ContainerID","typeName":"string","typeDecorators":null,"docString":"ContainerID is the ID of the container in the format '\u003ctype\u003e://\u003ccontainer_id\u003e'.\nWhere type is a container runtime identifier, returned from Version call of CRI API\n(for example \"containerd\").\n+optional"},{"fieldName":"Started","typeName":"bool","typeDecorators":["Ptr"],"docString":"Started indicates whether the container has finished its postStart lifecycle hook\nand passed its startup probe.\nInitialized as false, becomes true after startupProbe is considered\nsuccessful. Resets to false when the container is restarted, or if kubelet\nloses state temporarily. In both cases, startup probes will run again.\nIs always true when no startupProbe is defined and container is running and\nhas passed the postStart lifecycle hook. The null value must be treated the\nsame as false.\n+optional"},{"fieldName":"AllocatedResources","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"AllocatedResources represents the compute resources allocated for this container by the\nnode. Kubelet sets this value to Container.Resources.Requests upon successful pod admission\nand after successfully admitting desired pod resize.\n+featureGate=InPlacePodVerticalScalingAllocatedStatus\n+optional"},{"fieldName":"Resources","typeName":"k8s.io/api/core/v1.ResourceRequirements","typeDecorators":["Ptr"],"docString":"Resources represents the compute resource requests and limits that have been successfully\nenacted on the running container after it has been started or has been successfully resized.\n+featureGate=InPlacePodVerticalScaling\n+optional"},{"fieldName":"VolumeMounts","typeName":"k8s.io/api/core/v1.VolumeMountStatus","typeDecorators":["List"],"docString":"Status of volume mounts.\n+optional\n+patchMergeKey=mountPath\n+patchStrategy=merge\n+listType=map\n+listMapKey=mountPath\n+featureGate=RecursiveReadOnlyMounts"},{"fieldName":"User","typeName":"k8s.io/api/core/v1.ContainerUser","typeDecorators":["Ptr"],"docString":"User represents user identity information initially attached to the first process of the container\n+featureGate=SupplementalGroupsPolicy\n+optional"},{"fieldName":"AllocatedResourcesStatus","typeName":"k8s.io/api/core/v1.ResourceStatus","typeDecorators":["List"],"docString":"AllocatedResourcesStatus represents the status of various resources\nallocated for this Pod.\n+featureGate=ResourceHealthStatus\n+optional\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name"},{"fieldName":"StopSignal","typeName":"k8s.io/api/core/v1.Signal","typeDecorators":["Ptr"],"docString":"StopSignal reports the effective stop signal for this container\n+featureGate=ContainerStopSignals\n+optional"}],"enumValues":[],"docString":"ContainerStatus contains details for the current status of this container.","isRoot":false},"k8s.io/api/core/v1.ContainerUser":{"package":"k8s.io/api/core/v1","typeName":"ContainerUser","fields":[{"fieldName":"Linux","typeName":"k8s.io/api/core/v1.LinuxContainerUser","typeDecorators":["Ptr"],"docString":"Linux holds user identity information initially attached to the first process of the containers in Linux.\nNote that the actual running identity can be changed if the process has enough privilege to do so.\n+optional"}],"enumValues":[],"docString":"ContainerUser represents user identity information","isRoot":false},"k8s.io/api/core/v1.DNSPolicy":{"package":"k8s.io/api/core/v1","typeName":"DNSPolicy","fields":[],"enumValues":[{"name":"DNSClusterFirstWithHostNet","docString":"DNSClusterFirstWithHostNet indicates that the pod should use cluster DNS\nfirst, if it is available, then fall back on the default\n(as determined by kubelet) DNS settings."},{"name":"DNSClusterFirst","docString":"DNSClusterFirst indicates that the pod should use cluster DNS\nfirst unless hostNetwork is true, if it is available, then\nfall back on the default (as determined by kubelet) DNS settings."},{"name":"DNSDefault","docString":"DNSDefault indicates that the pod should use the default (as\ndetermined by kubelet) DNS settings."},{"name":"DNSNone","docString":"DNSNone indicates that the pod should use empty DNS settings. DNS\nparameters such as nameservers and search paths should be defined via\nDNSConfig."}],"docString":"DNSPolicy defines how a pod's DNS will be configured.\n+enum","isRoot":false},"k8s.io/api/core/v1.DaemonEndpoint":{"package":"k8s.io/api/core/v1","typeName":"DaemonEndpoint","fields":[{"fieldName":"Port","typeName":"int32","typeDecorators":null,"docString":"Port number of the given endpoint."}],"enumValues":[],"docString":"DaemonEndpoint contains information about a single Daemon endpoint.","isRoot":false},"k8s.io/api/core/v1.DownwardAPIProjection":{"package":"k8s.io/api/core/v1","typeName":"DownwardAPIProjection","fields":[{"fieldName":"Items","typeName":"k8s.io/api/core/v1.DownwardAPIVolumeFile","typeDecorators":["List"],"docString":"Items is a list of DownwardAPIVolume file\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"Represents downward API info for projecting into a projected volume.\nNote that this is identical to a downwardAPI volume source without the default\nmode.","isRoot":false},"k8s.io/api/core/v1.DownwardAPIVolumeFile":{"package":"k8s.io/api/core/v1","typeName":"DownwardAPIVolumeFile","fields":[{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"Required: Path is  the relative path name of the file to be created. Must not be absolute or contain the '..' path. Must be utf-8 encoded. The first item of the relative path must not start with '..'"},{"fieldName":"FieldRef","typeName":"k8s.io/api/core/v1.ObjectFieldSelector","typeDecorators":["Ptr"],"docString":"Required: Selects a field of the pod: only annotations, labels, name, namespace and uid are supported.\n+optional"},{"fieldName":"ResourceFieldRef","typeName":"k8s.io/api/core/v1.ResourceFieldSelector","typeDecorators":["Ptr"],"docString":"Selects a resource of the container: only resources limits and requests\n(limits.cpu, limits.memory, requests.cpu and requests.memory) are currently supported.\n+optional"},{"fieldName":"Mode","typeName":"int32","typeDecorators":["Ptr"],"docString":"Optional: mode bits used to set permissions on this file, must be an octal value\nbetween 0000 and 0777 or a decimal value between 0 and 511.\nYAML accepts both octal and decimal values, JSON requires decimal values for mode bits.\nIf not specified, the volume defaultMode will be used.\nThis might be in conflict with other options that affect the file\nmode, like fsGroup, and the result can be other mode bits set.\n+optional"}],"enumValues":[],"docString":"DownwardAPIVolumeFile represents information to create the file containing the pod field","isRoot":false},"k8s.io/api/core/v1.DownwardAPIVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"DownwardAPIVolumeSource","fields":[{"fieldName":"Items","typeName":"k8s.io/api/core/v1.DownwardAPIVolumeFile","typeDecorators":["List"],"docString":"Items is a list of downward API volume file\n+optional\n+listType=atomic"},{"fieldName":"DefaultMode","typeName":"int32","typeDecorators":["Ptr"],"docString":"Optional: mode bits to use on created files by default. Must be a\nOptional: mode bits used to set permissions on created files by default.\nMust be an octal value between 0000 and 0777 or a decimal value between 0 and 511.\nYAML accepts both octal and decimal values, JSON requires decimal values for mode bits.\nDefaults to 0644.\nDirectories within the path are not affected by this setting.\nThis might be in conflict with other options that affect the file\nmode, like fsGroup, and the result can be other mode bits set.\n+optional"}],"enumValues":[],"docString":"DownwardAPIVolumeSource represents a volume containing downward API info.\nDownward API volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.EmptyDirVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"EmptyDirVolumeSource","fields":[{"fieldName":"Medium","typeName":"k8s.io/api/core/v1.StorageMedium","typeDecorators":null,"docString":"medium represents what type of storage medium should back this directory.\nThe default is \"\" which means to use the node's default medium.\nMust be an empty string (default) or Memory.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir\n+optional"},{"fieldName":"SizeLimit","typeName":"k8s.io/apimachinery/pkg/api/resource.Quantity","typeDecorators":["Ptr"],"docString":"sizeLimit is the total amount of local storage required for this EmptyDir volume.\nThe size limit is also applicable for memory medium.\nThe maximum usage on memory medium EmptyDir would be the minimum value between\nthe SizeLimit specified here and the sum of memory limits of all containers in a pod.\nThe default is nil which means that the limit is undefined.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir\n+optional"}],"enumValues":[],"docString":"Represents an empty directory for a pod.\nEmpty directory volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.EndpointAddress":{"package":"k8s.io/api/core/v1","typeName":"EndpointAddress","fields":[{"fieldName":"IP","typeName":"string","typeDecorators":null,"docString":"The IP of this endpoint.\nMay not be loopback (127.0.0.0/8 or ::1), link-local (169.254.0.0/16 or fe80::/10),\nor link-local multicast (224.0.0.0/24 or ff02::/16)."},{"fieldName":"Hostname","typeName":"string","typeDecorators":null,"docString":"The Hostname of this endpoint\n+optional"},{"fieldName":"NodeName","typeName":"string","typeDecorators":["Ptr"],"docString":"Optional: Node hosting this endpoint. This can be used to determine endpoints local to a node.\n+optional"},{"fieldName":"TargetRef","typeName":"k8s.io/api/core/v1.ObjectReference","typeDecorators":["Ptr"],"docString":"Reference to object providing the endpoint.\n+optional"}],"enumValues":[],"docString":"EndpointAddress is a tuple that describes single IP address.\nDeprecated: This API is deprecated in v1.33+.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.EndpointPort":{"package":"k8s.io/api/core/v1","typeName":"EndpointPort","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"The name of this port.  This must match the 'name' field in the\ncorresponding ServicePort.\nMust be a DNS_LABEL.\nOptional only if one port is defined.\n+optional"},{"fieldName":"Port","typeName":"int32","typeDecorators":null,"docString":"The port number of the endpoint."},{"fieldName":"Protocol","typeName":"k8s.io/api/core/v1.Protocol","typeDecorators":null,"docString":"The IP protocol for this port.\nMust be UDP, TCP, or SCTP.\nDefault is TCP.\n+optional"},{"fieldName":"AppProtocol","typeName":"string","typeDecorators":["Ptr"],"docString":"The application protocol for this port.\nThis is used as a hint for implementations to offer richer behavior for protocols that they understand.\nThis field follows standard Kubernetes label syntax.\nValid values are either:\n\n* Un-prefixed protocol names - reserved for IANA standard service names (as per\nRFC-6335 and https://www.iana.org/assignments/service-names).\n\n* Kubernetes-defined prefixed names:\n  * 'kubernetes.io/h2c' - HTTP/2 prior knowledge over cleartext as described in https://www.rfc-editor.org/rfc/rfc9113.html#name-starting-http-2-with-prior-\n  * 'kubernetes.io/ws'  - WebSocket over cleartext as described in https://www.rfc-editor.org/rfc/rfc6455\n  * 'kubernetes.io/wss' - WebSocket over TLS as described in https://www.rfc-editor.org/rfc/rfc6455\n\n* Other protocols should use implementation-defined prefixed names such as\nmycompany.com/my-custom-protocol.\n+optional"}],"enumValues":[],"docString":"EndpointPort is a tuple that describes a single port.\nDeprecated: This API is deprecated in v1.33+.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.EndpointSubset":{"package":"k8s.io/api/core/v1","typeName":"EndpointSubset","fields":[{"fieldName":"Addresses","typeName":"k8s.io/api/core/v1.EndpointAddress","typeDecorators":["List"],"docString":"IP addresses which offer the related ports that are marked as ready. These endpoints\nshould be considered safe for load balancers and clients to utilize.\n+optional\n+listType=atomic"},{"fieldName":"NotReadyAddresses","typeName":"k8s.io/api/core/v1.EndpointAddress","typeDecorators":["List"],"docString":"IP addresses which offer the related ports but are not currently marked as ready\nbecause they have not yet finished starting, have recently failed a readiness check,\nor have recently failed a liveness check.\n+optional\n+listType=atomic"},{"fieldName":"Ports","typeName":"k8s.io/api/core/v1.EndpointPort","typeDecorators":["List"],"docString":"Port numbers available on the related IP addresses.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"EndpointSubset is a group of addresses with a common set of ports. The\nexpanded set of endpoints is the Cartesian product of Addresses x Ports.\nFor example, given:\n\n\t{\n\t  Addresses: [{\"ip\": \"10.10.1.1\"}, {\"ip\": \"10.10.2.2\"}],\n\t  Ports:     [{\"name\": \"a\", \"port\": 8675}, {\"name\": \"b\", \"port\": 309}]\n\t}\n\nThe resulting set of endpoints can be viewed as:\n\n\ta: [ 10.10.1.1:8675, 10.10.2.2:8675 ],\n\tb: [ 10.10.1.1:309, 10.10.2.2:309 ]\n\nDeprecated: This API is deprecated in v1.33+.","isRoot":false},"k8s.io/api/core/v1.Endpoints":{"package":"k8s.io/api/core/v1","typeName":"Endpoints","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Subsets","typeName":"k8s.io/api/core/v1.EndpointSubset","typeDecorators":["List"],"docString":"The set of all endpoints is the union of all subsets. Addresses are placed into\nsubsets according to the IPs they share. A single address with multiple ports,\nsome of which are ready and some of which are not (because they come from\ndifferent containers) will result in the address being displayed in different\nsubsets for the different ports. No address will appear in both Addresses and\nNotReadyAddresses in the same subset.\nSets of addresses and ports that comprise a service.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"Endpoints is a collection of endpoints that implement the actual service. Example:\n\n\t Name: \"mysvc\",\n\t Subsets: [\n\t   {\n\t     Addresses: [{\"ip\": \"10.10.1.1\"}, {\"ip\": \"10.10.2.2\"}],\n\t     Ports: [{\"name\": \"a\", \"port\": 8675}, {\"name\": \"b\", \"port\": 309}]\n\t   },\n\t   {\n\t     Addresses: [{\"ip\": \"10.10.3.3\"}],\n\t     Ports: [{\"name\": \"a\", \"port\": 93}, {\"name\": \"b\", \"port\": 76}]\n\t   },\n\t]\n\nEndpoints is a legacy API and does not contain information about all Service features.\nUse discoveryv1.EndpointSlice for complete information about Service endpoints.\n\nDeprecated: This API is deprecated in v1.33+. Use discoveryv1.EndpointSlice.","isRoot":true},"k8s.io/api/core/v1.EndpointsList":{"package":"k8s.io/api/core/v1","typeName":"EndpointsList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.Endpoints","typeDecorators":["List"],"docString":"List of endpoints."}],"enumValues":[],"docString":"EndpointsList is a list of endpoints.\nDeprecated: This API is deprecated in v1.33+.","isRoot":false},"k8s.io/api/core/v1.EnvFromSource":{"package":"k8s.io/api/core/v1","typeName":"EnvFromSource","fields":[{"fieldName":"Prefix","typeName":"string","typeDecorators":null,"docString":"Optional text to prepend to the name of each environment variable. Must be a C_IDENTIFIER.\n+optional"},{"fieldName":"ConfigMapRef","typeName":"k8s.io/api/core/v1.ConfigMapEnvSource","typeDecorators":["Ptr"],"docString":"The ConfigMap to select from\n+optional"},{"fieldName":"SecretRef","typeName":"k8s.io/api/core/v1.SecretEnvSource","typeDecorators":["Ptr"],"docString":"The Secret to select from\n+optional"}],"enumValues":[],"docString":"EnvFromSource represents the source of a set of ConfigMaps or Secrets","isRoot":false},"k8s.io/api/core/v1.EnvVar":{"package":"k8s.io/api/core/v1","typeName":"EnvVar","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name of the environment variable. Must be a C_IDENTIFIER."},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"Variable references $(VAR_NAME) are expanded\nusing the previously defined environment variables in the container and\nany service environment variables. If a variable cannot be resolved,\nthe reference in the input string will be unchanged. Double $$ are reduced\nto a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.\n\"$$(VAR_NAME)\" will produce the string literal \"$(VAR_NAME)\".\nEscaped references will never be expanded, regardless of whether the variable\nexists or not.\nDefaults to \"\".\n+optional"},{"fieldName":"ValueFrom","typeName":"k8s.io/api/core/v1.EnvVarSource","typeDecorators":["Ptr"],"docString":"Source for the environment variable's value. Cannot be used if value is not empty.\n+optional"}],"enumValues":[],"docString":"EnvVar represents an environment variable present in a Container.","isRoot":false},"k8s.io/api/core/v1.EnvVarSource":{"package":"k8s.io/api/core/v1","typeName":"EnvVarSource","fields":[{"fieldName":"FieldRef","typeName":"k8s.io/api/core/v1.ObjectFieldSelector","typeDecorators":["Ptr"],"docString":"Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['\u003cKEY\u003e']`, `metadata.annotations['\u003cKEY\u003e']`,\nspec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.\n+optional"},{"fieldName":"ResourceFieldRef","typeName":"k8s.io/api/core/v1.ResourceFieldSelector","typeDecorators":["Ptr"],"docString":"Selects a resource of the container: only resources limits and requests\n(limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.\n+optional"},{"fieldName":"ConfigMapKeyRef","typeName":"k8s.io/api/core/v1.ConfigMapKeySelector","typeDecorators":["Ptr"],"docString":"Selects a key of a ConfigMap.\n+optional"},{"fieldName":"SecretKeyRef","typeName":"k8s.io/api/core/v1.SecretKeySelector","typeDecorators":["Ptr"],"docString":"Selects a key of a secret in the pod's namespace\n+optional"}],"enumValues":[],"docString":"EnvVarSource represents a source for the value of an EnvVar.","isRoot":false},"k8s.io/api/core/v1.EphemeralContainer":{"package":"k8s.io/api/core/v1","typeName":"EphemeralContainer","fields":[{"fieldName":"EphemeralContainerCommon","typeName":"k8s.io/api/core/v1.EphemeralContainerCommon","typeDecorators":null,"docString":"Ephemeral containers have all of the fields of Container, plus additional fields\nspecific to ephemeral containers. Fields in common with Container are in the\nfollowing inlined struct so than an EphemeralContainer may easily be converted\nto a Container."},{"fieldName":"TargetContainerName","typeName":"string","typeDecorators":null,"docString":"If set, the name of the container from PodSpec that this ephemeral container targets.\nThe ephemeral container will be run in the namespaces (IPC, PID, etc) of this container.\nIf not set then the ephemeral container uses the namespaces configured in the Pod spec.\n\nThe container runtime must implement support for this feature. If the runtime does not\nsupport namespace targeting then the result of setting this field is undefined.\n+optional"}],"enumValues":[],"docString":"An EphemeralContainer is a temporary container that you may add to an existing Pod for\nuser-initiated activities such as debugging. Ephemeral containers have no resource or\nscheduling guarantees, and they will not be restarted when they exit or when a Pod is\nremoved or restarted. The kubelet may evict a Pod if an ephemeral container causes the\nPod to exceed its resource allocation.\n\nTo add an ephemeral container, use the ephemeralcontainers subresource of an existing\nPod. Ephemeral containers may not be removed or restarted.","isRoot":false},"k8s.io/api/core/v1.EphemeralContainerCommon":{"package":"k8s.io/api/core/v1","typeName":"EphemeralContainerCommon","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name of the ephemeral container specified as a DNS_LABEL.\nThis name must be unique among all containers, init containers and ephemeral containers."},{"fieldName":"Image","typeName":"string","typeDecorators":null,"docString":"Container image name.\nMore info: https://kubernetes.io/docs/concepts/containers/images"},{"fieldName":"Command","typeName":"string","typeDecorators":["List"],"docString":"Entrypoint array. Not executed within a shell.\nThe image's ENTRYPOINT is used if this is not provided.\nVariable references $(VAR_NAME) are expanded using the container's environment. If a variable\ncannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced\nto a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. \"$$(VAR_NAME)\" will\nproduce the string literal \"$(VAR_NAME)\". Escaped references will never be expanded, regardless\nof whether the variable exists or not. Cannot be updated.\nMore info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell\n+optional\n+listType=atomic"},{"fieldName":"Args","typeName":"string","typeDecorators":["List"],"docString":"Arguments to the entrypoint.\nThe image's CMD is used if this is not provided.\nVariable references $(VAR_NAME) are expanded using the container's environment. If a variable\ncannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced\nto a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. \"$$(VAR_NAME)\" will\nproduce the string literal \"$(VAR_NAME)\". Escaped references will never be expanded, regardless\nof whether the variable exists or not. Cannot be updated.\nMore info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell\n+optional\n+listType=atomic"},{"fieldName":"WorkingDir","typeName":"string","typeDecorators":null,"docString":"Container's working directory.\nIf not specified, the container runtime's default will be used, which\nmight be configured in the container image.\nCannot be updated.\n+optional"},{"fieldName":"Ports","typeName":"k8s.io/api/core/v1.ContainerPort","typeDecorators":["List"],"docString":"Ports are not allowed for ephemeral containers.\n+optional\n+patchMergeKey=containerPort\n+patchStrategy=merge\n+listType=map\n+listMapKey=containerPort\n+listMapKey=protocol"},{"fieldName":"EnvFrom","typeName":"k8s.io/api/core/v1.EnvFromSource","typeDecorators":["List"],"docString":"List of sources to populate environment variables in the container.\nThe keys defined within a source must be a C_IDENTIFIER. All invalid keys\nwill be reported as an event when the container is starting. When a key exists in multiple\nsources, the value associated with the last source will take precedence.\nValues defined by an Env with a duplicate key will take precedence.\nCannot be updated.\n+optional\n+listType=atomic"},{"fieldName":"Env","typeName":"k8s.io/api/core/v1.EnvVar","typeDecorators":["List"],"docString":"List of environment variables to set in the container.\nCannot be updated.\n+optional\n+patchMergeKey=name\n+patchStrategy=merge\n+listType=map\n+listMapKey=name"},{"fieldName":"Resources","typeName":"k8s.io/api/core/v1.ResourceRequirements","typeDecorators":null,"docString":"Resources are not allowed for ephemeral containers. Ephemeral containers use spare resources\nalready allocated to the pod.\n+optional"},{"fieldName":"ResizePolicy","typeName":"k8s.io/api/core/v1.ContainerResizePolicy","typeDecorators":["List"],"docString":"Resources resize policy for the container.\n+featureGate=InPlacePodVerticalScaling\n+optional\n+listType=atomic"},{"fieldName":"RestartPolicy","typeName":"k8s.io/api/core/v1.ContainerRestartPolicy","typeDecorators":["Ptr"],"docString":"Restart policy for the container to manage the restart behavior of each\ncontainer within a pod.\nThis may only be set for init containers. You cannot set this field on\nephemeral containers.\n+featureGate=SidecarContainers\n+optional"},{"fieldName":"VolumeMounts","typeName":"k8s.io/api/core/v1.VolumeMount","typeDecorators":["List"],"docString":"Pod volumes to mount into the container's filesystem. Subpath mounts are not allowed for ephemeral containers.\nCannot be updated.\n+optional\n+patchMergeKey=mountPath\n+patchStrategy=merge\n+listType=map\n+listMapKey=mountPath"},{"fieldName":"VolumeDevices","typeName":"k8s.io/api/core/v1.VolumeDevice","typeDecorators":["List"],"docString":"volumeDevices is the list of block devices to be used by the container.\n+patchMergeKey=devicePath\n+patchStrategy=merge\n+listType=map\n+listMapKey=devicePath\n+optional"},{"fieldName":"LivenessProbe","typeName":"k8s.io/api/core/v1.Probe","typeDecorators":["Ptr"],"docString":"Probes are not allowed for ephemeral containers.\n+optional"},{"fieldName":"ReadinessProbe","typeName":"k8s.io/api/core/v1.Probe","typeDecorators":["Ptr"],"docString":"Probes are not allowed for ephemeral containers.\n+optional"},{"fieldName":"StartupProbe","typeName":"k8s.io/api/core/v1.Probe","typeDecorators":["Ptr"],"docString":"Probes are not allowed for ephemeral containers.\n+optional"},{"fieldName":"Lifecycle","typeName":"k8s.io/api/core/v1.Lifecycle","typeDecorators":["Ptr"],"docString":"Lifecycle is not allowed for ephemeral containers.\n+optional"},{"fieldName":"TerminationMessagePath","typeName":"string","typeDecorators":null,"docString":"Optional: Path at which the file to which the container's termination message\nwill be written is mounted into the container's filesystem.\nMessage written is intended to be brief final status, such as an assertion failure message.\nWill be truncated by the node if greater than 4096 bytes. The total message length across\nall containers will be limited to 12kb.\nDefaults to /dev/termination-log.\nCannot be updated.\n+optional"},{"fieldName":"TerminationMessagePolicy","typeName":"k8s.io/api/core/v1.TerminationMessagePolicy","typeDecorators":null,"docString":"Indicate how the termination message should be populated. File will use the contents of\nterminationMessagePath to populate the container status message on both success and failure.\nFallbackToLogsOnError will use the last chunk of container log output if the termination\nmessage file is empty and the container exited with an error.\nThe log output is limited to 2048 bytes or 80 lines, whichever is smaller.\nDefaults to File.\nCannot be updated.\n+optional"},{"fieldName":"ImagePullPolicy","typeName":"k8s.io/api/core/v1.PullPolicy","typeDecorators":null,"docString":"Image pull policy.\nOne of Always, Never, IfNotPresent.\nDefaults to Always if :latest tag is specified, or IfNotPresent otherwise.\nCannot be updated.\nMore info: https://kubernetes.io/docs/concepts/containers/images#updating-images\n+optional"},{"fieldName":"SecurityContext","typeName":"k8s.io/api/core/v1.SecurityContext","typeDecorators":["Ptr"],"docString":"Optional: SecurityContext defines the security options the ephemeral container should be run with.\nIf set, the fields of SecurityContext override the equivalent fields of PodSecurityContext.\n+optional"},{"fieldName":"Stdin","typeName":"bool","typeDecorators":null,"docString":"Whether this container should allocate a buffer for stdin in the container runtime. If this\nis not set, reads from stdin in the container will always result in EOF.\nDefault is false.\n+optional"},{"fieldName":"StdinOnce","typeName":"bool","typeDecorators":null,"docString":"Whether the container runtime should close the stdin channel after it has been opened by\na single attach. When stdin is true the stdin stream will remain open across multiple attach\nsessions. If stdinOnce is set to true, stdin is opened on container start, is empty until the\nfirst client attaches to stdin, and then remains open and accepts data until the client disconnects,\nat which time stdin is closed and remains closed until the container is restarted. If this\nflag is false, a container processes that reads from stdin will never receive an EOF.\nDefault is false\n+optional"},{"fieldName":"TTY","typeName":"bool","typeDecorators":null,"docString":"Whether this container should allocate a TTY for itself, also requires 'stdin' to be true.\nDefault is false.\n+optional"}],"enumValues":[],"docString":"EphemeralContainerCommon is a copy of all fields in Container to be inlined in\nEphemeralContainer. This separate type allows easy conversion from EphemeralContainer\nto Container and allows separate documentation for the fields of EphemeralContainer.\nWhen a new field is added to Container it must be added here as well.","isRoot":false},"k8s.io/api/core/v1.EphemeralVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"EphemeralVolumeSource","fields":[{"fieldName":"VolumeClaimTemplate","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimTemplate","typeDecorators":["Ptr"],"docString":"Will be used to create a stand-alone PVC to provision the volume.\nThe pod in which this EphemeralVolumeSource is embedded will be the\nowner of the PVC, i.e. the PVC will be deleted together with the\npod.  The name of the PVC will be `\u003cpod name\u003e-\u003cvolume name\u003e` where\n`\u003cvolume name\u003e` is the name from the `PodSpec.Volumes` array\nentry. Pod validation will reject the pod if the concatenated name\nis not valid for a PVC (for example, too long).\n\nAn existing PVC with that name that is not owned by the pod\nwill *not* be used for the pod to avoid using an unrelated\nvolume by mistake. Starting the pod is then blocked until\nthe unrelated PVC is removed. If such a pre-created PVC is\nmeant to be used by the pod, the PVC has to updated with an\nowner reference to the pod once the pod exists. Normally\nthis should not be necessary, but it may be useful when\nmanually reconstructing a broken cluster.\n\nThis field is read-only and no changes will be made by Kubernetes\nto the PVC after it has been created.\n\nRequired, must not be nil."}],"enumValues":[],"docString":"Represents an ephemeral volume that is handled by a normal storage driver.","isRoot":false},"k8s.io/api/core/v1.Event":{"package":"k8s.io/api/core/v1","typeName":"Event","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata"},{"fieldName":"InvolvedObject","typeName":"k8s.io/api/core/v1.ObjectReference","typeDecorators":null,"docString":"The object that this event is about."},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"This should be a short, machine understandable string that gives the reason\nfor the transition into the object's current status.\nTODO: provide exact specification for format.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"A human-readable description of the status of this operation.\nTODO: decide on maximum length.\n+optional"},{"fieldName":"Source","typeName":"k8s.io/api/core/v1.EventSource","typeDecorators":null,"docString":"The component reporting this event. Should be a short machine understandable string.\n+optional"},{"fieldName":"FirstTimestamp","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"The time at which the event was first recorded. (Time of server receipt is in TypeMeta.)\n+optional"},{"fieldName":"LastTimestamp","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"The time at which the most recent occurrence of this event was recorded.\n+optional"},{"fieldName":"Count","typeName":"int32","typeDecorators":null,"docString":"The number of times this event has occurred.\n+optional"},{"fieldName":"Type","typeName":"string","typeDecorators":null,"docString":"Type of this event (Normal, Warning), new types could be added in the future\n+optional"},{"fieldName":"EventTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.MicroTime","typeDecorators":null,"docString":"Time when this Event was first observed.\n+optional"},{"fieldName":"Series","typeName":"k8s.io/api/core/v1.EventSeries","typeDecorators":["Ptr"],"docString":"Data about the Event series this event represents or nil if it's a singleton Event.\n+optional"},{"fieldName":"Action","typeName":"string","typeDecorators":null,"docString":"What action was taken/failed regarding to the Regarding object.\n+optional"},{"fieldName":"Related","typeName":"k8s.io/api/core/v1.ObjectReference","typeDecorators":["Ptr"],"docString":"Optional secondary object for more complex actions.\n+optional"},{"fieldName":"ReportingController","typeName":"string","typeDecorators":null,"docString":"Name of the controller that emitted this Event, e.g. `kubernetes.io/kubelet`.\n+optional"},{"fieldName":"ReportingInstance","typeName":"string","typeDecorators":null,"docString":"ID of the controller instance, e.g. `kubelet-xyzf`.\n+optional"}],"enumValues":[],"docString":"Event is a report of an event somewhere in the cluster.  Events\nhave a limited retention time and triggers and messages may evolve\nwith time.  Event consumers should not rely on the timing of an event\nwith a given Reason reflecting a consistent underlying trigger, or the\ncontinued existence of events with that Reason.  Events should be\ntreated as informative, best-effort, supplemental data.","isRoot":true},"k8s.io/api/core/v1.EventList":{"package":"k8s.io/api/core/v1","typeName":"EventList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.Event","typeDecorators":["List"],"docString":"List of events"}],"enumValues":[],"docString":"EventList is a list of events.","isRoot":false},"k8s.io/api/core/v1.EventSeries":{"package":"k8s.io/api/core/v1","typeName":"EventSeries","fields":[{"fieldName":"Count","typeName":"int32","typeDecorators":null,"docString":"Number of occurrences in this series up to the last heartbeat time"},{"fieldName":"LastObservedTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.MicroTime","typeDecorators":null,"docString":"Time of the last occurrence observed"}],"enumValues":[],"docString":"EventSeries contain information on series of events, i.e. thing that was/is happening\ncontinuously for some time.","isRoot":false},"k8s.io/api/core/v1.EventSource":{"package":"k8s.io/api/core/v1","typeName":"EventSource","fields":[{"fieldName":"Component","typeName":"string","typeDecorators":null,"docString":"Component from which the event is generated.\n+optional"},{"fieldName":"Host","typeName":"string","typeDecorators":null,"docString":"Node name on which the event is generated.\n+optional"}],"enumValues":[],"docString":"EventSource contains information for an event.","isRoot":false},"k8s.io/api/core/v1.ExecAction":{"package":"k8s.io/api/core/v1","typeName":"ExecAction","fields":[{"fieldName":"Command","typeName":"string","typeDecorators":["List"],"docString":"Command is the command line to execute inside the container, the working directory for the\ncommand  is roo
