t ('/') in the container's filesystem. The command is simply exec'd, it is\nnot run inside a shell, so traditional shell instructions ('|', etc) won't work. To use\na shell, you need to explicitly call out to that shell.\nExit status of 0 is treated as live/healthy and non-zero is unhealthy.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"ExecAction describes a \"run in container\" action.","isRoot":false},"k8s.io/api/core/v1.FCVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"FCVolumeSource","fields":[{"fieldName":"TargetWWNs","typeName":"string","typeDecorators":["List"],"docString":"targetWWNs is Optional: FC target worldwide names (WWNs)\n+optional\n+listType=atomic"},{"fieldName":"Lun","typeName":"int32","typeDecorators":["Ptr"],"docString":"lun is Optional: FC target lun number\n+optional"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified.\nTODO: how do we prevent errors in the filesystem from compromising the machine\n+optional"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly is Optional: Defaults to false (read/write). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\n+optional"},{"fieldName":"WWIDs","typeName":"string","typeDecorators":["List"],"docString":"wwids Optional: FC volume world wide identifiers (wwids)\nEither wwids or combination of targetWWNs and lun must be set, but not both simultaneously.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"Represents a Fibre Channel volume.\nFibre Channel volumes can only be mounted as read/write once.\nFibre Channel volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.FinalizerName":{"package":"k8s.io/api/core/v1","typeName":"FinalizerName","fields":[],"enumValues":[{"name":"FinalizerKubernetes","docString":"These are internal finalizer values to Kubernetes, must be qualified name unless defined here or\nin metav1."}],"docString":"FinalizerName is the name identifying a finalizer during namespace lifecycle.","isRoot":false},"k8s.io/api/core/v1.FlexPersistentVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"FlexPersistentVolumeSource","fields":[{"fieldName":"Driver","typeName":"string","typeDecorators":null,"docString":"driver is the name of the driver to use for this volume."},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the Filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\". The default filesystem depends on FlexVolume script.\n+optional"},{"fieldName":"SecretRef","typeName":"k8s.io/api/core/v1.SecretReference","typeDecorators":["Ptr"],"docString":"secretRef is Optional: SecretRef is reference to the secret object containing\nsensitive information to pass to the plugin scripts. This may be\nempty if no secret object is specified. If the secret object\ncontains more than one secret, all secrets are passed to the plugin\nscripts.\n+optional"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly is Optional: defaults to false (read/write). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\n+optional"},{"fieldName":"Options","typeName":"string","typeDecorators":["Map[string]"],"docString":"options is Optional: this field holds extra command options if any.\n+optional"}],"enumValues":[],"docString":"FlexPersistentVolumeSource represents a generic persistent volume resource that is\nprovisioned/attached using an exec based plugin.","isRoot":false},"k8s.io/api/core/v1.FlexVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"FlexVolumeSource","fields":[{"fieldName":"Driver","typeName":"string","typeDecorators":null,"docString":"driver is the name of the driver to use for this volume."},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is the filesystem type to mount.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\". The default filesystem depends on FlexVolume script.\n+optional"},{"fieldName":"SecretRef","typeName":"k8s.io/api/core/v1.LocalObjectReference","typeDecorators":["Ptr"],"docString":"secretRef is Optional: secretRef is reference to the secret object containing\nsensitive information to pass to the plugin scripts. This may be\nempty if no secret object is specified. If the secret object\ncontains more than one secret, all secrets are passed to the plugin\nscripts.\n+optional"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly is Optional: defaults to false (read/write). ReadOnly here will force\nthe ReadOnly setting in VolumeMounts.\n+optional"},{"fieldName":"Options","typeName":"string","typeDecorators":["Map[string]"],"docString":"options is Optional: this field holds extra command options if any.\n+optional"}],"enumValues":[],"docString":"FlexVolume represents a generic volume resource that is\nprovisioned/attached using an exec based plugin.","isRoot":false},"k8s.io/api/core/v1.FlockerVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"FlockerVolumeSource","fields":[{"fieldName":"DatasetName","typeName":"string","typeDecorators":null,"docString":"datasetName is Name of the dataset stored as metadata -\u003e name on the dataset for Flocker\nshould be considered as deprecated\n+optional"},{"fieldName":"DatasetUUID","typeName":"string","typeDecorators":null,"docString":"datasetUUID is the UUID of the dataset. This is unique identifier of a Flocker dataset\n+optional"}],"enumValues":[],"docString":"Represents a Flocker volume mounted by the Flocker agent.\nOne and only one of datasetName and datasetUUID should be set.\nFlocker volumes do not support ownership management or SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.GCEPersistentDiskVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"GCEPersistentDiskVolumeSource","fields":[{"fieldName":"PDName","typeName":"string","typeDecorators":null,"docString":"pdName is unique name of the PD resource in GCE. Used to identify the disk in GCE.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk"},{"fieldName":"FSType","typeName":"string","typeDecorators":null,"docString":"fsType is filesystem type of the volume that you want to mount.\nTip: Ensure that the filesystem type is supported by the host operating system.\nExamples: \"ext4\", \"xfs\", \"ntfs\". Implicitly inferred to be \"ext4\" if unspecified.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk\nTODO: how do we prevent errors in the filesystem from compromising the machine\n+optional"},{"fieldName":"Partition","typeName":"int32","typeDecorators":null,"docString":"partition is the partition in the volume that you want to mount.\nIf omitted, the default is to mount by volume name.\nExamples: For volume /dev/sda1, you specify the partition as \"1\".\nSimilarly, the volume partition for /dev/sda is \"0\" (or you can leave the property empty).\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk\n+optional"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly here will force the ReadOnly setting in VolumeMounts.\nDefaults to false.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk\n+optional"}],"enumValues":[],"docString":"Represents a Persistent Disk resource in Google Compute Engine.\n\nA GCE PD must exist before mounting to a container. The disk must\nalso be in the same GCE project and zone as the kubelet. A GCE PD\ncan only be mounted as read/write once or read-only many times. GCE\nPDs support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.GRPCAction":{"package":"k8s.io/api/core/v1","typeName":"GRPCAction","fields":[{"fieldName":"Port","typeName":"int32","typeDecorators":null,"docString":"Port number of the gRPC service. Number must be in the range 1 to 65535."},{"fieldName":"Service","typeName":"string","typeDecorators":["Ptr"],"docString":"Service is the name of the service to place in the gRPC HealthCheckRequest\n(see https://github.com/grpc/grpc/blob/master/doc/health-checking.md).\n\nIf this is not specified, the default behavior is defined by gRPC.\n+optional\n+default=\"\""}],"enumValues":[],"docString":"GRPCAction specifies an action involving a GRPC service.","isRoot":false},"k8s.io/api/core/v1.GitRepoVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"GitRepoVolumeSource","fields":[{"fieldName":"Repository","typeName":"string","typeDecorators":null,"docString":"repository is the URL"},{"fieldName":"Revision","typeName":"string","typeDecorators":null,"docString":"revision is the commit hash for the specified revision.\n+optional"},{"fieldName":"Directory","typeName":"string","typeDecorators":null,"docString":"directory is the target directory name.\nMust not contain or start with '..'.  If '.' is supplied, the volume directory will be the\ngit repository.  Otherwise, if specified, the volume will contain the git repository in\nthe subdirectory with the given name.\n+optional"}],"enumValues":[],"docString":"Represents a volume that is populated with the contents of a git repository.\nGit repo volumes do not support ownership management.\nGit repo volumes support SELinux relabeling.\n\nDEPRECATED: GitRepo is deprecated. To provision a container with a git repo, mount an\nEmptyDir into an InitContainer that clones the repo using git, then mount the EmptyDir\ninto the Pod's container.","isRoot":false},"k8s.io/api/core/v1.GlusterfsPersistentVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"GlusterfsPersistentVolumeSource","fields":[{"fieldName":"EndpointsName","typeName":"string","typeDecorators":null,"docString":"endpoints is the endpoint name that details Glusterfs topology.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod"},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"path is the Glusterfs volume path.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly here will force the Glusterfs volume to be mounted with read-only permissions.\nDefaults to false.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod\n+optional"},{"fieldName":"EndpointsNamespace","typeName":"string","typeDecorators":["Ptr"],"docString":"endpointsNamespace is the namespace that contains Glusterfs endpoint.\nIf this field is empty, the EndpointNamespace defaults to the same namespace as the bound PVC.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod\n+optional"}],"enumValues":[],"docString":"Represents a Glusterfs mount that lasts the lifetime of a pod.\nGlusterfs volumes do not support ownership management or SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.GlusterfsVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"GlusterfsVolumeSource","fields":[{"fieldName":"EndpointsName","typeName":"string","typeDecorators":null,"docString":"endpoints is the endpoint name that details Glusterfs topology.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod"},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"path is the Glusterfs volume path.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly here will force the Glusterfs volume to be mounted with read-only permissions.\nDefaults to false.\nMore info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod\n+optional"}],"enumValues":[],"docString":"Represents a Glusterfs mount that lasts the lifetime of a pod.\nGlusterfs volumes do not support ownership management or SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.HTTPGetAction":{"package":"k8s.io/api/core/v1","typeName":"HTTPGetAction","fields":[{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"Path to access on the HTTP server.\n+optional"},{"fieldName":"Port","typeName":"k8s.io/apimachinery/pkg/util/intstr.IntOrString","typeDecorators":null,"docString":"Name or number of the port to access on the container.\nNumber must be in the range 1 to 65535.\nName must be an IANA_SVC_NAME."},{"fieldName":"Host","typeName":"string","typeDecorators":null,"docString":"Host name to connect to, defaults to the pod IP. You probably want to set\n\"Host\" in httpHeaders instead.\n+optional"},{"fieldName":"Scheme","typeName":"k8s.io/api/core/v1.URIScheme","typeDecorators":null,"docString":"Scheme to use for connecting to the host.\nDefaults to HTTP.\n+optional"},{"fieldName":"HTTPHeaders","typeName":"k8s.io/api/core/v1.HTTPHeader","typeDecorators":["List"],"docString":"Custom headers to set in the request. HTTP allows repeated headers.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"HTTPGetAction describes an action based on HTTP Get requests.","isRoot":false},"k8s.io/api/core/v1.HTTPHeader":{"package":"k8s.io/api/core/v1","typeName":"HTTPHeader","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"The header field name.\nThis will be canonicalized upon output, so case-variant names will be understood as the same header."},{"fieldName":"Value","typeName":"string","typeDecorators":null,"docString":"The header field value"}],"enumValues":[],"docString":"HTTPHeader describes a custom header to be used in HTTP probes","isRoot":false},"k8s.io/api/core/v1.HostAlias":{"package":"k8s.io/api/core/v1","typeName":"HostAlias","fields":[{"fieldName":"IP","typeName":"string","typeDecorators":null,"docString":"IP address of the host file entry.\n+required"},{"fieldName":"Hostnames","typeName":"string","typeDecorators":["List"],"docString":"Hostnames for the above IP address.\n+listType=atomic"}],"enumValues":[],"docString":"HostAlias holds the mapping between IP and hostnames that will be injected as an entry in the\npod's hosts file.","isRoot":false},"k8s.io/api/core/v1.HostIP":{"package":"k8s.io/api/core/v1","typeName":"HostIP","fields":[{"fieldName":"IP","typeName":"string","typeDecorators":null,"docString":"IP is the IP address assigned to the host\n+required"}],"enumValues":[],"docString":"HostIP represents a single IP address allocated to the host.","isRoot":false},"k8s.io/api/core/v1.HostPathType":{"package":"k8s.io/api/core/v1","typeName":"HostPathType","fields":[],"enumValues":[{"name":"HostPathUnset","docString":"For backwards compatible, leave it empty if unset"},{"name":"HostPathDirectoryOrCreate","docString":"If nothing exists at the given path, an empty directory will be created there\nas needed with file mode 0755, having the same group and ownership with Kubelet."},{"name":"HostPathDirectory","docString":"A directory must exist at the given path"},{"name":"HostPathFileOrCreate","docString":"If nothing exists at the given path, an empty file will be created there\nas needed with file mode 0644, having the same group and ownership with Kubelet."},{"name":"HostPathFile","docString":"A file must exist at the given path"},{"name":"HostPathSocket","docString":"A UNIX socket must exist at the given path"},{"name":"HostPathCharDev","docString":"A character device must exist at the given path"},{"name":"HostPathBlockDev","docString":"A block device must exist at the given path"}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.HostPathVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"HostPathVolumeSource","fields":[{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"path of the directory on the host.\nIf the path is a symlink, it will follow the link to the real path.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#hostpath"},{"fieldName":"Type","typeName":"k8s.io/api/core/v1.HostPathType","typeDecorators":["Ptr"],"docString":"type for HostPath Volume\nDefaults to \"\"\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#hostpath\n+optional"}],"enumValues":[],"docString":"Represents a host path mapped into a pod.\nHost path volumes do not support ownership management or SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.IPFamily":{"package":"k8s.io/api/core/v1","typeName":"IPFamily","fields":[],"enumValues":[{"name":"IPv4Protocol","docString":"IPv4Protocol indicates that this IP is IPv4 protocol"},{"name":"IPv6Protocol","docString":"IPv6Protocol indicates that this IP is IPv6 protocol"},{"name":"IPFamilyUnknown","docString":"IPFamilyUnknown indicates that this IP is unknown protocol"}],"docString":"IPFamily represents the IP Family (IPv4 or IPv6). This type is used\nto express the family of an IP expressed by a type (e.g. service.spec.ipFamilies).\n+enum","isRoot":false},"k8s.io/api/core/v1.IPFamilyPolicy":{"package":"k8s.io/api/core/v1","typeName":"IPFamilyPolicy","fields":[],"enumValues":[{"name":"IPFamilyPolicySingleStack","docString":"IPFamilyPolicySingleStack indicates that this service is required to have a single IPFamily.\nThe IPFamily assigned is based on the default IPFamily used by the cluster\nor as identified by service.spec.ipFamilies field"},{"name":"IPFamilyPolicyPreferDualStack","docString":"IPFamilyPolicyPreferDualStack indicates that this service prefers dual-stack when\nthe cluster is configured for dual-stack. If the cluster is not configured\nfor dual-stack the service will be assigned a single IPFamily. If the IPFamily is not\nset in service.spec.ipFamilies then the service will be assigned the default IPFamily\nconfigured on the cluster"},{"name":"IPFamilyPolicyRequireDualStack","docString":"IPFamilyPolicyRequireDualStack nal"}],"enumValues":[],"docString":"Represents an ISCSI disk.\nISCSI volumes can only be mounted as read/write once.\nISCSI volumes support ownership management and SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.ImageVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"ImageVolumeSource","fields":[{"fieldName":"Reference","typeName":"string","typeDecorators":null,"docString":"Required: Image or artifact reference to be used.\nBehaves in the same way as pod.spec.containers[*].image.\nPull secrets will be assembled in the same way as for the container image by looking up node credentials, SA image pull secrets, and pod spec image pull secrets.\nMore info: https://kubernetes.io/docs/concepts/containers/images\nThis field is optional to allow higher level config management to default or override\ncontainer images in workload controllers like Deployments and StatefulSets.\n+optional"},{"fieldName":"PullPolicy","typeName":"k8s.io/api/core/v1.PullPolicy","typeDecorators":null,"docString":"Policy for pulling OCI objects. Possible values are:\nAlways: the kubelet always attempts to pull the reference. Container creation will fail If the pull fails.\nNever: the kubelet never pulls the reference and only uses a local image or artifact. Container creation will fail if the reference isn't present.\nIfNotPresent: the kubelet pulls if the reference isn't already present on disk. Container creation will fail if the reference isn't present and the pull fails.\nDefaults to Always if :latest tag is specified, or IfNotPresent otherwise.\n+optional"}],"enumValues":[],"docString":"ImageVolumeSource represents a image volume resource.","isRoot":false},"k8s.io/api/core/v1.KeyToPath":{"package":"k8s.io/api/core/v1","typeName":"KeyToPath","fields":[{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"key is the key to project."},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"path is the relative path of the file to map the key to.\nMay not be an absolute path.\nMay not contain the path element '..'.\nMay not start with the string '..'."},{"fieldName":"Mode","typeName":"int32","typeDecorators":["Ptr"],"docString":"mode is Optional: mode bits used to set permissions on this file.\nMust be an octal value between 0000 and 0777 or a decimal value between 0 and 511.\nYAML accepts both octal and decimal values, JSON requires decimal values for mode bits.\nIf not specified, the volume defaultMode will be used.\nThis might be in conflict with other options that affect the file\nmode, like fsGroup, and the result can be other mode bits set.\n+optional"}],"enumValues":[],"docString":"Maps a string key to a path within a volume.","isRoot":false},"k8s.io/api/core/v1.Lifecycle":{"package":"k8s.io/api/core/v1","typeName":"Lifecycle","fields":[{"fieldName":"PostStart","typeName":"k8s.io/api/core/v1.LifecycleHandler","typeDecorators":["Ptr"],"docString":"PostStart is called immediately after a container is created. If the handler fails,\nthe container is terminated and restarted according to its restart policy.\nOther management of the container blocks until the hook completes.\nMore info: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/#container-hooks\n+optional"},{"fieldName":"PreStop","typeName":"k8s.io/api/core/v1.LifecycleHandler","typeDecorators":["Ptr"],"docString":"PreStop is called immediately before a container is terminated due to an\nAPI request or management event such as liveness/startup probe failure,\npreemption, resource contention, etc. The handler is not called if the\ncontainer crashes or exits. The Pod's termination grace period countdown begins before the\nPreStop hook is executed. Regardless of the outcome of the handler, the\ncontainer will eventually terminate within the Pod's termination grace\nperiod (unless delayed by finalizers). Other management of the container blocks until the hook completes\nor until the termination grace period is reached.\nMore info: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/#container-hooks\n+optional"},{"fieldName":"StopSignal","typeName":"k8s.io/api/core/v1.Signal","typeDecorators":["Ptr"],"docString":"StopSignal defines which signal will be sent to a container when it is being stopped.\nIf not specified, the default is defined by the container runtime in use.\nStopSignal can only be set for Pods with a non-empty .spec.os.name\n+optional"}],"enumValues":[],"docString":"Lifecycle describes actions that the management system should take in response to container lifecycle\nevents. For the PostStart and PreStop lifecycle handlers, management of the container blocks\nuntil the action is complete, unless the container process fails, in which case the handler is aborted.","isRoot":false},"k8s.io/api/core/v1.LifecycleHandler":{"package":"k8s.io/api/core/v1","typeName":"LifecycleHandler","fields":[{"fieldName":"Exec","typeName":"k8s.io/api/core/v1.ExecAction","typeDecorators":["Ptr"],"docString":"Exec specifies a command to execute in the container.\n+optional"},{"fieldName":"HTTPGet","typeName":"k8s.io/api/core/v1.HTTPGetAction","typeDecorators":["Ptr"],"docString":"HTTPGet specifies an HTTP GET request to perform.\n+optional"},{"fieldName":"TCPSocket","typeName":"k8s.io/api/core/v1.TCPSocketAction","typeDecorators":["Ptr"],"docString":"Deprecated. TCPSocket is NOT supported as a LifecycleHandler and kept\nfor backward compatibility. There is no validation of this field and\nlifecycle hooks will fail at runtime when it is specified.\n+optional"},{"fieldName":"Sleep","typeName":"k8s.io/api/core/v1.SleepAction","typeDecorators":["Ptr"],"docString":"Sleep represents a duration that the container should sleep.\n+featureGate=PodLifecycleSleepAction\n+optional"}],"enumValues":[],"docString":"LifecycleHandler defines a specific action that should be taken in a lifecycle\nhook. One and only one of the fields, except TCPSocket must be specified.","isRoot":false},"k8s.io/api sistent volume claims in a namespace"}],"docString":"LimitType is a type of object that is limited. It can be Pod, Container, PersistentVolumeClaim or\na fully qualified resource name.","isRoot":false},"k8s.io/api/core/v1.LinuxContainerUser":{"package":"k8s.io/api/core/v1","typeName":"LinuxContainerUser","fields":[{"fieldName":"UID","typeName":"int64","typeDecorators":null,"docString":"UID is the primary uid initially attached to the first process in the container"},{"fieldName":"GID","typeName":"int64","typeDecorators":null,"docString":"GID is the primary gid initially attached to the first process in the container"},{"fieldName":"SupplementalGroups","typeName":"int64","typeDecorators":["List"],"docString":"SupplementalGroups are the supplemental groups initially attached to the first process in the container\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"LinuxContainerUser represents user identity information in Linux containers","isRoot":false},"k8s.io/api/core/v1.LoadBalancerIPMode":{"package":"k8s.io/api/core/v1","typeName":"LoadBalancerIPMode","fields":[],"enumValues":[{"name":"LoadBalancerIPModeVIP","docString":"LoadBalancerIPModeVIP indicates that traffic is delivered to the node with\nthe destination set to the load-balancer's IP and port."},{"name":"LoadBalancerIPModeProxy","docString":"LoadBalancerIPModeProxy indicates that traffic is delivered to the node or pod with\nthe destination set to the node's IP and port or the pod's IP and port."}],"docString":"LoadBalancerIPMode represents the mode of the LoadBalancer ingress IP","isRoot":false},"k8s.io/api/core/v1.LoadBalancerIngress":{"package":"k8s.io/api/core/v1","typeName":"LoadBalancerIngress","fields":[{"fieldName":"IP","typeName":"string","typeDecorators":null,"docString":"IP is set for load-balancer ingress points that are IP based\n(typically GCE or OpenStack load-balancers)\n+optional"},{"fieldName":"Hostname","typeName":"string","typeDecorators":null,"docString":"Hostname is set for load-balancer ingress points that are DNS based\n(typically AWS load-balancers)\n+optional"},{"fieldName":"IPMode","typeName":"k8s.io/api/core/v1.LoadBalancerIPMode","typeDecorators":["Ptr"],"docString":"IPMode specifies how the load-balancer IP behaves, and may only be specified when the ip field is specified.\nSetting this to \"VIP\" indicates that traffic is delivered to the node with\nthe destination set to the load-balancer's IP and port.\nSetting this to \"Proxy\" indicates that traffic is delivered to the node or pod with\nthe destination set to the node's IP and node port or the pod's IP and port.\nService implementations may use this information to adjust traffic routing.\n+optional"},{"fieldName":"Ports","typeName":"k8s.io/api/core/v1.PortStatus","typeDecorators":["List"],"docString":"Ports is a list of records of service ports\nIf used, every port defined in the service should have an entry in it\n+listType=atomic\n+optional"}],"enumValues":[],"docString":"LoadBalancerIngress represents the status of a load-balancer ingress point:\ntraffic intended for the service should be sent to an ingress point.","isRoot":false},"k8s.io/api/core/v1.LoadBalancerStatus":{"package":"k8s.io/api/core/v1","typeName":"LoadBalancerStatus","fields":[{"fieldName":"Ingress","typeName":"k8s.io/api/core/v1.LoadBalancerIngress","typeDecorators":["List"],"docString":"Ingress is a list containing ingress points for the load-balancer.\nTraffic intended for the service should be sent to these ingress points.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"LoadBalancerStatus represents the status of a load-balancer.","isRoot":false},"k8s.io/api/core/v1.LocalObjectReference":{"package":"k8s.io/api/core/v1","typeName":"LocalObjectReference","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name of the referent.\nThis field is effectively required, but due to backwards compatibility is\nallowed to be empty. Instances of this type with an empty value here are\nalmost certainly wrong.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names\n+optional\n+default=\"\"\n+kubebuilder:default=\"\"\nTODO: Drop `kubebuilder:default` when controller-gen doesn't need it https://github.com/kubernetes-sigs/kubebuilder/issues/3896."}],"enumValues":[],"docString":"LocalObjectReference contains enough information to let you locate the\nreferenced object inside the same namespace.\n---\nNew uses of this type are discouraged because of difficulty describing its usage when embedded in APIs.\n 1. Invalid usage help.  It is impossible to add specific help for individual usage.  In most embedded usages, there are particular\n    restrictions like, \"must refer only to types A and B\" or \"UID not honored\" or \"name must be restricted\".\n    Those cannot be well described when embedded.\n 2. Inconsistent validation.  Because the usages are different, the validation rules are different by usage, which makes it hard for users to predict what will happen.\n 3. We cannot easily change it.  Because this type is embedded in many locations, updates to this type\n    will affect numerous schemas.  Don't make new APIs embed an underspecified API type they do not control.\n\nInstead of using this type, create a locally provided and used type that is well-focused on your reference.\nFor example, ServiceReferences for admission registration: https://github.com/kubernetes/api/blob/release-1.17/admissionregistration/v1/types.go#L533 .\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.LocalVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"LocalVolumeSource","fields":[{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"path of the full path to the volume on the node.\nIt can be either a directory or block device (disk, partition, ...)."},{"fieldName":"FSType","typeName":"string","typeDecorators":["Ptr"],"docString":"fsType is the filesystem type to mount.\nIt applies only when the Path is a block device.\nMust be a filesystem type supported by the host operating system.\nEx. \"ext4\", \"xfs\", \"ntfs\". The default value is to auto-select a filesystem if unspecified.\n+optional"}],"enumValues":[],"docString":"Local represents directly-attached storage with node affinity","isRoot":false},"k8s.io/api/core/v1.ModifyVolumeStatus":{"package":"k8s.io/api/core/v1","typeName":"ModifyVolumeStatus","fields":[{"fieldName":"TargetVolumeAttributesClassName","typeName":"string","typeDecorators":null,"docString":"targetVolumeAttributesClassName is the name of the VolumeAttributesClass the PVC currently being reconciled"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimModifyVolumeStatus","typeDecorators":null,"docString":"status is the status of the ControllerModifyVolume operation. It can be in any of following states:\n - Pending\n   Pending indicates that the PersistentVolumeClaim cannot be modified due to unmet requirements, such as\n   the specified VolumeAttributesClass not existing.\n - InProgress\n   InProgress indicates that the volume is being modified.\n - Infeasible\n  Infeasible indicates that the request has been rejected as invalid by the CSI driver. To\n\t  resolve the error, a valid VolumeAttributesClass needs to be specified.\nNote: New statuses can be added in the future. Consumers should check for unknown statuses and fail appropriately."}],"enumValues":[],"docString":"ModifyVolumeStatus represents the status object of ControllerModifyVolume operation","isRoot":false},"k8s.io/api/core/v1.MountPropagationMode":{"package":"k8s.io/api/core/v1","typeName":"MountPropagationMode","fields":[],"enumValues":[{"name":"MountPropagationNone","docString":"MountPropagationNone means that the volume in a container will\nnot receive new mounts from the host or other containers, and filesystems\nmounted inside the container won't be propagated to the host or other\ncontainers.\nNote that this mode corresponds to \"private\" in Linux terminology."},{"name":"MountPropagationHostToContainer","docString":"MountPropagationHostToContainer means that the volume in a container will\nreceive new mounts from the host or other containers, but filesystems\nmounted inside the container won't be propagated to the host or other\ncontainers.\nNote that this mode is recursively applied to all mounts in the volume\n(\"rslave\" in Linux terminology)."},{"name":"MountPropagationBidirectional","docString":"MountPropagationBidirectional means that the volume in a container will\nreceive new mounts from the host or other containers, and its own mounts\nwill be propagated from the container to the host or other containers.\nNote that this mode is recursively applied to all mounts in the volume\n(\"rshared\" in Linux terminology)."}],"docString":"MountPropagationMode describes mount propagation.\n+enum","isRoot":false},"k8s.io/api/core/v1.NFSVolumeSource":{"package":"k8s.io/api/core/v1","typeName":"NFSVolumeSource","fields":[{"fieldName":"Server","typeName":"string","typeDecorators":null,"docString":"server is the hostname or IP address of the NFS server.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#nfs"},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"path that is exported by the NFS server.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#nfs"},{"fieldName":"ReadOnly","typeName":"bool","typeDecorators":null,"docString":"readOnly here will force the NFS export to be mounted with read-only permissions.\nDefaults to false.\nMore info: https://kubernetes.io/docs/concepts/storage/volumes#nfs\n+optional"}],"enumValues":[],"docString":"Represents an NFS mount that lasts the lifetime of a pod.\nNFS volumes do not support ownership management or SELinux relabeling.","isRoot":false},"k8s.io/api/core/v1.Namespace":{"package":"k8s.io/api/core/v1","typeName":"Namespace","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Spec","typeName":"k8s.io/api/core/v1.NamespaceSpec","typeDecorators":null,"docString":"Spec defines the behavior of the Namespace.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.NamespaceStatus","typeDecorators":null,"docString":"Status describes the current status of a Namespace.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"}],"enumValues":[],"docString":"Namespace provides a scope for Names.\nUse of multiple namespaces is optional.","isRoot":true},"k8s.io/api/core/v1.NamespaceCondition":{"package":"k8s.io/api/core/v1","typeName":"NamespaceCondition","fields":[{"fieldName":"Type","typeName":"k8s.io/api/core/v1.NamespaceConditionType","typeDecorators":null,"docString":"Type of namespace controller condition."},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.ConditionStatus","typeDecorators":null,"docString":"Status of the condition, one of True, False, Unknown."},{"fieldName":"LastTransitionTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Last time the condition transitioned from one status to another.\n+optional"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"Unique, one-word, CamelCase reason for the condition's last transition.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"Human-readable message indicating details about last transition.\n+optional"}],"enumValues":[],"docString":"NamespaceCondition contains details about state of namespace.","isRoot":false},"k8s.io/api/core/v1.NamespaceConditionType":{"package":"k8s.io/api/core/v1","typeName":"NamespaceConditionType","fields":[],"enumValues":[{"name":"NamespaceDeletionDiscoveryFailure","docString":"NamespaceDeletionDiscoveryFailure contains information about namespace deleter errors during resource discovery."},{"name":"NamespaceDeletionContentFailure","docString":"NamespaceDeletionContentFailure contains information about namespace deleter errors during deletion of resources."},{"name":"NamespaceDeletionGVParsingFailure","docString":"NamespaceDeletionGVParsingFailure contains information about namespace deleter errors parsing GV for legacy types."},{"name":"NamespaceContentRemaining","docString":"NamespaceContentRemaining contains information about resources remaining in a namespace."},{"name":"NamespaceFinalizersRemaining","docString":"NamespaceFinalizersRemaining contains information about which finalizers are on resources remaining in a namespace."}],"docString":"","isRoot":false},"k8s.io/api/core/v1.NamespaceList":{"package":"k8s.io/api/core/v1","typeName":"NamespaceList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.Namespace","typeDecorators":["List"],"docString":"Items is the list of Namespace objects in the list.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/"}],"enumValues":[],"docString":"NamespaceList is a list of Namespaces.","isRoot":false},"k8s.io/api/core/v1.NamespacePhase":{"package":"k8s.io/api/core/v1","typeName":"NamespacePhase","fields":[],"enumValues":[{"name":"NamespaceActive","docString":"NamespaceActive means the namespace is available for use in the system"},{"name":"NamespaceTerminating","docString":"NamespaceTerminating means the namespace is undergoing graceful termination"}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.NamespaceSpec":{"package":"k8s.io/api/core/v1","typeName":"NamespaceSpec","fields":[{"fieldName":"Finalizers","typeName":"k8s.io/api/core/v1.FinalizerName","typeDecorators":["List"],"docString":"Finalizers is an opaque list of values that must be empty to permanently remove object from storage.\nMore info: https://kubernetes.io/docs/tasks/administer-cluster/namespaces/\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"NamespaceSpec describes the attributes on a Namespace.","isRoot":false},"k8s.io/api/core/v1.NamespaceStatus":{"package":"k8s.io/api/core/v1","typeName":"NamespaceStatus","fields":[{"fieldName":"Phase","typeName":"k8s.io/api/core/v1.NamespacePhase","typeDecorators":null,"docString":"Phase is the current lifecycle phase of the namespace.\nMore info: https://kubernetes.io/docs/tasks/administer-cluster/namespaces/\n+optional"},{"fieldName":"Conditions","typeName":"k8s.io/api/core/v1.NamespaceCondition","typeDecorators":["List"],"docString":"Represents the latest available observations of a namespace's current state.\n+optional\n+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"}],"enumValues":[],"docString":"NamespaceStatus is information about the current status of a Namespace.","isRoot":false},"k8s.io/api/core/v1.Node":{"package":"k8s.io/api/core/v1","typeName":"Node","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Spec","typeName":"k8s.io/api/core/v1.NodeSpec","typeDecorators":null,"docString":"Spec defines the behavior of a node.\nhttps://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.NodeStatus","typeDecorators":null,"docString":"Most recently observed status of the node.\nPopulated by the system.\nRead-only.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status\n+optional"}],"enumValues":[],"docString":"Node is a worker node in Kubernetes.\nEach node will have a unique identifier in the cache (i.e. in etcd).","isRoot":true},"k8s.io/api/core/v1.NodeAddress":{"package":"k8s.io/api/core/v1","typeName":"NodeAddress","fields":[{"fieldName":"Type","typeName":"k8s.io/api/core/v1.NodeAddressType","typeDecorators":null,"docString":"Node address type, one of Hostname, ExternalIP or InternalIP."},{"fieldName":"Address","typeName":"string","typeDecorators":null,"docString":"The node address."}],"enumValues":[],"docString":"NodeAddress contains information for the node's address.","isRoot":false},"k8s.io/api/core/v1.NodeAddressType":{"package":"k8s.io/api/core/v1","typeName":"NodeAddressType","fields":[],"enumValues":[{"name":"NodeHostName","docString":"NodeHostName identifies a name of the node. Although every node can be assumed\nto have a NodeAddress of this type, its exact syntax and semantics are not\ndefined, and are not consistent between different clusters."},{"name":"NodeInternalIP","docString":"NodeInternalIP identifies an IP address which is assigned to one of the node's\nnetwork interfaces. Every node should have at least one address of this type.\n\nAn internal IP is normally expected to be reachable from every other node, but\nmay not be visible to hosts outside the cluster. By default it is assumed that\nkube-apiserver can reach node internal IPs, though it is possible to configure\nclusters where this is not the case.\n\nNodeInternalIP is the default type of node IP, and does not necessarily imply\nthat the IP is ONLY reachable internally. If a node has multiple internal IPs,\nno specific semantics are assigned to the additional IPs."},{"name":"NodeExternalIP","docString":"NodeExternalIP identifies an IP address which is, in some way, intended to be\nmore usable from outside the cluster then an internal IP, though no specific\nsemantics are defined. It may be a globally routable IP, though it is not\nrequired to be.\n\nExternal IPs may be assigned directly to an interface on the node, like a\nNodeInternalIP, or alternatively, packets sent to the external IP may be NAT'ed\nto an internal node IP rather than being delivered directly (making the IP less\nefficient for node-to-node traffic than a NodeInternalIP)."},{"name":"NodeInternalDNS","docString":"NodeInternalDNS identifies a DNS name which resolves to an IP address which has\nthe characteristics of a NodeInternalIP. The IP it resolves to may or may not\nbe a listed NodeInternalIP address."},{"name":"NodeExternalDNS","docString":"NodeExternalDNS identifies a DNS name which resolves to an IP address which has\nthe characteristics of a NodeExternalIP. The IP it resolves to may or may not\nbe a listed NodeExternalIP address."}],"docString":"","isRoot":false},"k8s.io/api/core/v1.NodeAffinity":{"package":"k8s.io/api/core/v1","typeName":"NodeAffinity","fields":[{"fieldName":"RequiredDuringSchedulingIgnoredDuringExecution","typeName":"k8s.io/api/core/v1.NodeSelector","typeDecorators":["Ptr"],"docString":"If the affinity requirements specified by this field are not met at\nscheduling time, the pod will not be scheduled onto the node.\nIf the affinity requirements specified by this field cease to be met\nat some point during pod execution (e.g. due to an update), the system\nmay or may not try to eventually evict the pod from its node.\n+optional"},{"fieldName":"PreferredDuringSchedulingIgnoredDuringExecution","typeName":"k8s.io/api/core/v1.PreferredSchedulingTerm","typeDecorators":["List"],"docString":"The scheduler will prefer to schedule pods to nodes that satisfy\nthe affinity expressions specified by this field, but it may choose\na node that violates one or more of the expressions. The node that is\nmost preferred is the one with the greatest sum of weights, i.e.\nfor each node that meets all of the scheduling requirements (resource\nrequest, requiredDuringScheduling affinity expressions, etc.),\ncompute a sum by iterating through the elements of this field and adding\n\"weight\" to the sum if the node matches the corresponding matchExpressions; the\nnode(s) with the highest sum are the most preferred.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"Node affinity is a group of node affinity scheduling rules.","isRoot":false},"k8s.io/api/core/v1.NodeCondition":{"package":"k8s.io/api/core/v1","typeName":"NodeCondition","fields":[{"fieldName":"Type","typeName":"k8s.io/api/core/v1.NodeConditionType","typeDecorators":null,"docString":"Type of node condition."},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.ConditionStatus","typeDecorators":null,"docString":"Status of the condition, one of True, False, Unknown."},{"fieldName":"LastHeartbeatTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Last time we got an update on a given condition.\n+optional"},{"fieldName":"LastTransitionTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"Last time the condition transit from one status to another.\n+optional"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"(brief) reason for the condition's last transition.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"Human readable message indicating details about last transition.\n+optional"}],"enumValues":[],"docString":"NodeCondition contains condition information for a node.","isRoot":false},"k8s.io/api/core/v1.NodeConditionType":{"package":"k8s.io/api/core/v1","typeName":"NodeConditionType","fields":[],"enumValues":[{"name":"NodeReady","docString":"NodeReady means kubelet is healthy and ready to accept pods."},{"name":"NodeMemoryPressure","docString":"NodeMemoryPressure means the kubelet is under pressure due to insufficient available memory."},{"name":"NodeDiskPressure","docString":"NodeDiskPressure means the kubelet is under pressure due to insufficient available disk."},{"name":"NodePIDPressure","docString":"NodePIDPressure means the kubelet is under pressure due to insufficient available PID."},{"name":"NodeNetworkUnavailable","docString":"NodeNetworkUnavailable means that network for the node is not correctly configured."}],"docString":"","isRoot":false},"k8s.io/api/core/v1.NodeConfigSource":{"package":"k8s.io/api/core/v1","typeName":"NodeConfigSource","fields":[{"fieldName":"ConfigMap","typeName":"k8s.io/api/core/v1.ConfigMapNodeConfigSource","typeDecorators":["Ptr"],"docString":"ConfigMap is a reference to a Node's ConfigMap"}],"enumValues":[],"docString":"NodeConfigSource specifies a source of node configuration. Exactly one subfield (excluding metadata) must be non-nil.\nThis API is deprecated since 1.22","isRoot":false},"k8s.io/api/core/v1.NodeConfigStatus":{"package":"k8s.io/api/core/v1","typeName":"NodeConfigStatus","fields":[{"fieldName":"Assigned","typeName":"k8s.io/api/core/v1.NodeConfigSource","typeDecorators":["Ptr"],"docString":"Assigned reports the checkpointed config the node will try to use.\nWhen Node.Spec.ConfigSource is updated, the node checkpoints the associated\nconfig payload to local disk, along with a record indicating intended\nconfig. The node refers to this record to choose its config checkpoint, and\nreports this record in Assigned. Assigned only updates in the status after\nthe record has been checkpointed to disk. When the Kubelet is restarted,\nit tries to make the Assigned config the Active config by loading and\nvalidating the checkpointed payload identified by Assigned.\n+optional"},{"fieldName":"Active","typeName":"k8s.io/api/core/v1.NodeConfigSource","typeDecorators":["Ptr"],"docString":"Active reports the checkpointed config the node is actively using.\nActive will represent either the current version of the Assigned config,\nor the current LastKnownGood config, depending on whether attempting to use the\nAssigned config results in an error.\n+optional"},{"fieldName":"LastKnownGood","typeName":"k8s.io/api/core/v1.NodeConfigSource","typeDecorators":["Ptr"],"docString":"LastKnownGood reports the checkpointed config the node will fall back to\nwhen it encounters an error attempting to use the Assigned config.\nThe Assigned config becomes the LastKnownGood config when the node determines\nthat the Assigned config is stable and correct.\nThis is currently implemented as a 10-minute soak period starting when the local\nrecord of Assigned config is updated. If the Assigned config is Active at the end\nof this period, it becomes the LastKnownGood. Note that if Spec.ConfigSource is\nreset to nil (use local defaults), the LastKnownGood is also immediately reset to nil,\nbecause the local default config is always assumed good.\nYou should not make assumptions about the node's method of determining config stability\nand correctness, as this may change or become configurable in the future.\n+optional"},{"fieldName":"Error","typeName":"string","typeDecorators":null,"docString":"Error describes any problems reconciling the Spec.ConfigSource to the Active config.\nErrors may occur, for example, attempting to checkpoint Spec.ConfigSource to the local Assigned\nrecord, attempting to checkpoint the payload associated with Spec.ConfigSource, attempting\nto load or validate the Assigned config, etc.\nErrors may occur at different points while syncing config. Earlier errors (e.g. download or\ncheckpointing errors) will not result in a rollback to LastKnownGood, and may resolve across\nKubelet retries. Later errors (e.g. loading or validating a checkpointed config) will result in\na rollback to LastKnownGood. In the latter case, it is usually possible to resolve the error\nby fixing the config assigned in Spec.ConfigSource.\nYou can find additional information for debugging by searching the error message in the Kubelet log.\nError is a human-readable description of the error state; machines can check whether or not Error\nis empty, but should not rely on the stability of the Error text across Kubelet versions.\n+optional"}],"enumValues":[],"docString":"NodeConfigStatus describes the status of the config assigned by Node.Spec.ConfigSource.","isRoot":false},"k8s.io/api/core/v1.NodeDaemonEndpoints":{"package":"k8s.io/api/core/v1","typeName":"NodeDaemonEndpoints","fields":[{"fieldName":"KubeletEndpoint","typeName":"k8s.io/api/core/v1.DaemonEndpoint","typeDecorators":null,"docString":"Endpoint on which Kubelet is listening.\n+optional"}],"enumValues":[],"docString":"NodeDaemonEndpoints lists ports opened by daemons running on the Node.","isRoot":false},"k8s.io/api/core/v1.NodeFeatures":{"package":"k8s.io/api/core/v1","typeName":"NodeFeatures","fields":[{"fieldName":"SupplementalGroupsPolicy","typeName":"bool","typeDecorators":["Ptr"],"docString":"SupplementalGroupsPolicy is set to true if the runtime supports SupplementalGroupsPolicy and ContainerUser.\n+optional"}],"enumValues":[],"docString":"NodeFeatures describes the set of features implemented by the CRI implementation.\nThe features contained in the NodeFeatures should depend only on the cri implementation\nindependent of runtime handlers.","isRoot":false},"k8s.io/api/core/v1.NodeInclusionPolicy":{"package":"k8s.io/api/core/v1","typeName":"NodeInclusionPolicy","fields":[],"enumValues":[{"name":"NodeInclusionPolicyIgnore","docString":"NodeInclusionPolicyIgnore means ignore this scheduling directive when calculating pod topology spread skew."},{"name":"NodeInclusionPolicyHonor","docString":"NodeInclusionPolicyHonor means use this scheduling directive when calculating pod topology spread skew."}],"docString":"NodeInclusionPolicy defines the type of node inclusion policy\n+enum","isRoot":false},"k8s.io/api/core/v1.NodeList":{"package":"k8s.io/api/core/v1","typeName":"NodeList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.Node","typeDecorators":["List"],"docString":"List of nodes"}],"enumValues":[],"docString":"NodeList is the whole list of all Nodes which have been registered with master.","isRoot":false},"k8s.io/api/core/v1.NodePhase":{"package":"k8s.io/api/core/v1","typeName":"NodePhase","fields":[],"enumValues":[{"name":"NodePending","docString":"NodePending means the node has been created/added by the system, but not configured."},{"name":"NodeRunning","docString":"NodeRunning means the node has been configured and has Kubernetes components running."},{"name":"NodeTerminated","docString":"NodeTerminated means the node has been removed from the cluster."}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.NodeProxyOptions":{"package":"k8s.io/api/core/v1","typeName":"NodeProxyOptions","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"Path","typeName":"string","typeDecorators":null,"docString":"Path is the URL path to use for the current proxy request to node.\n+optional"}],"enumValues":[],"docString":"NodeProxyOptions is the query options to a Node's proxy call.","isRoot":false},"k8s.io/api/core/v1.NodeRuntimeHandler":{"package":"k8s.io/api/core/v1","typeName":"NodeRuntimeHandler","fields":[{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Runtime handler name.\nEmpty for the default runtime handler.\n+optional"},{"fieldName":"Features","typeName":"k8s.io/api/core/v1.NodeRuntimeHandlerFeatures","typeDecorators":["Ptr"],"docString":"Supported features.\n+optional"}],"enumValues":[],"docString":"NodeRuntimeHandler is a set of runtime handler information.","isRoot":false},"k8s.io/api/core/v1.NodeRuntimeHandlerFeatures":{"package":"k8s.io/api/core/v1","typeName":"NodeRuntimeHandlerFeatures","fields":[{"fieldName":"RecursiveReadOnlyMounts","typeName":"bool","typeDecorators":["Ptr"],"docString":"RecursiveReadOnlyMounts is set to true if the runtime handler supports RecursiveReadOnlyMounts.\n+featureGate=RecursiveReadOnlyMounts\n+optional"},{"fieldName":"UserNamespaces","typeName":"bool","typeDecorators":["Ptr"],"docString":"UserNamespaces is set to true if the runtime handler supports UserNamespaces, including for volumes.\n+featureGate=UserNamespacesSupport\n+optional"}],"enumValues":[],"docString":"NodeRuntimeHandlerFeatures is a set of features implemented by the runtime handler.","isRoot":false},"k8s.io/api/core/v1.NodeSelector":{"package":"k8s.io/api/core/v1","typeName":"NodeSelector","fields":[{"fieldName":"NodeSelectorTerms","typeName":"k8s.io/api/core/v1.NodeSelectorTerm","typeDecorators":["List"],"docString":"Required. A list of node selector terms. The terms are ORed.\n+listType=atomic"}],"enumValues":[],"docString":"A node selector represents the union of the results of one or more label queries\nover a set of nodes; that is, it represents the OR of the selectors represented\nby the node selector terms.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.NodeSelectorOperator":{"package":"k8s.io/api/core/v1","typeName":"NodeSelectorOperator","fields":[],"enumValues":[{"name":"NodeSelectorOpIn","docString":""},{"name":"NodeSelectorOpNotIn","docString":""},{"name":"NodeSelectorOpExists","docString":""},{"name":"NodeSelectorOpDoesNotExist","docString":""},{"name":"NodeSelectorOpGt","docString":""},{"name":"NodeSelectorOpLt","docString":""}],"docString":"A node selector operator is the set of operators that can be used in\na node selector requirement.\n+enum","isRoot":false},"k8s.io/api/core/v1.NodeSelectorRequirement":{"package":"k8s.io/api/core/v1","typeName":"NodeSelectorRequirement","fields":[{"fieldName":"Key","typeName":"string","typeDecorators":null,"docString":"The label key that the selector applies to."},{"fieldName":"Operator","typeName":"k8s.io/api/core/v1.NodeSelectorOperator","typeDecorators":null,"docString":"Represents a key's relationship to a set of values.\nValid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt."},{"fieldName":"Values","typeName":"string","typeDecorators":["List"],"docString":"An array of string values. If the operator is In or NotIn,\nthe values array must be non-empty. If the operator is Exists or DoesNotExist,\nthe values array must be empty. If the operator is Gt or Lt, the values\narray must have a single element, which will be interpreted as an integer.\nThis array is replaced during a strategic merge patch.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"A node selector requirement is a selector that contains values, a key, and an operator\nthat relates the key and values.","isRoot":false},"k8s.io/api/core/v1.NodeSelectorTerm":{"package":"k8s.io/api/core/v1","typeName":"NodeSelectorTerm","fields":[{"fieldName":"MatchExpressions","typeName":"k8s.io/api/core/v1.NodeSelectorRequirement","typeDecorators":["List"],"docString":"A list of node selector requirements by node's labels.\n+optional\n+listType=atomic"},{"fieldName":"MatchFields","typeName":"k8s.io/api/core/v1.NodeSelectorRequirement","typeDecorators":["List"],"docString":"A list of node selector requirements by node's fields.\n+optional\n+listType=atomic"}],"enumValues":[],"docString":"A null or empty node selector term matches no objects. The requirements of\nthem are ANDed.\nThe TopologySelectorTerm type implements a subset of the NodeSelectorTerm.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.NodeSpec":{"package":"k8s.io/api/core/v1","typeName":"NodeSpec","fields":[{"fieldName":"PodCIDR","typeName":"string","typeDecorators":null,"docString":"PodCIDR represents the pod IP range assigned to the node.\n+optional"},{"fieldName":"PodCIDRs","typeName":"string","typeDecorators":["List"],"docString":"podCIDRs represents the IP ranges assigned to the node for usage by Pods on that node. If this\nfield is specified, the 0th entry must match the podCIDR field. It may contain at most 1 value for\neach of IPv4 and IPv6.\n+optional\n+patchStrategy=merge\n+listType=set"},{"fieldName":"ProviderID","typeName":"string","typeDecorators":null,"docString":"ID of the node assigned by the cloud provider in the format: \u003cProviderName\u003e://\u003cProviderSpecificNodeID\u003e\n+optional"},{"fieldName":"Unschedulable","typeName":"bool","typeDecorators":null,"docString":"Unschedulable controls node schedulability of new pods. By default, node is schedulable.\nMore info: https://kubernetes.io/docs/concepts/nodes/node/#manual-node-administration\n+optional"},{"fieldName":"Taints","typeName":"k8s.io/api/core/v1.Taint","typeDecorators":["List"],"docString":"If specified, the node's taints.\n+optional\n+listType=atomic"},{"fieldName":"ConfigSource","typeName":"k8s.io/api/core/v1.NodeConfigSource","typeDecorators":["Ptr"],"docString":"Deprecated: Previously used to specify the source of the node's configuration for the DynamicKubeletConfig feature. This feature is removed.\n+optional"},{"fieldName":"DoNotUseExternalID","typeName":"string","typeDecorators":null,"docString":"Deprecated. Not all kubelets will set this field. Remove field after 1.13.\nsee: https://issues.k8s.io/61966\n+optional"}],"enumValues":[],"docString":"NodeSpec describes the attributes that a node is created with.","isRoot":false},"k8s.io/api/core/v1.NodeStatus":{"package":"k8s.io/api/core/v1","typeName":"NodeStatus","fields":[{"fieldName":"Capacity","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Capacity represents the total resources of a node.\nMore info: https://kubernetes.io/docs/reference/node/node-status/#capacity\n+optional"},{"fieldName":"Allocatable","typeName":"k8s.io/api/core/v1.ResourceList","typeDecorators":null,"docString":"Allocatable represents the resources of a node that are available for scheduling.\nDefaults to Capacity.\n+optional"},{"fieldName":"Phase","typeName":"k8s.io/api/core/v1.NodePhase","typeDecorators":null,"docString":"NodePhase is the recently observed lifecycle phase of the node.\nMore info: https://kubernetes.io/docs/concepts/nodes/node/#phase\nThe field is never populated, and now is deprecated.\n+optional"},{"fieldName":"Conditions","typeName":"k8s.io/api/core/v1.NodeCondition","typeDecorators":["List"],"docString":"Conditions is an array of current observed node conditions.\nMore info: https://kubernetes.io/docs/reference/node/node-status/#condition\n+optional\n+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"},{"fieldName":"Addresses","typeName":"k8s.io/api/core/v1.NodeAddress","typeDecorators":["List"],"docString":"List of addresses reachable to the node.\nQueried from cloud provider, if available.\nMore info: https://kubernetes.io/docs/reference/node/node-status/#addresses\nNote: This field is declared as mergeable, but the merge key is not sufficiently\nunique, which can cause data corruption when it is merged. Callers should instead\nuse a full-replacement patch. See https://pr.k8s.io/79391 for an example.\nConsumers should assume that addresses can change during the\nlifetime of a Node. However, there are some exceptions where this may not\nbe possible, such as Pods that inherit a Node's address in its own status or\nconsumers of the downward API (status.hostIP).\n+optional\n+patchMergeKey=type\n+patchStrategy=merge\n+listType=map\n+listMapKey=type"},{"fieldName":"DaemonEndpoints","typeName":"k8s.io/api/core/v1.NodeDaemonEndpoints","typeDecorators":null,"docString":"Endpoints of daemons running on the Node.\n+optional"},{"fieldName":"NodeInfo","typeName":"k8s.io/api/core/v1.NodeSystemInfo","typeDecorators":null,"docString":"Set of ids/uuids to uniquely identify the node.\nMore info: https://kubernetes.io/docs/reference/node/node-status/#info\n+optional"},{"fieldName":"Images","typeName":"k8s.io/api/core/v1.ContainerImage","typeDecorators":["List"],"docString":"List of container images on this node\n+optional\n+listType=atomic"},{"fieldName":"VolumesInUse","typeName":"k8s.io/api/core/v1.UniqueVolumeName","typeDecorators":["List"],"docString":"List of attachable volumes in use (mounted) by the node.\n+optional\n+listType=atomic"},{"fieldName":"VolumesAttached","typeName":"k8s.io/api/core/v1.AttachedVolume","typeDecorators":["List"],"docString":"List of volumes that are attached to the node.\n+optional\n+listType=atomic"},{"fieldName":"Config","typeName":"k8s.io/api/core/v1.NodeConfigStatus","typeDecorators":["Ptr"],"docString":"Status of the config assigned to the node via the dynamic Kubelet config feature.\n+optional"},{"fieldName":"RuntimeHandlers","typeName":"k8s.io/api/core/v1.NodeRuntimeHandler","typeDecorators":["List"],"docString":"The available runtime handlers.\n+featureGate=RecursiveReadOnlyMounts\n+featureGate=UserNamespacesSupport\n+optional\n+listType=atomic"},{"fieldName":"Features","typeName":"k8s.io/api/core/v1.NodeFeatures","typeDecorators":["Ptr"],"docString":"Features describes the set of features implemented by the CRI implementation.\n+featureGate=SupplementalGroupsPolicy\n+optional"}],"enumValues":[],"docString":"NodeStatus is information about the current status of a node.","isRoot":false},"k8s.io/api/core/v1.NodeSwapStatus":{"package":"k8s.io/api/core/v1","typeName":"NodeSwapStatus","fields":[{"fieldName" ypeDecorators":null,"docString":"The Architecture reported by the node"},{"fieldName":"Swap","typeName":"k8s.io/api/core/v1.NodeSwapStatus","typeDecorators":["Ptr"],"docString":"Swap Info reported by the node."}],"enumValues":[],"docString":"NodeSystemInfo is a set of ids/uuids to uniquely identify the node.","isRoot":false},"k8s.io/api/core/v1.OSName":{"package":"k8s.io/api/core/v1","typeName":"OSName","fields":[],"enumValues":[{"name":"Linux","docString":"These are valid values for OSName"},{"name":"Windows","docString":"These are valid values for OSName"}],"docString":"OSName is the set of OS'es that can be used in OS.","isRoot":false},"k8s.io/api/core/v1.ObjectFieldSelector":{"package":"k8s.io/api/core/v1","typeName":"ObjectFieldSelector","fields":[{"fieldName":"APIVersion","typeName":"string","typeDecorators":null,"docString":"Version of the schema the FieldPath is written in terms of, defaults to \"v1\".\n+optional"},{"fieldName":"FieldPath","typeName":"string","typeDecorators":null,"docString":"Path of the field to select in the specified API version."}],"enumValues":[],"docString":"ObjectFieldSelector selects an APIVersioned field of an object.\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.ObjectReference":{"package":"k8s.io/api/core/v1","typeName":"ObjectReference","fields":[{"fieldName":"Kind","typeName":"string","typeDecorators":null,"docString":"Kind of the referent.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Namespace","typeName":"string","typeDecorators":null,"docString":"Namespace of the referent.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/\n+optional"},{"fieldName":"Name","typeName":"string","typeDecorators":null,"docString":"Name of the referent.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names\n+optional"},{"fieldName":"UID","typeName":"k8s.io/apimachinery/pkg/types.UID","typeDecorators":null,"docString":"UID of the referent.\nMore info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids\n+optional"},{"fieldName":"APIVersion","typeName":"string","typeDecorators":null,"docString":"API version of the referent.\n+optional"},{"fieldName":"ResourceVersion","typeName":"string","typeDecorators":null,"docString":"Specific resourceVersion to which this reference is made, if any.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency\n+optional"},{"fieldName":"FieldPath","typeName":"string","typeDecorators":null,"docString":"If referring to a piece of an object instead of an entire object, this string\nshould contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].\nFor example, if the object reference is to a container within a pod, this would take on a value like:\n\"spec.containers{name}\" (where \"name\" refers to the name of the container that triggered\nthe event) or if no container name is specified \"spec.containers[2]\" (container with\nindex 2 in this pod). This syntax is chosen only to have some well-defined way of\nreferencing a part of an object.\nTODO: this design is not final and this field is subject to change in the future.\n+optional"}],"enumValues":[],"docString":"ObjectReference contains enough information to let you inspect or modify the referred object.\n---\nNew uses of this type are discouraged because of difficulty describing its usage when embedded in APIs.\n 1. Ignored fields.  It includes many fields which are not generally honored.  For instance, ResourceVersion and FieldPath are both very rarely valid in actual usage.\n 2. Invalid usage help.  It is impossible to add specific help for individual usage.  In most embedded usages, there are particular\n    restrictions like, \"must refer only to types A and B\" or \"UID not honored\" or \"name must be restricted\".\n    Those cannot be well described when embedded.\n 3. Inconsistent validation.  Because the usages are different, the validation rules are different by usage, which makes it hard for users to predict what will happen.\n 4. The fields are both imprecise and overly precise.  Kind is not a precise mapping to a URL. This can produce ambiguity\n    during interpretation and require a REST mapping.  In most cases, the dependency is on the group,resource tuple\n    and the version of the actual struct is irrelevant.\n 5. We cannot easily change it.  Because this type is embedded in many locations, updates to this type\n    will affect numerous schemas.  Don't make new APIs embed an underspecified API type they do not control.\n\nInstead of using this type, create a locally provided and used type that is well-focused on your reference.\nFor example, ServiceReferences for admission registration: https://github.com/kubernetes/api/blob/release-1.17/admissionregistration/v1/types.go#L533 .\n+k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object\n+structType=atomic","isRoot":false},"k8s.io/api/core/v1.PersistentVolume":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolume","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Spec","typeName":"k8s.io/api/core/v1.PersistentVolumeSpec","typeDecorators":null,"docString":"spec defines a specification of a persistent volume owned by the cluster.\nProvisioned by an administrator.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistent-volumes\n+optional"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.PersistentVolumeStatus","typeDecorators":null,"docString":"status represents the current information/status for the persistent volume.\nPopulated by the system.\nRead-only.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistent-volumes\n+optional"}],"enumValues":[],"docString":"PersistentVolume (PV) is a storage resource provisioned by an administrator.\nIt is analogous to a node.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes","isRoot":true},"k8s.io/api/core/v1.PersistentVolumeAccessMode":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeAccessMode","fields":[],"enumValues":[{"name":"ReadWriteOnce","docString":"can be mounted in read/write mode to exactly 1 host"},{"name":"ReadOnlyMany","docString":"can be mounted in read-only mode to many hosts"},{"name":"ReadWriteMany","docString":"can be mounted in read/write mode to many hosts"},{"name":"ReadWriteOncePod","docString":"can be mounted in read/write mode to exactly 1 pod\ncannot be used in combination with other access modes"}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaim":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaim","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ObjectMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ObjectMeta","typeDecorators":null,"docString":"Standard object's metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata\n+optional"},{"fieldName":"Spec","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimSpec","typeDecorators":null,"docString":"spec defines the desired characteristics of a volume requested by a pod author.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims\n+optional"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimStatus","typeDecorators":null,"docString":"status represents the current information/status of a persistent volume claim.\nRead-only.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims\n+optional"}],"enumValues":[],"docString":"PersistentVolumeClaim is a user's request for and claim to a persistent volume","isRoot":true},"k8s.io/api/core/v1.PersistentVolumeClaimCondition":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimCondition","fields":[{"fieldName":"Type","typeName":"k8s.io/api/core/v1.PersistentVolumeClaimConditionType","typeDecorators":null,"docString":"Type is the type of the condition.\nMore info: https://kubernetes.io/docs/reference/kubernetes-api/config-and-storage-resources/persistent-volume-claim-v1/#:~:text=set%20to%20%27ResizeStarted%27.-,PersistentVolumeClaimCondition,-contains%20details%20about"},{"fieldName":"Status","typeName":"k8s.io/api/core/v1.ConditionStatus","typeDecorators":null,"docString":"Status is the status of the condition.\nCan be True, False, Unknown.\nMore info: https://kubernetes.io/docs/reference/kubernetes-api/config-and-storage-resources/persistent-volume-claim-v1/#:~:text=state%20of%20pvc-,conditions.status,-(string)%2C%20required"},{"fieldName":"LastProbeTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"lastProbeTime is the time we probed the condition.\n+optional"},{"fieldName":"LastTransitionTime","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.Time","typeDecorators":null,"docString":"lastTransitionTime is the time the condition transitioned from one status to another.\n+optional"},{"fieldName":"Reason","typeName":"string","typeDecorators":null,"docString":"reason is a unique, this should be a short, machine understandable string that gives the reason\nfor condition's last transition. If it reports \"Resizing\" that means the underlying\npersistent volume is being resized.\n+optional"},{"fieldName":"Message","typeName":"string","typeDecorators":null,"docString":"message is the human-readable message indicating details about last transition.\n+optional"}],"enumValues":[],"docString":"PersistentVolumeClaimCondition contains details about state of pvc","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaimConditionType":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimConditionType","fields":[],"enumValues":[{"name":"PersistentVolumeClaimResizing","docString":"PersistentVolumeClaimResizing - a user trigger resize of pvc has been started"},{"name":"PersistentVolumeClaimFileSystemResizePending","docString":"PersistentVolumeClaimFileSystemResizePending - controller resize is finished and a file system resize is pending on node"},{"name":"PersistentVolumeClaimControllerResizeError","docString":"PersistentVolumeClaimControllerResizeError indicates an error while resizing volume for size in the controller"},{"name":"PersistentVolumeClaimNodeResizeError","docString":"PersistentVolumeClaimNodeResizeError indicates an error while resizing volume for size in the node."},{"name":"PersistentVolumeClaimVolumeModifyVolumeError","docString":"Applying the target VolumeAttributesClass encountered an error"},{"name":"PersistentVolumeClaimVolumeModifyingVolume","docString":"Volume is being modified"}],"docString":"PersistentVolumeClaimConditionType defines the condition of PV claim.\nValid values are:\n  - \"Resizing\", \"FileSystemResizePending\"\n\nIf RecoverVolumeExpansionFailure feature gate is enabled, then following additional values can be expected:\n  - \"ControllerResizeError\", \"NodeResizeError\"\n\nIf VolumeAttributesClass feature gate is enabled, then following additional values can be expected:\n  - \"ModifyVolumeError\", \"ModifyingVolume\"","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaimList":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimList","fields":[{"fieldName":"TypeMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.TypeMeta","typeDecorators":null,"docString":""},{"fieldName":"ListMeta","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.ListMeta","typeDecorators":null,"docString":"Standard list metadata.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n+optional"},{"fieldName":"Items","typeName":"k8s.io/api/core/v1.PersistentVolumeClaim","typeDecorators":["List"],"docString":"items is a list of persistent volume claims.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims"}],"enumValues":[],"docString":"PersistentVolumeClaimList is a list of PersistentVolumeClaim items.","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaimModifyVolumeStatus":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimModifyVolumeStatus","fields":[],"enumValues":[{"name":"PersistentVolumeClaimModifyVolumePending","docString":"Pending indicates that the PersistentVolumeClaim cannot be modified due to unmet requirements, such as\nthe specified VolumeAttributesClass not existing"},{"name":"PersistentVolumeClaimModifyVolumeInProgress","docString":"InProgress indicates that the volume is being modified"},{"name":"PersistentVolumeClaimModifyVolumeInfeasible","docString":"Infeasible indicates that the request has been rejected as invalid by the CSI driver. To\nresolve the error, a valid VolumeAttributesClass needs to be specified"}],"docString":"+enum\nNew statuses can be added in the future. Consumers should check for unknown statuses and fail appropriately","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaimPhase":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimPhase","fields":[],"enumValues":[{"name":"ClaimPending","docString":"used for PersistentVolumeClaims that are not yet bound"},{"name":"ClaimBound","docString":"used for PersistentVolumeClaims that are bound"},{"name":"ClaimLost","docString":"used for PersistentVolumeClaims that lost their underlying\nPersistentVolume. The claim was bound to a PersistentVolume and this\nvolume does not exist any longer and all data on it was lost."}],"docString":"+enum","isRoot":false},"k8s.io/api/core/v1.PersistentVolumeClaimSpec":{"package":"k8s.io/api/core/v1","typeName":"PersistentVolumeClaimSpec","fields":[{"fieldName":"AccessModes","typeName":"k8s.io/api/core/v1.PersistentVolumeAccessMode","typeDecorators":["List"],"docString":"accessModes contains the desired access modes the volume should have.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#access-modes-1\n+optional\n+listType=atomic"},{"fieldName":"Selector","typeName":"k8s.io/apimachinery/pkg/apis/meta/v1.LabelSelector","typeDecorators":["Ptr"],"docString":"selector is a label query over volumes to consider for binding.\n+optional"},{"fieldName":"Resources","typeName":"k8s.io/api/core/v1.VolumeResourceRequirements","typeDecorators":null,"docString":"resources represents the minimum resources the volume should have.\nIf RecoverVolumeExpansionFailure feature is enabled users are allowed to specify resource requirements\nthat are lower than previous value but must still be higher than capacity recorded in the\nstatus field of the claim.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#resources\n+optional"},{"fieldName":"VolumeName","typeName":"string","typeDecorators":null,"docString":"volumeName is the binding reference to the PersistentVolume backing this claim.\n+optional"},{"fieldName":"StorageClassName","typeName":"string","typeDecorators":["Ptr"],"docString":"storageClassName is the name of the StorageClass required by the claim.\nMore info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#class-1\n+optional"},{"fieldName":"VolumeMode","typeName":"k8s.io/api/core/v1.PersistentVolumeMode","typeDecorators":["Ptr"],"docString":"volumeMode defines what type of volume is required by the claim.\nValue of Filesystem is implied when not included in claim spec.\n+optional"},{"fieldName":"DataSource","typeName":"k8s.
